<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>競技場對決</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Oswald:wght@700&display=swap');

  :root {
    --bg: #0a0a0f;
    --arena-bg: #0d1117;
    --border: #c8a84b;
    --border-glow: #f0c84a;
    --chef-color: #e84545;
    --drunk-color: #7b4cca;
    --text: #e8dcc8;
    --ui-bg: rgba(15,12,8,0.92);
    --hp-bg: #1a1a2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'Noto Serif TC', serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,168,75,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(232,69,69,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(123,76,202,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    letter-spacing: 0.2em;
    color: var(--border-glow);
    text-shadow: 0 0 30px rgba(240,200,74,0.5);
    margin-bottom: 0.2em;
    text-align: center;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  #select-screen {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    gap: 0;
    z-index: 1;
  }

  .select-row {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
    width: 100%;
    max-width: 480px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .player-slot {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    min-width: 0;
  }

  .player-label {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    opacity: 0.6;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .vs-divider {
    font-family: 'Oswald', sans-serif;
    font-size: 1.6rem;
    color: var(--border);
    opacity: 0.45;
    align-self: center;
    padding-top: 2.5rem;
    flex-shrink: 0;
  }

  .carousel-wrap {
    width: 100%;
    position: relative;
    user-select: none;
    touch-action: none;
  }

  .carousel-viewport {
    overflow: hidden;
    width: 100%;
    border-radius: 6px;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }

  .char-card {
    flex: 0 0 100%;
    padding: 1rem;
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .char-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(200,168,75,0.07) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .char-card.selected::before { opacity: 1; }

  .char-card.selected.p1 {
    border-color: var(--chef-color);
    box-shadow: 0 0 16px rgba(232,69,69,0.4);
  }
  .char-card.selected.p2 {
    border-color: var(--drunk-color);
    box-shadow: 0 0 16px rgba(123,76,202,0.4);
  }

  .char-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.5rem;
  }

  .char-emoji { font-size: 1.8rem; }

  .char-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .char-desc {
    font-size: 0.68rem;
    opacity: 0.55;
    line-height: 1.6;
    margin-bottom: 0.5rem;
  }

  .char-stat {
    font-size: 0.65rem;
    opacity: 0.45;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .stat-badge {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 0.15em 0.45em;
    white-space: nowrap;
  }

  .carousel-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
  }

  .carousel-page-num {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    color: var(--border-glow);
    opacity: 0.75;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .carousel-arrows {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 0.4rem;
  }

  .arrow-btn {
    background: rgba(200,168,75,0.1);
    border: 1px solid rgba(200,168,75,0.2);
    color: var(--border);
    border-radius: 3px;
    width: 28px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.75rem;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .arrow-btn:hover { background: rgba(200,168,75,0.22); }

  .selected-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
    min-height: 1em;
    text-align: center;
    color: var(--border-glow);
  }

  .start-btn {
    margin-top: 0.5rem;
    padding: 0.9rem 3rem;
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: var(--bg);
    background: linear-gradient(135deg, #c8a84b, #f0c84a);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(240,200,74,0.3);
    position: relative;
    z-index: 1;
  }

  .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(240,200,74,0.5); }
  .start-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .random-btn {
    margin-top: 6px;
    padding: 5px 18px;
    background: rgba(255,200,60,0.12);
    border: 1px solid rgba(255,200,60,0.35);
    border-radius: 20px;
    color: #f0c84a;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  .random-btn:hover { background: rgba(255,200,60,0.25); }

  .arena-select {
    display: flex; gap: 12px; justify-content: center; margin: 16px 0 8px;
    flex-wrap: wrap;
  }
  .arena-btn {
    padding: 8px 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; letter-spacing: .05em;
  }
  .arena-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
  .arena-btn.active { border-color: #f0c84a; color: #f0c84a; background: rgba(240,200,74,0.12); }
  .arena-btn.lava.active { border-color: #ff4500; color: #ff6a00; background: rgba(255,69,0,0.15); }

  #game-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    position: fixed;
    inset: 0;
    overflow: hidden;
    justify-content: center;
    z-index: 1;
    padding: 0.5rem;
    max-width: 100vw;
    box-sizing: border-box;
  }

  .hud {
    width: min(370px, 100vw - 1rem);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .hp-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-width: 0;
  }

  .hp-block.right { align-items: flex-end; }

  .hp-name {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hp-bar-wrap {
    width: 100%;
    height: 9px;
    background: var(--hp-bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .hp-bar {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .hp-bar.p1 { background: linear-gradient(90deg, #c03030, #e84545); }
  .hp-bar.p2 { background: linear-gradient(90deg, #7b4cca, #a66dff); float: right; }

  .hp-num {
    font-size: 0.72rem;
    font-weight: 700;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .hud-center {
    text-align: center;
    min-width: 44px;
    flex-shrink: 0;
  }

  .round-num {
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    opacity: 0.4;
  }

  canvas {
    border: 2px solid var(--border);
    border-radius: 2px;
    box-shadow: 0 0 40px rgba(200,168,75,0.2), 0 0 80px rgba(200,168,75,0.08), inset 0 0 40px rgba(0,0,0,0.5);
    display: block;
    max-width: calc(100vw - 1rem);
    max-height: calc(100vh - 120px);
  }

  .bottom-bar {
    width: min(370px, 100vw - 1rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.65rem;
    opacity: 0.35;
    letter-spacing: 0.1em;
    gap: 0.4rem;
  }

  .bottom-bar span {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bottom-bar span#p2-status {
    text-align: right;
  }

  .forfeit-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: rgba(232,100,100,0.55);
    background: rgba(80,20,20,0.35);
    border: 1px solid rgba(232,100,100,0.2);
    border-radius: 3px;
    padding: 0.25em 0.7em;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    line-height: 1;
    white-space: nowrap;
  }
  .forfeit-btn:hover, .forfeit-btn:active {
    color: rgba(255,90,90,0.95);
    background: rgba(120,20,20,0.6);
    border-color: rgba(232,80,80,0.5);
  }

  /* ── 倍速控制 ── */
  .speed-control {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    z-index: 5;
    background: rgba(15,12,8,0.55);
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 6px;
    padding: 0.25rem 0.4rem;
  }

  .speed-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: rgba(232,220,200,0.55);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 3px;
    padding: 0.22em 0.5em;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    line-height: 1;
    white-space: nowrap;
  }
  .speed-btn:hover {
    color: rgba(240,200,74,0.9);
    border-color: rgba(240,200,74,0.4);
  }
  .speed-btn.active {
    color: #0a0a0f;
    background: var(--border-glow);
    border-color: var(--border-glow);
    font-weight: 700;
  }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
    backdrop-filter: blur(4px);
  }

  #overlay.show { display: flex; }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-shadow: 0 0 40px currentColor;
    text-align: center;
    padding: 0 1rem;
  }

  .result-sub { font-size: 0.9rem; opacity: 0.5; letter-spacing: 0.2em; text-align: center; }

  .replay-btn {
    padding: 0.8rem 2.5rem;
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.3em;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .replay-btn:hover { background: rgba(200,168,75,0.1); box-shadow: 0 0 20px rgba(200,168,75,0.2); }

  /* ── 角色圖鑑按鈕 ── */
  .roster-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(200,168,75,0.8);
    background: rgba(200,168,75,0.08);
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 3px;
    padding: 0.4em 1.2em;
    cursor: pointer;
    transition: all 0.18s;
    margin-bottom: 0.6rem;
  }
  .roster-btn:hover { background: rgba(200,168,75,0.18); color: var(--border-glow); }

  /* ── 角色圖鑑 Modal ── */
  #roster-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.93);
    backdrop-filter: blur(6px);
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    padding: 1.2rem 1rem 1rem;
    box-sizing: border-box;
  }
  #roster-modal.show { display: flex; }

  .roster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 560px;
    margin-bottom: 0.8rem;
    flex-shrink: 0;
  }
  .roster-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.25em;
    color: var(--border-glow);
    text-shadow: 0 0 20px rgba(240,200,74,0.4);
  }
  .roster-close {
    font-size: 1.1rem;
    color: rgba(200,168,75,0.7);
    background: rgba(200,168,75,0.08);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 3px;
    width: 36px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .roster-close:hover { color: #fff; background: rgba(200,168,75,0.25); }

  /* 目標玩家切換 */
  .roster-target-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    max-width: 560px;
    margin-bottom: 0.7rem;
    flex-shrink: 0;
  }
  .roster-target-label { font-size: 0.68rem; opacity: 0.5; letter-spacing: 0.1em; }
  .roster-target-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    padding: 0.3em 1em;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid;
    background: transparent;
    opacity: 0.45;
    transition: all 0.15s;
  }
  .roster-target-btn.p1 { color: #e84545; border-color: rgba(232,69,69,0.4); }
  .roster-target-btn.p2 { color: #a66dff; border-color: rgba(123,76,202,0.4); }
  .roster-target-btn.active { opacity: 1; }
  .roster-target-btn.p1.active { background: rgba(232,69,69,0.18); box-shadow: 0 0 12px rgba(232,69,69,0.25); }
  .roster-target-btn.p2.active { background: rgba(123,76,202,0.18); box-shadow: 0 0 12px rgba(123,76,202,0.25); }

  /* 詳情面板 */
  .roster-detail {
    width: 100%;
    max-width: 560px;
    flex-shrink: 0;
    margin-bottom: 0.8rem;
    min-height: 3.6rem;
  }
  .roster-detail-empty {
    font-size: 0.68rem;
    opacity: 0.4;
    letter-spacing: 0.05em;
    line-height: 1.6;
    padding: 0.9rem 1rem;
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
    text-align: center;
  }
  .roster-detail-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,168,75,0.3);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    animation: rosterFadeIn 0.15s ease;
  }
  @keyframes rosterFadeIn { from { opacity:0; transform:translateY(-4px);} to {opacity:1; transform:translateY(0);} }
  .roster-detail-top { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.55rem; }
  .roster-detail-emoji { font-size: 1.9rem; flex-shrink: 0; }
  .roster-detail-name { font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; }
  .roster-detail-type { font-size: 0.6rem; opacity: 0.5; letter-spacing: 0.15em; margin-top: 0.1rem; }
  .roster-skill-list { list-style: none; padding: 0; margin: 0 0 0.6rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .roster-skill-list li {
    font-size: 0.68rem;
    opacity: 0.75;
    line-height: 1.55;
    padding-left: 0.9em;
    position: relative;
  }
  .roster-skill-list li::before {
    content: '▸';
    position: absolute;
    left: 0;
    opacity: 0.6;
  }
  .roster-confirm-hint {
    font-size: 0.62rem;
    opacity: 0.55;
    letter-spacing: 0.05em;
    text-align: center;
    padding-top: 0.5rem;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* 捲動區：方塊圖鑑 + 右側滑條 */
  .roster-scroll-area {
    display: flex;
    gap: 0.6rem;
    width: 100%;
    max-width: 560px;
    flex: 1;
    min-height: 0;
  }
  .roster-grid-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .roster-grid-wrap::-webkit-scrollbar { display: none; }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 0.5rem;
    padding-bottom: 1.2rem;
  }

  .roster-sq {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid rgba(200,168,75,0.18);
    background: rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .roster-sq:hover { background: rgba(255,255,255,0.07); }
  .roster-sq.active { transform: scale(1.08); box-shadow: 0 0 14px var(--sq-glow, rgba(200,168,75,0.5)); }

  /* 自訂右側滑條 */
  .roster-scrollbar {
    width: 14px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
    border-radius: 7px;
    position: relative;
  }
  .roster-scrollbar-thumb {
    position: absolute;
    left: 1px; right: 1px;
    background: rgba(200,168,75,0.55);
    border-radius: 6px;
    cursor: grab;
    touch-action: none;
  }
  .roster-scrollbar-thumb:active { cursor: grabbing; background: rgba(200,168,75,0.8); }
</style>
</head>
<body>

<!-- ══ SELECT SCREEN ══ -->
<div id="select-screen">
  <h1>競技場對決</h1>
  <p class="subtitle">ARENA · BATTLE · CHAMPIONSHIP</p>
  <button class="roster-btn" id="roster-btn">📖 角色圖鑑</button>

  <div class="select-row">
    <div class="player-slot">
      <div class="player-label">⚔ 玩家一</div>
      <div class="carousel-wrap" id="p1-carousel">
        <div class="carousel-viewport">
          <div class="carousel-track" id="p1-track"></div>
        </div>
        <div class="carousel-arrows">
          <button class="arrow-btn" data-player="p1" data-dir="-1">◀</button>
          <div class="carousel-dots" id="p1-dots"></div>
          <button class="arrow-btn" data-player="p1" data-dir="1">▶</button>
        </div>
      </div>
      <div class="selected-label" id="p1-selected-label">請選擇角色</div>
      <button class="random-btn" onclick="randomChar('p1')">🎲 隨機</button>
    </div>

<script>
// ──────────────── AUDIO ────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playHitSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const dist = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 256 - 1;
      curve[i] = (Math.PI + 300) * x / (Math.PI + 300 * Math.abs(x));
    }
    dist.curve = curve;
    osc.connect(dist); dist.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === 'knife') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.55, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'opm') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.type = 'square';
      osc3.frequency.setValueAtTime(1200, now);
      osc3.frequency.exponentialRampToValueAtTime(100, now + 0.3);
      gain3.gain.setValueAtTime(0.5, now);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc3.connect(dist); gain3.connect(ctx.destination);
      osc3.start(now); osc3.stop(now + 0.3);
      osc.start(now); osc.stop(now + 0.7);
    } else if (type === 'vampire_bite') {
      // 吸血鬼咬擊音效：短促刺穿聲 + 吸血低鳴
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
      // 額外低沉回血音
      const oscHeal = ctx.createOscillator();
      const gainHeal = ctx.createGain();
      oscHeal.type = 'sine';
      oscHeal.frequency.setValueAtTime(180, now + 0.05);
      oscHeal.frequency.linearRampToValueAtTime(260, now + 0.25);
      gainHeal.gain.setValueAtTime(0, now + 0.05);
      gainHeal.gain.linearRampToValueAtTime(0.3, now + 0.1);
      gainHeal.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      oscHeal.connect(gainHeal); gainHeal.connect(ctx.destination);
      oscHeal.start(now + 0.05); oscHeal.stop(now + 0.3);
    } else if (type === 'trap_place') {
      // 放置尖刺：輕微金屬插入聲
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.09);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'trap_hit') {
      // 尖刺命中：刺穿 + 毒液滴落
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      const oscPoi = ctx.createOscillator();
      const gainPoi = ctx.createGain();
      oscPoi.type = 'sine';
      oscPoi.frequency.setValueAtTime(220, now + 0.06);
      oscPoi.frequency.linearRampToValueAtTime(160, now + 0.3);
      gainPoi.gain.setValueAtTime(0.28, now + 0.06);
      gainPoi.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      oscPoi.connect(gainPoi); gainPoi.connect(ctx.destination);
      oscPoi.start(now + 0.06); oscPoi.stop(now + 0.35);
    } else if (type === 'trap_chain') {
      // 鎖鏈射出：金屬鏈聲 + 呼嘯
      const bufSz = Math.floor(ctx.sampleRate * 0.3);
      const cBuf = ctx.createBuffer(1, bufSz, ctx.sampleRate);
      const cData = cBuf.getChannelData(0);
      for (let i = 0; i < bufSz; i++) cData[i] = (Math.random()*2-1) * Math.exp(-i/bufSz*6);
      const cSrc = ctx.createBufferSource(); cSrc.buffer = cBuf;
      const cFilt = ctx.createBiquadFilter(); cFilt.type = 'bandpass'; cFilt.frequency.value = 2500; cFilt.Q.value = 2;
      const cGain = ctx.createGain(); cGain.gain.setValueAtTime(0.7, now); cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      cSrc.connect(cFilt); cFilt.connect(cGain); cGain.connect(ctx.destination);
      cSrc.start(now); cSrc.stop(now + 0.3);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'curse_slash') {
      // 捌斬擊音效：高頻破空 + 金屬摩擦
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.14);
      gain.gain.setValueAtTime(0.65, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
      // 噪聲氣流（斬風感）
      const bufSize = Math.floor(ctx.sampleRate * 0.18);
      const nBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const nData = nBuf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) nData[i] = (Math.random() * 2 - 1);
      const nSrc = ctx.createBufferSource(); nSrc.buffer = nBuf;
      const nFilt = ctx.createBiquadFilter(); nFilt.type = 'highpass'; nFilt.frequency.value = 4000;
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(0.5, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(ctx.destination);
      nSrc.start(now); nSrc.stop(now + 0.18);
      // 金屬回鳴
      const oscRing = ctx.createOscillator();
      const gainRing = ctx.createGain();
      oscRing.type = 'sine';
      oscRing.frequency.setValueAtTime(2000, now + 0.04);
      oscRing.frequency.linearRampToValueAtTime(1600, now + 0.22);
      gainRing.gain.setValueAtTime(0.22, now + 0.04);
      gainRing.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      oscRing.connect(gainRing); gainRing.connect(ctx.destination);
      oscRing.start(now + 0.04); oscRing.stop(now + 0.26);
    } else if (type === 'vampire_dash') {
      // 破空衝刺音效：高頻掃頻 + 氣流聲
      // 氣流噪聲
      const bufferSize = ctx.sampleRate * 0.4;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(3000, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(800, now + 0.35);
      noiseFilter.Q.value = 0.8;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.6, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
      noise.start(now); noise.stop(now + 0.4);
      // 掃頻音調
      const oscDash = ctx.createOscillator();
      const gainDash = ctx.createGain();
      oscDash.type = 'sawtooth';
      oscDash.frequency.setValueAtTime(1800, now);
      oscDash.frequency.exponentialRampToValueAtTime(200, now + 0.3);
      gainDash.gain.setValueAtTime(0.5, now);
      gainDash.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      oscDash.connect(gainDash); gainDash.connect(ctx.destination);
      oscDash.start(now); oscDash.stop(now + 0.3);
    } else if (type === 'samurai_parry') {
      // 招架音效：金屬格擋聲
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
      const oscRing2 = ctx.createOscillator();
      const gainRing2 = ctx.createGain();
      oscRing2.type = 'sine';
      oscRing2.frequency.setValueAtTime(2400, now + 0.03);
      oscRing2.frequency.linearRampToValueAtTime(1800, now + 0.3);
      gainRing2.gain.setValueAtTime(0.4, now + 0.03);
      gainRing2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      oscRing2.connect(gainRing2); gainRing2.connect(ctx.destination);
      oscRing2.start(now + 0.03); oscRing2.stop(now + 0.35);
    } else if (type === 'samurai_iaido') {
      // 居合音效：高速斬擊破空
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2200, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
      const bufSize2 = Math.floor(ctx.sampleRate * 0.1);
      const nBuf2 = ctx.createBuffer(1, bufSize2, ctx.sampleRate);
      const nData2 = nBuf2.getChannelData(0);
      for (let i = 0; i < bufSize2; i++) nData2[i] = (Math.random()*2-1);
      const nSrc2 = ctx.createBufferSource(); nSrc2.buffer = nBuf2;
      const nFilt2 = ctx.createBiquadFilter(); nFilt2.type = 'highpass'; nFilt2.frequency.value = 5000;
      const nGain2 = ctx.createGain();
      nGain2.gain.setValueAtTime(0.6, now);
      nGain2.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      nSrc2.connect(nFilt2); nFilt2.connect(nGain2); nGain2.connect(ctx.destination);
      nSrc2.start(now); nSrc2.stop(now + 0.1);
    } else if (type === 'samurai_shimetsu') {
      // 識滅斬：四連鳴音
      for (let si = 0; si < 4; si++) {
        const oscS = ctx.createOscillator();
        const gainS = ctx.createGain();
        oscS.type = 'sawtooth';
        oscS.frequency.setValueAtTime(1800 - si * 200, now + si * 0.06);
        oscS.frequency.exponentialRampToValueAtTime(100, now + si * 0.06 + 0.12);
        gainS.gain.setValueAtTime(0.7, now + si * 0.06);
        gainS.gain.exponentialRampToValueAtTime(0.001, now + si * 0.06 + 0.15);
        oscS.connect(dist); gainS.connect(ctx.destination);
        oscS.start(now + si * 0.06); oscS.stop(now + si * 0.06 + 0.15);
      }
      osc.start(now); osc.stop(now + 0.01); // dummy to avoid error
    } else if (type === 'naobito_shadow') {
      // 殘影命中：輕柔氣流
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    } else if (type === 'naobito_kyousei') {
      // 凶星軌跡：爆發衝擊聲
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2000, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
      gain.gain.setValueAtTime(0.85, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      // 衝擊低音
      const oscB = ctx.createOscillator(); const gainB = ctx.createGain();
      oscB.type = 'sine'; oscB.frequency.setValueAtTime(80, now);
      oscB.frequency.exponentialRampToValueAtTime(30, now + 0.35);
      gainB.gain.setValueAtTime(0.7, now); gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      oscB.connect(gainB); gainB.connect(ctx.destination);

// ──────────────── CAROUSEL STATE ────────────────
const carouselState = {
  p1: { index: 0, selected: null, dragging: false, startX: 0, currentX: 0 },
  p2: { index: 0, selected: null, dragging: false, startX: 0, currentX: 0 }
};

let p1Choice = null, p2Choice = null;

function buildCarousels() {
  ['p1', 'p2'].forEach(p => {
    const track = document.getElementById(`${p}-track`);
    const dotsEl = document.getElementById(`${p}-dots`);

    CHARACTERS.forEach((ch, i) => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.dataset.charId = ch.id;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="char-header">
          <span class="char-emoji">${ch.emoji}</span>
          <span class="char-name">${ch.name}</span>
        </div>
        <div class="char-desc">${ch.desc}</div>
        <div class="char-stat">${ch.stats.map(s => `<span class="stat-badge">${s}</span>`).join('')}</div>
      `;
      card.addEventListener('click', () => selectChar(p, ch.id));
      track.appendChild(card);
    });

    // 頁碼顯示
    const pageNum = document.createElement('span');
    pageNum.className = 'carousel-page-num';
    pageNum.id = `${p}-page-num`;
    pageNum.textContent = `1 / ${CHARACTERS.length}`;
    dotsEl.appendChild(pageNum);

    setupSwipe(p);
  });

  document.querySelectorAll('.arrow-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.player;
      const dir = parseInt(btn.dataset.dir);
      const cs = carouselState[p];
      goToSlide(p, cs.index + dir);
    });
  });
}

function setupSwipe(player) {
  const wrap = document.getElementById(`${player}-carousel`);
  const cs = carouselState[player];

  function onStart(e) {
    cs.dragging = true;
    cs.startX = (e.touches ? e.touches[0].clientX : e.clientX);
    cs.currentX = cs.startX;
    const track = document.getElementById(`${player}-track`);
    track.style.transition = 'none';
  }

  function onMove(e) {
    if (!cs.dragging) return;
    cs.currentX = (e.touches ? e.touches[0].clientX : e.clientX);
    const diff = cs.currentX - cs.startX;
    const track = document.getElementById(`${player}-track`);
    const base = -cs.index * 100;
    const pct = (diff / wrap.offsetWidth) * 100;
    track.style.transform = `translateX(calc(${base}% + ${pct * 0.4}px))`;
  }

  function onEnd() {
    if (!cs.dragging) return;
    cs.dragging = false;
    const diff = cs.currentX - cs.startX;
    const track = document.getElementById(`${player}-track`);
    track.style.transition = '';
    if (Math.abs(diff) > 40) {
      goToSlide(player, diff < 0 ? cs.index + 1 : cs.index - 1);
    } else {
      goToSlide(player, cs.index);
    }
  }

  wrap.addEventListener('touchstart', onStart, { passive: true });
  wrap.addEventListener('touchmove', onMove, { passive: true });
  wrap.addEventListener('touchend', onEnd);
  wrap.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

function goToSlide(player, index) {
  const cs = carouselState[player];
  const total = CHARACTERS.length;
  cs.index = ((index % total) + total) % total;
  const track = document.getElementById(`${player}-track`);
  track.style.transform = `translateX(-${cs.index * 100}%)`;
  const pageNum = document.getElementById(`${player}-page-num`);
  if (pageNum) pageNum.textContent = `${cs.index + 1} / ${total}`;
  const currentChar = CHARACTERS[cs.index];
  if (currentChar) selectChar(player, currentChar.id);
}

function randomChar(player) {
  const idx = Math.floor(Math.random() * CHARACTERS.length);
  const ch = CHARACTERS[idx];
  goToSlide(player, idx);
  selectChar(player, ch.id);
}

function selectChar(player, charId) {
  const cs = carouselState[player];
  cs.selected = charId;
  if (player === 'p1') p1Choice = charId;
  else p2Choice = charId;

  const track = document.getElementById(`${player}-track`);
  track.querySelectorAll('.char-card').forEach(card => {
    card.classList.remove('selected', 'p1', 'p2');
    if (card.dataset.charId === charId) {
      card.classList.add('selected', player);
    }
  });

  const ch = CHARACTERS.find(c => c.id === charId);
  document.getElementById(`${player}-selected-label`).textContent =
    ch ? `✓ ${ch.emoji} ${ch.name}` : '請選擇角色';

  document.getElementById('start-btn').disabled = !(p1Choice && p2Choice);
}

buildCarousels();

// ──────────────── ROSTER MODAL ────────────────
function openRoster()  { document.getElementById('roster-modal').classList.add('show'); }
function closeRoster() { document.getElementById('roster-modal').classList.remove('show'); }

(function () {
  const grid     = document.getElementById('roster-grid');
  const gridWrap = document.getElementById('roster-grid-wrap');
  const detail   = document.getElementById('roster-detail');
  const sbar     = document.getElementById('roster-scrollbar');
  const sthumb   = document.getElementById('roster-scrollbar-thumb');

  let rosterTarget = 'p1';
  let rosterSelectedId = null;

  const targetLabel = { p1: '玩家一', p2: '玩家二' };

  // ── 建立方塊圖鑑 ──
  CHARACTERS.forEach(ch => {
    const sq = document.createElement('div');
    sq.className = 'roster-sq';
    sq.dataset.charid = ch.id;
    sq.style.setProperty('--sq-glow', ch.glowColor || (ch.color + '88'));
    sq.textContent = ch.emoji;
    grid.appendChild(sq);
  });

  function renderDetail(ch) {
    detail.innerHTML = `
      <div class="roster-detail-card" style="border-color:${ch.color}66">
        <div class="roster-detail-top">
          <div class="roster-detail-emoji">${ch.emoji}</div>
          <div>
            <div class="roster-detail-name" style="color:${ch.color}">${ch.name}</div>
            <div class="roster-detail-type">${ch.type.toUpperCase()}</div>
          </div>
        </div>
        <ul class="roster-skill-list">${(ch.skills || [ch.desc]).map(s => `<li>${s}</li>`).join('')}</ul>
        <div class="roster-confirm-hint">再點一下圖示，選為 <b>${targetLabel[rosterTarget]}</b></div>
      </div>
    `;
  }

  function clearDetail() {
    detail.innerHTML = `<div class="roster-detail-empty">點一下方塊查看技能，再點一下同一格即可確認選擇</div>`;
  }

  function setActiveSquare(charId) {
    grid.querySelectorAll('.roster-sq').forEach(sq => {
      sq.classList.toggle('active', sq.dataset.charid === charId);
    });
  }

  grid.addEventListener('click', e => {
    const sq = e.target.closest('.roster-sq');
    if (!sq) return;
    const charId = sq.dataset.charid;
    const ch = CHARACTERS.find(c => c.id === charId);
    if (!ch) return;

    if (rosterSelectedId === charId) {
      // 第二次點擊同一格 → 確認選擇
      const idx = CHARACTERS.findIndex(c => c.id === charId);
      if (idx >= 0) { goToSlide(rosterTarget, idx); selectChar(rosterTarget, charId); }
      rosterSelectedId = null;
      setActiveSquare(null);
      clearDetail();
      closeRoster();
    } else {
      // 第一次點擊 → 預覽技能
      rosterSelectedId = charId;
      setActiveSquare(charId);
      renderDetail(ch);
    }
  });

  // ── 玩家目標切換 ──
  function setTarget(t) {
    rosterTarget = t;
    document.getElementById('roster-target-p1').classList.toggle('active', t === 'p1');
    document.getElementById('roster-target-p2').classList.toggle('active', t === 'p2');
    if (rosterSelectedId) {
      const ch = CHARACTERS.find(c => c.id === rosterSelectedId);
      if (ch) renderDetail(ch);
    }
  }
  document.getElementById('roster-target-p1').addEventListener('click', () => setTarget('p1'));
  document.getElementById('roster-target-p2').addEventListener('click', () => setTarget('p2'));

  // ── 自訂右側滑條 ──
  function updateThumb() {
    const trackH = sbar.clientHeight;
    const ratio  = gridWrap.clientHeight / gridWrap.scrollHeight;
    if (ratio >= 1) { sthumb.style.display = 'none'; return; }
    sthumb.style.display = 'block';
    const thumbH = Math.max(28, trackH * ratio);
    const maxScroll = gridWrap.scrollHeight - gridWrap.clientHeight;
    const scrollRatio = maxScroll > 0 ? gridWrap.scrollTop / maxScroll : 0;
    sthumb.style.height = thumbH + 'px';
    sthumb.style.top = (scrollRatio * (trackH - thumbH)) + 'px';
  }

  gridWrap.addEventListener('scroll', updateThumb);
  window.addEventListener('resize', updateThumb);

  let dragging = false, dragStartY = 0, dragStartScroll = 0;
  function onDragMove(clientY) {
    const trackH = sbar.clientHeight;
    const thumbH = sthumb.offsetHeight;
    const maxScroll = gridWrap.scrollHeight - gridWrap.clientHeight;
    const deltaY = clientY - dragStartY;
    const deltaRatio = deltaY / (trackH - thumbH);
    gridWrap.scrollTop = dragStartScroll + deltaRatio * maxScroll;
  }
  sthumb.addEventListener('pointerdown', e => {
    dragging = true;
    dragStartY = e.clientY;
    dragStartScroll = gridWrap.scrollTop;
    sthumb.setPointerCapture(e.pointerId);
  });
  sthumb.addEventListener('pointermove', e => { if (dragging) onDragMove(e.clientY); });
  sthumb.addEventListener('pointerup', () => { dragging = false; });
  sthumb.addEventListener('pointercancel', () => { dragging = false; });

  // 點擊滑條軌道空白處 → 跳轉捲動
  sbar.addEventListener('pointerdown', e => {
    if (e.target === sthumb) return;
    const rect = sbar.getBoundingClientRect();
    const clickRatio = (e.clientY - rect.top) / rect.height;
    const maxScroll = gridWrap.scrollHeight - gridWrap.clientHeight;
    gridWrap.scrollTop = clickRatio * maxScroll;
  });

  document.getElementById('roster-btn').addEventListener('click', () => {
    openRoster();
    rosterSelectedId = null;
    setActiveSquare(null);
    clearDetail();
    setTimeout(updateThumb, 30);
  });
  document.getElementById('roster-close').addEventListener('click', closeRoster);

function renderArenaModal() {
  const grid = document.getElementById('arena-modal-grid');
  grid.innerHTML = '';
  ARENAS.forEach(ar => {
    const card = document.createElement('div');
    const isActive = selectedArena === ar.id;
    card.style.cssText = `
      width:170px;padding:16px 12px;border-radius:14px;cursor:pointer;
      background:${isActive ? 'rgba(255,160,60,0.14)' : 'rgba(255,255,255,0.04)'};
      border:1px solid ${isActive ? 'rgba(255,160,60,0.6)' : 'rgba(255,255,255,0.12)'};
      text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
      transition:all 0.15s;
    `;
    card.innerHTML = `
      <div style="font-size:2.2rem">${ar.emoji}</div>
      <div style="font-size:0.92rem;font-weight:700;color:#eee">${ar.name}</div>
      <div style="font-size:0.65rem;color:#999;line-height:1.5">${ar.desc}</div>
    `;
    card.onmouseover = () => { if (!isActive) card.style.background = 'rgba(255,255,255,0.08)'; };
    card.onmouseout  = () => { if (!isActive) card.style.background = 'rgba(255,255,255,0.04)'; };
    card.onclick = () => {
      selectedArena = ar.id;
      document.getElementById('arena-pick-emoji').textContent = ar.emoji;
      document.getElementById('arena-pick-name').textContent = ar.name;
      document.getElementById('arena-modal').style.display = 'none';
    };
    grid.appendChild(card);
  });
}

function forfeitGame() {
  if (!gameLoop) return;
  cancelAnimationFrame(gameLoop);
  gameLoop = null;
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('result-title');
  const subEl   = document.getElementById('result-sub');
  titleEl.textContent  = '對局結束';
  titleEl.style.color  = '#c8a84b';
  subEl.textContent    = `已手動結束 · 共 ${Math.floor(elapsed)} 秒`;
  overlay.classList.add('show');
}

// 玩家 1、2 用既有的兩張色表；玩家 3 以上（多人混戰用）用同一顏色做色調偏移，避免撞色。
// 之後若要幫玩家 3/4 手動指定色表，只要新增 P3_COLORS / P4_COLORS 並在這裡優先讀取即可。
function colorForPlayer(player, type) {
  if (player === 1) return P1_COLORS[type] || '#ffffff';
  if (player === 2) return P2_COLORS[type] || '#cccccc';
  const base = P1_COLORS[type] || '#ffffff';
  return shiftHue(base, (player - 1) * 55);
}
function shiftHue(hex, degrees) {
  const m = hex.replace('#', '');
  const r = parseInt(m.substring(0, 2), 16) / 255;
  const g = parseInt(m.substring(2, 4), 16) / 255;
  const b = parseInt(m.substring(4, 6), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  const d = max - min;
  if (d === 0) { h = 0; s = 0; }
  else {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  h = (h + degrees) % 360; if (h < 0) h += 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m2 = l - c / 2;
  let r2, g2, b2;
  if (h < 60) { r2=c; g2=x; b2=0; } else if (h < 120) { r2=x; g2=c; b2=0; }
  else if (h < 180) { r2=0; g2=c; b2=x; } else if (h < 240) { r2=0; g2=x; b2=c; }
  else if (h < 300) { r2=x; g2=0; b2=c; } else { r2=c; g2=0; b2=x; }
  const toHex = v => Math.round((v + m2) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r2)}${toHex(g2)}${toHex(b2)}`;
}

const PROGRESS_HANDLERS = {
  opm(b) {
    return {
      atFrac: Math.min(1 - b.opmCountdown / OPM_COUNTDOWN_START, 1),
      barColor: b.opmPunched ? '#555' : (b.opmCountdown <= OPM_COUNTDOWN_START * 0.1 ? '#ff5050' : b.char.color)
    };
  },
  vampire(b) {
    const dashProgress = 1 - (b.vampireDashTimer / VAMPIRE_DASH_INTERVAL);
    return {
      atFrac: Math.max(0, Math.min(1, dashProgress)),
      barColor: b.vampireDashing ? '#ff44ff' : (b.vampireBiting ? '#aa00ff' : b.char.color)
    };
  },
  gojo(b) {
    if (b.gojoCharging) return { atFrac: Math.min(b.gojoChargeTimer / GOJO_CHARGE_TIME, 1), barColor: '#bf00ff' };
    return { atFrac: Math.min(b.gojoTimer / GOJO_COOLDOWN, 1), barColor: b.gojoUnlocked ? '#bf00ff' : b.char.color };
  },
  cursed(b) {
    return {
      atFrac: b.curseSlashTimer != null ? 1 - (b.curseSlashTimer / CURSE_SLASH_INTERVAL) : 0,
      barColor: b.curseDomainActive ? '#c0392b' : b.char.color
    };
  },
  trapper(b) {
    return {
      atFrac: b.trapChainTimer != null ? 1 - (b.trapChainTimer / TRAP_CHAIN_INTERVAL) : 0,
      barColor: b.trapChainActive ? '#f1c40f' : b.char.color
    };
  },
  yi(b) {
    return {
      atFrac: b.yiBlackTimer != null ? 1 - (b.yiBlackTimer / YI_BLACK_INTERVAL) : 0,
      barColor: (b.yiBlackCount != null && b.yiBlackCount >= YI_BLACK_MAX) ? '#ffffff' : b.char.color
    };
  },
  gunner(b) {
    return {
      atFrac: b.gunnerFiring ? (b.gunnerAmmoFired / GUNNER_MAG_SIZE) : (b.gunnerAmmo / GUNNER_MAG_SIZE),
      barColor: b.gunnerFiring ? '#ff6600' : b.char.color
    };
  },
  mage(b) {
    return {
      atFrac: 1 - Math.min(b.mageDoveTimer / MAGE_DOVE_INTERVAL, 1),
      barColor: b.mageTeleportTimer > 0 ? '#ffffff' : b.char.color
    };
  },
  samurai(b) {

    if (b.samuraiIaidoing) return { atFrac: 1 - (b.samuraiIaidoTimer / SAMURAI_IAIDO_DURATION), barColor: '#ffd700' };
    return {
      atFrac: 1 - Math.min(b.samuraiParryTimer / SAMURAI_PARRY_INTERVAL, 1),

      barColor: b.thunderParalyzed ? '#f1c40f' : b.char.color

  itachi(b) {
    if (b.itachiSusanooActive) return { atFrac: Math.max(0, Math.min(1, b.itachiSusanooTimer / ITACHI_SUSANOO_DURATION)), barColor: '#ff3333' };
    return {
      atFrac: Math.max(0, Math.min(1, b.itachiAmaterasuTimer != null ? 1 - (b.itachiAmaterasuTimer / ITACHI_AMATERASU_INTERVAL) : 0)),

  },
  cannondad(b) {
    if (b.cannonBlastFiring) return { atFrac: 1, barColor: '#ff8a3d' };
    return {
      atFrac: Math.max(0, Math.min(1, b.cannonSkillTimer != null ? b.cannonSkillTimer / (b.cannonSkillCooldown || CANNON_BEAM_COOLDOWN) : 0)),
      barColor: b.char.color
    };
  },
  dio(b) {
    if (b.dioWorldActive) {
      // 時停中：顯示剩餘時停時間
      const dur = b.dioHighActive ? DIO_WORLD_HIGH_DURATION : DIO_WORLD_DURATION;
      return { atFrac: Math.max(0, Math.min(1, b.dioWorldTimer / dur)), barColor: '#ffe566' };
    }
    // 冷卻中：顯示冷卻進度（滿格=可發動）
    const frac = Math.max(0, Math.min(1, 1 - (b.dioWorldCooldownTimer || 0) / DIO_WORLD_COOLDOWN));
    return { atFrac: frac, barColor: frac >= 1 ? '#ffe566' : b.char.color };
  },
  stargirl(b) {
    if (b.starMeteorActive) return { atFrac: Math.max(0, Math.min(1, b.starMeteorTimer / STAR_METEOR_DURATION)), barColor: '#ffaa00' };
    if (b.starMeteorCooldown > 0) {
      return { atFrac: Math.max(0, 1 - b.starMeteorCooldown / STAR_METEOR_COOLDOWN), barColor: b.char.color };
    }
    const sfrac = Math.max(0, Math.min(1, 1 - (b.starBigTimer || 0) / STAR_BIG_COOLDOWN));
    return { atFrac: sfrac, barColor: '#ffe566' };
  },
  obito(b) {
    if (b.obitoKamuiPhase === 'ghost') return { atFrac: 1 - (b.obitoGhostTimer||0)/OBITO_KAMUI_GHOST_TIME, barColor: '#cc44ff' };
    if (b.obitoKamuiPhase === 'teleporting') return { atFrac: 1, barColor: '#cc44ff' };
    if (b.obitoKamuiPhase === 'in_space') return { atFrac: 1, barColor: '#ff44ff' };
    if (b.obitoKamuiCooldown > 0) return { atFrac: 1 - b.obitoKamuiCooldown/OBITO_KAMUI_COOLDOWN, barColor: b.char.color };
    const fCd = 1 - Math.max(0,(b.obitoFireballTimer||0)/OBITO_FIREBALL_COOLDOWN);
    return { atFrac: fCd, barColor: '#ff6600' };
  },
  tiger(b) {
    if (b.tigerCharging) return { atFrac: Math.min(1, (b.tigerChargeTimer || 0) / TIGER_PUNCH_CHARGE_TIME), barColor: '#ff6600' };
    if (b.tigerNovaCharging) return { atFrac: Math.min(1, (b.tigerNovaChargeTimer || 0) / TIGER_NOVA_CHARGE_TIME), barColor: '#ff0044' };
    if (b.tigerNovaActive) return { atFrac: 1, barColor: '#ff0044' };
    const bloodOrbCount = state.tigerBloodOrbs ? state.tigerBloodOrbs.filter(o => o.owner === b.player).length : 0;
    if (bloodOrbCount >= TIGER_NOVA_THRESHOLD) return { atFrac: 1, barColor: '#ff0044' };
    return {
      atFrac: Math.max(0, Math.min(1, b.tigerPunchTimer != null ? 1 - (b.tigerPunchTimer / TIGER_PUNCH_INTERVAL) : 0)),
      barColor: b.tigerBleedPool > 50 ? '#aa0000' : b.char.color
    };
  },
  fisherman(b) {
    if (b.fisherOceanPhase) return { atFrac: 1, barColor: '#66ccff' };
    if (b.fisherPhase && b.fisherPhase !== 'idle') return { atFrac: 1, barColor: '#aee0ff' };
    return {
      atFrac: Math.max(0, Math.min(1, (b.fisherTimer || 0) / FISHER_CAST_COOLDOWN)),
      barColor: b.char.color
    };
  },
  geto(b) {
    if (b.getoUltimateCharging) return { atFrac: 1 - Math.max(0, b.getoUltimateChargeTimer) / GETO_ULTIMATE_CHARGE_TIME, barColor: '#c9a6ff' };
    if (b.getoSpecialActive) {
      if (b.getoSpecialSkill === 'surge' && b.getoSurgeCharging) {
        return { atFrac: 1 - Math.max(0, b.getoSurgeChargeTimer) / GETO_SURGE_CHARGE_TIME, barColor: '#c9a6ff' };
      }
      if (b.getoSpecialSkill === 'entangle') {
        return { atFrac: 1 - Math.max(0, b.getoEntangleTimer) / GETO_ENTANGLE_INTERVAL, barColor: '#6b8e3d' };
      }
      if (b.getoSpecialSkill === 'bind') {
        const enemy = state.balls.find(x => x.player !== b.player);
        if (enemy && enemy.getoBoundTimer > 0) return { atFrac: 1, barColor: '#8e6fd9' };
        return { atFrac: 1 - Math.max(0, b.getoBindTimer) / GETO_BIND_COOLDOWN, barColor: '#8e6fd9' };
      }
      if (b.getoSpecialSkill === 'surge') {
        return { atFrac: 1 - Math.max(0, b.getoSurgeTimer) / GETO_SURGE_COOLDOWN, barColor: b.char.color };
      }
    }
    return {
      atFrac: b.getoStock > 0 ? 1 - Math.max(0, b.getoSpawnTimer) / GETO_SPAWN_INTERVAL : 1,
      barColor: b.getoStock > 0 ? b.char.color : '#555'
    };
  },
  sakiko(b) {
    if (b.sakikoDualActive) {
      return { atFrac: Math.max(0, Math.min(1, b.sakikoDualTimer / SAKIKO_DUAL_DURATION)), barColor: '#ffd76b' };
    }
    return {
      atFrac: Math.max(0, Math.min(1, (b.sakikoFever || 0) / SAKIKO_FEVER_MAX)),
      barColor: b.sakikoMode === 'piano' ? '#e8d9c0' : '#8e6fd9'
    };
  },
  joseph(b) {
    if (b.josephState === 'charging') return { atFrac: Math.min(1, (b.josephChargeTimer||0) / JOSEPH_CHARGE_TIME), barColor: '#66ccff' };
    if (b.josephState === 'waiting') return { atFrac: Math.max(0, 1 - (b.josephRetryTimer||0) / JOSEPH_RETRY_DELAY), barColor: '#3a5f88' };
    if (b.josephUltimateActive) return { atFrac: 1, barColor: '#ffe066' };
    if (b.josephState !== 'breathing') return { atFrac: 0, barColor: '#555' };
    if (b.josephUltimateReady) return { atFrac: 1, barColor: '#ffe066' };
    const dashFrac = Math.max(0, 1 - (b.josephDashTimer||0) / JOSEPH_DASH_COOLDOWN);
    return { atFrac: dashFrac, barColor: '#2f7dc0' };
  },
  steve(b) {
    if (b.steveGathering) {
      return { atFrac: 1 - Math.max(0, b.steveGatherTimer) / STEVE_GATHER_DURATION, barColor: '#ffe066' };
    }
    if (b.stevePhase >= STEVE_MAX_PHASE) {
      if (b.steveHammerUnlocked) {
        const len = b.steveHammerCooldownLen || STEVE_HAMMER_COOLDOWN_BASE;
        return { atFrac: 1 - Math.max(0, b.steveHammerTimer) / len, barColor: '#ff6600' };
      }
      return { atFrac: 1, barColor: b.char.color };
    }
    return {
      atFrac: 1 - Math.max(0, b.steveGatherCooldown) / STEVE_GATHER_COOLDOWN,
      barColor: b.char.color
    };
  },
  __default(b) {
    return {
      atFrac: Math.min(1, b.attackTimer / b.attackInterval),
      barColor: (b.char.type !== 'chef' || b.knives > 0) ? b.char.color : '#555'
    };
  }
};

for (const c of CHARACTERS) {
  if (!(c.type in P1_COLORS)) console.warn(`[檢查] P1_COLORS 缺少角色: ${c.type}`);
  if (!(c.type in P2_COLORS)) console.warn(`[檢查] P2_COLORS 缺少角色: ${c.type}`);

}

  // 下面的顏色配置、出生點分配、state.balls 建立都已經是依人數自動算，不用再改這段。
  const playerChoices = [p1Choice, p2Choice];
  const playerCount = playerChoices.length;

  const idCounts = {};
  playerChoices.forEach(id => { idCounts[id] = (idCounts[id] || 0) + 1; });
  const idSeenSoFar = {};

  const chs = playerChoices.map((id, i) => {
    const base = CHARACTERS.find(c => c.id === id);
    const dupTotal = idCounts[id];
    idSeenSoFar[id] = (idSeenSoFar[id] || 0) + 1;
    return {
      ...base,
      color: colorForPlayer(i + 1, base.type),
      displayName: dupTotal > 1 ? base.name + ' ' + idSeenSoFar[id] : base.name
