        } else {
          dealDamage(enemy, ball.damage);
          // 赫：命中瞬間把敵人撞飛（仿鍛造師劍擊擊退寫法：疊加速度 + 立即位移，確保視覺上立刻看得到）
          const kdx = enemy.x - ball.x, kdy = enemy.y - ball.y;
          const kd = Math.sqrt(kdx*kdx + kdy*kdy) || 1;
          const knx = kdx / kd, kny = kdy / kd;
          enemy.x += knx * 22;
          enemy.y += kny * 22;
          enemy.vx += knx * GOJO_RED_KNOCKBACK;
          enemy.vy += kny * GOJO_RED_KNOCKBACK;
          state.hitFlashes.push({ x:ball.x, y:ball.y, r:25, alpha:1,
            color:'#ff4444', t:0.3 });
          playHitSound('knife');
          ball.active=false;
        }
      }
    } // end for (const ball of b.gojoBalls)
  } // end for (let bi gojo)

  // ── 奕邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'yi') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 落黑棋計時
    b.yiBlackTimer -= dt;
    if (b.yiBlackTimer <= 0) {
      b.yiBlackTimer = YI_BLACK_INTERVAL;
      if (b.yiBlackCount < YI_BLACK_MAX) {
        // 麻痺：跳過本次落棋
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        } else {
        state.yiBlackStones.push({
          x: enemy.x, y: enemy.y,
          owner: b.player,
          color: b.char.color,
          phase: 'stone',      // 'stone' | 'pulling' | 'exploded'
          pullTimer: 0,
          targetX: 0, targetY: 0,
          spawnFlash: 0.4
        });
        b.yiBlackCount++;
        dealDamage(enemy, YI_BLACK_DAMAGE);
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 22, alpha: 0.9, color: '#888888', t: 0.35 });
        playHitSound('trap_place');

        // 若第4顆落下 → 下次計時改為發白旗
        if (b.yiBlackCount >= YI_BLACK_MAX) {
          b.yiBlackTimer = YI_BLACK_INTERVAL; // 等一個間隔後發白旗
        }
        } // end else (not paralyzed)
      } else {
        // 發射白旗：落在敵方角色球當前位置，黑棋吸往此點
        const myStones = state.yiBlackStones.filter(s => s.owner === b.player && s.phase === 'stone');
        if (myStones.length > 0) {
          const cx = enemy.x;
          const cy = enemy.y;
          // 讓所有黑棋進入 pulling 階段
          for (const s of myStones) {
            s.phase = 'pulling';
            s.pullTimer = 0;
            s.targetX = cx;
            s.targetY = cy;
          }
          // 白旗視覺標記
          state.hitFlashes.push({ x: cx, y: cy, r: 40, alpha: 1.2, color: '#ffffff', t: 0.8 });
          state.hitFlashes.push({ x: cx, y: cy, r: 20, alpha: 1.0, color: '#ffeeaa', t: 0.5 });
          playHitSound('opm');
          // 重置計數
          b.yiBlackCount = 0;
        }
        b.yiBlackTimer = YI_BLACK_INTERVAL;
      }
    }

    // 小競技場觸發
    if (!b.yiArenaUsed && !b.yiArenaActive && b.hp <= YI_ARENA_HP) {
      b.yiArenaUsed = true;
      b.yiArenaActive = true;
      b.yiArenaTimer = YI_ARENA_DURATION;
      b.yiArenaCx = enemy.x;
      b.yiArenaCy = enemy.y;
      // 大型閃光特效
      state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 60, alpha: 1.0, color: '#ffffff', t: 0.7 });
      playHitSound('opm');
    }

    // 小競技場計時
    if (b.yiArenaActive) {
      b.yiArenaTimer -= dt;
      if (b.yiArenaTimer <= 0) {
        b.yiArenaActive = false;
      }
      // 強制敵人在小競技場範圍內反彈
      const half = YI_ARENA_SIZE;
      const ax1 = b.yiArenaCx - half, ax2 = b.yiArenaCx + half;
      const ay1 = b.yiArenaCy - half, ay2 = b.yiArenaCy + half;
      if (enemy.x - RADIUS < ax1) { enemy.x = ax1 + RADIUS; enemy.vx = Math.abs(enemy.vx); }
      if (enemy.x + RADIUS > ax2) { enemy.x = ax2 - RADIUS; enemy.vx = -Math.abs(enemy.vx); }
      if (enemy.y - RADIUS < ay1) { enemy.y = ay1 + RADIUS; enemy.vy = Math.abs(enemy.vy); }
      if (enemy.y + RADIUS > ay2) { enemy.y = ay2 - RADIUS; enemy.vy = -Math.abs(enemy.vy); }
    }
  }

  // 奕：黑棋 pulling 更新 & 爆炸判定
  for (let i = state.yiBlackStones.length - 1; i >= 0; i--) {
    const s = state.yiBlackStones[i];
    if (s.spawnFlash > 0) s.spawnFlash -= dt;

    if (s.phase === 'pulling') {
      s.pullTimer += dt;
      // 向中心飛行
      const pdx = s.targetX - s.x, pdy = s.targetY - s.y;
      const pd = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
      const moveAmt = YI_WHITE_PULL_SPEED * dt;
      if (pd <= moveAmt || s.pullTimer >= YI_WHITE_PULL_DUR) {
        s.x = s.targetX; s.y = s.targetY;
        s.phase = 'exploded';
        // 爆炸：對落在爆炸半徑內的敵人造成傷害
        for (const ball of state.balls) {
          if (ball.player === s.owner) continue;
          const ed = Math.sqrt((ball.x - s.x) ** 2 + (ball.y - s.y) ** 2);
          if (ed < YI_WHITE_EXPLODE_RAD + RADIUS) {
            dealDamage(ball, YI_WHITE_DAMAGE / 4); // 4顆各算1/4，合計200
            state.hitFlashes.push({ x: s.x, y: s.y, r: 35, alpha: 1.0, color: '#ffeeaa', t: 0.5 });
          }
        }
        playHitSound('trap_hit');
        state.hitFlashes.push({ x: s.x, y: s.y, r: 50, alpha: 1.2, color: '#ffffff', t: 0.4 });
      } else {
        s.x += (pdx / pd) * moveAmt;
        s.y += (pdy / pd) * moveAmt;
      }
    }

    // 爆炸後短暫閃光完畢就移除
    if (s.phase === 'exploded') {
      state.yiBlackStones.splice(i, 1);
    }
  }

  // ── 無名槍手邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'gunner') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 連射邏輯
    if (b.gunnerFiring) {
      // 停下來
      b.vx = b.vx * (1 - dt * 18);
      b.vy = b.vy * (1 - dt * 18);
      b.gunnerFireTimer -= dt;
      if (b.gunnerFireTimer <= 0 && b.gunnerAmmoFired < GUNNER_MAG_SIZE) {
        // 射出一顆子彈
        const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        const spread = (Math.random() - 0.5) * 0.15;
        state.projectiles.push({
          x: b.x, y: b.y,
          vx: Math.cos(angle + spread) * GUNNER_BULLET_SPEED,
          vy: Math.sin(angle + spread) * GUNNER_BULLET_SPEED,
          type: 'bullet', owner: b.player, color: b.char.color,
          damage: GUNNER_BULLET_DAMAGE, r: 5, active: true,
          angle: angle + spread
        });
        b.gunnerAmmoFired++;
        b.gunnerFireTimer = GUNNER_BULLET_INTERVAL;
        playHitSound('knife');
        state.hitFlashes.push({ x: b.x, y: b.y, r: 12, alpha: 0.8, color: b.char.color, t: 0.12 });
      }
      if (b.gunnerAmmoFired >= GUNNER_MAG_SIZE) {
        b.gunnerFiring = false;
        b.gunnerAmmo = 0;
        b.gunnerAmmoFired = 0;
        // 射完恢復速度
        const ang = Math.random() * Math.PI * 2;
        b.vx = Math.cos(ang) * BASE_SPEED;
        b.vy = Math.sin(ang) * BASE_SPEED;
      }
    }

    // 閃光彈冷卻 & 投擲
    b.gunnerFlashTimer -= dt;
    if (b.gunnerFlashTimer <= 0) {
      b.gunnerFlashTimer = GUNNER_FLASH_INTERVAL;
      // 麻痺：跳過本次閃光彈
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
      } else {
      const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
      state.projectiles.push({
        x: b.x, y: b.y,
        vx: Math.cos(angle) * GUNNER_FLASH_SPEED,
        vy: Math.sin(angle) * GUNNER_FLASH_SPEED,
        type: 'flashbang', owner: b.player, color: '#ffffaa',
        damage: GUNNER_FLASH_DAMAGE, r: 9, active: true,
        angle
      });
      } // end else (not paralyzed)
    }
  }

  // ── 史蒂夫邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    if (b.char.type !== 'steve') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 資源收集中：原地不動，時間到後升級裝備
    if (b.steveGathering) {
      b.vx = 0; b.vy = 0;
      b.steveGatherTimer -= dt;
      if (b.steveGatherTimer <= 0) {
        b.steveGathering = false;
        b.stevePhase = Math.min(b.stevePhase + 1, STEVE_MAX_PHASE);
        b.steveGatherCooldown = STEVE_GATHER_COOLDOWN;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 34, alpha: 1.0, color: '#c8a84b', t: 0.45 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 18, alpha: 0.9, color: '#ffffff', t: 0.25 });
        playHitSound('trap_place');
        if (b.stevePhase >= STEVE_MAX_PHASE && !b.steveHammerUnlocked) {
          b.steveHammerUnlocked = true;
          b.steveHammerCooldownLen = STEVE_HAMMER_COOLDOWN_BASE;
          b.steveHammerTimer = STEVE_HAMMER_COOLDOWN_BASE;
        }
      }
      continue; // 收集期間不做其他任何動作
    }
    if (b.steveGatherCooldown > 0) b.steveGatherCooldown -= dt;
    if (b.steveContactCooldown > 0) b.steveContactCooldown -= dt;

    // ── 鞘翅三連擊（重錘觸發時，若煙花弩正在瞄準則走這條分支）──
    if (b.steveElytraActive) {
      b.steveElytraTimer -= dt;
      const dx0 = enemy.x - b.x, dy0 = enemy.y - b.y;
      const d0 = Math.hypot(dx0, dy0) || 1;
      if (b.steveElytraStep < 3) {
        if (b.steveElytraPhaseIn) {
          // 衝刺向敵人
          b.vx = (dx0 / d0) * STEVE_HAMMER_DASH_SPEED;
          b.vy = (dy0 / d0) * STEVE_HAMMER_DASH_SPEED;
          if (!b.steveElytraHit && d0 < RADIUS * 2 + 10) {
            b.steveElytraHit = true;
            dealDamage(enemy, STEVE_ELYTRA_DASH_DMG);
            enemy.vx += (dx0 / d0) * STEVE_AXE_KNOCKBACK;
            enemy.vy += (dy0 / d0) * STEVE_AXE_KNOCKBACK;
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 26, alpha: 1, color: '#7fd0ff', t: 0.3 });
            state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: Math.atan2(dy0, dx0), life: 0.35, maxLife: 0.35, hit: true, owner: b.player, style: 'sword' });
          }
        } else {
          // 後退
          b.vx = -(dx0 / d0) * STEVE_HAMMER_DASH_SPEED * 0.7;
          b.vy = -(dy0 / d0) * STEVE_HAMMER_DASH_SPEED * 0.7;
        }
        if (b.steveElytraTimer <= 0) {
          if (b.steveElytraPhaseIn) {
            b.steveElytraPhaseIn = false;
            b.steveElytraTimer = STEVE_ELYTRA_STEP_DURATION;
          } else {
            b.steveElytraStep += 1;
            b.steveElytraPhaseIn = true;
            b.steveElytraTimer = STEVE_ELYTRA_STEP_DURATION;
            b.steveElytraHit = false;
          }
        }
      } else {
        // 第三擊：茅穿刺
        b.vx = (dx0 / d0) * STEVE_HAMMER_DASH_SPEED * 1.2;
        b.vy = (dy0 / d0) * STEVE_HAMMER_DASH_SPEED * 1.2;
        if (!b.steveElytraHit && d0 < RADIUS * 2 + 12) {
          b.steveElytraHit = true;
          dealDamage(enemy, STEVE_ELYTRA_THRUST_DMG);
          enemy.vx += (dx0 / d0) * STEVE_HAMMER_KNOCKBACK;
          enemy.vy += (dy0 / d0) * STEVE_HAMMER_KNOCKBACK;
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 42, alpha: 1.2, color: '#ffe066', t: 0.4 });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 20, alpha: 1, color: '#ffffff', t: 0.25 });
          state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: Math.atan2(dy0, dx0), life: 0.4, maxLife: 0.4, hit: true, owner: b.player, style: 'sword' });
          playHitSound('samurai_iaido');
        }
        if (b.steveElytraTimer <= 0) {
          b.steveElytraActive = false;
          b.steveElytraStep = 0;
        }
      }
      continue; // 鞘翅連擊期間不執行斧/弓等其他邏輯
    }

    // ── 重錘衝刺（一般版本，煙花弩未瞄準時觸發）──
    if (b.steveHammerDashing) {
      const dx0 = enemy.x - b.x, dy0 = enemy.y - b.y;
      const d0 = Math.hypot(dx0, dy0) || 1;
      b.vx = (dx0 / d0) * STEVE_HAMMER_DASH_SPEED;
      b.vy = (dy0 / d0) * STEVE_HAMMER_DASH_SPEED;
      if (!b.steveHammerDashHit && d0 < RADIUS * 2 + 10) {
        b.steveHammerDashHit = true;
        dealDamage(enemy, STEVE_HAMMER_DMG);
        enemy.vx += (dx0 / d0) * STEVE_HAMMER_KNOCKBACK;
        enemy.vy += (dy0 / d0) * STEVE_HAMMER_KNOCKBACK;
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 38, alpha: 1.2, color: '#c8a84b', t: 0.4 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 18, alpha: 1, color: '#ffffff', t: 0.25 });
        playHitSound('samurai_iaido');
      }
      b.steveHammerDashTimer -= dt;
      if (b.steveHammerDashTimer <= 0) b.steveHammerDashing = false;
      continue; // 重錘衝刺期間不執行斧/弓
    }

    // ── 重錘冷卻／觸發判定（四階段解鎖後才開始跑）──
    if (b.steveHammerUnlocked) {
      b.steveHammerTimer -= dt;
      if (b.steveHammerTimer <= 0) {
        if (b.steveBowAiming) {
          // 煙花弩正在瞄準：改為鞘翅三連擊，弩改進入17秒冷卻
          b.steveBowAiming = false;
          b.steveBowTimer = STEVE_ELYTRA_BOW_COOLDOWN;
          b.steveElytraActive = true;
          b.steveElytraStep = 1;
          b.steveElytraPhaseIn = true;
          b.steveElytraTimer = STEVE_ELYTRA_STEP_DURATION;
          b.steveElytraHit = false;
          b.steveHammerCooldownLen = STEVE_HAMMER_COOLDOWN_COMBO;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1, color: '#7fd0ff', t: 0.4 });
        } else {
          // 一般重錘：衝向敵人重擊
          b.steveHammerDashing = true;
          b.steveHammerDashTimer = STEVE_HAMMER_DASH_DURATION;
          b.steveHammerDashHit = false;
          b.steveHammerCooldownLen = STEVE_HAMMER_COOLDOWN_BASE;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 26, alpha: 1, color: '#c8a84b', t: 0.35 });
        }
        b.steveHammerTimer = b.steveHammerCooldownLen;
        continue;
      }
    }

    // ── 斧（主動劈砍，一階段起解鎖）──
    if (b.stevePhase >= 1) {
      if (b.steveAxeTimer > 0) b.steveAxeTimer -= dt;
      const distToEnemy = Math.hypot(enemy.x - b.x, enemy.y - b.y);
      if (b.steveAxeCharging) {
        b.steveAxeChargeTimer -= dt;
        if (b.steveAxeChargeTimer <= 0) {
          b.steveAxeCharging = false;
          const dmg = STEVE_AXE_DMG[b.stevePhase];
          const swingAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          const hit = distToEnemy < STEVE_AXE_RANGE[b.stevePhase] * 1.3;
          // 揮砍弧形特效（無論有沒有命中都會播放，讓玩家看得到揮斧動作）
          state.steveAxeFX.push({
            x: b.x, y: b.y, angle: swingAngle,
            reach: RADIUS * (b.stevePhase >= 4 ? 2.1 : 2.6),
            dual: b.stevePhase >= 4,
            life: 0.22, maxLife: 0.22
          });
          if (hit) {
            dealDamage(enemy, dmg);
            const ex = enemy.x - b.x, ey = enemy.y - b.y;
            const ed = Math.hypot(ex, ey) || 1;
            enemy.vx += (ex / ed) * STEVE_AXE_KNOCKBACK;
            enemy.vy += (ey / ed) * STEVE_AXE_KNOCKBACK;
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 28, alpha: 1, color: b.char.color, t: 0.32 });
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 14, alpha: 0.9, color: '#ffffff', t: 0.2 });
            state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: Math.atan2(ey, ex), life: 0.4, maxLife: 0.4, hit: true, owner: b.player, style: 'sword' });
          }
          playHitSound('samurai_iaido');
          b.steveAxeTimer = STEVE_AXE_COOLDOWN[b.stevePhase];
        }
      } else if (b.steveAxeTimer <= 0 && distToEnemy < STEVE_AXE_RANGE[b.stevePhase]) {
        b.steveAxeCharging = true;
        b.steveAxeChargeTimer = STEVE_AXE_CHARGE[b.stevePhase];
      }
    }

    // ── 弓／弩／煙花弩（二階段起解鎖）──
    if (b.stevePhase >= 2) {
      if (b.steveBowAiming) {
        b.steveBowAimTimer -= dt;
        if (b.steveBowAimTimer <= 0) {
          b.steveBowAiming = false;
          const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          state.projectiles.push({
            x: b.x, y: b.y,
            vx: Math.cos(angle) * STEVE_BOW_SPEED,
            vy: Math.sin(angle) * STEVE_BOW_SPEED,
            type: b.stevePhase >= 4 ? 'steve_firework' : 'steve_arrow',
            owner: b.player, color: b.char.color,
            damage: STEVE_BOW_DMG[b.stevePhase], r: 6, active: true, angle
          });
          b.steveBowTimer = STEVE_BOW_COOLDOWN;
          playHitSound('knife');
        }
      } else {
        b.steveBowTimer -= dt;
        if (b.steveBowTimer <= 0) {
          const charge = STEVE_BOW_CHARGE[b.stevePhase];
          if (charge > 0) {
            b.steveBowAiming = true;
            b.steveBowAimTimer = charge;
          } else {
            const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
            state.projectiles.push({
              x: b.x, y: b.y,
              vx: Math.cos(angle) * STEVE_BOW_SPEED,
              vy: Math.sin(angle) * STEVE_BOW_SPEED,
              type: 'steve_arrow', owner: b.player, color: b.char.color,
              damage: STEVE_BOW_DMG[b.stevePhase], r: 6, active: true, angle
            });
            b.steveBowTimer = STEVE_BOW_COOLDOWN;
            playHitSound('knife');
          }
        }
      }
    }
  }

  // ── 陷阱大師邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'trapper') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 鎖鏈冷卻計時
    if (!b.trapChainActive) {
      b.trapChainTimer -= dt;
      if (b.trapChainTimer <= 0 && state.traps.filter(t => t.owner === b.player).length > 0) {
        // 麻痺：跳過本次鎖鏈
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          b.trapChainTimer = TRAP_CHAIN_INTERVAL;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        } else {
        // 選一個己方尖刺，距敵人最近的
        const myTraps = state.traps.map((t, i) => ({ t, i })).filter(x => x.t.owner === b.player);
        if (myTraps.length > 0) {
          let best = myTraps[0], bestDist = Infinity;
          for (const mt of myTraps) {
            const dd = Math.hypot(mt.t.x - enemy.x, mt.t.y - enemy.y);
            if (dd < bestDist) { bestDist = dd; best = mt; }
          }
          b.trapChainActive = true;
          b.trapChainTimer2 = 0;
          b.trapChainTargetTrap = best.t;
          best.t.chainPulling = true;
          playHitSound('trap_chain');
        }
        b.trapChainTimer = TRAP_CHAIN_INTERVAL;
        } // end else (not paralyzed)
      }
    }

    // 鎖鏈拉扯中
    if (b.trapChainActive) {
      b.trapChainTimer2 += dt;
      const trap = b.trapChainTargetTrap;
      // 尖刺可能已被移除
      if (!trap || !trap.chainPulling || !state.traps.includes(trap)) {
        b.trapChainActive = false;
        b.trapChainTargetTrap = null;
      } else {
        // 向尖刺位置拉扯敵人（強制設速度方向）
        const px = trap.x - enemy.x, py = trap.y - enemy.y;
        const pd = Math.hypot(px, py) || 1;
        enemy.vx = (px / pd) * TRAP_CHAIN_PULL_SPD;
        enemy.vy = (py / pd) * TRAP_CHAIN_PULL_SPD;
        // 拉到尖刺旁邊或超時就停止
        if (pd < RADIUS + 10 || b.trapChainTimer2 >= TRAP_CHAIN_PULL_DUR) {
          b.trapChainActive = false;
          trap.chainPulling = false;
          b.trapChainTargetTrap = null;
          // 到達尖刺立即觸發傷害
          if (pd < RADIUS + 16 && !trap.hitCooldown) {
            dealDamage(enemy, TRAP_DAMAGE);
            enemy.trapDotTimer = TRAP_DOT_DURATION;
            enemy.trapDotDps = TRAP_DOT_DPS;
            trap.hitCooldown = TRAP_HIT_COOLDOWN;
            playHitSound('trap_hit');
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 28, alpha: 0.9, color: '#27ae60', t: 0.4 });
          }
        }
      }
    }
  }

  // 尖刺碰撞判定 & dot
  for (let i = state.traps.length - 1; i >= 0; i--) {
    const trap = state.traps[i];
    if (trap.hitCooldown > 0) trap.hitCooldown -= dt;
    // 對敵方球判定
    for (let bi = 0; bi < state.balls.length; bi++) {
      const ball = state.balls[bi];
      if (ball.player === trap.owner) continue;
      const dd = Math.hypot(ball.x - trap.x, ball.y - trap.y);
      if (dd < RADIUS + 10 && (!trap.hitCooldown || trap.hitCooldown <= 0)) {
        dealDamage(ball, TRAP_DAMAGE);
        ball.trapDotTimer = TRAP_DOT_DURATION;
        ball.trapDotDps = TRAP_DOT_DPS;
        trap.hitCooldown = TRAP_HIT_COOLDOWN;
        playHitSound('trap_hit');
        state.hitFlashes.push({ x: ball.x, y: ball.y, r: 25, alpha: 0.9, color: '#27ae60', t: 0.35 });
      }
    }
  }

  // 尖刺 dot 傷害
  for (const b of state.balls) {
    if (b.trapDotTimer > 0) {
      b.trapDotTimer -= dt;
      dealDamage(b, b.trapDotDps * dt);
      if (b.trapDotTimer <= 0) { b.trapDotTimer = 0; b.trapDotDps = 0; }
      if (Math.random() < 0.25) {
        state.hitFlashes.push({ x: b.x + randBetween(-12,12), y: b.y + randBetween(-12,12), r: 7, alpha: 0.7, color: '#2ecc71', t: 0.35 });
      }
    }
  }

  // ── 工程師邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'engineer') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 機甲模式倒數
    if (b.engMechActive) {
      b.engMechTimer -= dt;
      if (b.engMechTimer <= 0) {
        b.engMechActive = false;
        b.engMechTimer = 0;
        b.engTurretTotalSummoned = 0; // 重置累積數，下一輪需再累積15個才能再次進入機甲模式
        b.engTurretTimer = ENGINEER_TURRET_INTERVAL;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 45, alpha: 1.0, color: '#3a8fd6', t: 0.5 });
        playHitSound('knife');
      }
    }

    // 召喚炮台（機甲模式中暫停召喚）
    if (!b.engMechActive) {
      b.engTurretTimer -= dt;
      if (b.engTurretTimer <= 0) {
        b.engTurretTimer = ENGINEER_TURRET_INTERVAL;
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        } else {
          state.turrets.push({
            x: b.x, y: b.y, owner: b.player, color: b.char.color,
            life: ENGINEER_TURRET_LIFETIME, maxLife: ENGINEER_TURRET_LIFETIME,
            fireTimer: ENGINEER_TURRET_FIRE_INTERVAL * 0.4, spawnFlash: 0.4
          });
          b.engTurretTotalSummoned++;
          playHitSound('trap_chain');
          state.hitFlashes.push({ x: b.x, y: b.y, r: 26, alpha: 0.9, color: '#3a8fd6', t: 0.35 });
          // 累積滿15個炮台觸發機甲模式
          if (b.engTurretTotalSummoned >= ENGINEER_MECH_TURRET_THRESHOLD) {
            b.engMechActive = true;
            b.engMechTimer = ENGINEER_MECH_DURATION;
            b.engLaserTimer = ENGINEER_LASER_INTERVAL * 0.3;
            state.hitFlashes.push({ x: b.x, y: b.y, r: 60, alpha: 1.2, color: '#aee0ff', t: 0.6 });
            state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.0, color: '#ffffff', t: 0.4 });
            playHitSound('opm');
          }
        }
      }
    }

    // 機甲模式：雷射發射
    if (b.engMechActive) {
      b.engLaserTimer -= dt;
      if (b.engLaserTimer <= 0) {
        b.engLaserTimer = ENGINEER_LASER_INTERVAL;
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        } else {
          const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          state.engLaserFX.push({
            x: b.x, y: b.y, angle, owner: b.player,
            life: ENGINEER_LASER_TRAVEL_TIME, maxLife: ENGINEER_LASER_TRAVEL_TIME,
            length: ENGINEER_LASER_RANGE, width: ENGINEER_LASER_WIDTH,
            hit: false
          });
          playHitSound('vampire_dash');
        }
      }
    }

    // 部署電網（於敵人附近）
    b.engGridTimer -= dt;
    if (b.engGridTimer <= 0) {
      b.engGridTimer = ENGINEER_GRID_INTERVAL;
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
      } else {
        const gx = Math.min(W - RADIUS - ENGINEER_GRID_HALF, Math.max(RADIUS + ENGINEER_GRID_HALF, enemy.x + randBetween(-25, 25)));
        const gy = Math.min(H - RADIUS - ENGINEER_GRID_HALF, Math.max(RADIUS + ENGINEER_GRID_HALF, enemy.y + randBetween(-25, 25)));
        state.engGrids.push({
          x: gx, y: gy, owner: b.player,
          life: ENGINEER_GRID_LIFETIME, maxLife: ENGINEER_GRID_LIFETIME
        });
        playHitSound('thunder');
        state.hitFlashes.push({ x: gx, y: gy, r: 30, alpha: 0.8, color: '#5fd0ff', t: 0.4 });
      }
    }
  }

  // ── 砲爹邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    if (b.char.type !== 'cannondad') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 近戰拳頭：貼近敵人時揮拳
    if (b.cannonMeleeCooldown > 0) b.cannonMeleeCooldown -= dt;
    if (!state.dioWorldGlobalActive) {
      const md = Math.hypot(enemy.x - b.x, enemy.y - b.y);
      if (md < RADIUS * 2 + 6 && b.cannonMeleeCooldown <= 0) {
        b.cannonMeleeCooldown = CANNON_MELEE_COOLDOWN;
        dealDamage(enemy, CANNON_MELEE_DAMAGE);
        state.hitFlashes.push({ x: (b.x+enemy.x)/2, y: (b.y+enemy.y)/2, r: 18, alpha: 0.8, color: '#ffd76b', t: 0.25 });
        playHitSound('knife');
      }
    }

    // 光砲發射中：每次發射期間鎖定角度，可移動不可轉向
    if (b.cannonBlastFiring) {
      b.cannonBlastTimer -= dt;
      if (!b.cannonBlastHitThisShot && !state.dioWorldGlobalActive) {
        const ang = b.cannonBlastAngle;
        const dx = Math.cos(ang), dy = Math.sin(ang);
        const ex = enemy.x - b.x, ey = enemy.y - b.y;
        const proj = ex*dx + ey*dy;
        if (proj > 0) {
          const perp = Math.abs(ex*dy - ey*dx);
          if (perp < CANNON_BLAST_HALFWIDTH + RADIUS) {
            dealDamage(enemy, CANNON_BLAST_DAMAGE);
            b.cannonBlastHitThisShot = true;
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 36, alpha: 1, color: '#ff8a3d', t: 0.3 });
            playHitSound('opm');
          }
        }
      }
      if (b.cannonBlastTimer <= 0) {
        b.cannonBlastShotsLeft--;
        if (b.cannonBlastShotsLeft > 0) {
          b.cannonBlastTimer = CANNON_BLAST_SHOT_TIME;
          b.cannonBlastHitThisShot = false;
          state.cannonBlastFX.push({ x:b.x, y:b.y, angle: b.cannonBlastAngle, owner:b.player,
            life: CANNON_BLAST_SHOT_TIME, maxLife: CANNON_BLAST_SHOT_TIME,
            length: CANNON_BLAST_HALFWIDTH*2 + 700, halfWidth: CANNON_BLAST_HALFWIDTH });
        } else {
          b.cannonBlastFiring = false;
          b.cannonSkillCooldown = CANNON_BLAST_COOLDOWN;
          b.cannonSkillTimer = 0;
        }
      }
      continue; // 發射期間跳過下方的技能選擇判定
    }

    // 蓄力中：不可選擇新技能
    if (b.cannonBlastCharging) {
      b.cannonBlastChargeTimer -= dt;
      if (b.cannonBlastChargeTimer <= 0) {
        b.cannonBlastCharging = false;
        b.cannonBlastFiring = true;
        b.cannonBlastShotsLeft = CANNON_BLAST_SHOTS;
        b.cannonBlastTimer = CANNON_BLAST_SHOT_TIME;
        b.cannonBlastHitThisShot = false;
        state.cannonBlastFX.push({ x:b.x, y:b.y, angle: b.cannonBlastAngle, owner:b.player,
          life: CANNON_BLAST_SHOT_TIME, maxLife: CANNON_BLAST_SHOT_TIME,
          length: CANNON_BLAST_HALFWIDTH*2 + 700, halfWidth: CANNON_BLAST_HALFWIDTH });
      }
    } else {
      // 技能冷卻：到時隨機選一招（追蹤／光柱／光砲）
      if (!(b.gunnerStunTimer > 0)) b.cannonSkillTimer += dt;
      if (b.cannonSkillTimer >= b.cannonSkillCooldown) {
        b.cannonSkillTimer = 0;
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          state.hitFlashes.push({ x: b.x, y: b.y, r: 22, alpha: 0.8, color: '#f1c40f', t: 0.4 });
          b.cannonSkillCooldown = CANNON_BEAM_COOLDOWN;
        } else {
          const roll = Math.random();
          const ddx = enemy.x - b.x, ddy = enemy.y - b.y;
          const baseAngle = Math.atan2(ddy, ddx);
          if (roll < 0.34) {
            // 追蹤：先散射發射三顆光球，再各自小幅轉向追蹤
            for (let i = 0; i < CANNON_TRACK_COUNT; i++) {
              const off = (i - (CANNON_TRACK_COUNT-1)/2) * CANNON_TRACK_SPREAD;
              const a = baseAngle + off;
              b.cannonBalls.push({
                x: b.x, y: b.y,
                vx: Math.cos(a)*CANNON_TRACK_SPEED, vy: Math.sin(a)*CANNON_TRACK_SPEED,
                r: CANNON_TRACK_RADIUS, damage: CANNON_TRACK_DAMAGE,
                life: CANNON_TRACK_LIFESPAN, active: true
              });
            }
            b.cannonSkillCooldown = CANNON_TRACK_COOLDOWN;
            playHitSound('knife');
          } else if (roll < 0.67) {
            // 光柱：類似工程師機甲雷射，瞬間判定一發
            state.cannonBeamFX.push({
              x: b.x, y: b.y, angle: baseAngle, owner: b.player,
              life: CANNON_BEAM_TRAVEL_TIME, maxLife: CANNON_BEAM_TRAVEL_TIME,
              length: CANNON_BEAM_RANGE, width: CANNON_BEAM_WIDTH, hit: false
            });
            b.cannonSkillCooldown = CANNON_BEAM_COOLDOWN;
            playHitSound('vampire_dash');
          } else {
            // 光砲：進入蓄力，鎖定方向
            if (b.thunderParalyzed > 0) {
              b.thunderParalyzed = 0;
              b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
              b.vx = 0; b.vy = 0;
              state.thunderStunFX = state.thunderStunFX || [];
              state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
              state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 0.8, color: '#f1c40f', t: 0.4 });
              b.cannonSkillCooldown = CANNON_BLAST_CHARGE_TIME; // 打斷：短暫冷卻
            } else {
            b.cannonBlastCharging = true;
            b.cannonBlastChargeTimer = CANNON_BLAST_CHARGE_TIME;
            b.cannonBlastAngle = baseAngle;
            state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1, color: '#ff8a3d', t: CANNON_BLAST_CHARGE_TIME });
            playHitSound('opm');
            } // end else (not paralyzed)
          }
        }
      }
    }

    // 追蹤光球：移動、轉向、撞牆／命中消散
    b.cannonBalls = b.cannonBalls.filter(cb => cb.active);
    for (const cb of b.cannonBalls) {
      const desiredAng = Math.atan2(enemy.y - cb.y, enemy.x - cb.x);
      const curAng = Math.atan2(cb.vy, cb.vx);
      let diff = desiredAng - curAng;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      const maxTurn = CANNON_TRACK_TURN_RATE * dt;
      const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
      const newAng = curAng + turn;
      const spd = Math.hypot(cb.vx, cb.vy);
      cb.vx = Math.cos(newAng)*spd; cb.vy = Math.sin(newAng)*spd;
      cb.x += cb.vx*dt; cb.y += cb.vy*dt;
      cb.life -= dt;
      if (cb.life <= 0) { cb.active = false; continue; }
      if (cb.x < cb.r || cb.x > W-cb.r || cb.y < cb.r || cb.y > H-cb.r) { cb.active = false; continue; }
      const dd = Math.hypot(enemy.x - cb.x, enemy.y - cb.y);
      if (dd < RADIUS + cb.r) {
        dealDamage(enemy, cb.damage);
        cb.active = false;
        state.hitFlashes.push({ x: cb.x, y: cb.y, r: 20, alpha: 0.9, color: '#ffb347', t: 0.25 });
        playHitSound('knife');
      }
    }
  }

  // 砲爹：光柱特效（壽命衰減 & 命中判定，與工程師雷射判定方式相同）
  for (let i = state.cannonBeamFX.length - 1; i >= 0; i--) {
    const lz = state.cannonBeamFX[i];
    lz.life -= dt;
    if (lz.life <= 0) { state.cannonBeamFX.splice(i, 1); continue; }
    if (!lz.hit) {
      const target = state.balls.find(x => x.player !== lz.owner);
      if (target) {
        const dx = target.x - lz.x, dy = target.y - lz.y;
        const cos = Math.cos(lz.angle), sin = Math.sin(lz.angle);
        const localX = dx * cos + dy * sin;
        const localY = -dx * sin + dy * cos;
        if (localX > 0 && localX < lz.length && Math.abs(localY) < lz.width / 2 + RADIUS) {
          dealDamage(target, CANNON_BEAM_DAMAGE);
          lz.hit = true;
          state.hitFlashes.push({ x: target.x, y: target.y, r: 28, alpha: 1.0, color: '#ffd9a0', t: 0.3 });
          playHitSound('opm');
        }
      }
    }
  }

  // 砲爹：光砲視覺特效壽命衰減（傷害判定已在主邏輯處理，此處純粹視覺用）
  for (let i = state.cannonBlastFX.length - 1; i >= 0; i--) {
    state.cannonBlastFX[i].life -= dt;
    if (state.cannonBlastFX[i].life <= 0) state.cannonBlastFX.splice(i, 1);
  }

  // 炮台：壽命衰減 & 開火
  for (let i = state.turrets.length - 1; i >= 0; i--) {
    const t = state.turrets[i];
    if (t.spawnFlash > 0) t.spawnFlash -= dt;
    t.life -= dt;
    if (t.life <= 0) { state.turrets.splice(i, 1); continue; }
    t.fireTimer -= dt;
    if (t.fireTimer <= 0) {
      t.fireTimer = ENGINEER_TURRET_FIRE_INTERVAL;
      const target = state.balls.find(x => x.player !== t.owner);
      if (target) {
        const angle = Math.atan2(target.y - t.y, target.x - t.x);
        state.projectiles.push({
          x: t.x, y: t.y,
          vx: Math.cos(angle) * ENGINEER_TURRET_BULLET_SPEED,
          vy: Math.sin(angle) * ENGINEER_TURRET_BULLET_SPEED,
          type: 'turret_bullet', owner: t.owner, color: '#3a8fd6',
          damage: ENGINEER_TURRET_BULLET_DAMAGE, r: 7, active: true, angle
        });
        playHitSound('knife');
      }
    }
  }

  // 電網：壽命衰減、暈眩 & dot 傷害
  for (let i = state.engGrids.length - 1; i >= 0; i--) {
    const g = state.engGrids[i];
    g.life -= dt;
    if (g.life <= 0) { state.engGrids.splice(i, 1); continue; }
    const ax1 = g.x - ENGINEER_GRID_HALF, ax2 = g.x + ENGINEER_GRID_HALF;
    const ay1 = g.y - ENGINEER_GRID_HALF, ay2 = g.y + ENGINEER_GRID_HALF;
    for (const ball of state.balls) {
      if (ball.player === g.owner) continue;
      if (ball.x > ax1 && ball.x < ax2 && ball.y > ay1 && ball.y < ay2) {
        // 定身（重用通用定身欄位）並持續造成傷害
        ball.itachiPinnedTimer = Math.max(ball.itachiPinnedTimer, ENGINEER_GRID_STUN_BUFFER);
        ball.vx = 0; ball.vy = 0;
        dealDamage(ball, ENGINEER_GRID_DPS * dt);
        if (Math.random() < 0.4) {
          state.hitFlashes.push({ x: ball.x + randBetween(-14,14), y: ball.y + randBetween(-14,14), r: 6, alpha: 0.7, color: '#5fd0ff', t: 0.2 });
        }
      }
    }
  }

  // 工程師雷射特效：壽命衰減 & 命中判定
  for (let i = state.engLaserFX.length - 1; i >= 0; i--) {
    const lz = state.engLaserFX[i];
    lz.life -= dt;
    if (lz.life <= 0) { state.engLaserFX.splice(i, 1); continue; }
    if (!lz.hit) {
      const target = state.balls.find(x => x.player !== lz.owner);
      if (target) {
        // 將目標投影到雷射方向上的局部座標，檢查是否落在光束矩形內
        const dx = target.x - lz.x, dy = target.y - lz.y;
        const cos = Math.cos(lz.angle), sin = Math.sin(lz.angle);
        const localX = dx * cos + dy * sin;
        const localY = -dx * sin + dy * cos;
        if (localX > 0 && localX < lz.length && Math.abs(localY) < lz.width / 2 + RADIUS) {
          dealDamage(target, ENGINEER_LASER_DAMAGE);
          lz.hit = true;
          state.hitFlashes.push({ x: target.x, y: target.y, r: 30, alpha: 1.0, color: '#aee0ff', t: 0.3 });
          state.hitFlashes.push({ x: target.x, y: target.y, r: 16, alpha: 0.9, color: '#ffffff', t: 0.2 });
          playHitSound('opm');
        }
      }
    }
  }

  // ── 雷電法王邏輯 ──
  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'thunder') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) {
      // 時停中只更新閃電柱壽命（已在上方處理），不觸發新閃電
      for (let i = state.thunderPillars.length - 1; i >= 0; i--) {
        const p = state.thunderPillars[i];
        if (p.spawnFlash > 0) p.spawnFlash -= dt;
      }
      continue;
    }

    // 麻痺計時器清除（麻痺只持續到下一次攻擊觸發，在閃電攻擊中消耗）
    // 閃電柱計時（無限壽命不衰減；時停期間凍結壽命）
    for (let i = state.thunderPillars.length - 1; i >= 0; i--) {
      const p = state.thunderPillars[i];
      if (p.spawnFlash > 0) p.spawnFlash -= dt;
      if (p.life !== Infinity && !state.dioWorldGlobalActive) {
        p.life -= dt;
        if (p.life <= 0) state.thunderPillars.splice(i, 1);
      }
    }

    // 閃電連線計時：每個柱子同時與所有其他柱子連線
    b.thunderStrikeTimer -= dt;
    if (b.thunderStrikeTimer <= 0) {
      b.thunderStrikeTimer = THUNDER_STRIKE_INTERVAL;
      // 麻痺：跳過本次閃電
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
      } else {
      const myPillars = state.thunderPillars.filter(p => p.owner === b.player);
      if (myPillars.length >= 2) {
        state.thunderStrikes = state.thunderStrikes || [];
        let totalHits = 0;

        // 枚舉所有柱子配對，全部同時發閃電
        for (let pi = 0; pi < myPillars.length; pi++) {
          for (let pj = pi + 1; pj < myPillars.length; pj++) {
            const pA = myPillars[pi], pB = myPillars[pj];
            state.thunderStrikes.push({
              x1: pA.x, y1: pA.y,
              x2: pB.x, y2: pB.y,
              life: THUNDER_STRIKE_FX_DURATION, maxLife: THUNDER_STRIKE_FX_DURATION,
              color: b.char.color,
              owner: b.player
            });
            // 判定敵人到線段的垂直距離（不延伸到線段外）
            const lx = pB.x - pA.x, ly = pB.y - pA.y;
            const len2 = lx*lx + ly*ly;
            if (len2 > 0) {
              const t = Math.max(0, Math.min(1, ((enemy.x - pA.x)*lx + (enemy.y - pA.y)*ly) / len2));
              const cx2 = pA.x + t*lx, cy2 = pA.y + t*ly;
              const dist = Math.hypot(enemy.x - cx2, enemy.y - cy2);
              if (dist < RADIUS + THUNDER_STRIKE_HIT_RADIUS) {
                totalHits++;
              }
            }
          }
        }

        playHitSound('samurai_iaido');
        // 每條命中的閃電線各自造成傷害
        for (let h = 0; h < totalHits; h++) {
          dealDamage(enemy, THUNDER_STRIKE_DAMAGE);
        }
        if (totalHits > 0) {
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: THUNDER_HIT_FX_R1, alpha: 1.0, color: '#f1c40f', t: 0.4 });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: THUNDER_HIT_FX_R2, alpha: 0.9, color: '#ffffff', t: 0.25 });
          const canParalyze = !enemy.thunderParalyzeWasHit && Math.random() < THUNDER_PARALYZE_CHANCE;
          if (canParalyze) {
            enemy.thunderParalyzed = 2.0;  // 麻痺 2 秒
            enemy.vx = 0; enemy.vy = 0;
            state.thunderStunFX = state.thunderStunFX || [];
            state.thunderStunFX.push({ x: enemy.x, y: enemy.y, life: 0.5, maxLife: 0.5 });
            enemy.thunderParalyzeWasHit = true;
          } else {
            enemy.thunderParalyzeWasHit = false;
          }
        }

        // 所有柱子本身不額外計算碰觸傷害（柱子貼牆，敵人不會靠近）
      }
      } // end else (not paralyzed)
    }
  }

  // 雷電柱 lifetime 更新（非雷電法王角色的閃電柱時間也倒數，統一在上面處理了）

  // ── 鍛造師邏輯 ──
  // 鍛造粒子更新
  if (state.smithForgeParticles) {
    for (let i = state.smithForgeParticles.length - 1; i >= 0; i--) {
      const sp = state.smithForgeParticles[i];
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 200 * dt; // gravity
      sp.life -= dt;
      if (sp.life <= 0) state.smithForgeParticles.splice(i, 1);
    }
  }

  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if (b.char.type !== 'blacksmith') continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 揮劍動畫計時
    if (b.smithSwordSwinging) {
      b.smithSwordSwingTimer -= dt;
      if (b.smithSwordSwingTimer <= 0) b.smithSwordSwinging = false;
    }

    // 劍擊冷卻
    if (b.smithSwordTimer > 0) b.smithSwordTimer -= dt;

    const distToEnemy = Math.hypot(enemy.x - b.x, enemy.y - b.y);
    const nearEnemy = distToEnemy < SMITH_SWORD_RANGE;

    if (nearEnemy && !state.dioWorldGlobalActive) {
      // 靠近敵人：嘗試揮劍
      if (b.smithSwordTimer <= 0) {
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          b.smithSwordTimer = SMITH_SWORD_COOLDOWN;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        } else {
          // 揮劍攻擊
          const swordDmg = SMITH_SWORD_BASE_DAMAGE + b.smithForgeStacks * SMITH_FORGE_DMG_PER_STACK;
          dealDamage(enemy, swordDmg);
          if (state.stats) state.stats[b.player].skillUses++;

          // 擊退效果
          const ex2 = enemy.x - b.x, ey2 = enemy.y - b.y;
          const ed = Math.hypot(ex2, ey2) || 1;
          enemy.vx += (ex2 / ed) * SMITH_SWORD_KNOCKBACK;
          enemy.vy += (ey2 / ed) * SMITH_SWORD_KNOCKBACK;

          // 視覺特效
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30 + b.smithForgeStacks * 1.5, alpha: 1.0, color: b.char.color, t: 0.35 });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 16, alpha: 0.9, color: '#ffffff', t: 0.22 });
          // 斬擊線條
          const sAngle = Math.atan2(ey2, ex2) + (Math.random() - 0.5) * 0.5;
          state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: sAngle, life: 0.4, maxLife: 0.4, hit: true, owner: b.player, style: 'sword' });
          // 實體劍刃軌跡（從鍛造師本體噴出，比照須佐能乎的刺擊軌跡）
          state.smithSlashFX = state.smithSlashFX || [];
          state.smithSlashFX.push({
            x: b.x, y: b.y, angle: Math.atan2(ey2, ex2),
            stacks: b.smithForgeStacks,
            life: 0.3, maxLife: 0.3
          });
          playHitSound('samurai_iaido');

          // 重置鍛造速度（攻速回到基礎值），但鍛造層數永久保留，不再清零
          b.smithForgeInterval = SMITH_FORGE_INTERVAL_BASE;
          b.smithForgeTimer = SMITH_FORGE_INTERVAL_BASE;
          b.smithSwordTimer = SMITH_SWORD_COOLDOWN;
          b.smithSwordSwinging = true;
          b.smithSwordSwingTimer = 0.25;
        }
      }
    } else {
      // 遠離敵人：持續鍛造
      b.smithForgeTimer -= dt;
      if (b.smithForgeTimer <= 0) {
        // 鍛造一次
        b.smithForgeStacks = Math.min(b.smithForgeStacks + 1, SMITH_FORGE_MAX_STACKS);
        // 加快鍛造速度
        b.smithForgeInterval = Math.max(SMITH_FORGE_INTERVAL_MIN, b.smithForgeInterval * (1 - SMITH_FORGE_ACCEL));
        b.smithForgeTimer = b.smithForgeInterval;

        // 鍛造火花粒子（層數越高越多越亮）
        if (state.smithForgeParticles) {
          const sparks = 10 + Math.floor(b.smithForgeStacks * 1.5);
          for (let i = 0; i < sparks; i++) {
            const sa = Math.random() * Math.PI * 2;
            const ss = 100 + Math.random() * 220;
            const isLarge = Math.random() < 0.25;
            state.smithForgeParticles.push({
              x: b.x, y: b.y,
              vx: Math.cos(sa) * ss, vy: Math.sin(sa) * ss - 120,
              life: 0.35 + Math.random() * 0.45,
              maxLife: 0.8,
              color: Math.random() < 0.5 ? '#ff6600' : (Math.random() < 0.5 ? '#ffdd00' : '#ffffff'),
              r: isLarge ? 4 + Math.random() * 3 : 1.5 + Math.random() * 2
            });
          }
          // 少量長拖尾火花（斜向飛出）
          for (let i = 0; i < 4; i++) {
            const sa = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.8;
            state.smithForgeParticles.push({
              x: b.x, y: b.y,
              vx: Math.cos(sa) * (150 + Math.random() * 100),
              vy: Math.sin(sa) * (150 + Math.random() * 100),
              life: 0.5 + Math.random() * 0.3,
              maxLife: 0.8,
              color: '#ffaa00',
              r: 2.5, trail: true
            });
          }
        }
        // 鍛造音效（金屬敲擊）
        playHitSound('smith_forge');
        // 衝擊光環（層數越高越大）
        const flashR = 20 + b.smithForgeStacks * 2;
        state.hitFlashes.push({ x: b.x, y: b.y, r: flashR, alpha: 0.85, color: '#ff8800', t: 0.28 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: flashR * 0.5, alpha: 0.7, color: '#ffee88', t: 0.18 });
      }
    }
  }

  // ── 禪院直哉邏輯 ──
  // 殘影生命倒數＋接觸傷害
  if (state.naoShadows) {
    for (let i = state.naoShadows.length - 1; i >= 0; i--) {
      const sh = state.naoShadows[i];
      sh.life -= dt;
      if (sh.hitCooldown > 0) sh.hitCooldown -= dt;
      if (sh.life <= 0) { state.naoShadows.splice(i, 1); continue; }
      // 接觸判定：碰到敵人
      const enemy = state.balls.find(b => b.player !== sh.owner);
      if (enemy && sh.hitCooldown <= 0 && !state.dioWorldGlobalActive) {
        const dist = Math.hypot(enemy.x - sh.x, enemy.y - sh.y);
        if (dist < NAOBITO_SHADOW_HIT_RADIUS + RADIUS) {
          dealDamage(enemy, NAOBITO_SHADOW_DAMAGE);
          sh.hitCooldown = NAOBITO_SHADOW_HIT_COOLDOWN;
          state.hitFlashes.push({ x: sh.x, y: sh.y, r: 22, alpha: 0.7, color: '#c8c8ff', t: 0.2 });
          playHitSound('naobito_shadow');
        }
      }
    }
    // 路徑預覽線倒數
    for (let i = state.naoPathLines.length - 1; i >= 0; i--) {
      state.naoPathLines[i].life -= dt;
      if (state.naoPathLines[i].life <= 0) state.naoPathLines.splice(i, 1);
    }
  }

  for (let bi = 0; bi < state.balls.length; bi++) {
    const b = state.balls[bi];
    if (b.char.type !== 'naobito') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 凶星軌跡冷卻倒數
    if (b.naoKyouseiTimer > 0) b.naoKyouseiTimer -= dt;

    // 凶星軌跡動畫計時
    if (b.naoKyouseiFiring) {
      b.naoKyouseiTimer2 -= dt;
      if (b.naoKyouseiTimer2 <= 0) b.naoKyouseiFiring = false;
    }

    // 凶星軌跡觸發判定
    const myShadows = state.naoShadows ? state.naoShadows.filter(s => s.owner === b.player) : [];
    if (myShadows.length >= NAOBITO_KYOUSEI_THRESHOLD && b.naoKyouseiTimer <= 0 && !b.naoKyouseiFiring && !b.naoDashing) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        b.naoKyouseiTimer = NAOBITO_KYOUSEI_COOLDOWN * 0.5; // 打斷：短暫冷卻
        // 殘影保留，只是這次發動被打斷
      } else {
      const ex = enemy.x - b.x, ey = enemy.y - b.y;
      const ed = Math.hypot(ex, ey) || 1;
      b.vx = (ex / ed) * NAOBITO_KYOUSEI_SPEED;
      b.vy = (ey / ed) * NAOBITO_KYOUSEI_SPEED;
      b.naoDashing = true;

      // 每個殘影也飛向敵人（作為投射物）
      for (const sh of myShadows) {
        const sx = enemy.x - sh.x, sy = enemy.y - sh.y;
        const sd = Math.hypot(sx, sy) || 1;
        state.projectiles.push({
          x: sh.x, y: sh.y,
          vx: (sx / sd) * NAOBITO_KYOUSEI_SPEED,
          vy: (sy / sd) * NAOBITO_KYOUSEI_SPEED,
          damage: NAOBITO_KYOUSEI_SHADOW_DMG,
          owner: b.player,
          type: 'naobito_kyousei',
          life: 1.5,
          r: RADIUS * 0.7,
          hit: false
        });
      }
      // 移除所有殘影
      state.naoShadows = state.naoShadows.filter(s => s.owner !== b.player);
      b.naoKyouseiTimer = NAOBITO_KYOUSEI_COOLDOWN;
      b.naoKyouseiFiring = true;
      b.naoKyouseiTimer2 = 0.35;
      b.naoPathTimer = NAOBITO_PATH_INTERVAL; // 重新規劃路徑
      if (state.stats) state.stats[b.player].skillUses++;
      playHitSound('naobito_kyousei');
      // 大光爆特效
      state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.0, color: '#ffffff', t: 0.4 });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 0.8, color: '#aaaaff', t: 0.3 });
      continue; // 凶星軌跡期間跳過普通路徑邏輯
      } // end else (not paralyzed)
    }

    // 凶星軌跡本體命中判定
    if (b.naoKyouseiFiring) {
      const distE = Math.hypot(enemy.x - b.x, enemy.y - b.y);
      if (distE < RADIUS * 2) {
        dealDamage(enemy, NAOBITO_KYOUSEI_PIERCE_DMG);
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 40, alpha: 1.0, color: '#ffffff', t: 0.35 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 20, alpha: 0.9, color: '#8888ff', t: 0.25 });
        b.naoKyouseiFiring = false;
        b.naoDashing = false;
      }
      continue;
    }

    // ── 一般路徑規劃與衝刺 ──
    b.naoPathTimer -= dt;

    // 需要規劃新路徑
    if (b.naoPathTimer <= 0 && (!b.naoWaypoints || b.naoWaypointIdx >= b.naoWaypoints.length)) {
      // 生成折線路徑：多個偏移中繼點 → 最終目標為敵人
      const waypoints = [];
      for (let wi = 0; wi < NAOBITO_WAYPOINT_COUNT - 1; wi++) {
        const t = (wi + 1) / NAOBITO_WAYPOINT_COUNT;
        const mx = b.x + (enemy.x - b.x) * t;
        const my = b.y + (enemy.y - b.y) * t;
        const perp = Math.atan2(enemy.y - b.y, enemy.x - b.x) + Math.PI / 2;
        const dev = (Math.random() - 0.5) * 2 * NAOBITO_PATH_DEVIATION;
        waypoints.push({
          x: Math.max(RADIUS + 5, Math.min(W - RADIUS - 5, mx + Math.cos(perp) * dev)),
          y: Math.max(RADIUS + 5, Math.min(H - RADIUS - 5, my + Math.sin(perp) * dev))
        });
      }
      waypoints.push({ x: enemy.x, y: enemy.y });  // 最終目標
      const retreatAng = Math.atan2(b.y - enemy.y, b.x - enemy.x);
waypoints.push({
  x: Math.max(RADIUS + 5, Math.min(W - RADIUS - 5, enemy.x + Math.cos(retreatAng) * NAOBITO_RETREAT_DISTANCE)),
  y: Math.max(RADIUS + 5, Math.min(H - RADIUS - 5, enemy.y + Math.sin(retreatAng) * NAOBITO_RETREAT_DISTANCE))
});

      b.naoWaypoints = waypoints;
      b.naoWaypointIdx = 0;
      b.naoDashing = true;
      b.naoPathTimer = NAOBITO_PATH_INTERVAL;

      // 路徑預覽線（短暫顯示）
      const allPts = [{ x: b.x, y: b.y }, ...waypoints];
      for (let wi = 0; wi < allPts.length - 1; wi++) {
        state.naoPathLines.push({
          x1: allPts[wi].x, y1: allPts[wi].y,
          x2: allPts[wi + 1].x, y2: allPts[wi + 1].y,
          life: 0.45, maxLife: 0.45, owner: b.player
        });
      }
    }

    // 沿路徑衝刺
    if (b.naoDashing && b.naoWaypoints && b.naoWaypointIdx < b.naoWaypoints.length) {
      // 最大衝刺時間：避免卡在無法完成的路徑上
      b.naoDashElapsed = (b.naoDashElapsed || 0) + dt;
      if (b.naoDashElapsed >= NAOBITO_DASH_MAX_DURATION) {
        b.naoDashing = false;
        b.naoWaypoints = null;
        b.naoWaypointIdx = 0;
        b.naoDashElapsed = 0;
        const ang = Math.random() * Math.PI * 2;
        b.vx = Math.cos(ang) * BASE_SPEED;
        b.vy = Math.sin(ang) * BASE_SPEED;
      } else {
      const target = b.naoWaypoints[b.naoWaypointIdx];
      const dx = target.x - b.x, dy = target.y - b.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 12) {
        // 抵達中繼點：留下殘影
        const myCount = state.naoShadows.filter(s => s.owner === b.player).length;
        if (myCount < NAOBITO_SHADOW_MAX) {
          state.naoShadows.push({
            x: b.x, y: b.y,
            owner: b.player,
            life: NAOBITO_SHADOW_LIFETIME,
            maxLife: NAOBITO_SHADOW_LIFETIME,
            hitCooldown: 0
          });
          // 殘影出現特效
          state.hitFlashes.push({ x: b.x, y: b.y, r: 18, alpha: 0.5, color: '#c8c8ff', t: 0.25 });
        }
        b.naoWaypointIdx++;
        if (b.naoWaypointIdx >= b.naoWaypoints.length) {
          b.naoDashing = false;
          b.naoDashElapsed = 0;
        }
      } else {
        // 朝中繼點衝刺
        b.vx = (dx / dist) * NAOBITO_DASH_SPEED;
        b.vy = (dy / dist) * NAOBITO_DASH_SPEED;
      }
      }
    } else {
      b.naoDashing = false;
      b.naoDashElapsed = 0;
    }
  }

  // 凶星軌跡投射物更新
  if (state.projectiles) {
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      if (p.type !== 'naobito_kyousei') continue;
      if (state.dioWorldGlobalActive) continue;
      p.life -= dt;
      if (p.life <= 0 || p.hit) { state.projectiles.splice(i, 1); continue; }

  }
  if (state.thunderStrikes) {

  }

  // 麻痺消耗：在attackTimer到達間隔時若麻痺，重置計時器並取消麻痺
  for (const b of state.balls) {

      // 麻痺：阻止下一次攻擊（重置計時器讓它再等一輪）

    }
  }

  // 斬痕更新（解）
  for (let i = state.slashMarks.length-1; i >= 0; i--) {

    if (state.slashMarks[i].life <= 0) state.slashMarks.splice(i, 1);

  {

              samurai.samuraiIaidoCount = 0;

            samurai.y += samurai.vy * dt;
            state.hitFlashes.push({ x: samurai.x, y: samurai.y, r: 35, alpha: 1.0, color: '#d4af37', t: 0.35 });

      }

  }

  // 投射物更新
  for (let i = state.projectiles.length-1; i >= 0; i--) {

    for (let bi = 0; bi < state.balls.length; bi++) {

      }

      if (pd < RADIUS+10) {
        // 末代武士招架反彈

            dealDamage(b, p.damage);
            state.hitFlashes.push({ x:b.x, y:b.y, r:35, alpha:1, color:'#ffcc00', t:0.35 });

        } else if (p.type === 'bullet' || p.type === 'turret_bullet') {

          b.vx += (p.vx / blen) * (p.type === 'turret_bullet' ? GUNNER_BULLET_KNOCKBACK * 0.5 : GUNNER_BULLET_KNOCKBACK);
          b.vy += (p.vy / blen) * (p.type === 'turret_bullet' ? GUNNER_BULLET_KNOCKBACK * 0.5 : GUNNER_BULLET_KNOCKBACK);
          state.hitFlashes.push({ x:b.x, y:b.y, r:20, alpha:1, color: p.type === 'turret_bullet' ? '#5fd0ff' : '#ffdd44', t:0.2 });

          const yuta = state.balls.find(x => x.player === p.owner);
          if (yuta && yuta.yutaBindCooldown <= 0) {
            b.itachiPinnedTimer = YUTA_BIND_DURATION;
            b.vx = 0; b.vy = 0;
            yuta.yutaBindCooldown = YUTA_BIND_COOLDOWN;
          }
          state.hitFlashes.push({ x:b.x, y:b.y, r:24, alpha:1, color:'#ff6fa5', t:0.3 });
          playHitSound('knife');
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'flashbang') {
          for (const target of state.balls) {
            if (target.player === p.owner) continue;
            const fd = Math.hypot(p.x - target.x, p.y - target.y);
            if (fd < GUNNER_FLASH_RADIUS) {
              dealDamage(target, p.damage);
              target.gunnerStunTimer = GUNNER_FLASH_STUN_DUR;
            }
          }
          state.hitFlashes.push({ x:p.x, y:p.y, r:GUNNER_FLASH_RADIUS, alpha:1.2, color:'#ffffff', t:0.5 });
          state.hitFlashes.push({ x:p.x, y:p.y, r:GUNNER_FLASH_RADIUS*0.6, alpha:1.0, color:'#ffffaa', t:0.35 });
          playHitSound('opm');
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'amaterasu') {
          if (b.itachiMarked) {
            // 已有標記：清空標記，造成大量傷害
            b.itachiMarked = false;
            dealDamage(b, p.reflected ? p.damage : ITACHI_AMATERASU_MARK_DMG);
            state.hitFlashes.push({ x:b.x, y:b.y, r:65, alpha:1.3, color:'#ff2200', t:0.5 });
            state.hitFlashes.push({ x:b.x, y:b.y, r:35, alpha:1.0, color:'#1a0a1a', t:0.4 });
            playHitSound('opm');
          } else {
            // 無標記：造成基礎傷害並施加標記
            dealDamage(b, p.reflected ? p.damage : ITACHI_AMATERASU_DAMAGE);
            b.itachiMarked = true;
            state.hitFlashes.push({ x:b.x, y:b.y, r:32, alpha:1.0, color:'#8b0000', t:0.35 });
            state.hitFlashes.push({ x:b.x, y:b.y, r:16, alpha:0.8, color:'#1a0a1a', t:0.25 });
            playHitSound('knife');
          }
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'dove') {
          dealDamage(b, p.damage);
          state.hitFlashes.push({ x:b.x, y:b.y, r:35, alpha:1.0, color:'#9b59b6', t:0.35 });
          state.hitFlashes.push({ x:b.x, y:b.y, r:18, alpha:0.8, color:'#ffffff', t:0.2 });
          playHitSound('knife');

          // ── 魔術技巧命中效果 ──
          const trickId = p.mageTrick ? Number(p.mageTrick) : 0;
          if (trickId === 1) {
            // 技巧1：魔術師回血
            const mage = state.balls.find(m => m.player === p.owner && m.char.type === 'mage');
            if (mage) {
              mage.hp = Math.min(MAX_HP, mage.hp + MAGE_TRICK_HEAL);
              state.hitFlashes.push({ x: mage.x, y: mage.y, r: 40, alpha: 1.2, color: '#2ecc71', t: 0.55 });
              state.hitFlashes.push({ x: mage.x, y: mage.y, r: 18, alpha: 0.8, color: '#ffffff', t: 0.35 });
            }
            state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#f0c84a', t: 0.4 });
            state.projectiles.splice(i, 1);
            removed = true; break;
          } else if (trickId === 2) {
            // 技巧2：穿透反彈，繼續飛
            p.vx = -p.vx; p.vy = -p.vy;
            p.angle = Math.atan2(p.vy, p.vx);
            p.mageTrick = 0; // 消耗技巧
            p.trickGlow = false;
            p.doveWallBounce = true; // 碰牆繼續反彈
            state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#f0c84a', t: 0.4 });
            break; // 跳出 bi 迴圈，不移除投射物
          } else if (trickId === 3) {
            // 技巧3：追蹤鴿子命中（普通傷害，加紅色特效）
            state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1.2, color: '#e74c3c', t: 0.45 });
            state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#f0c84a', t: 0.4 });
            state.projectiles.splice(i, 1);
            removed = true; break;
          } else if (trickId === 4) {
            // 技巧4：定身
            b.mageFreezeTimer = MAGE_TRICK_FREEZE_DUR;
            state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1.0, color: '#00cfff', t: 0.5 });
            state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#f0c84a', t: 0.4 });
            state.projectiles.splice(i, 1);
            removed = true; break;
          } else {
            // 普通鴿子
          }

          // ── 命中計數（普通鴿子才計）→ 蓄積魔術技巧 ──
          const mageShooter = state.balls.find(m => m.player === p.owner && m.char.type === 'mage');
          if (mageShooter) {
            mageShooter.mageHitCount = (mageShooter.mageHitCount || 0) + 1;
            if (mageShooter.mageHitCount >= MAGE_TRICK_HIT_COUNT) {
              mageShooter.mageHitCount = 0;
              mageShooter.mageTrickReady = true;
              mageShooter.mageTrickType = Math.floor(Math.random() * 4) + 1;
              state.hitFlashes.push({ x: mageShooter.x, y: mageShooter.y, r: 40, alpha: 1.0, color: '#f0c84a', t: 0.6 });
            }
          }
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'bloodshot') {
          dealDamage(b, p.damage);
          // 在命中位置留下血球
          if (!state.tigerBloodOrbs) state.tigerBloodOrbs = [];
          state.tigerBloodOrbs.push({
            x: b.x, y: b.y, r: TIGER_BLOOD_ORB_RADIUS,
            owner: p.owner, life: TIGER_BLOOD_ORB_LIFETIME,
            pulse: 0
          });
          // 命中藍色咒力特效
          if (!state.tigerCurseFX) state.tigerCurseFX = [];
          for (let ci = 0; ci < 8; ci++) {
            const ca = Math.random() * Math.PI * 2;
            state.tigerCurseFX.push({ x: b.x, y: b.y, vx: Math.cos(ca)*80, vy: Math.sin(ca)*80, life: 0.4, maxLife: 0.4, r: 4, color: '#4488ff', isBleed: false });
          }
          state.hitFlashes.push({ x:b.x, y:b.y, r:28, alpha:1.1, color:'#dd0022', t:0.3 });
          playHitSound('knife');
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'shimetsu') {
          // 識滅斬：穿透
          if (!p.hitTargets) p.hitTargets = new Set();
          if (!p.hitTargets.has(b.player)) {
            p.hitTargets.add(b.player);
            dealDamage(b, p.damage);
            state.hitFlashes.push({ x: b.x, y: b.y, r: 32, alpha: 1.1, color: '#ffd700', t: 0.35 });
            playHitSound('knife');
          }
        } else if (p.type === 'fisher_fish') {
          dealDamage(b, p.damage);
          b.fisherRedTimer = FISHER_FISH_RED_DELAY;
          state.hitFlashes.push({ x:b.x, y:b.y, r:26, alpha:1, color:'#4a90d9', t:0.3 });
          playHitSound('bottle');
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else if (p.type === 'fisher_shark') {
          dealDamage(b, p.damage);
          b.curseDotTimer = FISHER_SHARK_BLEED_DUR;
          b.curseDotDmg = FISHER_SHARK_BLEED_DPS;
          state.hitFlashes.push({ x:b.x, y:b.y, r:36, alpha:1.1, color:'#cc0022', t:0.35 });
          playHitSound('vampire_bite');
          state.projectiles.splice(i, 1);
          removed = true; break;
        } else {
          dealDamage(b, p.damage);
          state.hitFlashes.push({ x:b.x, y:b.y, r:35, alpha:1, color:'#ffcc00', t:0.35 });
          playHitSound('bottle');
          state.projectiles.splice(i, 1);
          removed = true; break;
        }
      } else if (p.type === 'knife' && p.hitTargets) {
        p.hitTargets.delete(b.player);
      }
    }
    if (removed) continue;
    if (i >= state.projectiles.length) continue;
    const hitWall = p.x < WALL || p.x > W-WALL || p.y < WALL || p.y > H-WALL;
    if (hitWall) {
      if (p.type === 'knife') {
        p.x = Math.max(WALL, Math.min(W-WALL, p.x));
        p.y = Math.max(WALL, Math.min(H-WALL, p.y));
        // 只有廚師的刀才插牆等待回收，其他飛刀（如DIO）碰牆直接消失
        const knifeOwnerBall = state.balls.find(b => b.player === p.owner);
        if (knifeOwnerBall && knifeOwnerBall.char.type === 'chef') {
          state.wallKnives.push({ x:p.x, y:p.y, angle:p.angle, owner:p.owner, color:p.color });
        }
        state.projectiles.splice(i, 1);
      } else if ((p.type === 'dove' && Number(p.mageTrick) === 2) || p.doveWallBounce) {
        // 技巧2穿透反彈鴿子：碰牆反彈
        if (p.x < WALL || p.x > W-WALL) { p.vx = -p.vx; p.x = Math.max(WALL, Math.min(W-WALL, p.x)); }
        if (p.y < WALL || p.y > H-WALL) { p.vy = -p.vy; p.y = Math.max(WALL, Math.min(H-WALL, p.y)); }
      } else if (p.type === 'shimetsu') {
        state.projectiles.splice(i, 1);
      } else { state.projectiles.splice(i, 1); }
    }
  }

  // ── 宇治波鼬邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'itachi') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 烏鴉替身：瀕死觸發（每場一次），優先判定
    if (!b.itachiCrowUsed && !b.opmExecuted && b.hp <= 0) {
      b.itachiCrowUsed = true;
      b.hp = ITACHI_CROW_HEAL;
      // 瞬移到隨機位置
      b.x = randBetween(RADIUS*3, W - RADIUS*3);
      b.y = randBetween(RADIUS*3, H - RADIUS*3);
      b.vx = (Math.random() - 0.5) * BASE_SPEED * 2;
      b.vy = (Math.random() - 0.5) * BASE_SPEED * 2;
      // 解除任何定身/咬擊狀態
      b.itachiBiting = false; b.itachiBiteStep = 0; b.itachiBiteTimer = 0;
      b.itachiPinnedTimer = 0; b.mageFreezeTimer = 0; b.frozenByVampire = false;
      b.invincible = false;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 60, alpha: 1.2, color: '#1a1a1a', t: 0.6 });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.0, color: '#8b0000', t: 0.4 });
      state.itachiCrowFX = { x: b.x, y: b.y, life: 0.6, maxLife: 0.6 };
      playHitSound('vampire_dash');
      continue; // 本幀跳過其他邏輯
    }

    // 須佐能乎：血量低於門檻時自動觸發（每場一次）
    if (!b.itachiSusanooUsed && !b.itachiSusanooActive && b.hp > 0 && b.hp <= ITACHI_SUSANOO_HP_THRESHOLD) {
      b.itachiSusanooUsed = true;
      b.itachiSusanooActive = true;
      b.itachiSusanooTimer = ITACHI_SUSANOO_DURATION;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 90, alpha: 1.3, color: '#8b0000', t: 0.8 });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.0, color: '#ff3333', t: 0.5 });
      playHitSound('vampire_dash');
    }

    // 須佐能乎持續時間倒數
    if (b.itachiSusanooActive) {
      b.itachiSusanooTimer -= dt;
      if (b.itachiSusanooTimer <= 0) {
        b.itachiSusanooActive = false;
        b.itachiSusanooTimer = 0;
        b.itachiBiting = false; b.itachiBiteStep = 0; b.itachiBiteTimer = 0;
      }
    }

    // 須佐能乎：刺擊冷卻倒數
    if (b.itachiBiteCooldown > 0) {
      b.itachiBiteCooldown -= dt;
      if (b.itachiBiteCooldown < 0) b.itachiBiteCooldown = 0;
    }

    // 須佐能乎：靠近敵人時觸發單次刺擊（不停下、保留速度；時停中跳過）
    if (b.itachiSusanooActive && b.itachiBiteCooldown <= 0 && !state.dioWorldGlobalActive) {
      const sd = Math.hypot(b.x - enemy.x, b.y - enemy.y);
      if (sd < ITACHI_SUSANOO_BITE_RANGE) {
        dealDamage(enemy, ITACHI_SUSANOO_BITE_DAMAGE);
        b.hp = Math.min(MAX_HP, b.hp + ITACHI_SUSANOO_BITE_HEAL);
        const stabAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        state.itachiStabFX = state.itachiStabFX || [];
        state.itachiStabFX.push({
          x: b.x, y: b.y, angle: stabAngle,
          life: 0.28, maxLife: 0.28
        });
        // 命中血花（誇張化）
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 50, alpha: 1.3, color: '#ff0000', t: 0.35 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 26, alpha: 1.2, color: '#ffffff', t: 0.2 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 70, alpha: 0.6, color: '#660000', t: 0.45 });
        // 吸血回流特效（在須佐能乎位置）
        state.hitFlashes.push({ x: b.x, y: b.y, r: 36, alpha: 1.0, color: '#8b0000', t: 0.35 });
        playHitSound('vampire_bite');
        b.itachiBiteCooldown = ITACHI_SUSANOO_BITE_INTERVAL;
        // 輕微推開，避免持續貼著重複觸發太密
        const ex2 = b.x - enemy.x, ey2 = b.y - enemy.y;
        const ed2 = Math.sqrt(ex2*ex2 + ey2*ey2) || 1;
        b.vx += (ex2/ed2) * 80;
        b.vy += (ey2/ed2) * 80;
        enemy.vx -= (ex2/ed2) * 60;
        enemy.vy -= (ey2/ed2) * 60;
      }
    }

    // 須佐能乎啟動中：跳過天照/月讀施放（純近戰）
    if (b.itachiSusanooActive) continue;

    // 天照冷卻倒數與發射
    b.itachiAmaterasuTimer -= dt;
    if (b.itachiAmaterasuTimer <= 0) {
      b.itachiAmaterasuTimer = ITACHI_AMATERASU_INTERVAL;
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
      } else {
        const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        state.projectiles.push({
          x: b.x, y: b.y,
          vx: Math.cos(angle) * ITACHI_AMATERASU_SPEED,
          vy: Math.sin(angle) * ITACHI_AMATERASU_SPEED,
          type: 'amaterasu', owner: b.player, color: '#1a0a1a',
          damage: ITACHI_AMATERASU_DAMAGE, r: 13, active: true, angle
        });
        if (state.stats) state.stats[b.player].skillUses++;
        playHitSound('knife');
      }
    }

    // 月讀冷卻倒數與發射
    b.itachiTsukuyomiTimer -= dt;
    if (b.itachiTsukuyomiTimer <= 0) {
      b.itachiTsukuyomiTimer = ITACHI_TSUKUYOMI_INTERVAL;
      if (!(b.thunderParalyzed > 0)) {
        enemy.itachiPinnedTimer = ITACHI_TSUKUYOMI_PIN_DUR;
        enemy.vx = 0; enemy.vy = 0;
        if (state.stats) state.stats[b.player].skillUses++;
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 50, alpha: 1.2, color: '#aa0000', t: 0.5 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 25, alpha: 1.0, color: '#1a0a1a', t: 0.35 });
        playHitSound('opm');
      }
    }
  }

  // 宇治波鼬：烏鴉替身特效更新
  if (state.itachiCrowFX) {
    state.itachiCrowFX.life -= dt;
    if (state.itachiCrowFX.life <= 0) state.itachiCrowFX = null;
  }

  // 宇治波鼬：刺擊特效更新
  if (state.itachiStabFX) {
    for (let i = state.itachiStabFX.length - 1; i >= 0; i--) {
      state.itachiStabFX[i].life -= dt;
      if (state.itachiStabFX[i].life <= 0) state.itachiStabFX.splice(i, 1);
    }
  }

  // ── 乙骨憂太邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'yuta') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 禁錮自身冷卻倒數
    if (b.yutaBindCooldown > 0) {
      b.yutaBindCooldown -= dt;
      if (b.yutaBindCooldown < 0) b.yutaBindCooldown = 0;
    }

    // 里香在場時的攻速加成（被動：冷卻-0.5秒，套用在咒言與咒力斬上）
    const rikaCdCut = b.yutaRikaActive ? YUTA_RIKA_PASSIVE_CD_CUT : 0;

    // 咒言：定時發射投射物（不受距離限制）
    b.yutaCurseWordTimer -= dt;
    if (b.yutaCurseWordTimer <= 0) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        b.yutaCurseWordTimer = Math.max(0.5, YUTA_CURSEWORD_INTERVAL - rikaCdCut); // 打斷：重置冷卻
      } else {
        const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        const dmgMul = b.yutaRikaActive ? YUTA_RIKA_PASSIVE_DMG_MULT : 1;
        state.projectiles.push({
          x: b.x, y: b.y,
          vx: Math.cos(angle) * YUTA_CURSEWORD_SPEED,
          vy: Math.sin(angle) * YUTA_CURSEWORD_SPEED,
          type: 'curseword', owner: b.player, color: '#ff6fa5',
          damage: YUTA_CURSEWORD_DAMAGE * dmgMul, r: 7, active: true, angle
        });
        if (state.stats) state.stats[b.player].skillUses++;
        playHitSound('knife');
        b.yutaCurseWordTimer = Math.max(0.2, YUTA_CURSEWORD_INTERVAL - rikaCdCut);
      }
    }

    // 咒力斬：靠近敵人時自動揮砍（鍛造師式距離判定，固定傷害、無蓄力疊層）
    if (b.yutaSlashSwinging) {
      b.yutaSlashSwingTimer -= dt;
      if (b.yutaSlashSwingTimer <= 0) b.yutaSlashSwinging = false;
    }
    if (b.yutaSlashTimer > 0) b.yutaSlashTimer -= dt;

    const distToEnemy = Math.hypot(enemy.x - b.x, enemy.y - b.y);
    if (distToEnemy < YUTA_SLASH_RANGE && b.yutaSlashTimer <= 0 && !state.dioWorldGlobalActive) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        b.yutaSlashTimer = Math.max(0.2, YUTA_SLASH_COOLDOWN - rikaCdCut);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#f1c40f', t: 0.4 });
      } else {
        const dmgMul = b.yutaRikaActive ? YUTA_RIKA_PASSIVE_DMG_MULT : 1;
        dealDamage(enemy, YUTA_SLASH_DAMAGE * dmgMul);
        if (state.stats) state.stats[b.player].skillUses++;

        // 咒力斬累積命中次數 → 達標永久召喚里香
        if (!b.yutaRikaActive) {
          b.yutaSlashHits = (b.yutaSlashHits || 0) + 1;
          if (b.yutaSlashHits >= YUTA_SLASH_HIT_THRESHOLD) {
            b.yutaRikaActive = true;
            state.hitFlashes.push({ x: b.x, y: b.y, r: 60, alpha: 1.2, color: '#ff6fa5', t: 0.6 });
            state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.0, color: '#ffffff', t: 0.4 });
          }
        }

        // 視覺特效（比照鍛造師劍擊）
        const ex2 = enemy.x - b.x, ey2 = enemy.y - b.y;
        const ed = Math.hypot(ex2, ey2) || 1;
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30, alpha: 1.0, color: b.char.color, t: 0.35 });
        state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 16, alpha: 0.9, color: '#ffffff', t: 0.22 });
        const sAngle = Math.atan2(ey2, ex2) + (Math.random() - 0.5) * 0.5;
        state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: sAngle, life: 0.4, maxLife: 0.4, hit: true, owner: b.player, style: 'sword' });
        // 實體咒力斬軌跡（從乙骨本體噴出，比照鍛造師的劍刃軌跡，但無蓄力疊層、固定距離與張角）
        state.yutaSlashFX.push({
          x: b.x, y: b.y, angle: Math.atan2(ey2, ex2),
          life: 0.3, maxLife: 0.3
        });
        playHitSound('samurai_iaido');

        b.yutaSlashTimer = Math.max(0.2, YUTA_SLASH_COOLDOWN - rikaCdCut);
        b.yutaSlashSwinging = true;
        b.yutaSlashSwingTimer = 0.25;
      }
    }

    // ── 里香：跟隨、揮爪、純愛大砲 ──
    if (b.yutaRikaActive && !b.obitoInSpace) {
      // 跟隨：以乙骨為中心繞圈飛行
      b.yutaRikaAngle = (b.yutaRikaAngle || 0) + dt * 2.2; // 繞圈角速度
      const rikaX = b.x + Math.cos(b.yutaRikaAngle) * YUTA_RIKA_FOLLOW_RADIUS;
      const rikaY = b.y + Math.sin(b.yutaRikaAngle) * YUTA_RIKA_FOLLOW_RADIUS;
      b.yutaRikaX = rikaX;
      b.yutaRikaY = rikaY;

      // 揮爪：先0.5秒預警（鎖定圓心位置顯示警示圈），預警結束才真正判定傷害
      if (b.yutaRikaClawWarning) {
        b.yutaRikaClawWarnTimer -= dt;
        if (b.yutaRikaClawWarnTimer <= 0) {
          b.yutaRikaClawWarning = false;
          const wx = b.yutaRikaClawWarnX, wy = b.yutaRikaClawWarnY;
          const cd = Math.hypot(enemy.x - wx, enemy.y - wy);
          if (cd < YUTA_RIKA_CLAW_RANGE) {
            dealDamage(enemy, YUTA_RIKA_CLAW_DAMAGE);
            if (state.stats) state.stats[b.player].skillUses++;
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 36, alpha: 1.2, color: '#ff6fa5', t: 0.4 });
            // 爪痕：3道斜線劃傷 + 閃光
            const clawAngle = Math.atan2(enemy.y - wy, enemy.x - wx);
            state.slashMarks.push({ x: enemy.x, y: enemy.y, angle: clawAngle, life: 0.4, maxLife: 0.4, hit: true, owner: b.player, style: 'claw' });
          }
        }
      } else {
        b.yutaRikaClawTimer -= dt;
        if (b.yutaRikaClawTimer <= 0) {
          b.yutaRikaClawTimer = YUTA_RIKA_CLAW_INTERVAL;
          b.yutaRikaClawWarning = true;
          b.yutaRikaClawWarnTimer = YUTA_RIKA_CLAW_WARN_DUR;
          b.yutaRikaClawWarnX = rikaX;
          b.yutaRikaClawWarnY = rikaY;
        }
      }

      // 純愛大砲：先0.5秒預警（鎖定方向顯示警示線），預警結束才開始持續造成範圍傷害
      if (b.yutaRikaCannonWarning) {
        b.yutaRikaCannonWarnTimer -= dt;
        if (b.yutaRikaCannonWarnTimer <= 0) {
          b.yutaRikaCannonWarning = false;
          b.yutaRikaCannonFiring = true;
          b.yutaRikaCannonElapsed = 0;
          playHitSound('opm');
        }
      } else if (b.yutaRikaCannonFiring) {
        b.yutaRikaCannonElapsed += dt;
        // 判定敵人到光柱（射線）的垂直距離（與視覺光柱寬度對齊：半寬=YUTA_RIKA_CANNON_RANGE）
        const ang = b.yutaRikaCannonAngle;
        const dx = Math.cos(ang), dy = Math.sin(ang);
        const ex = enemy.x - rikaX, ey = enemy.y - rikaY;
        const proj = ex * dx + ey * dy; // 沿光柱方向的投影長度
        if (proj > 0) {
          const perp = Math.abs(ex * dy - ey * dx); // 垂直距離
          if (perp < YUTA_RIKA_CANNON_RANGE) {
            dealDamage(enemy, YUTA_RIKA_CANNON_DPS * dt);
          }
        }
        if (b.yutaRikaCannonElapsed >= YUTA_RIKA_CANNON_DURATION) {
          b.yutaRikaCannonFiring = false;
          b.yutaRikaCannonTimer = YUTA_RIKA_CANNON_INTERVAL;
        }
      } else {
        b.yutaRikaCannonTimer -= dt;
        if (b.yutaRikaCannonTimer <= 0) {
          b.yutaRikaCannonTimer = YUTA_RIKA_CANNON_INTERVAL; // 防止預警期間冷卻計時器持續觸發
          b.yutaRikaCannonWarning = true;
          b.yutaRikaCannonWarnTimer = YUTA_RIKA_CANNON_WARN_DUR;
          // 預警階段就鎖定方向，期間不再轉向
          b.yutaRikaCannonAngle = Math.atan2(enemy.y - rikaY, enemy.x - rikaX);
          if (state.stats) state.stats[b.player].skillUses++;
          state.hitFlashes.push({ x: rikaX, y: rikaY, r: 50, alpha: 1.2, color: '#ff9fc6', t: 0.5 });
          playHitSound('opm');
        }
      }
    }
  }

  // 鍛造師：劍刃軌跡特效更新
  if (state.smithSlashFX) {
    for (let i = state.smithSlashFX.length - 1; i >= 0; i--) {
      state.smithSlashFX[i].life -= dt;
      if (state.smithSlashFX[i].life <= 0) state.smithSlashFX.splice(i, 1);
    }
  }

  // 史蒂夫：斧劈特效更新
  if (state.steveAxeFX) {
    for (let i = state.steveAxeFX.length - 1; i >= 0; i--) {
      state.steveAxeFX[i].life -= dt;
      if (state.steveAxeFX[i].life <= 0) state.steveAxeFX.splice(i, 1);
    }
  }

  // ── DIO 邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'dio') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;

    // 替身：環繞跟隨本體
    if (!b.obitoInSpace) {
    b.dioStandAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);    const standX = b.x + Math.cos(b.dioStandAngle) * DIO_STAND_RADIUS;
    const standY = b.y + Math.sin(b.dioStandAngle) * DIO_STAND_RADIUS;
    b.dioStandX = standX;
    b.dioStandY = standY;

    // 替身：碰到敵人時連打（包含時停狀態下也會造成傷害）
    if (b.dioStandPunchTimer > 0) b.dioStandPunchTimer -= dt;
    const standDist = Math.hypot(enemy.x - standX, enemy.y - standY);
    if (standDist < DIO_STAND_HIT_RANGE && b.dioStandPunchTimer <= 0) {
      dealDamage(enemy, DIO_STAND_PUNCH_DAMAGE);
      b.dioStandPunchTimer = DIO_STAND_PUNCH_INTERVAL;
      if (state.stats) state.stats[b.player].skillUses++;
      const pAngle = Math.atan2(enemy.y - standY, enemy.x - standX);
      // 衝擊閃光
      state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 22, alpha: 1.1, color: '#ffd34d', t: 0.18 });
      state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 12, alpha: 0.9, color: '#ffffff', t: 0.12 });
      if (!state.dioPunchFX) state.dioPunchFX = [];
      const mudaWords = [];
      for (let _mi = 0; _mi < 4; _mi++) {
        mudaWords.push({
          angle: pAngle + (_mi - 1.5) * 0.55 + (Math.random() - 0.5) * 0.3,
          dist: 28 + Math.random() * 18,
          rot: (Math.random() - 0.5) * 0.6,
          size: 9 + Math.random() * 5
        });
      }
      state.dioPunchFX.push({ x: enemy.x, y: enemy.y, angle: pAngle, life: 0.22, maxLife: 0.22, mudaWords });
      // 衝擊線條（放射狀）
      if (!state.dioImpactLines) state.dioImpactLines = [];
      for (let _li = 0; _li < 6; _li++) {
        const la = pAngle + (Math.random() - 0.5) * Math.PI * 0.7;
        state.dioImpactLines.push({ x: enemy.x, y: enemy.y, angle: la,
          len: 18 + Math.random() * 22, life: 0.16, maxLife: 0.16 });
      }
      playHitSound('knife');
    }
    } // end !obitoInSpace (替身)

    // 世界：冷卻倒數（時停中不倒數）
    if (!b.dioWorldActive && b.dioWorldCooldownTimer > 0) {
      b.dioWorldCooldownTimer -= dt;
    }

    // 麵包：定時生成（場上共用）
    b.dioBreadSpawnTimer -= dt;
    if (b.dioBreadSpawnTimer <= 0) {
      b.dioBreadSpawnTimer = randBetween(DIO_BREAD_SPAWN_MIN, DIO_BREAD_SPAWN_MAX);
      const bx = RADIUS * 2 + Math.random() * (W - RADIUS * 4);
      const by = RADIUS * 2 + Math.random() * (H - RADIUS * 4);
      state.dioBreads.push({ x: bx, y: by, r: DIO_BREAD_RADIUS });
    }

    // 麵包：碰撞判定（回血＋丟刀＋累積HIGH計數）
    for (let i = state.dioBreads.length - 1; i >= 0; i--) {
      const br = state.dioBreads[i];
      if (Math.hypot(b.x - br.x, b.y - br.y) < RADIUS + br.r) {
        state.dioBreads.splice(i, 1);
        b.hp = Math.min(MAX_HP, b.hp + DIO_BREAD_HEAL);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 26, alpha: 0.8, color: '#e8a33d', t: 0.3 });
        const bAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        if (b.dioWorldActive) {
          state.projectiles.push({
            x: b.x, y: b.y, vx: 0, vy: 0,
            dioFrozenVx: Math.cos(bAngle) * DIO_KNIFE_SPEED, dioFrozenVy: Math.sin(bAngle) * DIO_KNIFE_SPEED,
