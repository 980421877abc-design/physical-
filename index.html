    for (let ci = 0; ci < 8; ci++) {
      const ang = (Math.PI*2/8)*ci + ci*0.4;
      const dist = (1-prog) * 70;
      const cx = fx.x + Math.cos(ang)*dist;
      const cy = fx.y + Math.sin(ang)*dist - (1-prog)*30;
      ctx.globalAlpha = prog;
      ctx.fillText('🐦‍⬛', cx, cy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // 一拳超人出拳特效
  let hasShake = false, shakeIntensity = 0;
  for (const f of state.opmFX) {
    if (f.type === 'shake') { hasShake = true; shakeIntensity = f.intensity * (f.life / f.maxLife); }
  }
  if (hasShake) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
  }

  for (const f of state.opmFX) {
    const prog = f.life / f.maxLife;
    if (f.type === 'flash') {
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${prog * 0.85})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    } else if (f.type === 'ring') {
      ctx.save();
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.strokeStyle = f.color + Math.floor(prog * 220).toString(16).padStart(2,'0');
      ctx.lineWidth = (f.lineW || 2) * prog;
      ctx.stroke();
      ctx.restore();
    } else if (f.type === 'spark') {
      ctx.save();
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * prog, 0, Math.PI * 2);
      ctx.fillStyle = f.color + Math.floor(prog * 255).toString(16).padStart(2,'0');
      ctx.fill();
      ctx.restore();
    }
  }

  if (hasShake) ctx.restore();

  // 鍛造師：火花粒子
  if (state.smithForgeParticles) {
    for (const sp of state.smithForgeParticles) {
      const maxLife = sp.maxLife || 0.6;
      const prog = sp.life / maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(0, prog * prog); // 二次方衰退更自然
      if (sp.trail) {
        // 長拖尾火花：畫線段
        const tx = sp.x - sp.vx * 0.04;
        const ty = sp.y - sp.vy * 0.04;
        ctx.strokeStyle = sp.color;
        ctx.lineWidth = sp.r;
        ctx.lineCap = 'round';
        ctx.shadowColor = sp.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(sp.x, sp.y);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r * Math.max(0.2, prog), 0, Math.PI * 2);
        ctx.fillStyle = sp.color;
        ctx.shadowColor = sp.color;
        ctx.shadowBlur = sp.r > 3 ? 14 : 7;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // 禪院直哉：路徑預覽線
  if (state.naoPathLines) {
    for (const line of state.naoPathLines) {
      const prog = line.life / line.maxLife;
      ctx.save();
      ctx.globalAlpha = prog * 0.55;
      ctx.strokeStyle = '#c8c8ff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.shadowColor = '#8888ff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(line.x1, line.y1);
      ctx.lineTo(line.x2, line.y2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // 禪院直哉：殘影分身
  if (state.naoShadows) {
    for (const sh of state.naoShadows) {
      const prog = sh.life / sh.maxLife;
      const ownerBall = state.balls.find(b => b.player === sh.owner);
      const col = ownerBall ? ownerBall.char.color : '#c8c8ff';
      ctx.save();
      ctx.globalAlpha = Math.max(0, prog * 0.65);
      // 外光暈
      const sg = ctx.createRadialGradient(sh.x, sh.y, 0, sh.x, sh.y, RADIUS * 1.8);
      sg.addColorStop(0, col + '55');
      sg.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(sh.x, sh.y, RADIUS * 1.8, 0, Math.PI * 2);
      ctx.fillStyle = sg; ctx.fill();
      // 主體（半透明）
      ctx.beginPath(); ctx.arc(sh.x, sh.y, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1117';
      ctx.globalAlpha = Math.max(0, prog * 0.5);
      ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.8;
      ctx.shadowColor = col;
      ctx.shadowBlur = 12;
      ctx.globalAlpha = Math.max(0, prog * 0.7);
      ctx.stroke();
      // 殘影 emoji
      ctx.font = `${RADIUS * 1.1}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.max(0, prog * 0.55);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('👤', sh.x, sh.y);
      ctx.restore();
    }
  }

  // 乙骨憂太：里香本體渲染（跟隨、揮爪、純愛大砲）
  for (const b of state.balls) {
    if (b.char.type !== 'yuta' || !b.yutaRikaActive) continue;
    if (b.obitoInSpace) continue; // 進入神威空間時里香消失
    const rx = b.yutaRikaX != null ? b.yutaRikaX : b.x;
    const ry = b.yutaRikaY != null ? b.yutaRikaY : b.y;

    // 揮爪預警：以鎖定圓心顯示脈動警示圈（範圍與實際判定一致）
    if (b.yutaRikaClawWarning) {
      const warnProg = 1 - (b.yutaRikaClawWarnTimer / YUTA_RIKA_CLAW_WARN_DUR); // 0→1
      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 22);
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.yutaRikaClawWarnX, b.yutaRikaClawWarnY, YUTA_RIKA_CLAW_RANGE, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,61,138,${0.4 + 0.4 * pulse})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff3d8a'; ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.fillStyle = `rgba(255,111,165,${0.08 + 0.10 * warnProg})`;
      ctx.fill();
      ctx.restore();
    }

    // 大砲預警：顯示完整光柱路徑（細線、半透明閃爍，寬度與實際判定一致但視覺上明顯較細不顯眼）
    if (b.yutaRikaCannonWarning) {
      const ang = b.yutaRikaCannonAngle || 0;
      const farX = rx + Math.cos(ang) * (W + H);
      const farY = ry + Math.sin(ang) * (W + H);
      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 26);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(farX, farY);
      ctx.strokeStyle = `rgba(255,111,165,${0.5 + 0.4 * pulse})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ff6fa5'; ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.restore();
    }

    // 純愛大砲光柱（畫在里香本體之前，避免遮蓋角色圖示）
    if (b.yutaRikaCannonFiring) {
      const ang = b.yutaRikaCannonAngle || 0;
      const farX = rx + Math.cos(ang) * (W + H);
      const farY = ry + Math.sin(ang) * (W + H);
      const pulse = 0.7 + 0.3 * Math.sin(elapsed * 16);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(farX, farY);
      ctx.strokeStyle = `rgba(255,111,165,${0.55 * pulse})`;
      ctx.lineWidth = YUTA_RIKA_CANNON_RANGE * 2;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ff6fa5';
      ctx.shadowBlur = 25;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(farX, farY);
      ctx.strokeStyle = `rgba(255,230,240,${0.8 * pulse})`;
      ctx.lineWidth = 10;
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.restore();
    }

    // 里香本體（永久顯形，非半透明殘影）
    ctx.save();
    const rikaPulse = 0.85 + 0.15 * Math.sin(elapsed * 4 + b.player);
    const rg = ctx.createRadialGradient(rx, ry, 0, rx, ry, RADIUS * 1.6);
    rg.addColorStop(0, `rgba(255,111,165,${0.45 * rikaPulse})`);
    rg.addColorStop(1, 'rgba(255,111,165,0)');
    ctx.beginPath(); ctx.arc(rx, ry, RADIUS * 1.6, 0, Math.PI * 2);
    ctx.fillStyle = rg; ctx.fill();
    ctx.font = `${RADIUS * 1.3}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff6fa5';
    ctx.shadowBlur = 12;
    ctx.fillText('👧', rx, ry);
    ctx.restore();
  }

  // DIO：麵包（場上物件）
  if (state.dioBreads) {
    for (const br of state.dioBreads) {
      ctx.save();
      // 穩定光圈（取代 shadowBlur，避免 emoji shadow 閃爍）
      const bg = ctx.createRadialGradient(br.x, br.y, 0, br.x, br.y, br.r + 10);
      bg.addColorStop(0, 'rgba(232,163,61,0.35)');
      bg.addColorStop(1, 'rgba(232,163,61,0)');
      ctx.beginPath(); ctx.arc(br.x, br.y, br.r + 10, 0, Math.PI * 2);
      ctx.fillStyle = bg; ctx.fill();
      ctx.font = '22px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🍞', br.x, br.y);
      ctx.restore();
    }
  }

  // DIO：替身（跟隨環繞 + 拳擊特效）
  for (const b of state.balls) {
    if (b.char.type !== 'dio') continue;
    if (b.obitoInSpace) continue; // 進入神威空間時替身消失
    const sx = b.dioStandX != null ? b.dioStandX : b.x;
    const sy = b.dioStandY != null ? b.dioStandY : b.y;
    ctx.save();
    const standPulse = 0.8 + 0.2 * Math.sin(elapsed * 5 + b.player);
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, RADIUS * DIO_STAND_SIZE);
    sg.addColorStop(0, `rgba(245,208,32,${0.35 * standPulse})`);
    sg.addColorStop(1, 'rgba(245,208,32,0)');
    ctx.beginPath(); ctx.arc(sx, sy, RADIUS * DIO_STAND_SIZE, 0, Math.PI * 2);
    ctx.fillStyle = sg; ctx.fill();
    ctx.font = `${RADIUS * DIO_STAND_SIZE}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.85;
    ctx.shadowColor = '#f5d020'; ctx.shadowBlur = 10;
    ctx.fillText('🧍', sx, sy);
    ctx.restore();
  }
  if (state.dioPunchFX) {
    for (const fx of state.dioPunchFX) {
      const prog = fx.life / fx.maxLife;
      const eased = 1 - (1 - prog) * (1 - prog);
      ctx.save();
      // 擴散圓環
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, 14 + (1 - prog) * 20, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,211,77,${prog * 0.7})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // 👊 emoji（往打擊方向飛出）
      ctx.translate(fx.x + Math.cos(fx.angle) * (1 - eased) * 18,
                    fx.y + Math.sin(fx.angle) * (1 - eased) * 18);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = Math.max(0, eased);
      ctx.font = `${16 + (1 - prog) * 8}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#f5d020'; ctx.shadowBlur = 8;
      ctx.fillText('👊', 0, 0);
      ctx.restore();
      // 無駄無駄文字（往四周爆散）
      if (fx.mudaWords) {
        for (const mw of fx.mudaWords) {
          const mp = fx.life / fx.maxLife;
          ctx.save();
          const mx = fx.x + Math.cos(mw.angle) * mw.dist * (1 - mp);
          const my = fx.y + Math.sin(mw.angle) * mw.dist * (1 - mp);
          ctx.translate(mx, my);
          ctx.rotate(mw.rot);
          ctx.globalAlpha = Math.max(0, mp * 1.2);
          ctx.font = `bold ${mw.size + (1 - mp) * 4}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 6;
          ctx.fillStyle = mp > 0.5 ? '#ffffff' : '#ffd34d';
          ctx.fillText('無駄', 0, 0);
          ctx.restore();
        }
      }
    }
  }
  // 衝擊線條
  if (state.dioImpactLines) {
    for (const ln of state.dioImpactLines) {
      const prog = ln.life / ln.maxLife;
      ctx.save();
      ctx.translate(ln.x, ln.y);
      ctx.rotate(ln.angle);
      ctx.globalAlpha = prog * 0.85;
      ctx.strokeStyle = '#ffd34d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(6 + ln.len * prog, 0);
      ctx.stroke();
      ctx.restore();
    }
  }

  // DIO：壓路機
  if (state.dioSteamroller) {
    const sr = state.dioSteamroller;
    ctx.save();
    ctx.translate(sr.x, sr.y);
    ctx.rotate(Math.atan2(sr.vy, sr.vx));
    ctx.font = `${DIO_STEAMROLLER_RADIUS * 1.6}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#444444'; ctx.shadowBlur = 14;
    ctx.fillText('🚜', 0, 0);
    ctx.restore();
  }

  // 凶星軌跡投射物（殘影飛撲）
  if (state.projectiles) {
    for (const p of state.projectiles) {
      if (p.type !== 'naobito_kyousei') continue;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1117'; ctx.fill();
      ctx.strokeStyle = '#c8c8ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#8888ff';
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.font = `${p.r * 1.2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('👤', p.x, p.y);
      ctx.restore();
    }
  }

  // ── 帶土：火球渲染 ──
  if (state.obitoFireballs) {
    for (const fb of state.obitoFireballs) {
      ctx.save();
      ctx.translate(fb.x, fb.y);
      const fg = ctx.createRadialGradient(0,0,0,0,0,fb.r*2.5);
      fg.addColorStop(0,'rgba(255,200,80,0.9)');
      fg.addColorStop(0.5,'rgba(255,80,0,0.6)');
      fg.addColorStop(1,'rgba(255,40,0,0)');
      ctx.beginPath(); ctx.arc(0,0,fb.r*2.5,0,Math.PI*2);
      ctx.fillStyle = fg; ctx.fill();
      const fg2 = ctx.createRadialGradient(0,0,0,0,0,fb.r);
      fg2.addColorStop(0,'rgba(255,255,200,1)');
      fg2.addColorStop(0.6,'rgba(255,120,0,0.95)');
      fg2.addColorStop(1,'rgba(200,40,0,0.8)');
      ctx.beginPath(); ctx.arc(0,0,fb.r,0,Math.PI*2);
      ctx.fillStyle = fg2; ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 18; ctx.fill();
      ctx.restore();
    }
  }

  // ── 帶土：神威空間（左上角半透明視窗）──
  const obitoB = state.balls.find(b => b.char.type === 'obito');
  const spaceHasContent = state.obitoSpaceCaptures && state.obitoSpaceCaptures.length > 0;
  const spaceActive = obitoB && (
    spaceHasContent ||
    ['ghost','teleporting','in_space','grabbing','returning','chaining'].includes(obitoB.obitoKamuiPhase)
  );
  if (spaceActive) {
    const SX = 8, SY = 8, SW = OBITO_SPACE_W, SH = OBITO_SPACE_H;
    ctx.save();
    ctx.translate(SX, SY);
    ctx.fillStyle = 'rgba(8,0,18,0.88)';
    ctx.fillRect(0, 0, SW, SH);
    const pulse = 0.6 + 0.4 * Math.sin(elapsed * 6);
    ctx.strokeStyle = `rgba(180,60,255,${pulse})`;
    ctx.lineWidth = 2; ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 12;
    ctx.strokeRect(0, 0, SW, SH); ctx.shadowBlur = 0;
    ctx.font = 'bold 9px sans-serif';
    ctx.fillStyle = `rgba(200,120,255,${pulse})`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('🌀 神 威 空 間', SW/2, 3);
    // 顯示口袋儲存數（右上角）
    if (obitoB && obitoB.obitoAbsorbStored && obitoB.obitoAbsorbStored.length > 0) {
      ctx.font = 'bold 8px sans-serif';
      ctx.fillStyle = `rgba(255,200,100,${pulse})`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(`📦×${obitoB.obitoAbsorbStored.length}`, SW - 3, 3);
      ctx.textAlign = 'center';
    }
    ctx.strokeStyle = 'rgba(100,40,160,0.22)'; ctx.lineWidth = 0.5;
    for (let gx = 20; gx < SW; gx += 20) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,SH); ctx.stroke(); }
    for (let gy = 20; gy < SH; gy += 20) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(SW,gy); ctx.stroke(); }

    if (state.obitoSpaceCaptures) {
      for (const cap of state.obitoSpaceCaptures) {
        if (cap.type === 'enemy') {
          const eB = state.balls.find(x => x.player === cap.enemyPlayer);
          if (!eB) continue;
          ctx.save();
          ctx.font = `${RADIUS}px serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.shadowColor = eB.char.color; ctx.shadowBlur = 8;
          ctx.fillText(eB.char.emoji, cap.x, cap.y);
          for (let ki = 0; ki < 6; ki++) {
            const ka = elapsed * 3 + ki / 6 * Math.PI * 2;
            ctx.fillStyle = `rgba(180,60,255,${0.5+0.3*Math.sin(elapsed*8+ki)})`;
            ctx.beginPath(); ctx.arc(cap.x + Math.cos(ka)*18, cap.y + Math.sin(ka)*18, 3, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        } else {
          ctx.save();
          const bob = Math.sin(elapsed * 4 + cap.x) * 3;
          const py = cap.y + bob;
          const flicker = cap.life < 1.5 ? (0.4 + 0.6 * Math.abs(Math.sin(elapsed * 12))) : 1;
          // 外圈光暈
          ctx.globalAlpha = flicker;
          ctx.beginPath(); ctx.arc(cap.x, py, 11, 0, Math.PI*2);
          ctx.fillStyle = `${cap.origColor || '#ff8800'}33`;
          ctx.fill();
          // 本體
          ctx.beginPath(); ctx.arc(cap.x, py, 7, 0, Math.PI*2);
          ctx.fillStyle = cap.origColor || '#ff8800';
          ctx.shadowColor = cap.origColor || '#ff8800'; ctx.shadowBlur = 10;
          ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.shadowBlur = 0; ctx.stroke();
          // 環繞旋轉小光點，標示「被封印中」
          for (let ki = 0; ki < 4; ki++) {
            const ka = elapsed * 4 + ki / 4 * Math.PI * 2;
            ctx.fillStyle = `rgba(200,160,255,${0.6+0.3*Math.sin(elapsed*8+ki)})`;
            ctx.beginPath(); ctx.arc(cap.x + Math.cos(ka)*13, py + Math.sin(ka)*13, 2, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        }
      }
    }
    if (obitoB && ['in_space','grabbing'].includes(obitoB.obitoKamuiPhase)) {
      ctx.save();
      ctx.font = `${RADIUS}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = obitoB.char.color; ctx.shadowBlur = 10;
      ctx.fillText(obitoB.char.emoji, obitoB.obitoSpaceX, obitoB.obitoSpaceY);
      ctx.restore();
    }
    if (obitoB && obitoB.obitoKamuiPhase === 'ghost') {
      const gP = 0.4 + 0.4*Math.abs(Math.sin(elapsed*10));
      ctx.save(); ctx.globalAlpha = gP;
      ctx.font = `${RADIUS}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 12;
      ctx.fillText('👻', obitoB.obitoGhostX, obitoB.obitoGhostY);
      ctx.restore();
      ctx.save(); ctx.strokeStyle = `rgba(180,80,255,${gP})`; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.arc(obitoB.obitoGhostX, obitoB.obitoGhostY, 18, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    ctx.restore();
  }

  // 帶土 returning 出現預警點
  if (obitoB && obitoB.obitoKamuiPhase === 'returning' && obitoB.obitoExitX != null) {
    const warnProg = 1 - Math.max(0, obitoB.obitoTeleportTimer) / 0.4;
    const warnA = 0.4 + 0.5 * Math.abs(Math.sin(elapsed * 12));
    ctx.save();
    ctx.beginPath();
    ctx.arc(obitoB.obitoExitX, obitoB.obitoExitY, RADIUS + 16, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200,60,255,${warnA})`;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 10;
    ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
    // 填色漸進
    ctx.beginPath();
    ctx.arc(obitoB.obitoExitX, obitoB.obitoExitY, RADIUS + 16, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150,0,255,${0.08 + 0.1 * warnProg})`;
    ctx.fill();
    // 旋轉光點
    for (let wi = 0; wi < 6; wi++) {
      const wa = elapsed * 8 + wi / 6 * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(obitoB.obitoExitX + Math.cos(wa) * (RADIUS + 16), obitoB.obitoExitY + Math.sin(wa) * (RADIUS + 16), 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,120,255,${warnA})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // 帶土主場地旋渦特效
  if (obitoB && ['ghost','teleporting','in_space','grabbing','returning','chaining'].includes(obitoB.obitoKamuiPhase)) {
    ctx.save();
    const spins = 8;
    for (let si = 0; si < spins; si++) {
      const sa = elapsed * 4 + (si / spins) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(obitoB.x + Math.cos(sa)*(RADIUS+12), obitoB.y + Math.sin(sa)*(RADIUS+12), 3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(180,60,255,${0.4+0.4*Math.sin(sa*2)})`;
      ctx.fill();
    }
    ctx.restore();
  }
  // 帶土被動：虛化態等待圓圈（閒置時顯示虛化冷卻進度）
  if (obitoB && obitoB.obitoKamuiPhase === 'idle' && !obitoB.obitoFireballDashing && !obitoB.obitoFireballDashDelay && !obitoB.obitoPhasing) {
    ctx.save();
    const stored = (obitoB.obitoAbsorbStored && obitoB.obitoAbsorbStored.length) || 0;
    const cdFrac = Math.max(0, Math.min(1, 1 - obitoB.obitoPhaseTimer / OBITO_PHASE_INTERVAL));
    const cdPulse = 0.3 + 0.15 * Math.sin(elapsed * 2);
    ctx.beginPath(); ctx.arc(obitoB.x, obitoB.y, RADIUS + 10, -Math.PI/2, -Math.PI/2 + Math.PI*2*cdFrac);
    ctx.strokeStyle = `rgba(180,60,255,${cdPulse + (stored > 0 ? 0.2 : 0)})`;
    ctx.lineWidth = 2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    if (stored > 0) {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = `rgba(200,120,255,0.9)`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#9900ff'; ctx.shadowBlur = 6;
      ctx.fillText(`📦${stored}`, obitoB.x, obitoB.y - RADIUS - 14);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  // 帶土鎖鏈範圍（改為旋風斬特效，更明顯）
  if (obitoB && obitoB.obitoKamuiPhase === 'chaining') {
    const pCh = 0.4 + 0.4 * Math.sin(elapsed * 14);
    ctx.save();
    if (!obitoB.obitoChainPhase) {
      ctx.beginPath(); ctx.arc(obitoB.x, obitoB.y, OBITO_KAMUI_CHAIN_RADIUS, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(180,60,255,${pCh})`; ctx.lineWidth = 2;
      ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 10; ctx.stroke();
      ctx.fillStyle = `rgba(140,40,200,${0.08})`; ctx.fill();

      // 旋風斬：多道高速旋轉的弧形刀光環繞帶土
      const spinSpeed = 22; // rad/s
      const bladeCount = 3;
      const r1 = RADIUS + 14, r2 = OBITO_KAMUI_CHAIN_RADIUS;
      for (let bi = 0; bi < bladeCount; bi++) {
        const baseAng = elapsed * spinSpeed + bi * (Math.PI * 2 / bladeCount);
        const arcSpan = 1.4; // 弧形刀光張角
        ctx.beginPath();
        ctx.arc(obitoB.x, obitoB.y, r2, baseAng, baseAng + arcSpan);
        ctx.lineWidth = 7;
        ctx.strokeStyle = `rgba(200,80,255,${0.55 + 0.3*Math.sin(elapsed*20+bi)})`;
        ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 18;
        ctx.stroke();
        // 內層較亮的刀刃
        ctx.beginPath();
        ctx.arc(obitoB.x, obitoB.y, r1 + (r2-r1)*0.5, baseAng, baseAng + arcSpan*0.7);
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(255,255,255,0.8)`;
        ctx.shadowBlur = 0;
        ctx.stroke();
      }
      // 風壓粒子環
      if (Math.random() < 0.6) {
        const pa = Math.random() * Math.PI * 2;
        const pr = r1 + Math.random() * (r2 - r1);
        state.hitFlashes.push({ x: obitoB.x + Math.cos(pa)*pr, y: obitoB.y + Math.sin(pa)*pr, r: 6, alpha: 0.6, color: '#cc44ff', t: 0.15 });
      }
    } else {
      ctx.beginPath(); ctx.arc(obitoB.x, obitoB.y, OBITO_KAMUI_BOMB_RADIUS, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,100,0,${pCh})`; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 16; ctx.stroke();
      ctx.fillStyle = `rgba(255,60,0,0.10)`; ctx.fill();
    }
    ctx.restore();
  }

  // 繪製球
  for (const b of state.balls) {
    // 詛咒橫切動畫中：隱藏被擊殺角色本體（由特效自己畫兩半）
    if (state.curseSliceKillFX && b.player === state.curseSliceKillFX.targetPlayer) continue;
    // 帶土在神威空間中：在主場地隱形
    if (b.char.type === 'obito' && ['in_space','grabbing'].includes(b.obitoKamuiPhase)) continue;
    // 被帶土抓進神威空間的敵人：在主場地隱形（只在空間視窗中顯示）
    if (b.obitoInSpace) continue;
    // 軌跡
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], prog = i/b.trail.length;
      ctx.beginPath(); ctx.arc(t.x,t.y,RADIUS*prog*0.6,0,Math.PI*2);
      ctx.fillStyle = b.char.color + Math.floor(prog*80).toString(16).padStart(2,'0');
      ctx.fill();
    }

    // 暗夜領主衝刺特效：額外光暈
    if (b.char.type === 'vampire' && b.vampireDashing) {
      const dashGlow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,RADIUS*4);
      dashGlow.addColorStop(0, b.char.color+'60');
      dashGlow.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS*4,0,Math.PI*2);
      ctx.fillStyle = dashGlow; ctx.fill();
    }

    // 被凍結：藍紫冰封光暈
    if (b.frozenByVampire) {
      const frozenGlow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,RADIUS*2);
      frozenGlow.addColorStop(0, 'rgba(80,0,160,0.5)');
      frozenGlow.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS*2,0,Math.PI*2);
      ctx.fillStyle = frozenGlow; ctx.fill();
      // 閃爍邊框
      ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS+6,0,Math.PI*2);
      ctx.strokeStyle = `rgba(180,80,255,${0.5+0.5*Math.sin(elapsed*15)})`;
      ctx.lineWidth = 2; ctx.stroke();
    }

    // 被緩速：藍白光暈
    if (b.curseSlowTimer > 0) {
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+7, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(200,220,255,${0.4 + 0.3*Math.sin(elapsed*10)})`;
      ctx.lineWidth = 2; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 被詛咒 dot：暗紅閃爍邊框
    if (b.curseDotTimer > 0) {
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(192,57,43,${0.5+0.5*Math.abs(Math.sin(elapsed*8))})`;
      ctx.lineWidth = 2.5; ctx.stroke();
    }

    // 虎天帝流血中：深紅滴血邊框
    if ((b.tigerBleedPool || 0) > 0) {
      const bleedRatio = Math.min(1, b.tigerBleedPool / TIGER_BLEED_MAX_POOL);
      const bPulse = 0.6 + 0.4 * Math.abs(Math.sin(elapsed * 6));
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(160,0,0,${bPulse * bleedRatio})`;
      ctx.lineWidth = 3; ctx.shadowColor = '#880000'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
    }

    // 虎天帝超新星：原地蓄力深紅脈動光暈
    if (b.char.type === 'tiger' && b.tigerNovaCharging) {
      const novaFrac = Math.min(1, (b.tigerNovaChargeTimer||0) / TIGER_NOVA_CHARGE_TIME);
      const novaPulse = 0.5 + 0.5 * Math.sin(elapsed * 25);
      const nGlow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,RADIUS*3.5);
      nGlow.addColorStop(0, `rgba(255,0,60,${0.5*novaPulse})`);
      nGlow.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS*3.5, 0, Math.PI*2);
      ctx.fillStyle = nGlow; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+10, -Math.PI/2, -Math.PI/2 + Math.PI*2*novaFrac);
      ctx.strokeStyle = '#ff0044';
      ctx.lineWidth = 5; ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 20;
      ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt'; ctx.shadowBlur = 0;
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = `rgba(255,40,80,${0.8+0.2*novaPulse})`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('☄️超新星', 0, -RADIUS-14); ctx.restore();
    }

    // 虎天帝蓄力：橘紅光暈
    if (b.char.type === 'tiger' && b.tigerCharging) {
      const chargeFrac = Math.min(1, (b.tigerChargeTimer||0) / TIGER_PUNCH_CHARGE_TIME);
      const chargePulse = 0.5 + 0.5 * Math.sin(elapsed * 20);
      const cGlow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,RADIUS*3);
      const gColor = b.tigerBlackFlash ? '#220066' : '#ff4400';
      cGlow.addColorStop(0, gColor + Math.floor(chargeFrac*100).toString(16).padStart(2,'0'));
      cGlow.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS*3, 0, Math.PI*2);
      ctx.fillStyle = cGlow; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+6, -Math.PI/2, -Math.PI/2 + Math.PI*2*chargeFrac);
      ctx.strokeStyle = b.tigerBlackFlash ? '#8800ff' : '#ff6600';
      ctx.lineWidth = 4; ctx.shadowColor = b.tigerBlackFlash ? '#660099' : '#ff4400'; ctx.shadowBlur = 16;
      ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt'; ctx.shadowBlur = 0;
      if (b.tigerBlackFlash) {
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = `rgba(180,0,255,${0.8+0.2*chargePulse})`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('黑閃', 0, -RADIUS-12); ctx.restore();
      }
    }

    // 被尖刺中毒：綠色虛線邊框
    if (b.trapDotTimer > 0) {
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(46,204,113,${0.5 + 0.5 * Math.abs(Math.sin(elapsed * 10))})`;
      ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 被魔術師定身：水藍色固定光環
    if (b.mageFreezeTimer > 0) {
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 9, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,207,255,${0.6 + 0.3 * Math.sin(elapsed * 14)})`;
      ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 14, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,207,255,0.2)`;
      ctx.lineWidth = 5; ctx.stroke();
    }

    // 被天照標記：暗紅黑色符紋光環（持續顯示直到引爆）
    if (b.itachiMarked) {
      const mPulse = 0.5 + 0.4 * Math.sin(elapsed * 6);
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 7, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(139,0,0,${0.6 + 0.3*mPulse})`;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 12;
      ctx.stroke();
      // 旋轉黑色符紋三角
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(elapsed * 1.5);
      ctx.beginPath();
      for (let ti = 0; ti < 3; ti++) {
        const a2 = ti * (Math.PI*2/3);
        const rr = RADIUS + 11;
        const px = Math.cos(a2)*rr, py = Math.sin(a2)*rr;
        if (ti === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(20,0,0,${0.7 + 0.3*mPulse})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    // 被月讀定身：暗紅漣漪光環 + 黑色瞳紋
    if (b.itachiPinnedTimer > 0) {
      const tp = 0.5 + 0.5 * Math.sin(elapsed * 10);
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(170,0,0,${0.6 + 0.3*tp})`;
      ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 16 + 4*tp, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(170,0,0,0.25)`;
      ctx.lineWidth = 2; ctx.stroke();
      // 中心瞳紋
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(20,0,0,${0.8})`;
      ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2);
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1; ctx.stroke();
    }

    // ── 須佐能乎：球外鎧甲特效 ──
    if (b.char.type === 'itachi' && b.itachiSusanooActive) {
      const susPulse = 0.7 + 0.3 * Math.sin(elapsed * 5);
      const floatOff = Math.sin(elapsed * 2.2) * 3;
      ctx.save();
      ctx.translate(b.x, b.y + floatOff);

      // 外暈
      const sg = ctx.createRadialGradient(0,0,RADIUS*0.6,0,0,RADIUS*3.2);
      sg.addColorStop(0, `rgba(139,0,0,${0.35*susPulse})`);
      sg.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(0,0,RADIUS*3.2,0,Math.PI*2);
      ctx.fillStyle = sg; ctx.fill();

      // 多邊形鎧甲外殼（六邊形，發光描邊）
      const shellR = RADIUS * 2.1;
      const sides = 6;
      ctx.beginPath();
      for (let si = 0; si <= sides; si++) {
        const a2 = (Math.PI*2/sides) * si - Math.PI/2 + elapsed*0.15;
        const px = Math.cos(a2)*shellR, py = Math.sin(a2)*shellR;
        if (si === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(80,0,0,${0.18*susPulse})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(220,30,30,${0.85*susPulse})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 22;
      ctx.stroke();

      // 肋骨狀放射線（外殼頂點連到內圈）
      for (let si = 0; si < sides; si++) {
        const a2 = (Math.PI*2/sides) * si - Math.PI/2 + elapsed*0.15;
        const ox = Math.cos(a2)*shellR, oy = Math.sin(a2)*shellR;
        const ix = Math.cos(a2)*(RADIUS+4), iy = Math.sin(a2)*(RADIUS+4);
        ctx.beginPath();
        ctx.moveTo(ix,iy); ctx.lineTo(ox,oy);
        ctx.strokeStyle = `rgba(255,60,60,${0.4*susPulse})`;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 6;
        ctx.stroke();
      }

      // 內層胸甲護盾（橢圓）
      ctx.beginPath();
      ctx.ellipse(0, 0, RADIUS*1.5, RADIUS*1.3, 0, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,100,100,${0.7*susPulse})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 14;
      ctx.stroke();

      // 雙臂輪廓（左右延伸的弧形塊）
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);
        ctx.beginPath();
        ctx.moveTo(RADIUS*1.2, -RADIUS*0.3);
        ctx.quadraticCurveTo(RADIUS*2.6, -RADIUS*0.6, RADIUS*2.9, RADIUS*0.2);
        ctx.quadraticCurveTo(RADIUS*2.5, RADIUS*0.6, RADIUS*1.3, RADIUS*0.5);
        ctx.closePath();
        ctx.fillStyle = `rgba(100,0,0,${0.25*susPulse})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,50,50,${0.6*susPulse})`;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
      ctx.shadowBlur = 0;

      // 剩餘時間倒數環
      const remainFrac = b.itachiSusanooTimer / ITACHI_SUSANOO_DURATION;
      ctx.beginPath();
      ctx.arc(b.x, b.y, RADIUS + 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*remainFrac);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // ── 工程師：機甲模式裝甲特效 ──
    if (b.char.type === 'engineer' && b.engMechActive) {
      const mechPulse = 0.7 + 0.3 * Math.sin(elapsed * 6);
      ctx.save();
      ctx.translate(b.x, b.y);

      // 外暈
      const mg = ctx.createRadialGradient(0,0,RADIUS*0.6,0,0,RADIUS*2.8);
      mg.addColorStop(0, `rgba(58,143,214,${0.3*mechPulse})`);
      mg.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(0,0,RADIUS*2.8,0,Math.PI*2);
      ctx.fillStyle = mg; ctx.fill();

      // 八邊形重裝甲外殼
      const shellR = RADIUS * 1.85;
      const sides = 8;
      ctx.beginPath();
      for (let si = 0; si <= sides; si++) {
        const a2 = (Math.PI*2/sides) * si - Math.PI/2;
        const px = Math.cos(a2)*shellR, py = Math.sin(a2)*shellR;
        if (si === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(20,40,60,${0.3*mechPulse})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(95,208,255,${0.85*mechPulse})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#5fd0ff'; ctx.shadowBlur = 18;
      ctx.stroke();

      // 裝甲接縫線
      for (let si = 0; si < sides; si++) {
        const a2 = (Math.PI*2/sides) * si - Math.PI/2;
        const ox = Math.cos(a2)*shellR, oy = Math.sin(a2)*shellR;
        const ix = Math.cos(a2)*(RADIUS+3), iy = Math.sin(a2)*(RADIUS+3);
        ctx.beginPath();
        ctx.moveTo(ix,iy); ctx.lineTo(ox,oy);
        ctx.strokeStyle = `rgba(174,224,255,${0.35*mechPulse})`;
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 4;
        ctx.stroke();
      }

      ctx.restore();
      ctx.shadowBlur = 0;

      // 剩餘時間倒數環
      const mechRemainFrac = b.engMechTimer / ENGINEER_MECH_DURATION;
      ctx.beginPath();
      ctx.arc(b.x, b.y, RADIUS + 22, -Math.PI/2, -Math.PI/2 + Math.PI*2*mechRemainFrac);
      ctx.strokeStyle = 'rgba(174,224,255,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 末代武士：招架光盾
    if (b.char.type === 'samurai' && b.samuraiParrying) {
      const parryProg = b.samuraiParryElapsed / SAMURAI_PARRY_DURATION;
      const pulse = 0.6 + 0.4 * Math.sin(elapsed * 18);
      const isShimetsuNext = b.samuraiNextIsShimetsu;
      const shieldColor = isShimetsuNext ? '#ff4400' : '#d4af37';
      // 外光暈
      const shieldGrad = ctx.createRadialGradient(b.x, b.y, RADIUS, b.x, b.y, RADIUS + 22);
      shieldGrad.addColorStop(0, `${shieldColor}88`);
      shieldGrad.addColorStop(1, `${shieldColor}00`);
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 22, 0, Math.PI * 2);
      ctx.fillStyle = shieldGrad; ctx.fill();
      // 招架環（消耗進度）
      ctx.beginPath();
      ctx.arc(b.x, b.y, RADIUS + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - parryProg));
      ctx.strokeStyle = `rgba(${isShimetsuNext?'255,68,0':'212,175,55'},${pulse})`;
      ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
      // 招架文字
      ctx.save(); ctx.translate(b.x, b.y - RADIUS - 16);
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = `rgba(${isShimetsuNext?'255,100,50':'255,220,80'},${0.8 + 0.2 * Math.sin(elapsed * 20)})`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(isShimetsuNext ? '🔥 識滅斬！' : '🛡️ 招架中', 0, 0);
      ctx.restore();
    }

    // 鍛造師：鍛造層數光環 & 揮劍弧線
    if (b.char.type === 'blacksmith') {
      const stackRatio = (b.smithForgeStacks || 0) / SMITH_FORGE_MAX_STACKS;
      const forgeColor = stackRatio > 0.7 ? '#ff3300' : stackRatio > 0.4 ? '#ff7700' : '#ffcc00';

      // 持續熔爐光暈（即使層數為0也有微弱光）
      if (stackRatio > 0) {
        const pulse = 0.55 + 0.35 * Math.abs(Math.sin(elapsed * (3 + stackRatio * 8)));
        const heatGlow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, RADIUS * (2 + stackRatio * 2.5));
        heatGlow.addColorStop(0, forgeColor + Math.floor(pulse * stackRatio * 160).toString(16).padStart(2,'0'));
        heatGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS * (2 + stackRatio * 2.5), 0, Math.PI * 2);
        ctx.fillStyle = heatGlow;
        ctx.fill();
      }

      if (stackRatio > 0) {
        // 背景灰色底環（顯示還有多少空間）
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 10, -Math.PI / 2, Math.PI * 3 / 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.restore();

        // 鍛造層數弧形進度環（加粗＋脈動）
        const pulse2 = 0.7 + 0.3 * Math.abs(Math.sin(elapsed * (4 + stackRatio * 6)));
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * stackRatio);
        ctx.strokeStyle = forgeColor;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.shadowColor = forgeColor;
        ctx.shadowBlur = 18 * pulse2;
        ctx.globalAlpha = 0.9;
        ctx.stroke();
        ctx.restore();

        // 層數文字（層數≥1就顯示）
        ctx.save();
        const fontSize = 11 + Math.min(b.smithForgeStacks, 9);
        ctx.font = `bold ${fontSize}px 'Oswald', sans-serif`;
        ctx.fillStyle = forgeColor;
        ctx.shadowColor = forgeColor;
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.95;
        ctx.fillText(`🔥×${b.smithForgeStacks}`, b.x, b.y - RADIUS - 18);
        ctx.restore();
      }

      // 鍛造倒數進度條（在球下方）
      const nearEnemy3 = (() => { const e = state.balls.find(x => x.player !== b.player); return e && Math.hypot(e.x - b.x, e.y - b.y) < SMITH_SWORD_RANGE; })();
      if (!nearEnemy3) {
        const barW = RADIUS * 2;
        const barH = 4;
        const bx = b.x - barW / 2;
        const by = b.y + RADIUS + 8;
        const forgeProgress = 1 - (b.smithForgeTimer || 0) / (b.smithForgeInterval || SMITH_FORGE_INTERVAL_BASE);
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath(); ctx.roundRect(bx, by, barW, barH, 2); ctx.fill();
        ctx.fillStyle = forgeColor;
        ctx.shadowColor = forgeColor;
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.roundRect(bx, by, barW * forgeProgress, barH, 2); ctx.fill();
        ctx.restore();
      }

      // 揮劍弧線（加強版）
      if (b.smithSwordSwinging) {
        const swingProg = 1 - (b.smithSwordSwingTimer || 0) / 0.25;
        const enemy2 = state.balls.find(x => x.player !== b.player);
        const sDir = enemy2 ? Math.atan2(enemy2.y - b.y, enemy2.x - b.x) : 0;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(sDir);
        ctx.globalAlpha = Math.max(0, 1 - swingProg) * 0.9;
        // 外層橙光
        ctx.strokeStyle = forgeColor;
        ctx.lineWidth = 8;
        ctx.shadowColor = forgeColor;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(0, 0, RADIUS + 20, -Math.PI / 2.5, Math.PI / 2.5);
        ctx.stroke();
        // 白色芯線
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(0, 0, RADIUS + 20, -Math.PI / 2.5, Math.PI / 2.5);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 禪院直哉：衝刺殘像＆凶星軌跡光暈
    if (b.char.type === 'naobito') {
      const shadows = state.naoShadows ? state.naoShadows.filter(s => s.owner === b.player).length : 0;
      if (b.naoDashing || b.naoKyouseiFiring) {
        // 衝刺方向殘像
        const speed = Math.hypot(b.vx, b.vy);
        if (speed > 100) {
          const ang = Math.atan2(b.vy, b.vx) + Math.PI;
          for (let ti = 1; ti <= 3; ti++) {
            const ta = 0.25 + ti * 0.2;
            ctx.save();
            ctx.globalAlpha = ta * 0.35;
            ctx.beginPath();
            ctx.arc(b.x + Math.cos(ang) * ti * 14, b.y + Math.sin(ang) * ti * 14, RADIUS * (1 - ti * 0.15), 0, Math.PI * 2);
            ctx.fillStyle = b.char.color + '33';
            ctx.strokeStyle = b.char.color;
            ctx.lineWidth = 1.2;
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }
      }
      // 凶星軌跡就緒：白色光暈脈動
      if (shadows >= NAOBITO_KYOUSEI_THRESHOLD && !b.naoKyouseiFiring) {
        const pulse = 0.5 + 0.5 * Math.abs(Math.sin(elapsed * 8));
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#aaaaff';
        ctx.shadowBlur = 20 * pulse;
        ctx.globalAlpha = 0.7 * pulse;
        ctx.stroke();
        ctx.restore();
      }
      // 殘影數量小指示點
      if (shadows > 0) {
        for (let si = 0; si < shadows; si++) {
          const ang2 = (si / NAOBITO_SHADOW_MAX) * Math.PI * 2 - Math.PI / 2;
          const dotX = b.x + Math.cos(ang2) * (RADIUS + 12);
          const dotY = b.y + Math.sin(ang2) * (RADIUS + 12);
          ctx.save();
          ctx.beginPath();
          ctx.arc(dotX, dotY, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = si < NAOBITO_KYOUSEI_THRESHOLD ? '#8888ff' : '#ffffff';
          ctx.shadowColor = '#aaaaff';
          ctx.shadowBlur = 8;
          ctx.globalAlpha = 0.9;
          ctx.fill();
          ctx.restore();
        }
      }
    }
    if (b.char.type === 'samurai' && b.samuraiIaidoing) {
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.shadowColor = '#d4af37'; ctx.shadowBlur = 20;
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      const iLen = 50;
      const iAng = b.samuraiIaidoAngle + Math.PI;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(iAng) * iLen, b.y + Math.sin(iAng) * iLen);
      ctx.stroke();
      ctx.restore();
    }

    // 帶土虛化態：降低透明度 + 紫色輪廓
    const isPhasing = b.char.type === 'obito' && b.obitoPhasing;
    if (isPhasing) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.1 * Math.sin(elapsed * 10);
    }

    // 一般光暈
    const glow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,RADIUS*2.5);
    glow.addColorStop(0, b.char.color+'40'); glow.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS*2.5,0,Math.PI*2);
    ctx.fillStyle = glow; ctx.fill();

    // 球體本體
    ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS,0,Math.PI*2);
    ctx.fillStyle = '#0d1117'; ctx.fill();
    ctx.strokeStyle = b.char.color; ctx.lineWidth = 2.5; ctx.stroke();

    // 冰雪場地凍結效果
    if (b.arenaFrozen > 0) {
      const fPulse = 0.6 + 0.4 * Math.abs(Math.sin(elapsed * 6));
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 7, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(140,220,255,${fPulse})`;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 冰晶符號
      ctx.font = `12px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = fPulse * 0.85;
      ctx.fillText('❄️', b.x, b.y - RADIUS - 12);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // HP 圓弧
    const hpFrac = b.hp/MAX_HP;
    ctx.beginPath(); ctx.arc(b.x,b.y,RADIUS+4,-Math.PI/2,-Math.PI/2+Math.PI*2*hpFrac);
    ctx.strokeStyle = b.char.color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

    // emoji
    ctx.font = `${RADIUS*1.1}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.char.emoji,b.x,b.y);

    // 廚師刀計數
    if (b.char.type === 'chef') {
      ctx.font = '11px serif'; ctx.textAlign = 'left';
      for (let k = 0; k < b.knives; k++) ctx.fillText('🔪',b.x+RADIUS+4,b.y-6+k*13);
    }

    // 史蒂夫裝備階段圖示
    if (b.char.type === 'steve') {
      const steveIcons = ['✊','🗡️','⚔️','🗡️','🪓'];
      ctx.font = '13px serif'; ctx.textAlign = 'center';
      ctx.fillText(steveIcons[b.stevePhase] || '✊', b.x, b.y - RADIUS - 12);
      if (b.stevePhase >= 2) {
        ctx.font = '12px serif';
        ctx.fillText(b.stevePhase >= 4 ? '🎆' : '🏹', b.x + RADIUS + 10, b.y - RADIUS - 12);
      }
      // 斧蓄力中：斧頭沿肩膀後拉並隨蓄力進度發亮，提示即將劈砍
      if (b.steveAxeCharging) {
        const chargeMax = STEVE_AXE_CHARGE[b.stevePhase] || 0.1;
        const chargeProg = 1 - Math.max(0, b.steveAxeChargeTimer) / chargeMax; // 0→1
        const enemy2 = state.balls.find(x => x.player !== b.player);
        const aimAngle = enemy2 ? Math.atan2(enemy2.y - b.y, enemy2.x - b.x) : 0;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(aimAngle);
        const pullBack = RADIUS * (0.9 - chargeProg * 0.5); // 越蓄力越貼近身體，準備揮出
        ctx.globalAlpha = 0.6 + chargeProg * 0.4;
        ctx.font = `${14 + chargeProg * 6}px serif`;
        ctx.fillText(b.stevePhase >= 4 ? '🪓' : (b.stevePhase >= 2 ? '🪓' : '🪓'), -pullBack, -RADIUS * 0.7);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    // 攻擊/技能進度條
    const progHandler = PROGRESS_HANDLERS[b.char.type] || PROGRESS_HANDLERS.__default;
    const progResult = progHandler(b);
    const atFrac = progResult.atFrac, barColor = progResult.barColor;
    const barW = RADIUS*2, barH = 4, barX = b.x-RADIUS, barY = b.y+RADIUS+7;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY,barW,barH);
    ctx.fillStyle = barColor;
    ctx.fillRect(barX,barY,barW*atFrac,barH);

    // 暗夜領主：衝刺/咬擊狀態文字
    if (b.char.type === 'vampire') {
      if (b.vampireBiting) {
        // 咬擊動畫文字
        ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
        ctx.font = `bold 11px sans-serif`;
        ctx.fillStyle = `rgba(255,50,150,${0.7+0.3*Math.sin(elapsed*30)})`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`🦷 ${b.vampireBiteStep}/${VAMPIRE_BITE_COUNT}`, 0, 0);
        ctx.restore();
      } else if (b.vampireDashing) {
        ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = `rgba(200,100,255,${0.7+0.3*Math.abs(Math.sin(elapsed*20))})`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🦇 衝！', 0, 0);
        ctx.restore();
      } else {
        const dashLeft = Math.max(0, Math.ceil(b.vampireDashTimer));
        ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
        ctx.font = '9px sans-serif';
        ctx.fillStyle = dashLeft <= 3 ? `rgba(200,100,255,0.9)` : 'rgba(200,150,255,0.5)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`🦇${dashLeft}s`, 0, 0);
        ctx.restore();
      }
    }
    // 大喬：波紋呼吸法狀態視覺 + 波紋層數提示
    if (b.char.type === 'joseph') {
      if (b.josephState === 'charging') {
        const chargeFrac = Math.min(1, (b.josephChargeTimer||0) / JOSEPH_CHARGE_TIME);
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 8 + chargeFrac * 6, 0, Math.PI * 2 * chargeFrac);
        ctx.strokeStyle = 'rgba(102,204,255,0.9)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
      } else if (b.josephState === 'breathing') {
        const pulse = 0.5 + 0.4 * Math.abs(Math.sin(elapsed * 4));
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(47,125,192,${pulse})`; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
        if (b.josephUltimateReady && !b.josephUltimateActive) {
          ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = b.josephUltimateCooldown > 0 ? 'rgba(180,180,180,0.7)' : `rgba(255,224,102,${0.7+0.3*Math.sin(elapsed*10)})`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(b.josephUltimateCooldown > 0 ? '☀️' : '☀️就緒！', 0, 0);
          ctx.restore();
        }
      } else if (b.josephState === 'waiting') {
        ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
        ctx.font = '10px sans-serif';
        ctx.fillStyle = 'rgba(150,190,220,0.7)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('💧', 0, 0);
        ctx.restore();
      }
      if (b.josephUltimateActive) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, RADIUS + 14, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,224,102,${0.6+0.4*Math.abs(Math.sin(elapsed*15))})`; ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
      }
    }
    // 波紋層數（任何角色被施加波紋都會顯示）
    if ((b.rippleStacks || 0) > 0) {
      ctx.save(); ctx.translate(b.x + RADIUS + 4, b.y + RADIUS + 4);
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = b.rippleStacks >= RIPPLE_BURST_THRESHOLD ? 'rgba(255,120,80,0.9)' : 'rgba(102,204,255,0.85)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`🌀${Math.floor(b.rippleStacks)}`, 0, 0);
      ctx.restore();
    }
    // 帶土虛化態結束：還原 alpha + 畫虛化外圈提示
    if (isPhasing) {
      ctx.restore();
      // 虛化外圈（讓對手看出帶土現在在虛化）
      const phPulse = 0.5 + 0.5 * Math.abs(Math.sin(elapsed * 8));
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(180,60,255,${0.6 + 0.3 * phPulse})`;
      ctx.lineWidth = 2.5; ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.restore();
      // 虛化計時條（顯示剩餘虛化時間）
      const phFrac = Math.max(0, b.obitoPhaseTimer / OBITO_PHASE_DURATION);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(b.x - RADIUS, b.y + RADIUS + 12, RADIUS * 2, 3);
      ctx.fillStyle = '#cc44ff';
      ctx.fillRect(b.x - RADIUS, b.y + RADIUS + 12, RADIUS * 2 * phFrac, 3);
      ctx.restore();
    }
  }

  // 酒鬼轉向圖示
  for (const b of state.balls) {
    if (b.char.type !== 'drunk') continue;
    ctx.save(); ctx.translate(b.x,b.y-RADIUS-12);
    ctx.font = '10px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.textAlign='center';
    ctx.fillText(Math.sin(elapsed*3)>0?'↻':'↺',0,0); ctx.restore();
  }

  // 末代武士：識滅斬計數顯示
  for (const b of state.balls) {
    if (b.char.type !== 'samurai') continue;
    if (b.samuraiParrying || b.samuraiIaidoing || b.samuraiShimetsuing) continue;
    const count = b.samuraiIaidoCount || 0;
    if (count > 0 || b.samuraiNextIsShimetsu) {
      ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
      ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = b.samuraiNextIsShimetsu ? 'rgba(255,100,50,0.9)' : 'rgba(212,175,55,0.7)';
      ctx.fillText(b.samuraiNextIsShimetsu ? '🔥 識滅斬蓄勢' : `⚔️${count}/${SAMURAI_IAIDO_MAX}`, 0, 0);
      ctx.restore();
    }
  }

  // 一拳超人倒數環
  for (const b of state.balls) {
    if (b.char.type !== 'opm') continue;
    const prog = Math.min(1 - b.opmCountdown / OPM_COUNTDOWN_START, 1); // 0=空 1=滿
    const rage = prog; // 方便語意

    if (b.opmPunched) {
      // 已出拳：爆炸符號
      ctx.save(); ctx.translate(b.x, b.y - RADIUS - 14);
      ctx.font = '14px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💥', 0, 0); ctx.restore();
    } else {
      // ── 怒氣光環（glow 外圈）──
      const glowSize  = RADIUS + 4 + rage * 14;
      const glowAlpha = 0.08 + rage * 0.35;
      const r1 = Math.round(255);
      const g1 = Math.round(220 - rage * 180); // 白→橙→紅
      const b1 = Math.round(180 - rage * 180);
      const gradient = ctx.createRadialGradient(b.x, b.y, RADIUS - 2, b.x, b.y, glowSize + 10);
      gradient.addColorStop(0,   `rgba(${r1},${g1},${b1},${glowAlpha * 1.8})`);
      gradient.addColorStop(1,   `rgba(${r1},${g1},${b1},0)`);
      ctx.beginPath();
      ctx.arc(b.x, b.y, glowSize + 10, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      // ── 怒氣進度環 ──
      const ringR   = RADIUS + 9;
      const arcEnd  = -Math.PI / 2 + Math.PI * 2 * prog;
      const pulse   = rage > 0.8 ? 0.5 + 0.5 * Math.abs(Math.sin(elapsed * 10)) : 1;
      const ringR2  = Math.round(255);
      const ringG2  = Math.round(200 - rage * 200);
      const ringB2  = Math.round(100 - rage * 100);
      // 底環（暗）
      ctx.beginPath();
      ctx.arc(b.x, b.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(80,40,40,0.3)';
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
      // 進度環（亮）
      ctx.beginPath();
      ctx.arc(b.x, b.y, ringR, -Math.PI / 2, arcEnd);
      ctx.strokeStyle = `rgba(${ringR2},${ringG2},${ringB2},${0.7 * pulse})`;
      ctx.lineWidth = rage > 0.8 ? 4 : 3;
      ctx.lineCap = 'round'; ctx.stroke();

      // ── 怒氣粒子（rage > 0.3 才出現）──
      if (rage > OPM_RAGE_PARTICLE_THRESHOLD) {
        const particleCount = Math.floor(rage * 5);
        for (let p = 0; p < particleCount; p++) {
          const angle = elapsed * 2.5 + (Math.PI * 2 / particleCount) * p + Math.sin(elapsed * 4 + p) * 0.5;
          const dist  = ringR + 2 + Math.sin(elapsed * 6 + p * 1.3) * 4;
          const px = b.x + Math.cos(angle) * dist;
          const py = b.y + Math.sin(angle) * dist;
          const pr = 1.5 + rage * 2;
          const pa = 0.4 + rage * 0.5;
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,${Math.round(120 - rage*100)},0,${pa})`;
          ctx.fill();
        }
      }

      // ── 倒數文字 ──
      const timeLeft = Math.max(0, Math.ceil(b.opmCountdown));
      ctx.save(); ctx.translate(b.x, b.y - RADIUS - 16);
      const textScale = 1 + rage * 0.4 + (rage > 0.8 ? 0.1 * Math.abs(Math.sin(elapsed * 10)) : 0);
      ctx.scale(textScale, textScale);
      ctx.font = `bold ${rage > 0.7 ? 11 : 9}px sans-serif`;
      ctx.fillStyle = `rgba(${ringR2},${ringG2},${ringB2},${0.6 + rage * 0.4})`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`👊${timeLeft}s`, 0, 0);
      ctx.restore();
    }
  }

  // ── 詛咒之王擊殺通用橫切動畫 ──
  if (state.curseSliceKillFX) {
    const fx = state.curseSliceKillFX;
    const prog = 1 - fx.life / fx.maxLife;
    const cx = fx.targetX, cy = fx.targetY;

    // 1. 全畫面閃白
    if (fx.flashAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = fx.flashAlpha * 0.65;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 2. 血粒子
    for (const p of fx.particles) {
      if (p.life <= 0) continue;
      const pa = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = pa * 0.85;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = '#c0392b';
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();
    }

    // 3. 橫向斬線（長白線）
    if (fx.slashAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = fx.slashAlpha;
      // 外層粗線
      ctx.beginPath();
      ctx.moveTo(cx - W * 0.55, cy);
      ctx.lineTo(cx + W * 0.55, cy);
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 22;
      ctx.stroke();
      // 白色芯線
      ctx.globalAlpha = fx.slashAlpha * 0.85;
      ctx.beginPath();
      ctx.moveTo(cx - W * 0.5, cy);
      ctx.lineTo(cx + W * 0.5, cy);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.restore();

      // 斬線起始閃光
      ctx.save();
      ctx.globalAlpha = fx.slashAlpha * 0.7;
      const slashGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 55);
      slashGrad.addColorStop(0,   'rgba(255,255,255,0.9)');
      slashGrad.addColorStop(0.3, 'rgba(192,57,43,0.6)');
      slashGrad.addColorStop(1,   'rgba(192,57,43,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, 55, 0, Math.PI * 2);
      ctx.fillStyle = slashGrad;
      ctx.fill();
      ctx.restore();
    }

    // 4. 畫上半圓（往左上飄）
    {
      const ox = fx.topOffX, oy = fx.topOffY, rot = fx.topRot;
      const fade = Math.max(0, fx.life / fx.maxLife);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(cx + ox, cy + oy);
      ctx.rotate(rot);
      // 上半球
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS, Math.PI, 0);   // 上半弧
      ctx.closePath();
      ctx.fillStyle = fx.color;
      ctx.shadowColor = fx.color;
      ctx.shadowBlur = 12;
      ctx.fill();
      // 切面（紅色）
      ctx.beginPath();
      ctx.moveTo(-RADIUS, 0);
      ctx.lineTo(RADIUS, 0);
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.restore();
    }

    // 5. 畫下半圓（往右下掉）
    {
      const ox = fx.botOffX, oy = fx.botOffY, rot = fx.botRot;
      const fade = Math.max(0, fx.life / fx.maxLife);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(cx + ox, cy + oy);
      ctx.rotate(rot);
      // 下半球
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS, 0, Math.PI);   // 下半弧
      ctx.closePath();
      ctx.fillStyle = fx.color;
      ctx.shadowColor = fx.color;
      ctx.shadowBlur = 12;
      ctx.fill();
      // 切面（紅色）
      ctx.beginPath();
      ctx.moveTo(-RADIUS, 0);
      ctx.lineTo(RADIUS, 0);
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.restore();
    }

    // 6. ☠️ 文字
    if (prog > 0.15) {
      const textAlpha = Math.min((prog - 0.15) * 3, 1) * Math.max(0, fx.life / fx.maxLife);
      ctx.save();
      ctx.globalAlpha = textAlpha;
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#c0392b';
      ctx.shadowBlur = 12;
      ctx.fillText('☠️ 世界斬！', cx, cy - RADIUS - 30);
      ctx.restore();
    }
  }

  // ── 無量空處領域展開 ──
  if (state.gojoKillFX) {
    const fx = state.gojoKillFX;
    const prog = 1 - fx.life / fx.maxLife; // 0→1
    const cx = W / 2, cy = H / 2;

    // 1. 虛無底色（藍黑漸層，逐漸覆蓋畫面）
    const bgAlpha = Math.min(prog * 3, 0.92);
    const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H));
    bgGrad.addColorStop(0,   `rgba(0,40,80,${bgAlpha})`);
    bgGrad.addColorStop(0.5, `rgba(0,10,40,${bgAlpha * 0.95})`);
    bgGrad.addColorStop(1,   `rgba(0,0,10,${bgAlpha})`);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. 速度線（從中心向外爆射）
    ctx.save();
    ctx.translate(cx, cy);
    for (const l of fx.lines) {
      const fadeIn  = Math.min(prog * 5, 1);
      const fadeOut = fx.life < 0.6 ? fx.life / 0.6 : 1;
      const a = l.alpha * fadeIn * fadeOut;
      ctx.save();
      ctx.rotate(l.angle);
      ctx.beginPath();
      ctx.moveTo(l.dist, 0);
      ctx.lineTo(l.dist + l.len, 0);
      ctx.strokeStyle = `rgba(100,200,255,${a})`;
      ctx.lineWidth = l.width;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 3. 藍色光暈圓圈（中心擴散）
    const ringR = 40 + prog * 220;
    const ringA = Math.max(0, 0.6 - prog * 0.5);
    const rg = ctx.createRadialGradient(cx, cy, ringR * 0.5, cx, cy, ringR);
    rg.addColorStop(0, `rgba(100,210,255,${ringA})`);
    rg.addColorStop(1, `rgba(0,80,160,0)`);
    ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.fillStyle = rg; ctx.fill();
  }

  // ── 砲爹 vs 乙骨 決鬥終結 ──
  if (state.cannonDuelFX) {
    const fx = state.cannonDuelFX;
    if (fx.phase === 'charge') {
      const prog = 1 - fx.timer / CANNON_DUEL_CHARGE_TIME;
      for (const who of [fx.a, fx.c]) {
        const pulse = 0.5 + 0.5 * Math.sin(elapsed * 14);
        ctx.save();
        ctx.shadowColor = who === fx.a ? '#ff8a3d' : '#ff9fc6';
        ctx.shadowBlur = 25 + prog * 30;
        ctx.strokeStyle = who === fx.a ? `rgba(255,138,61,${0.5+0.4*pulse})` : `rgba(255,159,198,${0.5+0.4*pulse})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(who.x, who.y, 28 + prog * 18 + pulse*6, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
      }
    } else if (fx.phase === 'beam') {
      const prog = 1 - fx.timer / CANNON_DUEL_BEAM_TIME;
      const len = Math.hypot(fx.c.x - fx.a.x, fx.c.y - fx.a.y) * Math.min(1, prog * 1.6);
      for (const [origin, ang, col] of [[fx.a, fx.angleA, '255,138,61'], [fx.c, fx.angleC, '255,159,198']]) {
        ctx.save();
        ctx.translate(origin.x, origin.y);
        ctx.rotate(ang);
        const grad = ctx.createLinearGradient(0,0,len,0);
        grad.addColorStop(0, `rgba(${col},0.95)`);
        grad.addColorStop(1, `rgba(${col},0.15)`);
        ctx.fillStyle = grad;
        ctx.shadowColor = `rgb(${col})`;
        ctx.shadowBlur = 35;
        ctx.fillRect(0, -32, len, 64);
        ctx.fillStyle = `rgba(255,255,255,0.7)`;
        ctx.fillRect(0, -10, len, 20);
        ctx.restore();
      }
    } else if (fx.phase === 'explode') {
      const r = fx.explodeR || 10;
      const grad = ctx.createRadialGradient(fx.midX, fx.midY, 0, fx.midX, fx.midY, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.4, 'rgba(255,200,140,0.8)');
      grad.addColorStop(1, 'rgba(255,138,61,0)');
      ctx.save();
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 40;
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(fx.midX, fx.midY, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // 虎天帝：血球繪製
  if (state.tigerBloodOrbs) {
    for (const orb of state.tigerBloodOrbs) {
      orb.pulse = (orb.pulse || 0) + 0.08;
      const puls = 0.7 + 0.3 * Math.sin(orb.pulse * 4);
      const lifeFrac = Math.min(1, orb.life / TIGER_BLOOD_ORB_LIFETIME);
      ctx.save();
      ctx.globalAlpha = puls * lifeFrac;
      const og = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r * 1.8);
      og.addColorStop(0, 'rgba(255,80,80,0.9)');
      og.addColorStop(0.5, 'rgba(180,0,30,0.7)');
      og.addColorStop(1, 'rgba(80,0,0,0)');
      ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r * 1.8, 0, Math.PI*2);
      ctx.fillStyle = og; ctx.fill();
      ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI*2);
      ctx.fillStyle = '#cc1122'; ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 10; ctx.fill();
      ctx.restore();
    }
  }

  // 虎天帝：超新星針彈繪製
  if (state.tigerNovaNeedles) {
    for (const needle of state.tigerNovaNeedles) {
      ctx.save();
      ctx.translate(needle.x, needle.y);
      ctx.rotate(needle.angle);
      ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#ee1133';
      ctx.fillRect(-10, -2, 20, 4);
      ctx.fillStyle = 'rgba(255,180,200,0.8)';
      ctx.fillRect(-6, -1, 12, 2);
      ctx.restore();
    }
  }

  // 虎天帝：出拳特效 & 蓄力特效
  if (state.tigerPunchFX) {
    for (const fx of state.tigerPunchFX) {
      const prog = 1 - fx.life / fx.maxLife;
      ctx.save();
      ctx.globalAlpha = 1 - prog;
      if (fx.type === 'hit') {
        // 拳影軌跡：從虎天帝本體位置(sx,sy)打向命中點(x,y)
        if (fx.sx !== undefined) {
          const strikeProg = Math.min(1, prog * 4); // 拳影本身收得比衝擊環快
          ctx.save();
          ctx.globalAlpha = (1 - strikeProg) * 0.9;
          const dx = fx.x - fx.sx, dy = fx.y - fx.sy;
          const ang = Math.atan2(dy, dx);
          const len = Math.hypot(dx, dy);
          ctx.translate(fx.sx, fx.sy);
          ctx.rotate(ang);
          const grad = ctx.createLinearGradient(0, 0, len, 0);
          const tipCol = fx.isBlack ? '#cc88ff' : '#ffcc88';
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(0.6, fx.isBlack ? 'rgba(136,0,255,0.5)' : 'rgba(255,90,0,0.5)');
          grad.addColorStop(1, tipCol);
          ctx.fillStyle = grad;
          ctx.shadowColor = fx.isBlack ? '#8800ff' : '#ff6600'; ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.moveTo(0, -3);
          ctx.lineTo(len * 0.85, -9);
          ctx.lineTo(len, 0);
          ctx.lineTo(len * 0.85, 9);
          ctx.lineTo(0, 3);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        const r = 20 + prog * 30;
        const col = fx.isBlack ? '#330055' : '#ff4400';
        ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2);
        ctx.strokeStyle = col; ctx.lineWidth = 4 - prog * 3;
        ctx.shadowColor = fx.isBlack ? '#8800ff' : '#ff6600'; ctx.shadowBlur = 18;
        ctx.stroke();
      } else if (fx.type === 'miss') {
        if (fx.sx !== undefined) {
          ctx.save();
          ctx.globalAlpha = (1 - prog) * 0.7;
          const dx = fx.x - fx.sx, dy = fx.y - fx.sy;
          const ang = Math.atan2(dy, dx);
          const len = Math.hypot(dx, dy);
          ctx.translate(fx.sx, fx.sy);
          ctx.rotate(ang);
          ctx.strokeStyle = '#aa5500'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
          ctx.restore();
        }
        const r = 12 + prog * 18;
        ctx.translate(fx.x, fx.y);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.strokeStyle = '#884400'; ctx.lineWidth = 2; ctx.stroke();
      } else if (fx.type === 'charge') {
        // 蓄力環（已在球上方顯示，此處略）
      }
      ctx.restore();
    }
  }

  // 虎天帝：黑閃閃電特效
  if (state.tigerBlackFlashFX) {
    for (const fx of state.tigerBlackFlashFX) {
      const prog = 1 - fx.life / fx.maxLife;
      ctx.save();
      ctx.globalAlpha = (1 - prog) * 0.9;
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      const bfLen = fx.len * (1 - prog * 0.4);
      ctx.shadowColor = '#9900ff'; ctx.shadowBlur = 18;
      ctx.strokeStyle = '#4400aa';
      ctx.lineWidth = 3 - prog * 2;
      ctx.beginPath();
      // 鋸齒閃電
      ctx.moveTo(0, 0);
      const segs = 5;
      for (let si = 1; si <= segs; si++) {
        const lx = (bfLen / segs) * si;
        const ly = (si % 2 === 0 ? 1 : -1) * (5 - prog * 4);
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
      ctx.strokeStyle = '#cc66ff';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  // 虎天帝：咒力粒子 & 流血粒子特效
  if (state.tigerCurseFX) {
    for (const p of state.tigerCurseFX) {
      const lifeFrac = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = lifeFrac * 0.9;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * lifeFrac, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = p.isBleed ? 6 : 10;
      ctx.fill();
      ctx.restore();
    }
  }

  // 星星女孩：星隕預警繪製
  if (state.starMeteorWarnings) {
    for (const w of state.starMeteorWarnings) {
      const frac = w.life / STAR_METEOR_WARNING_TIME;
      ctx.save();
      ctx.globalAlpha = frac * 0.7;
      ctx.strokeStyle = w.color || '#ffe066';
      ctx.lineWidth = 2;
      ctx.shadowColor = w.color || '#ffe066';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(w.x, w.y, STAR_METEOR_RADIUS + 8, 0, Math.PI * 2);
      ctx.stroke();
      // 十字準心
      ctx.beginPath();
      ctx.moveTo(w.x - 12, w.y); ctx.lineTo(w.x + 12, w.y);
      ctx.moveTo(w.x, w.y - 12); ctx.lineTo(w.x, w.y + 12);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 星星女孩：流星繪製
  if (state.starMeteors) {
    for (const m of state.starMeteors) {
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.shadowColor = m.color || '#ffe066';
      ctx.shadowBlur = 16;
      // 拖尾
      const grad = ctx.createLinearGradient(m.x, m.y - 30, m.x, m.y);
      grad.addColorStop(0, 'rgba(255,240,100,0)');
      grad.addColorStop(1, m.color || '#ffe066');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y - 30);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
      // 主體
      ctx.beginPath();
      ctx.arc(m.x, m.y, STAR_METEOR_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.restore();
    }
  }

  // 星星女孩：大星星繪製
  if (state.starBigStars) {
    for (const s of state.starBigStars) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.shadowColor = s.color || '#ffe066';
      ctx.shadowBlur = 18;
      // 畫星形
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 === 0 ? STAR_BIG_RADIUS : STAR_BIG_RADIUS * 0.45;
        const a = (k / 10) * Math.PI * 2 - Math.PI / 2;
        if (k === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fillStyle = s.color || '#ffe066';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  // 星星女孩：小星星繪製
  if (state.starSmallStars) {
    for (const s of state.starSmallStars) {
      const lifeFrac = Math.min(1, s.life / 1.5);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.globalAlpha = lifeFrac;
      ctx.shadowColor = s.color || '#ffe066';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 === 0 ? STAR_SMALL_RADIUS : STAR_SMALL_RADIUS * 0.4;
        const a = (k / 10) * Math.PI * 2 - Math.PI / 2;
        if (k === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fillStyle = '#fffde0';
      ctx.fill();
      ctx.strokeStyle = s.color || '#ffe066';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  // DIO 世界：時停灰色濾鏡覆蓋全畫面
  if (state.dioWorldGlobalActive) {
    ctx.save();
    ctx.fillStyle = 'rgba(120,120,120,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function updateHUD() {
  if (!state.balls) return;
  const [b0,b1] = state.balls;
  const hp0 = Math.max(0,b0.hp), hp1 = Math.max(0,b1.hp);
  const bleed0 = Math.min(b0.tigerBleedPool||0, MAX_HP - hp0);
  const bleed1 = Math.min(b1.tigerBleedPool||0, MAX_HP - hp1);
  // 主血條
  document.getElementById('p1-bar').style.width = (hp0/MAX_HP*100)+'%';
  document.getElementById('p2-bar').style.width = (hp1/MAX_HP*100)+'%';
  // 流血池（在主血條後方用不同顏色顯示，用 box-shadow 模擬）
  const p1BleedWidth = (bleed0/MAX_HP*100).toFixed(1)+'%';
  const p2BleedWidth = (bleed1/MAX_HP*100).toFixed(1)+'%';
  const p1BleedEl = document.getElementById('p1-bleed-bar');
  const p2BleedEl = document.getElementById('p2-bleed-bar');
  if (p1BleedEl) { p1BleedEl.style.width = p1BleedWidth; p1BleedEl.style.left = (hp0/MAX_HP*100).toFixed(1)+'%'; }
  if (p2BleedEl) { p2BleedEl.style.width = p2BleedWidth; p2BleedEl.style.right = (hp1/MAX_HP*100).toFixed(1)+'%'; }
  document.getElementById('p1-hp-num').textContent = `${Math.ceil(hp0)} / ${MAX_HP}`;
  document.getElementById('p2-hp-num').textContent = `${Math.ceil(hp1)} / ${MAX_HP}`;
  document.getElementById('timer-display').textContent =
    ({lava:'🌋 ', snow:'❄️ ', grass:'🌿 ', sand:'🏜️ ', beach:'🏖️ '}[state.arena] || '') + Math.floor(elapsed) + 's';

  function statusText(b) {
    if (b.char.type === 'chef') {
      return `菜刀: ${'🔪'.repeat(b.knives)}${b.knives===0?'空手！':''}`;
    } else if (b.char.type === 'opm') {
      return b.opmPunched ? '👊 已出拳！' : `👊 倒數: ${Math.max(0, Math.ceil(b.opmCountdown))}s`;
    } else if (b.char.type === 'vampire') {
      if (b.vampireBiting) return `🦷 咬擊中 ${b.vampireBiteStep}/${VAMPIRE_BITE_COUNT}`;
      if (b.vampireDashing) return `🦇 蝙蝠狂襲！`;
      return `🦇 衝刺: ${Math.max(0, Math.ceil(b.vampireDashTimer))}s`;
    } else if (b.char.type === 'cursed') {
      const slashLeft = b.curseSlashTimer ? b.curseSlashTimer.toFixed(1) : '-';
      return b.curseDomainActive ? `☠️ 伏魔展開中` : `⚔️ 解: ${slashLeft}s`;
    } else if (b.char.type === 'trapper') {
      const trapCount = state.traps.filter(t => t.owner === b.player).length;
      if (b.trapChainActive) return `⛓️ 鎖鏈拉扯中！`;
      const chainLeft = Math.max(0, Math.ceil(b.trapChainTimer));
      return `🪤 ${trapCount}/${TRAP_MAX_COUNT} 刺 ⛓️${chainLeft}s`;
    } else if (b.char.type === 'yi') {
      const stoneCount = state.yiBlackStones.filter(s => s.owner === b.player && s.phase === 'stone').length;
      const nextIn = b.yiBlackTimer != null ? b.yiBlackTimer.toFixed(1) : '-';
      if (b.yiBlackCount >= YI_BLACK_MAX) return `⬜ 白旗蓄力中 ${nextIn}s`;
      if (b.yiArenaActive) return `⬛ ${stoneCount}/${YI_BLACK_MAX} 🏟️${b.yiArenaTimer.toFixed(1)}s`;
      return `⬛ ${stoneCount}/${YI_BLACK_MAX} 棋 ${nextIn}s`;
    } else if (b.char.type === 'gojo') {
      if (b.gojoCharging) return `🔵 蓄力虛式 ${b.gojoChargeTimer ? b.gojoChargeTimer.toFixed(1) : ''}s`;
      const cdLeft = Math.max(0, b.gojoCooldown || 0).toFixed(1);
      const mode = b.gojoUnlocked ? '六眼解放' : '術式';
      return `✨ ${mode} CD:${cdLeft}s`;
    } else if (b.char.type === 'gunner') {
      if (b.gunnerFiring) return `🔫 連射中！`;
      if (b.gunnerStunTimer > 0) return `💫 暈眩 ${b.gunnerStunTimer.toFixed(1)}s`;
      const flashLeft = Math.max(0, b.gunnerFlashTimer).toFixed(1);
      return `🔫 ${b.gunnerAmmo}/${GUNNER_MAG_SIZE}彈 💣${flashLeft}s`;
    } else if (b.char.type === 'samurai') {
      if (b.samuraiIaidoing) return `⚡ 居合！`;
      if (b.samuraiShimetsuing) return `💥 識滅斬！！`;
      if (b.samuraiParrying) {
        const left = Math.max(0, SAMURAI_PARRY_DURATION - b.samuraiParryElapsed).toFixed(1);
        return `🛡️ 招架 ${left}s ${b.samuraiNextIsShimetsu?'🔥':''}`;
      }
      const cdLeft = Math.max(0, b.samuraiParryTimer).toFixed(1);
      const iCount = b.samuraiIaidoCount || 0;
      return `⚔️ 招架:${cdLeft}s 居合${iCount}/${SAMURAI_IAIDO_MAX}${b.samuraiNextIsShimetsu?'🔥':''}`;
    } else if (b.char.type === 'mage') {
      if (b.mageTeleportTimer > 0) return `✨ 瞬移中...`;
      const doveLeft = Math.max(0, b.mageDoveTimer).toFixed(1);
      const trickNames = { 1:'💚回血', 2:'🔮穿透彈', 3:'🎯追蹤', 4:'❄️定身' };
      if (b.mageTrickReady) return `🎩 技巧蓄好！${trickNames[b.mageTrickType]} 🕊️${doveLeft}s`;

    } else if (b.char.type === 'thunder') {
      const pillarCount = state.thunderPillars.filter(p => p.owner === b.player).length;
      const strikeLeft = Math.max(0, b.thunderStrikeTimer).toFixed(1);
      const paraStatus = b.thunderParalyzed ? ' ⚡麻痺！' : '';
      return `⚡ ${pillarCount}/${THUNDER_PILLAR_MAX}柱 🌩️${strikeLeft}s${paraStatus}`;

      if (b.smithSwordSwinging) return `⚔️ 斬擊！(鍛造×${b.smithForgeStacks})`;
      const nearEnemy = (() => {

      })();
      if (nearEnemy) return `⚔️ 劍擊 CD:${swordCD}s (鍛造×${b.smithForgeStacks})`;

      if (b.naoKyouseiFiring) return `💥 凶星軌跡！`;

      if (b.itachiBiting) return `🦷 月讀定身中 ${b.itachiBiteStep}/3`;
