    } else if (b.char.type === 'yuta') {
      const curseLeft = Math.max(0, b.yutaCurseWordTimer || 0).toFixed(1);
      const slashLeft = Math.max(0, b.yutaSlashTimer || 0).toFixed(1);
      const bindCdStr = b.yutaBindCooldown > 0 ? ` 🔒CD${b.yutaBindCooldown.toFixed(1)}s` : '';
      if (!b.yutaRikaActive) {
        return `🪽 咒言${curseLeft}s 咒力斬${slashLeft}s(${b.yutaSlashHits||0}/${YUTA_SLASH_HIT_THRESHOLD})${bindCdStr}`;
      }
      if (b.yutaRikaCannonWarning) {
        return `👧 純愛大砲蓄力中⚠️`;
      }
      if (b.yutaRikaCannonFiring) {
        const cannonLeft = Math.max(0, YUTA_RIKA_CANNON_DURATION - (b.yutaRikaCannonElapsed||0)).toFixed(1);
        return `👧 純愛大砲！${cannonLeft}s`;
      }
      const clawWarnStr = b.yutaRikaClawWarning ? ' 預警' : '';

          const clawLeft = Math.max(0, b.yutaRikaClawTimer || 0).toFixed(1);
      const cannonCd = Math.max(0, b.yutaRikaCannonTimer || 0).toFixed(1);
      return `👧 揮爪${clawLeft}s 大砲${cannonCd}s${bindCdStr}${clawWarnStr}`;
    } else if (b.char.type === 'drunk') {
      return `🍺 轉向: ${b.drunkTimer ? b.drunkTimer.toFixed(1) : '-'}s`;
    } else if (b.char.type === 'engineer') {
      const turretCount = state.turrets ? state.turrets.filter(t => t.owner === b.player).length : 0;
      const gridLeft = Math.max(0, b.engGridTimer || 0).toFixed(1);
      if (b.engMechActive) {
        return `🤖 機甲${Math.max(0, b.engMechTimer).toFixed(1)}s ⚡${gridLeft}s`;
      }
      const turretLeft = Math.max(0, b.engTurretTimer || 0).toFixed(1);
      return `🔧×${turretCount} ${turretLeft}s(${b.engTurretTotalSummoned||0}/${ENGINEER_MECH_TURRET_THRESHOLD}) ⚡${gridLeft}s`;
    } else if (b.char.type === 'cannondad') {
      if (b.cannonBlastCharging) return `🚬 光砲蓄力中⚠️`;
      if (b.cannonBlastFiring) return `🚬 光砲連射 ${b.cannonBlastShotsLeft}`;
      const cdLeft = Math.max(0, (b.cannonSkillCooldown||0) - (b.cannonSkillTimer||0)).toFixed(1);
      return `🚬 CD:${cdLeft}s`;
    } else if (b.char.type === 'tiger') {
      const orbCount = state.tigerBloodOrbs ? state.tigerBloodOrbs.filter(o => o.owner === b.player).length : 0;
      const bleedPool = Math.ceil(b.tigerBleedPool || 0);
      const punchLeft = Math.max(0, b.tigerPunchTimer || 0).toFixed(1);
      if (b.tigerCharging) return `🐯 蓄力中⚡ 血球${orbCount}/${TIGER_NOVA_THRESHOLD}`;
      if (b.tigerNovaCharging) return `🐯 ☄️超新星蓄力中！`;
      if (orbCount >= TIGER_NOVA_THRESHOLD && (b.tigerNovaCooldown || 0) <= 0) return `🐯 ☄️超新星就緒！血條${bleedPool}`;
      if (orbCount >= TIGER_NOVA_THRESHOLD) return `🐯 ☄️冷卻中${Math.ceil(b.tigerNovaCooldown)}s 球${orbCount}/${TIGER_NOVA_THRESHOLD}`;
      return `🐯 徑庭拳:${punchLeft}s 球${orbCount}/${TIGER_NOVA_THRESHOLD}${bleedPool>0?' 💉'+bleedPool:''}`;
    } else if (b.char.type === 'stargirl') {
      const bigCount = state.starBigStars ? state.starBigStars.filter(s => s.owner === b.player).length : 0;
      const smallCount = state.starSmallStars ? state.starSmallStars.filter(s => s.owner === b.player).length : 0;
      if (b.starMeteorActive) return `☄️ 星隕！${Math.ceil(b.starMeteorTimer)}s ⭐×${bigCount} ★×${smallCount}`;
      const starCdLeft = Math.max(0, b.starBigTimer || 0).toFixed(1);
      const meteorCd = b.starMeteorCooldown > 0 ? `☄️CD:${Math.ceil(b.starMeteorCooldown)}s` : '☄️就緒！';
      return `⭐×${bigCount}/${STAR_BIG_MAX} ★×${smallCount} ${meteorCd} 大星:${starCdLeft}s`;
    } else if (b.char.type === 'obito') {
      const phase = b.obitoKamuiPhase;
      const kamuiCd = Math.max(0, b.obitoKamuiCooldown || 0).toFixed(1);
      const fireCd = Math.max(0, b.obitoFireballTimer || 0).toFixed(1);
      const spaceCount = state.obitoSpaceCaptures ? state.obitoSpaceCaptures.filter(c => c.owner === b.player).length : 0;
      if (phase === 'ghost') return `🌀 虛影判定中... ⏱${(b.obitoGhostTimer||0).toFixed(1)}s`;
      if (phase === 'teleporting') return `🌀 轉移中...`;
      if (phase === 'in_space') return `🔮 神威空間中 ${spaceCount > 0 ? '📦'+spaceCount : ''}`;
      if (phase === 'grabbing') return `🔮 空間衝刺中！`;
      if (phase === 'returning') return `🌀 帶回主場地！`;
      if (phase === 'chaining') return `⛓️ 鎖鏈甩飛！`;
      return `🔥 火球:${fireCd}s 🌀 神威:${kamuiCd > 0 ? kamuiCd+'s' : '就緒！'} 📦${spaceCount}`;
    } else if (b.char.type === 'geto') {
      const spiritCount = state.getoSpirits ? state.getoSpirits.filter(s => s.owner === b.player).length : 0;
      if (b.getoUltimateCharging) return `🌀 極之番•漩渦蓄力中！`;
      if (b.getoSpecialActive) {
        const skillLabel = { entangle: '🌿糾纏', bind: '💜定身', surge: '✨咒力奔流' }[b.getoSpecialSkill] || '';
        let extra = '';
        if (b.getoSpecialSkill === 'surge' && b.getoSurgeCharging) extra = '蓄力中⚠️';
        else if (b.getoSpecialSkill === 'bind') {
          const enemy = state.balls.find(x => x.player !== b.player);
          extra = (enemy && enemy.getoBoundTimer > 0) ? '鎖定中！' : `CD:${Math.max(0, b.getoBindTimer || 0).toFixed(1)}s`;
        } else if (b.getoSpecialSkill === 'entangle') extra = `${Math.max(0, b.getoEntangleTimer || 0).toFixed(1)}s`;
        else if (b.getoSpecialSkill === 'surge') extra = `CD:${Math.max(0, b.getoSurgeTimer || 0).toFixed(1)}s`;
        return `👻咒靈${b.getoStock}(場${spiritCount}) 🔮特級${Math.max(0,Math.ceil(b.getoSpecialHp))}/${GETO_SPECIAL_HP} ${skillLabel}${extra}`;
      }
      return `👻 咒靈庫存 ${b.getoStock}/${GETO_MAX_STOCK}（場上${spiritCount}隻）`;
    } else if (b.char.type === 'sakiko') {
      const noteCount = b.sakikoNotes ? b.sakikoNotes.filter(n => !n.isNova).length : 0;
      const modeLabel = b.sakikoMode === 'piano' ? '🎹鋼琴' : '🎺管風琴';
      if (b.sakikoDualActive) return `✨殘月的餘韻！${Math.ceil(b.sakikoDualTimer)}s 音符${noteCount}/${SAKIKO_DUAL_NOTE_CAP}`;
      if (b.sakikoNovaFiring) return `🌙新月甦醒！連發中 ${modeLabel}`;
      const novaCd = Math.max(0, SAKIKO_NOVA_COOLDOWN - (b.sakikoNovaTimer || 0)).toFixed(1);
      return `${modeLabel} 音符${noteCount}/${SAKIKO_NOTE_MAX_STACK} Fever${Math.floor(b.sakikoFever||0)}/${SAKIKO_FEVER_MAX} 🌙${novaCd}s`;
    } else if (b.char.type === 'joseph') {
      const stacks = Math.floor(b.rippleStacks || 0);
      const stackStr = stacks > 0 ? ` 🌀波紋×${stacks}` : '';
      if (b.josephState === 'charging') return `🌊 蓄力波紋呼吸法中... ${(b.josephChargeTimer||0).toFixed(1)}/${JOSEPH_CHARGE_TIME}s`;
      if (b.josephState === 'waiting') return `💧 蓄力中斷，${Math.max(0, b.josephRetryTimer||0).toFixed(1)}s後再試`;
      if (b.josephState === 'failed') return `⚪ 未能習得波紋呼吸法（碰觸5傷害）`;
      if (b.josephUltimateActive) return `☀️ Sunlight Yellow Overdrive！${b.josephUltimateStep}/${JOSEPH_ULTIMATE_COMBO_HITS}`;
      const breathLeft = Math.max(0, JOSEPH_ULTIMATE_UNLOCK - (b.josephBreathingTimer||0));
      const syoStr = b.josephUltimateReady ? (b.josephUltimateCooldown > 0 ? `☀️CD:${b.josephUltimateCooldown.toFixed(1)}s` : '☀️就緒！') : `☀️${breathLeft.toFixed(1)}s`;
      const dashCd = Math.max(0, b.josephDashTimer||0).toFixed(1);
      const springCd = Math.max(0, b.josephSpringTimer||0).toFixed(1);
      return `🌊波紋呼吸法 疾走${dashCd}s 彈簧${springCd}s ${syoStr}${stackStr}`;
    } else {
      return '';
    }
  }
  document.getElementById('p1-status').textContent = statusText(b0);
  document.getElementById('p2-status').textContent = statusText(b1);
}

function showResult(deadBalls) {
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('result-title');
  const subEl   = document.getElementById('result-sub');
  const statsEl = document.getElementById('result-stats');
  if (deadBalls.length === 2) {
    titleEl.textContent = '平局！'; titleEl.style.color = '#c8a84b'; subEl.textContent = '兩位勇士同歸於盡';
  } else {
    const winner = state.balls.find(b => b.player !== deadBalls[0].player);
    const loser  = deadBalls[0];
    titleEl.textContent = `${winner.char.emoji} 勝利！`;
    titleEl.style.color = winner.char.color;
    // 特定對手專屬勝利台詞：若 winner.char.vsQuotes[loser角色id] 有設定，優先使用；否則用一般 winQuote
   function pickQuote(q) {
  if (Array.isArray(q)) return q[Math.floor(Math.random() * q.length)];
  return q;
}

const specialQuote = winner.char.vsQuotes && loser.char && winner.char.vsQuotes[loser.char.id];
const quote = pickQuote(specialQuote || winner.char.winQuote);
    subEl.innerHTML = `${winner.char.displayName} 剩餘 ${Math.ceil(winner.hp)} 血` +
      (quote ? `<div style="margin-top:6px;font-size:0.85em;opacity:0.85">「${quote}」</div>` : '');
  }

  // 戰鬥紀錄
  if (statsEl && state.stats) {
    const dur = state.stats.duration;
    const mm = Math.floor(dur / 60).toString().padStart(2,'0');
    const ss = Math.floor(dur % 60).toString().padStart(2,'0');
    const cardStyle = `background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 16px;min-width:130px;text-align:center;font-size:0.82rem;color:#ccc;line-height:1.8`;
    const rows = state.balls.map(b => {
      const s = state.stats[b.player];
      return `<div style="${cardStyle}">
        <div style="font-size:1.1rem;margin-bottom:4px">${b.char.emoji} <span style="color:${b.char.color};font-weight:700">${b.char.displayName}</span></div>
        <div>💥 總傷害　<b style="color:#fff">${Math.round(s.totalDmg)}</b></div>
              </div>`;
    });
    statsEl.innerHTML = `
      <div style="width:100%;text-align:center;font-size:0.75rem;color:#888;margin-bottom:6px;letter-spacing:.1em">⚔️ 戰鬥紀錄　${mm}:${ss}</div>
      ${rows.join('')}
    `;
  }

  if (endlessMode) {
    // 無盡模式：判斷 P1 是否獲勝（player 是數字 1/2）
    const p1Won = deadBalls.length === 2 ? false : !deadBalls.find(b => b.player === 1);
    const sid = endlessSessionId;
    setTimeout(() => { if (endlessSessionId === sid) handleEndlessResult(p1Won); }, 800);
    return; // 不顯示一般 overlay
  }
  overlay.classList.add('show');
}

// ══════════════ 無盡闖關模式 ══════════════
let endlessMode = false;
let endlessStage = 1;
let endlessSessionId = 0; // 用來作廢舊的 setTimeout
let endlessBest = parseInt(localStorage.getItem('endlessBest') || '0');
let endlessEnemyId = null;
let endlessPlayerCharId = null;

function startEndless() {
  endlessMode = true;
  endlessStage = 1;
  showEndlessPick();
}

function showEndlessPick() {
  // 隱藏其他畫面
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('endless-result-screen').style.display = 'none';
  document.getElementById('endless-pick-screen').style.display = 'flex';

  // 關卡資訊
  document.getElementById('ep-stage').textContent = `第 ${endlessStage} 關`;
  document.getElementById('ep-best').textContent = endlessBest > 0 ? `🏆 最高紀錄：第 ${endlessBest} 關` : '';

  // 隨機選一個對手（跟上次不同）
  let enemyChar;
  do { enemyChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)]; }
  while (enemyChar.id === endlessEnemyId && CHARACTERS.length > 1);
  endlessEnemyId = enemyChar.id;
  document.getElementById('ep-next-enemy').textContent = `${enemyChar.emoji} ${enemyChar.name}`;

  // 三個隨機玩家角色選項（不重複）
  const pool = [...CHARACTERS].sort(() => Math.random() - 0.5).slice(0, 3);
  const cardsEl = document.getElementById('ep-cards');
  cardsEl.innerHTML = '';

  pool.forEach((ch, idx) => {
    // 外層：做翻轉容器
    const wrapper = document.createElement('div');
    wrapper.style.cssText = `
      width:140px;height:220px;perspective:700px;cursor:pointer;flex-shrink:0;
      opacity:0;transform:translateY(-60px);
      transition:opacity 0.35s ease ${idx*0.18}s, transform 0.35s ease ${idx*0.18}s;
    `;

    const inner = document.createElement('div');
    inner.style.cssText = `
      width:100%;height:100%;position:relative;
      transform-style:preserve-3d;
      transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);
    `;

    // 牌背
    const back = document.createElement('div');
    back.style.cssText = `
      position:absolute;inset:0;backface-visibility:hidden;
      background:linear-gradient(135deg,#1a0030,#2d0060);
      border:2px solid rgba(180,80,255,0.5);border-radius:14px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    `;
    back.innerHTML = `
      <div style="font-size:2.5rem;filter:drop-shadow(0 0 10px #aa44ff)">🌀</div>
      <div style="font-size:0.7rem;color:rgba(180,80,255,0.8);letter-spacing:.15em">點擊翻牌</div>
    `;

    // 牌面（預先建好但先藏起來，rotateY(180deg) 反面朝前）
    const front = document.createElement('div');
    front.style.cssText = `
      position:absolute;inset:0;backface-visibility:hidden;
      transform:rotateY(180deg);
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.15);border-radius:14px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
      padding:12px 8px;text-align:center;
    `;
    front.innerHTML = `
      <div style="font-size:2.4rem">${ch.emoji}</div>
      <div style="font-size:0.92rem;font-weight:700;color:#eee">${ch.name}</div>
      <div style="font-size:0.64rem;color:#888;line-height:1.45">${ch.desc}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:2px">
        ${ch.stats.map(s=>`<span style="font-size:0.58rem;padding:2px 6px;background:rgba(255,255,255,0.08);border-radius:8px;color:#aaa">${s}</span>`).join('')}
      </div>
    `;

    inner.appendChild(back);
    inner.appendChild(front);
    wrapper.appendChild(inner);
    cardsEl.appendChild(wrapper);

    let flipped = false;

    wrapper.onclick = () => {
      if (!flipped) {
        // 翻面
        flipped = true;
        inner.style.transform = 'rotateY(180deg)';
        // 翻面後牌邊發光
        setTimeout(() => {
          front.style.borderColor = 'rgba(255,160,60,0.6)';
          front.style.boxShadow = '0 0 18px rgba(255,140,0,0.3)';
          wrapper.onmouseover = () => front.style.background = 'rgba(255,160,60,0.1)';
          wrapper.onmouseout  = () => front.style.background = 'rgba(255,255,255,0.04)';
        }, 280);
      } else {
        // 已翻面，第二次點擊才出戰
        endlessPlayerCharId = ch.id;
        launchEndlessBattle(ch.id, endlessEnemyId);
      }
    };

    // 發牌入場動畫
    requestAnimationFrame(() => {
      setTimeout(() => {
        wrapper.style.opacity = '1';
        wrapper.style.transform = 'translateY(0)';
      }, 50 + idx * 180);
    });
  });
}

function launchEndlessBattle(p1Id, p2Id) {
  p1Choice = p1Id;
  p2Choice = p2Id;
  document.getElementById('endless-pick-screen').style.display = 'none';
  startGame();
  document.getElementById('endless-stop-btn').style.display = 'block';
}

function endlessQuit() {
  // 用內嵌確認，避免 confirm() 被瀏覽器封鎖
  const btn = document.getElementById('endless-stop-btn');
  if (btn.dataset.confirming === '1') {
    btn.dataset.confirming = '0';
    btn.textContent = '✕ 放棄闖關';
    btn.style.background = 'rgba(255,60,60,0.15)';
    endlessMode = false;
    endlessSessionId++;
    if (gameLoop) { cancelAnimationFrame(gameLoop); gameLoop = null; }
    document.getElementById('endless-stop-btn').style.display = 'none';
    backToSelect();
  } else {
    btn.dataset.confirming = '1';
    btn.textContent = '確定放棄？再按一次';
    btn.style.background = 'rgba(255,60,60,0.4)';
    setTimeout(() => {
      if (btn.dataset.confirming === '1') {
        btn.dataset.confirming = '0';
        btn.textContent = '✕ 放棄闖關';
        btn.style.background = 'rgba(255,60,60,0.15)';
      }
    }, 2500);
  }
}

function handleEndlessResult(p1Won) {
  if (p1Won) {
    endlessStage++;
    showEndlessPick();
  } else {
    // 更新最高紀錄
    const reached = endlessStage;
    if (reached > endlessBest) {
      endlessBest = reached;
      localStorage.setItem('endlessBest', endlessBest);
    }
    document.getElementById('endless-pick-screen').style.display = 'none';
    document.getElementById('endless-result-screen').style.display = 'flex';
    document.getElementById('er-stage').textContent = `抵達第 ${reached} 關`;
    document.getElementById('er-best').textContent = `🏆 最高紀錄：第 ${endlessBest} 關`;
    document.getElementById('overlay').classList.remove('show');
  }
}

function backToSelect() {
  endlessMode = false;
  p1Choice = null; p2Choice = null;
  document.getElementById('endless-stop-btn').style.display = 'none';
  document.getElementById('endless-result-screen').style.display = 'none';
  document.getElementById('endless-pick-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('select-screen').style.display = 'flex';
  // 清除選角畫面的選中狀態
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected','p1','p2'));
  const lbl1 = document.getElementById('p1-selected-label');
  const lbl2 = document.getElementById('p2-selected-label');
  if (lbl1) lbl1.textContent = '請選擇角色';
  if (lbl2) lbl2.textContent = '請選擇角色';
  const startBtn = document.getElementById('start-btn');
  if (startBtn) startBtn.disabled = true;
}

document.getElementById('endless-btn').addEventListener('click', startEndless);
</script>
