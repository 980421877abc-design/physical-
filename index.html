  for (let i = state.getoBindFX.length - 1; i >= 0; i--) { state.getoBindFX[i].life -= dt; if (state.getoBindFX[i].life <= 0) state.getoBindFX.splice(i, 1); }
  for (let i = state.getoSurgeFX.length - 1; i >= 0; i--) { state.getoSurgeFX[i].life -= dt; if (state.getoSurgeFX[i].life <= 0) state.getoSurgeFX.splice(i, 1); }
  for (let i = state.getoDeathFX.length - 1; i >= 0; i--) { state.getoDeathFX[i].life -= dt; if (state.getoDeathFX[i].life <= 0) state.getoDeathFX.splice(i, 1); }
  for (let i = state.getoCaneFX.length - 1; i >= 0; i--) { state.getoCaneFX[i].life -= dt; if (state.getoCaneFX[i].life <= 0) state.getoCaneFX.splice(i, 1); }
  if (state.josephPunchFX) for (let i = state.josephPunchFX.length - 1; i >= 0; i--) { state.josephPunchFX[i].life -= dt; if (state.josephPunchFX[i].life <= 0) state.josephPunchFX.splice(i, 1); }
  if (state.rippleStackFX) for (let i = state.rippleStackFX.length - 1; i >= 0; i--) { state.rippleStackFX[i].life -= dt; if (state.rippleStackFX[i].life <= 0) state.rippleStackFX.splice(i, 1); }

  // ══════════════ Oblivionis（豐川祥子）邏輯 ══════════════
  for (const b of state.balls) {
    if (b.char.type !== 'sakiko') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 殘月的餘韻：Fever滿層時觸發雙音色齊發＋期間不死
    if (!b.sakikoDualActive && (b.sakikoFever || 0) >= SAKIKO_FEVER_MAX) {
      b.sakikoDualActive = true;
      b.sakikoDualTimer = SAKIKO_DUAL_DURATION;
      b.sakikoFever = 0;
      b.sakikoShadowHp = b.hp;
      if (state && state.stats) state.stats[b.player].skillUses++;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 46, alpha: 1.1, color: '#ffd76b', t: 0.6 });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 26, alpha: 1.0, color: '#ffffff', t: 0.4 });
      playHitSound('opm');
    }

    // 殘月的餘韻：倒數，結束後依真實血量正式結算生死
    if (b.sakikoDualActive) {
      b.sakikoDualTimer -= dt;
      if (b.sakikoDualTimer <= 0) {
        b.sakikoDualActive = false;
        b.hp = Math.max(0, Math.round(b.sakikoShadowHp));
        b.sakikoShadowHp = null;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 0.8, color: '#8e6fd9', t: 0.4 });
      }
    }

    // 新月甦醒：連發推進 / 冷卻計時
    if (b.sakikoNovaFiring) {
      b.sakikoNovaShotTimer -= dt;
      if (b.sakikoNovaShotTimer <= 0) {
        b.sakikoNovaShotTimer = SAKIKO_NOVA_GAP;
        const shotIdx = SAKIKO_NOVA_COUNT - b.sakikoNovaShotsLeft; // 0-based
        const ratio = SAKIKO_NOVA_COUNT > 1
          ? SAKIKO_NOVA_DECAY_START * Math.pow(SAKIKO_NOVA_DECAY_END / SAKIKO_NOVA_DECAY_START, shotIdx / (SAKIKO_NOVA_COUNT - 1))
          : SAKIKO_NOVA_DECAY_START;
        spawnSakikoNote(b, enemy, b.sakikoMode, {
          isNova: true,
          damage: SAKIKO_NOVA_BASE_DAMAGE * ratio,
          speed: SAKIKO_NOVA_SPEED
        });
        b.sakikoNovaShotsLeft--;
        if (b.sakikoNovaShotsLeft <= 0) b.sakikoNovaFiring = false;
      }
    } else if (!(b.gunnerStunTimer > 0) && !(b.thunderParalyzed > 0)) {
      b.sakikoNovaTimer += dt;
      if (b.sakikoNovaTimer >= SAKIKO_NOVA_COOLDOWN) {
        b.sakikoNovaTimer = 0;
        b.sakikoNovaFiring = true;
        b.sakikoNovaShotsLeft = SAKIKO_NOVA_COUNT;
        b.sakikoNovaShotTimer = 0;
        if (state && state.stats) state.stats[b.player].skillUses++;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 0.9, color: '#ffffff', t: 0.3 });
        playHitSound('vampire_dash');
      }
    }

    // 頌樂音符（被動）：持續發射，殘月的餘韻期間雙音色狂暴齊發（大量噴發）
    const dualBoost = b.sakikoDualActive;
    const tones = dualBoost ? ['piano', 'organ'] : [b.sakikoMode];
    for (const tone of tones) {
      if (b.gunnerStunTimer > 0 || b.thunderParalyzed > 0) continue;
      const interval = dualBoost ? SAKIKO_DUAL_FIRE_INTERVAL : (tone === 'piano' ? SAKIKO_PIANO_INTERVAL : SAKIKO_ORGAN_INTERVAL);
      const timerKey = tone === 'piano' ? 'sakikoPianoTimer' : 'sakikoOrganTimer';
      b[timerKey] += dt;
      if (b[timerKey] >= interval) {
        b[timerKey] -= interval;
        const cap = dualBoost ? SAKIKO_DUAL_NOTE_CAP : SAKIKO_NOTE_MAX_STACK;
        const stackCount = b.sakikoNotes.filter(n => !n.isNova && n.active).length;
        if (stackCount < cap) {
          const burst = dualBoost ? SAKIKO_DUAL_SPAWN_BURST : 1;
          for (let k = 0; k < burst; k++) {
            spawnSakikoNote(b, enemy, tone, dualBoost ? { spread: SAKIKO_DUAL_SPREAD } : {});
          }
        }
      }
    }

    // 音符：追蹤移動、命中判定（依場上音符層數加成傷害）、壽命
    b.sakikoNotes = b.sakikoNotes.filter(n => n.active);
    for (const n of b.sakikoNotes) {
      const desiredAng = Math.atan2(enemy.y - n.y, enemy.x - n.x);
      const curAng = Math.atan2(n.vy, n.vx);
      let diff = desiredAng - curAng;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const maxTurn = SAKIKO_NOTE_TURN_RATE * dt;
      const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
      const newAng = curAng + turn;
      const spd = Math.hypot(n.vx, n.vy);
      n.vx = Math.cos(newAng) * spd; n.vy = Math.sin(newAng) * spd;
      n.x += n.vx * dt; n.y += n.vy * dt;
      n.life -= dt;
      if (n.life <= 0) { n.active = false; continue; }
      if (n.x < n.r || n.x > W - n.r || n.y < n.r || n.y > H - n.r) { n.active = false; continue; }
      const dd = Math.hypot(enemy.x - n.x, enemy.y - n.y);
      if (dd < RADIUS + n.r) {
        const stackCount = b.sakikoNotes.filter(x => !x.isNova && x.active).length;
        const stackCap = b.sakikoDualActive ? SAKIKO_DUAL_NOTE_CAP : SAKIKO_NOTE_MAX_STACK;
        const finalDmg = n.isNova ? n.damage : n.damage * (1 + SAKIKO_NOTE_DMG_PER_STACK * Math.min(stackCount, stackCap));
       dealDamage(enemy, finalDmg);
if (!b.sakikoDualActive) {
  b.sakikoFever = Math.min(SAKIKO_FEVER_MAX, (b.sakikoFever || 0) + SAKIKO_FEVER_PER_HIT);
}        n.active = false;
        state.hitFlashes.push({ x: n.x, y: n.y, r: 16, alpha: 0.85, color: n.color, t: 0.25 });
        playHitSound('knife');
      }
    }
  }

  // ── DIO 世界（時停）：將敵方所有狀態還原為本幀凍結前的樣子（HP變化除外，讓DIO的傷害保留）──
  if (dioFreezeTarget && dioFreezeSnapshot) {
    const survivedHp = dioFreezeTarget.hp;
    Object.assign(dioFreezeTarget, dioFreezeSnapshot);
    dioFreezeTarget.hp = survivedHp;
  }
}

function applyGojoForce(ball, fighters, owner) {
  const FORCE = GOJO_FORCE;
  for (const f of fighters) {
    if (f === owner) continue; // 不對自己本體施力
    const dx = f.x - ball.x, dy = f.y - ball.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    if (d > GOJO_FORCE_RANGE) continue;
    if (ball.type === 'blue') { f.vx -= (dx/d)*FORCE; f.vy -= (dy/d)*FORCE; }
    // 赫球不再持續施加斥力，改為命中時直接擊退（見碰撞判定處）
  }
}
// 生成蝙蝠粒子
function spawnBatParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = randBetween(40, 150);
    state.batParticles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: randBetween(0.3, 0.7),
      maxLife: 0.7,
      alpha: 1,
      color,
      size: randBetween(8, 14)
    });
  }
}

function fireProjectile(ball, enemy, type) {
  if (state && state.stats) state.stats[ball.player].skillUses++;
  const dx = enemy.x-ball.x, dy = enemy.y-ball.y;
  const d  = Math.sqrt(dx*dx + dy*dy);
  const nx = dx/d, ny = dy/d;
  const spd = type==='knife' ? KNIFE_SPEED : BOTTLE_SPEED;
  const dmg = type==='knife' ? KNIFE_DAMAGE : BOTTLE_DAMAGE;
  state.projectiles.push({
    x: ball.x + nx*(RADIUS+5), y: ball.y + ny*(RADIUS+5),
    vx: nx*spd, vy: ny*spd,
    owner: ball.player, type,
    angle: Math.atan2(ny, nx), damage: dmg,
    color: ball.char.color   // 繼承發射者顏色
  });
}

// 海灘場地：繪製沙灘、水域、潮汐、暗流、螃蟹、海膽、寶箱與電化特效
function renderBeachArena() {
  const bx = state.beachBoundary != null ? state.beachBoundary : ARENA_BEACH_MID_X;

  // 沙灘底色與紋理
  ctx.fillStyle = '#e8cf8a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(170,140,80,0.18)';
  for (let i = 0; i < 26; i++) {
    ctx.beginPath(); ctx.arc((i * 53) % W, (i * 97) % H, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  // 水域
  const wgrad = ctx.createLinearGradient(0, 0, bx, 0);
  wgrad.addColorStop(0, '#0f4c75');
  wgrad.addColorStop(1, '#2f8fd0');
  ctx.fillStyle = wgrad;
  ctx.fillRect(0, 0, bx, H);

  // 水面交界波浪線
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = 0; y <= H; y += 6) {
    const wobble = Math.sin(elapsed * 2 + y * 0.15) * 3;
    if (y === 0) ctx.moveTo(bx + wobble, y); else ctx.lineTo(bx + wobble, y);
  }
  ctx.stroke();
  // 水面反光紋路
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const wy = ((i / 5) * H + (elapsed * 20)) % H;
    ctx.beginPath(); ctx.moveTo(0, wy); ctx.lineTo(bx * 0.9, wy); ctx.stroke();
  }

  // 退潮後殘留水漬
  if (state.beachPuddles) {
    ctx.fillStyle = 'rgba(60,140,200,0.35)';
    for (const pd of state.beachPuddles) {
      ctx.beginPath(); ctx.ellipse(pd.x, pd.y, pd.r, pd.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 雷電法王電化水域特效
  if (state.beachElectrified) {
    ctx.strokeStyle = `rgba(255,255,100,${0.5 + 0.3 * Math.sin(elapsed * 20)})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      let lx = Math.random() * bx, ly = Math.random() * H;
      ctx.beginPath(); ctx.moveTo(lx, ly);
      for (let s = 0; s < 3; s++) { lx += randBetween(-14, 14); ly += randBetween(-14, 14); ctx.lineTo(lx, ly); }
      ctx.stroke();
    }
  }

  // 暗流
  if (state.beachCurrents) {
    for (const cur of state.beachCurrents) {
      const swirl = elapsed * 3;
      const cg = ctx.createRadialGradient(cur.x, cur.y, 0, cur.x, cur.y, ARENA_BEACH_CURRENT_R);
      cg.addColorStop(0, 'rgba(0,20,40,0.9)');
      cg.addColorStop(0.7, 'rgba(0,60,100,0.5)');
      cg.addColorStop(1, 'rgba(0,60,100,0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(cur.x, cur.y, ARENA_BEACH_CURRENT_R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,220,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cur.x, cur.y, ARENA_BEACH_CURRENT_R * 0.6, swirl, swirl + Math.PI * 1.4); ctx.stroke();
    }
  }

  // 螃蟹
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '18px serif';
  for (const crab of state.beachCrabs || []) {
    ctx.save();
    ctx.translate(crab.x, crab.y);
    ctx.rotate(Math.atan2(crab.vy, crab.vx));
    ctx.fillText('🦀', 0, 0);
    ctx.restore();
  }

  // 海膽
  for (const u of state.beachUrchins || []) {
    ctx.fillStyle = '#1a0a2a';
    ctx.beginPath(); ctx.arc(u.x, u.y, ARENA_BEACH_URCHIN_R * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3d1f5c'; ctx.lineWidth = 1.6;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(u.x + Math.cos(a) * ARENA_BEACH_URCHIN_R * 0.4, u.y + Math.sin(a) * ARENA_BEACH_URCHIN_R * 0.4);
      ctx.lineTo(u.x + Math.cos(a) * ARENA_BEACH_URCHIN_R, u.y + Math.sin(a) * ARENA_BEACH_URCHIN_R);
      ctx.stroke();
    }
  }

  // 寶箱
  if (state.beachChest) {
    ctx.font = '22px serif';
    ctx.fillText('📦', state.beachChest.x, state.beachChest.y);
  }

  // 釣魚佬鯊魚鰭累積數
  ctx.font = 'bold 11px sans-serif';
  for (const b of state.balls) {
    if (b.char.type !== 'fisherman') continue;
    const n = (state.beachSharkFins && state.beachSharkFins[b.player]) || 0;
    if (n > 0) {
      ctx.fillStyle = '#333';
      ctx.fillText(`🦈×${n}`, b.x, b.y - RADIUS - 14);
    }
  }
}

// 大喬：波紋拳頭圖形（拳頭主體＋指節反光），in local rotated coords，(x,y)為拳心位置
function drawHamonFist(ctx, x, y, angle, size, color) {
  if (size <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.shadowColor = '#66ccff';
  ctx.shadowBlur = size * 0.9;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, size * 0.62, size * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.arc(size * 0.18, k * size * 0.32, size * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 大喬：波紋衝擊環（世界座標）
function drawHamonRing(ctx, x, y, r, alpha, color, lineWidth) {
  if (alpha <= 0 || r <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = (state && state.bgColor) ? state.bgColor : '#a8d8f0'; ctx.fillRect(0, 0, W, H);

  // 熔岩場地背景
  if (state.arena === 'lava') {
    // 底色
    ctx.fillStyle = '#1a0800'; ctx.fillRect(0, 0, W, H);
    // 熔岩流動紋路
    const t = elapsed * 0.8;
    for (let i = 0; i < 6; i++) {
      const x = (W * (i / 5)) + Math.sin(t + i * 1.3) * 30;
      const grad = ctx.createLinearGradient(x, 0, x + 60, H);
      grad.addColorStop(0,   'rgba(200,50,0,0)');
      grad.addColorStop(0.3 + 0.2 * Math.sin(t + i), 'rgba(255,80,0,0.06)');
      grad.addColorStop(1,   'rgba(200,50,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    // 底部熔岩光
    const lavaGlow = ctx.createLinearGradient(0, H * 0.75, 0, H);
    lavaGlow.addColorStop(0, 'rgba(255,60,0,0)');
    lavaGlow.addColorStop(1, `rgba(255,80,0,${0.12 + 0.05 * Math.sin(elapsed * 3)})`);
    ctx.fillStyle = lavaGlow; ctx.fillRect(0, 0, W, H);
    // 場地邊緣灼燒警示
    const edgeGlow = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    edgeGlow.addColorStop(0, 'rgba(255,40,0,0)');
    edgeGlow.addColorStop(1, `rgba(255,40,0,${0.18 + 0.06 * Math.sin(elapsed * 2)})`);
    ctx.fillStyle = edgeGlow; ctx.fillRect(0, 0, W, H);
  }

  // 冰雪場地背景
  if (state.arena === 'snow') {
    ctx.fillStyle = '#0c1620'; ctx.fillRect(0, 0, W, H);
    const sgrad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, Math.max(W,H)*0.75);
    sgrad.addColorStop(0, 'rgba(140,200,255,0.10)');
    sgrad.addColorStop(1, 'rgba(20,40,70,0.25)');
    ctx.fillStyle = sgrad; ctx.fillRect(0, 0, W, H);
    if (!state.arenaSnowParticles) {
      state.arenaSnowParticles = Array.from({length: 40}, () => ({
        x: Math.random()*W, y: Math.random()*H, r: 1 + Math.random()*2, spd: 10 + Math.random()*20, drift: Math.random()*2-1
      }));
    }
    ctx.fillStyle = 'rgba(220,240,255,0.7)';
    for (const sp of state.arenaSnowParticles) {
      sp.y += sp.spd * 0.016; sp.x += sp.drift * 0.3;
      if (sp.y > H) { sp.y = -5; sp.x = Math.random()*W; }
      if (sp.x > W) sp.x = 0; if (sp.x < 0) sp.x = W;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); ctx.fill();
    }
    if (state.arenaBlizzardFX && state.arenaBlizzardFX.life > 0) {
      state.arenaBlizzardFX.life -= 0.016;
      const a = state.arenaBlizzardFX.life / state.arenaBlizzardFX.maxLife;
      ctx.fillStyle = `rgba(200,230,255,${a*0.25})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // 青草場地背景
  if (state.arena === 'grass') {
    ctx.fillStyle = '#0e1c0a'; ctx.fillRect(0, 0, W, H);
    const ggrad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, Math.max(W,H)*0.75);
    ggrad.addColorStop(0, 'rgba(120,220,90,0.12)');
    ggrad.addColorStop(1, 'rgba(20,50,15,0.25)');
    ctx.fillStyle = ggrad; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(140,220,100,0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i < 18; i++) {
      const gx = (W * (i / 17));
      ctx.beginPath(); ctx.moveTo(gx, H); ctx.lineTo(gx + Math.sin(elapsed*0.6+i)*8, H*0.4); ctx.stroke();
    }
    const grassPulse = (Math.sin(elapsed * 1.2) + 1) / 2;
    const gedge = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    gedge.addColorStop(0, 'rgba(100,255,100,0)');
    gedge.addColorStop(1, `rgba(100,255,100,${0.06 + 0.05*grassPulse})`);
    ctx.fillStyle = gedge; ctx.fillRect(0, 0, W, H);
  }

  // 流沙場地背景
  if (state.arena === 'sand') {
    ctx.fillStyle = '#2a1f0c'; ctx.fillRect(0, 0, W, H);
    const sandgrad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, Math.max(W,H)*0.75);
    sandgrad.addColorStop(0, 'rgba(210,170,90,0.12)');
    sandgrad.addColorStop(1, 'rgba(60,40,15,0.3)');
    ctx.fillStyle = sandgrad; ctx.fillRect(0, 0, W, H);
    if (state.arenaSandZones) {
      for (const z of state.arenaSandZones) {
        const fadeIn = Math.min(1, (z.maxLife - z.life) / 0.6);
        const fadeOut = Math.min(1, z.life / 0.8);
        const a = Math.min(fadeIn, fadeOut);
        const swirl = elapsed * 1.5;
        const sg = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, ARENA_SAND_RADIUS);
        sg.addColorStop(0, `rgba(180,140,60,${0.05*a})`);
        sg.addColorStop(0.7, `rgba(200,160,70,${0.22*a})`);
        sg.addColorStop(1, `rgba(160,120,50,${0.05*a})`);
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(z.x, z.y, ARENA_SAND_RADIUS, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = `rgba(220,180,90,${0.5*a})`; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.arc(z.x, z.y, ARENA_SAND_RADIUS, swirl, swirl + Math.PI*1.7); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  // 海灘場地背景
  if (state.arena === 'beach') {
    renderBeachArena();
  }

  // 格線
  ctx.strokeStyle = 'rgba(200,168,75,0.04)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 22) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 22) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(200,168,75,0.06)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(W/2,H/2,50,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,100,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#c8a84b'; ctx.lineWidth = 2; ctx.strokeRect(1,1,W-2,H-2);
  const corners = [[1,1],[W-1,1],[W-1,H-1],[1,H-1]];
  ctx.strokeStyle = '#f0c84a'; ctx.lineWidth = 2;
  for (const [cx,cy] of corners) {
    const s = 14;
    ctx.beginPath(); ctx.moveTo(cx-s*(cx<W/2?-1:1),cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy-s*(cy<H/2?-1:1)); ctx.stroke();
  }

  // 詛咒之王：斬痕（解 / 捌 / 御廚子）
  for (const s of state.slashMarks) {
    const prog = s.life / s.maxLife;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.globalAlpha = prog * 0.9;

    if (s.style === 'hachi') {
      // 捌：短且密集的十字斬線，橘紅色
      const len = 38;
      ctx.strokeStyle = `#e74c3c`;
      ctx.lineWidth = 2.5 - prog * 1.0;
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 12 * prog;
      ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -len/2); ctx.lineTo(0, len/2); ctx.stroke();
      // 斜線
      ctx.globalAlpha = prog * 0.5;
      ctx.beginPath(); ctx.moveTo(-len*0.35, -len*0.35); ctx.lineTo(len*0.35, len*0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(len*0.35, -len*0.35); ctx.lineTo(-len*0.35, len*0.35); ctx.stroke();
    } else if (s.style === 'geto_cane') {
      // 游雲：鈍器命中的紫色爆裂星紋（區別於刀劍系的斬擊線）
      const len = 26;
      ctx.strokeStyle = '#c9a6ff';
      ctx.lineWidth = 3 - prog * 1.5;
      ctx.shadowColor = '#8e6fd9'; ctx.shadowBlur = 16 * prog;
      for (let k = 0; k < 6; k++) {
        const a2 = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a2) * len * 0.3, Math.sin(a2) * len * 0.3);
        ctx.lineTo(Math.cos(a2) * len, Math.sin(a2) * len);
        ctx.stroke();
      }
      ctx.globalAlpha = prog * 0.6;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0, 0, len * 0.4, 0, Math.PI * 2); ctx.stroke();
    } else if (s.style === 'domain_burst') {
      // 御廚子啟動：長且粗的放射斬線，深紅帶白芯
      const len = 80;
      ctx.strokeStyle = `#c0392b`;
      ctx.lineWidth = 4 - prog * 2.5;
      ctx.shadowColor = '#c0392b';
      ctx.shadowBlur = 20 * prog;
      ctx.beginPath(); ctx.moveTo(-len*0.2, 0); ctx.lineTo(len, 0); ctx.stroke();
      // 白色芯線
      ctx.globalAlpha = prog * 0.7;
      ctx.strokeStyle = `#ffffff`;
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(-len*0.1, 0); ctx.lineTo(len*0.85, 0); ctx.stroke();
    } else if (s.style === 'iaido') {
      // 居合：細長金色雙斬線
      const len = 70;
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2.5 - prog * 1.5;
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14 * prog;
      ctx.beginPath(); ctx.moveTo(-len*0.15, -3); ctx.lineTo(len, -3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-len*0.1, 3); ctx.lineTo(len*0.9, 3); ctx.stroke();
      ctx.globalAlpha = prog * 0.5;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.8; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(len * 0.85, -2); ctx.stroke();
    } else if (s.style === 'shimetsu') {
      // 識滅斬：長且炙熱的金橙色斬波
      const len = 200;
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 3.5 - prog * 2;
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 22 * prog;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.globalAlpha = prog * 0.65;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(len * 0.9, 0); ctx.stroke();
    } else if (s.style === 'claw') {
      // 里香揮爪：3道斜向爪痕劃傷 + 閃光，粉色系
      const len = 50;
      ctx.strokeStyle = '#ff3d8a';
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ff6fa5'; ctx.shadowBlur = 14 * prog;
      for (let ci = 0; ci < 3; ci++) {
        const off = (ci - 1) * 14;
        ctx.lineWidth = 3.5 - prog * 1.8;
        ctx.beginPath();
        ctx.moveTo(-len/2 + off * 0.3, -len/2 + off);
        ctx.lineTo(len/2 + off * 0.3, len/2 + off);
        ctx.stroke();
      }
      // 白色閃光芯線（中間那道）
      ctx.globalAlpha = prog * 0.6;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(-len/2, -len/2); ctx.lineTo(len/2, len/2); ctx.stroke();
    } else {
      // 解：原始斜斬痕
      const len = 55;
      ctx.strokeStyle = `#c0392b`;
      ctx.lineWidth = 3 - prog * 1.5;
      ctx.shadowColor = '#c0392b';
      ctx.shadowBlur = 10 * prog;
      ctx.beginPath();
      ctx.moveTo(-len/2, -len/2);
      ctx.lineTo(len/2, len/2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(len/2 * 0.3, -len/2);
      ctx.lineTo(len/2 * 1.3, len/2 * 0.5);
      ctx.globalAlpha = prog * 0.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 詛咒之王：伏魔御廚子紅圈
  for (const b of state.balls) {
    if (b.char.type !== 'cursed' || !b.curseDomainActive) continue;
    const pulse = 0.4 + 0.2 * Math.sin(elapsed * 6);
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, CURSE_DOMAIN_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(192,57,43,${pulse + 0.3})`;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#c0392b';
    ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x, b.y, CURSE_DOMAIN_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(192,57,43,${pulse * 0.15})`;
    ctx.fill();
    // 原地倒數文字
    if (b.curseDomainFreezeTimer > 0) {
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = `rgba(255,120,100,0.9)`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`☠️ ${b.curseDomainFreezeTimer.toFixed(1)}s`, b.x, b.y - CURSE_DOMAIN_RADIUS - 10);
    }
    ctx.restore();
  }

  // 陷阱大師：鎖鏈連線
  for (const b of state.balls) {
    if (b.char.type !== 'trapper' || !b.trapChainActive) continue;
    const trap = b.trapChainTargetTrap;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!trap || !enemy) continue;
    ctx.save();
    const chainAlpha = 0.55 + 0.35 * Math.sin(elapsed * 25);
    ctx.strokeStyle = `rgba(39,174,96,${chainAlpha})`;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 3]);
    ctx.shadowColor = '#27ae60';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(trap.x, trap.y);
    ctx.lineTo(enemy.x, enemy.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    // 鎖鏈節點粒子（每幀隨機）
    if (Math.random() < 0.5) {
      const t = Math.random();
      const px = trap.x + (enemy.x - trap.x) * t;
      const py = trap.y + (enemy.y - trap.y) * t;
      state.hitFlashes.push({ x: px, y: py, r: 5, alpha: 0.6, color: '#2ecc71', t: 0.15 });
    }
  }

  // 陷阱大師：尖刺
  for (const trap of state.traps) {
    ctx.save();
    ctx.translate(trap.x, trap.y);
    const pulse = 0.85 + 0.15 * Math.sin(elapsed * 4 + trap.x);
    const col = trap.chainPulling ? '#f1c40f' : trap.color;
    ctx.shadowColor = col;
    ctx.shadowBlur = trap.chainPulling ? 22 : 10;
    ctx.globalAlpha = pulse;
    // 三角尖刺形狀
    const sz = 11;
    ctx.beginPath();
    ctx.moveTo(0, -sz * 1.5);
    ctx.lineTo(sz, sz * 0.7);
    ctx.lineTo(-sz, sz * 0.7);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 冷卻後亮點
    if (trap.chainPulling) {
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#f1c40f'; ctx.fill();
    }
    ctx.restore();
  }

  // 工程師：炮台
  for (const t of state.turrets) {
    ctx.save();
    ctx.translate(t.x, t.y);
    const lifeRatio = t.life / t.maxLife;
    const flashBoost = t.spawnFlash > 0 ? t.spawnFlash * 2 : 0;
    // 存活時間將盡時，整座炮台閃爍警示
    const dying = lifeRatio < 0.25;
    const dyingFlicker = dying ? (0.4 + 0.6 * Math.abs(Math.sin(elapsed * 14))) : 1;
    const mainColor = dying ? '#ff4444' : t.color;
    ctx.shadowColor = mainColor;
    ctx.shadowBlur = (10 + flashBoost * 20) * dyingFlicker;
    ctx.globalAlpha = Math.min(1, 0.6 + lifeRatio * 0.4 + flashBoost) * dyingFlicker;

    // 瞄準方向：朝向當前敵人（與實際開火方向一致）
    const target = state.balls.find(x => x.player !== t.owner);
    const aimAngle = target ? Math.atan2(target.y - t.y, target.x - t.x) : 0;

    // 底座（圓形機座 + 螺栓裝飾）
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fillStyle = '#2c3e50';
    ctx.fill();
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    for (let bi = 0; bi < 4; bi++) {
      const ba = (Math.PI * 2 / 4) * bi + Math.PI / 4;
      ctx.beginPath();
      ctx.arc(Math.cos(ba) * 10, Math.sin(ba) * 10, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = mainColor;
      ctx.fill();
    }

    // 炮塔（朝向目標旋轉的炮身，從底座中心向外延伸）
    ctx.save();
    ctx.rotate(aimAngle);
    // 炮管
    ctx.fillStyle = mainColor;
    ctx.fillRect(0, -3, 20, 6);
    // 炮口
    ctx.beginPath();
    ctx.arc(20, 0, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = dying ? '#ffaaaa' : '#7ec8ff';
    ctx.fill();
    ctx.restore();

    // 炮塔中心轂
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#1a242f';
    ctx.fill();
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // 工程師：電網
  for (const g of state.engGrids) {
    const half = ENGINEER_GRID_HALF;
    const ax1 = g.x - half, ay1 = g.y - half;
    const aw = half * 2, ah = half * 2;
    const lifeRatio = g.life / g.maxLife;
    const pulse = 0.5 + 0.35 * Math.sin(elapsed * 16);
    ctx.save();
    ctx.globalAlpha = Math.min(1, lifeRatio * 1.3);
    ctx.strokeStyle = `rgba(95,208,255,${pulse + 0.3})`;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#5fd0ff';
    ctx.shadowBlur = 16;
    ctx.strokeRect(ax1, ay1, aw, ah);
    // 內部格線（電網效果）
    ctx.lineWidth = 1;
    ctx.globalAlpha = (0.25 + 0.15 * pulse) * lifeRatio;
    const gridLines = 4;
    for (let gi = 1; gi < gridLines; gi++) {
      const gx = ax1 + (aw / gridLines) * gi;
      ctx.beginPath(); ctx.moveTo(gx, ay1); ctx.lineTo(gx, ay1 + ah); ctx.stroke();
      const gy = ay1 + (ah / gridLines) * gi;
      ctx.beginPath(); ctx.moveTo(ax1, gy); ctx.lineTo(ax1 + aw, gy); ctx.stroke();
    }
    ctx.fillStyle = `rgba(95,208,255,${0.06 * lifeRatio})`;
    ctx.fillRect(ax1, ay1, aw, ah);
    ctx.restore();
  }

  // 工程師：機甲雷射光束
  for (const lz of state.engLaserFX) {
    const prog = lz.life / lz.maxLife;
    ctx.save();
    ctx.translate(lz.x, lz.y);
    ctx.rotate(lz.angle);
    ctx.globalAlpha = Math.max(0, prog);
    const grad = ctx.createLinearGradient(0, 0, lz.length, 0);
    grad.addColorStop(0, 'rgba(174,224,255,0.95)');
    grad.addColorStop(0.5, 'rgba(95,208,255,0.55)');
    grad.addColorStop(1, 'rgba(95,208,255,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#5fd0ff';
    ctx.shadowBlur = 20;
    ctx.fillRect(0, -lz.width / 2, lz.length, lz.width);
    // 中心亮白核心線
    ctx.fillStyle = `rgba(255,255,255,${0.8 * prog})`;
    ctx.fillRect(0, -lz.width * 0.12, lz.length, lz.width * 0.24);
    ctx.restore();
  }

  // 砲爹：光柱渲染（橙黃色，比照工程師雷射）
  for (const lz of state.cannonBeamFX) {
    const prog = lz.life / lz.maxLife;
    ctx.save();
    ctx.translate(lz.x, lz.y);
    ctx.rotate(lz.angle);
    ctx.globalAlpha = Math.max(0, prog);
    const grad = ctx.createLinearGradient(0, 0, lz.length, 0);
    grad.addColorStop(0, 'rgba(255,217,160,0.95)');
    grad.addColorStop(0.5, 'rgba(255,138,61,0.55)');
    grad.addColorStop(1, 'rgba(255,138,61,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff8a3d';
    ctx.shadowBlur = 20;
    ctx.fillRect(0, -lz.width / 2, lz.length, lz.width);
    ctx.fillStyle = `rgba(255,255,255,${0.8 * prog})`;
    ctx.fillRect(0, -lz.width * 0.12, lz.length, lz.width * 0.24);
    ctx.restore();
  }

  // 砲爹：光砲渲染（寬版橙色光柱，約乙骨純愛大砲一半寬度）
  for (const bz of state.cannonBlastFX) {
    const prog = bz.life / bz.maxLife;
    ctx.save();
    ctx.translate(bz.x, bz.y);
    ctx.rotate(bz.angle);
    ctx.globalAlpha = Math.max(0, prog);
    const grad = ctx.createLinearGradient(0, 0, bz.length, 0);
    grad.addColorStop(0, 'rgba(255,200,140,0.95)');
    grad.addColorStop(0.4, 'rgba(255,120,40,0.6)');
    grad.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff5c1a';
    ctx.shadowBlur = 30;
    ctx.fillRect(0, -bz.halfWidth, bz.length, bz.halfWidth * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.7 * prog})`;
    ctx.fillRect(0, -bz.halfWidth * 0.18, bz.length, bz.halfWidth * 0.36);
    ctx.restore();
  }

  // 砲爹：追蹤光球渲染
  for (const b of state.balls) {
    if (b.char.type !== 'cannondad' || !b.cannonBalls) continue;
    for (const cb of b.cannonBalls) {
      ctx.save();
      ctx.shadowColor = '#ffb347';
      ctx.shadowBlur = 18;
      const bg = ctx.createRadialGradient(cb.x - 2, cb.y - 2, 1, cb.x, cb.y, cb.r);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.4, '#ffd28a');
      bg.addColorStop(1, '#ff8a3d');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(cb.x, cb.y, cb.r, 0, Math.PI*2); ctx.fill();
      // 尾焰
      const tailAng = Math.atan2(-cb.vy, -cb.vx);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ff8a3d';
      ctx.beginPath();
      ctx.ellipse(cb.x + Math.cos(tailAng)*cb.r*1.6, cb.y + Math.sin(tailAng)*cb.r*1.6, cb.r*1.3, cb.r*0.6, tailAng, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  for (const b of state.balls) {
    if (b.char.type !== 'yi' || !b.yiArenaActive) continue;
    const half = YI_ARENA_SIZE;
    const ax1 = b.yiArenaCx - half, ay1 = b.yiArenaCy - half;
    const aw = half * 2, ah = half * 2;
    const timeRatio = b.yiArenaTimer / YI_ARENA_DURATION;
    const pulse = 0.5 + 0.3 * Math.sin(elapsed * 8);
    ctx.save();
    // 外框
    ctx.strokeStyle = `rgba(220,220,255,${pulse + 0.2})`;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#aaaaff';
    ctx.shadowBlur = 16;
    ctx.strokeRect(ax1, ay1, aw, ah);
    // 半透明填色
    ctx.fillStyle = `rgba(150,150,220,${0.04 + 0.03 * Math.sin(elapsed * 4)})`;
    ctx.fillRect(ax1, ay1, aw, ah);
    // 角標（模仿主競技場角落裝飾）
    ctx.strokeStyle = '#ddddff';
    ctx.lineWidth = 2;
    const s = 8;
    const corners2 = [[ax1,ay1],[ax1+aw,ay1],[ax1+aw,ay1+ah],[ax1,ay1+ah]];
    for (const [ccx, ccy] of corners2) {
      ctx.beginPath();
      ctx.moveTo(ccx + (ccx < b.yiArenaCx ? s : -s), ccy);
      ctx.lineTo(ccx, ccy);
      ctx.lineTo(ccx, ccy + (ccy < b.yiArenaCy ? s : -s));
      ctx.stroke();
    }
    // 倒數
    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = `rgba(200,200,255,0.8)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`⬛ ${b.yiArenaTimer.toFixed(1)}s`, b.yiArenaCx, ay1 - 10);
    ctx.restore();
  }

  // 奕：黑棋棋子
  for (const s of state.yiBlackStones) {
    if (s.phase === 'exploded') continue;
    ctx.save();
    const pulse = s.phase === 'pulling'
      ? 0.6 + 0.4 * Math.abs(Math.sin(elapsed * 30))
      : 0.7 + 0.15 * Math.sin(elapsed * 3 + s.x);
    ctx.globalAlpha = pulse;
    ctx.shadowColor = s.phase === 'pulling' ? '#ffffff' : '#aaaaaa';
    ctx.shadowBlur = s.phase === 'pulling' ? 20 : 8;
    // 黑棋圓形
    ctx.beginPath();
    ctx.arc(s.x, s.y, YI_BLACK_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#111111';
    ctx.fill();
    ctx.strokeStyle = '#666666';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 拉動時顯示白色箭頭
    if (s.phase === 'pulling') {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.8;
    }
    ctx.restore();
  }

  // 雷電法王：閃電連線特效
  if (state.thunderStrikes) {
    for (const ts of state.thunderStrikes) {
      const prog = ts.life / ts.maxLife;
      ctx.save();
      ctx.globalAlpha = prog;
      // 主閃電線（鋸齒感用多段折線模擬）
      const segCount = 8;
      const pts = [];
      for (let si = 0; si <= segCount; si++) {
        const t2 = si / segCount;
        const bx2 = ts.x1 + (ts.x2 - ts.x1) * t2;
        const by2 = ts.y1 + (ts.y2 - ts.y1) * t2;
        const jitter = (si === 0 || si === segCount) ? 0 : (Math.random() - 0.5) * 22 * prog;
        const nx = -(ts.y2 - ts.y1), ny = (ts.x2 - ts.x1);
        const nlen = Math.hypot(nx, ny) || 1;
        pts.push({ x: bx2 + (nx/nlen)*jitter, y: by2 + (ny/nlen)*jitter });
      }
      // 外發光
      ctx.strokeStyle = ts.color + 'bb';
      ctx.lineWidth = 6 * prog;
      ctx.shadowColor = ts.color;
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let si = 1; si < pts.length; si++) ctx.lineTo(pts[si].x, pts[si].y);
      ctx.stroke();
      // 白色芯線
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * prog;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let si = 1; si < pts.length; si++) ctx.lineTo(pts[si].x, pts[si].y);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 雷電法王：閃電柱（半圓形貼牆）
  for (const pil of (state.thunderPillars || [])) {
    ctx.save();
    const pulse = 0.75 + 0.2 * Math.sin(elapsed * 6 + pil.x * 0.1);
    // 無限壽命時全亮，有限壽命才逐漸消退
    const lifeAlpha = (pil.life === Infinity) ? 1 : Math.min(1, pil.life / THUNDER_PILLAR_FADE_IN);
    ctx.globalAlpha = pulse * lifeAlpha;
    ctx.shadowColor = pil.color;
    ctx.shadowBlur = 14;
    // 根據牆面畫半圓（半圓開口朝場地內，中心點貼牆）
    ctx.fillStyle = pil.color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let startAngle, endAngle;
    if (pil.wallSide === 'left')   { startAngle = -Math.PI/2; endAngle = Math.PI/2; }
    else if (pil.wallSide === 'right')  { startAngle = Math.PI/2; endAngle = Math.PI*1.5; }
    else if (pil.wallSide === 'top')    { startAngle = 0; endAngle = Math.PI; }
    else                                { startAngle = Math.PI; endAngle = Math.PI*2; }
    ctx.arc(pil.x, pil.y, THUNDER_PILLAR_RADIUS, startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = pulse * 0.7 * lifeAlpha;
    ctx.stroke();
    // 小閃電符號
    ctx.globalAlpha = lifeAlpha * 0.9;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 6;
    ctx.fillText('⚡', pil.x, pil.y);
    ctx.restore();
  }

  // 插牆菜刀
  for (const k of state.wallKnives) {
    ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.angle);
    ctx.filter = `drop-shadow(0 0 3px ${k.color||'#e84545'}88)`;
    ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔪',0,0); ctx.restore();
  }

// ── 繪製 GOJO 術式球 ──
  for (const b of state.balls) {
    if (b.char.type !== 'gojo') continue;
    if (b.gojoChargingVisual) {
      const prog = Math.min(b.gojoChargeTimer/GOJO_CHARGE_TIME, 1);
      ctx.save();
      ctx.strokeStyle = `rgba(191,0,255,${0.4+0.6*prog})`;
      ctx.lineWidth = 2+3*prog;
      ctx.shadowColor = '#bf00ff'; ctx.shadowBlur = 20*prog;
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS+8+12*prog, 0, Math.PI*2*prog);
      ctx.stroke(); ctx.restore();
    }
    for (const ball of b.gojoBalls) {
      if (!ball.active && !ball.sticking) continue;
      ctx.save();
      if (ball.type==='blue') {
        // ── 蒼球光線（朝附近角色，加強亮度） ──
        for (const f of state.balls) {
          const dx = f.x - ball.x, dy = f.y - ball.y;
          const d = Math.sqrt(dx*dx+dy*dy) || 1;
          if (d < GOJO_BLUE_RAY_RANGE) {
            const alpha = 0.85 * (1 - d / GOJO_BLUE_RAY_RANGE) + 0.1;
            const grad = ctx.createLinearGradient(ball.x, ball.y, f.x, f.y);
            grad.addColorStop(0, `rgba(180,245,255,${alpha})`);
            grad.addColorStop(0.5, `rgba(0,207,255,${alpha*0.7})`);
            grad.addColorStop(1, `rgba(0,207,255,0)`);
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(f.x, f.y);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 4.5;
            ctx.shadowColor = '#00eaff';
            ctx.shadowBlur = 22;
            ctx.stroke();
            // 核心亮線，讓光束更銳利明顯
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(f.x, f.y);
            ctx.strokeStyle = `rgba(255,255,255,${alpha*0.6})`;
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 0;
            ctx.stroke();
          }
        }

        // ── 旋轉光圈（加強亮度） ──
        const ang = ball.ringAngle || 0;
        const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
        ctx.shadowColor = '#00eaff';
        ctx.shadowBlur = 28 * pulse;
        ctx.strokeStyle = `rgba(120,235,255,${0.9 * pulse})`;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.ellipse(ball.x, ball.y, GOJO_BLUE_RING_R, GOJO_BLUE_RING_R * 0.35, ang, 0, Math.PI * 2);
        ctx.stroke();
        // 第二圈，垂直方向
        ctx.strokeStyle = `rgba(200,250,255,${0.6 * pulse})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(ball.x, ball.y, GOJO_BLUE_RING_R, GOJO_BLUE_RING_R * 0.35, ang + Math.PI/2, 0, Math.PI * 2);
        ctx.stroke();

        // ── 蒼球主體（加強光暈） ──
        ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 34;
        const bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
        bg.addColorStop(0, '#ffffff');
        bg.addColorStop(0.35, '#aaf0ff');
        bg.addColorStop(0.7, '#00cfff');
        bg.addColorStop(1, '#0066aa');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

      } else if (ball.type==='red') {
        ctx.shadowColor='#ff4444'; ctx.shadowBlur=18; ctx.fillStyle='#ff4444';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      } else {
        const pulse = 0.7+0.3*Math.sin(Date.now()/150);
        ctx.shadowColor='#bf00ff'; ctx.shadowBlur=28*pulse;
        ctx.fillStyle='#bf00ff'; ctx.globalAlpha=pulse;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }
  // 投射物
  for (const p of state.projectiles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.filter = `drop-shadow(0 0 3px ${p.color}88)`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (p.type === 'bullet') {
      ctx.filter = 'none';
      ctx.fillStyle = '#ffee44';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fffbe0';
      ctx.beginPath(); ctx.ellipse(-2, 0, 3, 2, 0, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'turret_bullet') {
      ctx.filter = 'none';
      ctx.fillStyle = '#5fd0ff';
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e8f7ff';
      ctx.beginPath(); ctx.ellipse(-2, 0, 2.5, 1.6, 0, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'curseword') {
      ctx.filter = 'none';
      const cg = ctx.createRadialGradient(0,0,0,0,0,12);
      cg.addColorStop(0, 'rgba(255,200,225,0.85)');
      cg.addColorStop(0.5, 'rgba(255,111,165,0.6)');
      cg.addColorStop(1, 'rgba(255,111,165,0)');
      ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2);
      ctx.fillStyle = cg; ctx.fill();
      // 反向旋轉抵消子彈飛行角度，讓文字保持正向可讀
      ctx.rotate(-p.angle);
      ctx.font = 'bold 15px sans-serif';
      ctx.fillStyle = '#ff3d8a';
      ctx.shadowColor = '#ff6fa5'; ctx.shadowBlur = 8;
      ctx.fillText('咒', 0, 1);
    } else if (p.type === 'flashbang') {
      ctx.font = '16px serif';
      ctx.fillText('💣', 0, 0);
    } else if (p.type === 'amaterasu') {
      ctx.filter = 'none';
      const flick = 0.7 + 0.3 * Math.sin(elapsed * 30);
      const ag = ctx.createRadialGradient(0,0,0,0,0,16);
      ag.addColorStop(0, `rgba(139,0,0,${0.9*flick})`);
      ag.addColorStop(0.5, `rgba(60,0,0,${0.6*flick})`);
      ag.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2);
      ctx.fillStyle = ag; ctx.fill();
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2);
      ctx.fillStyle = '#0a0a0a';
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 14;
      ctx.fill();
      for (let fi = 0; fi < 3; fi++) {
        const fa = elapsed * 12 + fi * 2.1;
        ctx.beginPath();
        ctx.arc(Math.cos(fa)*5, Math.sin(fa)*5, 2.5, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,40,0,${0.7*flick})`;
        ctx.fill();
      }
    } else if (p.type === 'dove') {
      ctx.font = '18px serif';
      if (p.trickGlow) {
        const trickColors = { 1:'#2ecc71', 2:'#bf00ff', 3:'#e74c3c', 4:'#00cfff' };
        const col = trickColors[p.mageTrick] || '#f0c84a';
        ctx.filter = `drop-shadow(0 0 6px ${col}) drop-shadow(0 0 3px #ffffff)`;
      }
      ctx.fillText('🕊️', 0, 0);
    } else if (p.type === 'bloodshot') {
      ctx.filter = 'none';
      const beamLen = (p.r || 6) * 5.5;
      const beamW = (p.r || 6) * 0.85;
      // 拖尾錐形：由細到粗，模擬「血流」而非單純光束
      const trailGrad = ctx.createLinearGradient(-beamLen, 0, beamW * 0.4, 0);
      trailGrad.addColorStop(0, 'rgba(160,0,0,0)');
      trailGrad.addColorStop(0.45, 'rgba(200,0,30,0.45)');
      trailGrad.addColorStop(1, 'rgba(255,90,90,0.95)');
      ctx.beginPath();
      ctx.moveTo(-beamLen, -beamW * 0.25);
      ctx.lineTo(beamW * 0.4, -beamW);
      ctx.lineTo(beamW * 0.4, beamW);
      ctx.lineTo(-beamLen, beamW * 0.25);
      ctx.closePath();
      ctx.fillStyle = trailGrad;
      ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 16;
      ctx.fill();
      // 彈頭核心：發亮血球，仍是實體拋射物而非瞬發光束
      const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, beamW);
      coreGrad.addColorStop(0, 'rgba(255,220,220,0.98)');
      coreGrad.addColorStop(0.5, 'rgba(255,60,60,0.9)');
      coreGrad.addColorStop(1, 'rgba(160,0,0,0.5)');
      ctx.beginPath(); ctx.arc(beamW * 0.3, 0, beamW, 0, Math.PI*2);
      ctx.fillStyle = coreGrad; ctx.fill();
      // 周圍細小血滴飛散
      if (!p._dripT || elapsed - p._dripT > 0.04) {
        p._dripT = elapsed;
        if (!state.tigerCurseFX) state.tigerCurseFX = [];
        state.tigerCurseFX.push({
          x: p.x - Math.cos(p.angle) * beamLen * 0.5,
          y: p.y - Math.sin(p.angle) * beamLen * 0.5,
          vx: -Math.cos(p.angle) * 20 + (Math.random()-0.5)*30,
          vy: -Math.sin(p.angle) * 20 + (Math.random()-0.5)*30,
          life: 0.3, maxLife: 0.3, r: 2, color: '#cc0022', isBleed: true
        });
      }
    } else if (p.type === 'shimetsu') {
      // 識滅斬斬波：金橙發光條
      ctx.filter = 'none';
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(-14, -3, 28, 6);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-10, -1, 20, 2);
    } else if (p.type === 'fisher_fish') {
      ctx.filter = 'none';
      ctx.font = '22px serif';
      ctx.rotate(p.vx < 0 ? Math.PI : 0);
      ctx.fillText('🐟', 0, 0);
    } else if (p.type === 'fisher_shark') {
      ctx.filter = 'none';
      ctx.font = '28px serif';
      ctx.shadowColor = '#cc0022'; ctx.shadowBlur = 10;
      ctx.rotate(p.vx < 0 ? Math.PI : 0);
      ctx.fillText('🦈', 0, 0);
    } else if (p.type === 'fisher_school') {
      ctx.filter = 'none';
      ctx.font = '16px serif';
      ctx.rotate(p.vx < 0 ? Math.PI : 0);
      ctx.fillText('🐟', 0, 0);
    } else if (p.type === 'steve_arrow') {
      ctx.filter = 'none';
      ctx.strokeStyle = '#c8a878'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(1, -3); ctx.lineTo(1, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4a8f3c';
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-6, -3); ctx.lineTo(-6, 3); ctx.closePath(); ctx.fill();
    } else if (p.type === 'steve_firework') {
      ctx.filter = 'none';
      const pulse = 0.7 + 0.3 * Math.sin(elapsed * 20);
      ctx.shadowColor = '#ff8844'; ctx.shadowBlur = 12 * pulse;
      ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.fillStyle = '#ff8844';
      ctx.beginPath(); ctx.arc(7, 0, 4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.font = `${p.type==='knife'?24:16}px serif`;
      {
        ctx.fillText(p.type==='knife'?'🔪':'🍾', 0, 0);
      }
    }
    ctx.restore();
  }

  // 蝙蝠粒子
  for (const bp of state.batParticles) {
    ctx.save();
    ctx.globalAlpha = bp.alpha * 0.85;
    ctx.font = `${bp.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🦇', bp.x, bp.y);
    ctx.restore();
  }

  // 無名槍手：閃光暈眩光暈 & 彈藥顯示
  for (const b of state.balls) {
    if (b.char.type !== 'gunner') continue;
    // 暈眩白光
    if (b.gunnerStunTimer > 0) {
      const sa = 0.25 + 0.15 * Math.sin(elapsed * 20);
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,180,${sa})`;
      ctx.fill(); ctx.restore();
    }
    // 彈藥格子
    const ammo = b.gunnerFiring ? 0 : b.gunnerAmmo;
    const slotW = (RADIUS * 2) / GUNNER_MAG_SIZE; // 自動等分，調彈數不會跑版
    for (let i = 0; i < GUNNER_MAG_SIZE; i++) {
      const bx = b.x - RADIUS + i * slotW + slotW * 0.1;
      const by = b.y + RADIUS + 8;
      ctx.beginPath(); ctx.rect(bx, by - 3, slotW * 0.8, 7);
      ctx.fillStyle = i < ammo ? b.char.color : 'rgba(255,255,255,0.2)';
      ctx.fill();
    }
  }

  // 魔術師：技巧蓄好時發光環
  for (const b of state.balls) {
    if (b.char.type !== 'mage' || !b.mageTrickReady) continue;
    ctx.save();
    const pulse = 0.5 + 0.4 * Math.abs(Math.sin(elapsed * 8));
    const trickColors = { 1:'#2ecc71', 2:'#bf00ff', 3:'#e74c3c', 4:'#00cfff' };
    const col = trickColors[b.mageTrickType] || '#f0c84a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, RADIUS + 7, 0, Math.PI * 2);
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = col;
    ctx.globalAlpha = pulse;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = col;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // ── 釣魚佬：大海全場藍色覆蓋（在角色與投射物之前，作為背景色調）──
  for (const b of state.balls) {
    if (b.char.type !== 'fisherman' || !b.fisherOceanPhase) continue;
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.06 * Math.sin(elapsed * 6);
    ctx.fillStyle = '#1a5fb4';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // 釣魚佬：海浪
  for (const wv of state.fisherOceanWaves) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    const wg = ctx.createLinearGradient(wv.x - FISHER_OCEAN_WAVE_WIDTH/2, 0, wv.x + FISHER_OCEAN_WAVE_WIDTH/2, 0);
    wg.addColorStop(0, 'rgba(120,200,255,0)');
    wg.addColorStop(0.5, 'rgba(160,220,255,0.9)');
    wg.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(wv.x - FISHER_OCEAN_WAVE_WIDTH/2, 0, FISHER_OCEAN_WAVE_WIDTH, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let yy = 0; yy <= canvas.height; yy += 14) {
      const xx = wv.x + Math.sin(yy * 0.08 + elapsed * 10) * 6;
      if (yy === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 釣魚佬：魚鉤（拋竿／收線階段）
  for (const b of state.balls) {
    if (b.char.type !== 'fisherman') continue;
    if (b.fisherPhase === 'casting' || b.fisherPhase === 'waiting' || b.fisherPhase === 'reeling') {
      ctx.save();
      ctx.strokeStyle = 'rgba(220,230,240,0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.fisherHookX, b.fisherHookY);
      ctx.stroke();
      ctx.font = '20px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🪝', b.fisherHookX, b.fisherHookY);
      if (b.fisherPhase === 'waiting') {
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#ffe066';
        ctx.fillText('！', b.fisherHookX, b.fisherHookY - 20);
      }
      ctx.restore();
    }
    // 大海：坐船勾甩視覺（船隨衝刺/勾住/揮甩階段顯示在自己位置）
    if (b.fisherOceanPhase === 'dash' || b.fisherOceanPhase === 'grab' || b.fisherOceanPhase === 'slam') {
      ctx.save();
      ctx.font = '26px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🚤', b.x, b.y);
      ctx.restore();
    }
  }

  // 釣魚佬：結果飄字
  for (const fx of state.fisherResultFX) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, fx.life / fx.maxLife));
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#4a90d9'; ctx.shadowBlur = 10;
    ctx.fillText(fx.text, fx.x, fx.y);
    ctx.restore();
  }

  // Oblivionis：殘月的餘韻──雙音色齊發不死光環
  for (const b of state.balls) {
    if (b.char.type !== 'sakiko' || !b.sakikoDualActive) continue;
    ctx.save();
    const pulse = 0.55 + 0.35 * Math.sin(elapsed * 10);
    ctx.strokeStyle = `rgba(255,215,107,${pulse})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffd76b';
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Oblivionis：頌樂音符
  for (const b of state.balls) {
    if (b.char.type !== 'sakiko' || !b.sakikoNotes) continue;
    for (const n of b.sakikoNotes) {
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(Math.atan2(n.vy, n.vx));
      ctx.shadowColor = n.color;
      ctx.shadowBlur = n.isNova ? 20 : 12;
      ctx.globalAlpha = n.isNova ? 1 : 0.9;
      ctx.beginPath();
      ctx.arc(0, 0, n.r, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, n.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, n.color);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.rotate(-Math.atan2(n.vy, n.vx));
      ctx.font = `${n.r + 5}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2a1f33';
      ctx.fillText(n.tone === 'piano' ? '♪' : '♫', 0, 0);
      ctx.restore();
    }
  }

  // 夏油條：小型咒靈
  for (const s of state.getoSpirits) {
    ctx.save();
    ctx.translate(s.x, s.y);
    const hpRatio = s.hp / s.maxHp;
    const flash = s.spawnFlash > 0 ? s.spawnFlash * 2 : 0;
    ctx.shadowColor = '#5b3a8e';
    ctx.shadowBlur = 12 + flash * 20;
    ctx.globalAlpha = 0.55 + hpRatio * 0.45 + flash;
    ctx.beginPath();
    ctx.arc(0, 0, GETO_SPIRIT_RADIUS, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, GETO_SPIRIT_RADIUS);
    g.addColorStop(0, '#c9a6ff');
    g.addColorStop(1, '#5b3a8e');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#2e1c4a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('咒', 0, 1);
    ctx.restore();
  }

  // 夏油條：特級咒靈
  for (const b of state.balls) {
    if (b.char.type !== 'geto' || !b.getoSpecialActive) continue;
    ctx.save();
    ctx.translate(b.getoSpecialX, b.getoSpecialY);
    const hpRatio = Math.max(0, b.getoSpecialHp / GETO_SPECIAL_HP);
    ctx.shadowColor = '#8e6fd9';
    ctx.shadowBlur = 20 + (b.getoSurgeCharging ? 20 * Math.abs(Math.sin(elapsed * 10)) : 0);
    ctx.beginPath();
    ctx.arc(0, 0, GETO_SPECIAL_RADIUS, 0, Math.PI * 2);
    const g2 = ctx.createRadialGradient(0, 0, 2, 0, 0, GETO_SPECIAL_RADIUS);
    g2.addColorStop(0, '#e6d6ff');
    g2.addColorStop(0.6, '#7a4fbf');
    g2.addColorStop(1, '#3a2560');
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.strokeStyle = '#2e1c4a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('特', 0, 1);
    ctx.restore();
    // 特級咒靈血條
    ctx.save();
    const bw = 40;
    ctx.translate(b.getoSpecialX - bw / 2, b.getoSpecialY - GETO_SPECIAL_RADIUS - 12);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, bw, 5);
    ctx.fillStyle = '#a678e0';
    ctx.fillRect(0, 0, bw * hpRatio, 5);
    ctx.restore();
  }

  // 夏油條：糾纏枝條特效
  for (const fx of state.getoEntangleFX) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife) * 0.9;
    ctx.strokeStyle = '#6b8e3d';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#6b8e3d';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    const midx = (fx.fromX + fx.toX) / 2 + (fx.toY - fx.fromY) * 0.15;
    const midy = (fx.fromY + fx.toY) / 2 - (fx.toX - fx.fromX) * 0.15;
    ctx.moveTo(fx.fromX, fx.fromY);
    ctx.quadraticCurveTo(midx, midy, fx.toX, fx.toY);
    ctx.stroke();
    ctx.restore();
  }

  // 夏油條：糾纏枝條（長在中招者身上，隨受擊次數增生、DoT結束後凋零）
  for (const tb of state.balls) {
    if (!tb.getoBranches || !tb.getoBranches.length) continue;
    for (const br of tb.getoBranches) {
      const growRatio = Math.min(1, br.growTimer / GETO_ENTANGLE_BRANCH_GROW);
      const curLen = br.targetLen * growRatio;
      if (curLen < 1) continue;
      const fadeRatio = br.fadeTimer > 0 ? Math.max(0, 1 - br.fadeTimer / GETO_ENTANGLE_BRANCH_FADE) : 1;
      const sway = Math.sin(br.swayPhase + br.growTimer * 2.4) * 0.12;
      const ang = br.angle + sway;
      const baseX = tb.x + Math.cos(br.angle) * (RADIUS * 0.7);
      const baseY = tb.y + Math.sin(br.angle) * (RADIUS * 0.7);
      const tipX = baseX + Math.cos(ang) * curLen;
      const tipY = baseY + Math.sin(ang) * curLen;
      const midX = (baseX + tipX) / 2 + Math.cos(ang + Math.PI / 2) * curLen * 0.18;
      const midY = (baseY + tipY) / 2 + Math.sin(ang + Math.PI / 2) * curLen * 0.18;
      ctx.save();
      ctx.globalAlpha = 0.9 * fadeRatio;
      ctx.strokeStyle = '#5c7a34';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#6b8e3d';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(midX, midY, tipX, tipY);
      ctx.stroke();
      // 分岔小葉
      if (growRatio > 0.5) {
        const leafAng = ang + Math.PI / 2;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(midX, midY);
        ctx.lineTo(midX + Math.cos(leafAng) * curLen * 0.22, midY + Math.sin(leafAng) * curLen * 0.22);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 夏油條：定身特效
  for (const fx of state.getoBindFX) {
    ctx.save();
    const ratio = Math.max(0, fx.life / fx.maxLife);
    ctx.globalAlpha = 0.7 * ratio + 0.2;
    ctx.strokeStyle = '#8e6fd9';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#8e6fd9';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, 34 + (1 - ratio) * 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 夏油條：咒力奔流特效
  for (const fx of state.getoSurgeFX) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife);
    ctx.strokeStyle = '#c9a6ff';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#c9a6ff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(fx.fromX, fx.fromY);
    ctx.lineTo(fx.fromX + Math.cos(fx.angle) * GETO_SURGE_RANGE, fx.fromY + Math.sin(fx.angle) * GETO_SURGE_RANGE);
    ctx.stroke();
    ctx.restore();
  }

  // 夏油條：極之番•漩渦光球
  for (const p of state.getoUltimateProjectiles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(elapsed * 6);
    ctx.shadowColor = '#c9a6ff';
    ctx.shadowBlur = 26;
    const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, p.r);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.5, '#c9a6ff');
    gr.addColorStop(1, '#5b3a8e');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.rotate(Math.PI * 2 / 3);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.r - 6, k, k + 1.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 夏油條：咒靈/特級咒靈消散特效
  for (const fx of state.getoDeathFX) {
    ctx.save();
    const ratio = Math.max(0, fx.life / fx.maxLife);
    ctx.globalAlpha = ratio * 0.8;
    ctx.strokeStyle = '#c9a6ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.r + (1 - ratio) * 25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 夏油條：游雲甩棍揮擊動畫（棍子本體由後往前掃過）
  for (const fx of state.getoCaneFX) {
    const geto = state.balls.find(x => x.player === fx.owner);
    if (!geto) continue;
    const prog = 1 - Math.max(0, fx.life) / fx.maxLife; // 0→1 揮動進度
    const swing = (prog - 0.5) * 2.2; // 揮動幅度：從 -1.1rad 掃到 +1.1rad
    const curAngle = fx.angle + swing;
    ctx.save();
    ctx.translate(geto.x, geto.y);
    ctx.rotate(curAngle);
    ctx.globalAlpha = Math.max(0, 1 - prog) * 0.95;
    // 棍身
    ctx.strokeStyle = '#caa06b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#8e6fd9';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(RADIUS * 0.3, 0);
    ctx.lineTo(RADIUS + 30, 0);
    ctx.stroke();
    // 棍頭咒力光點
    ctx.beginPath();
    ctx.arc(RADIUS + 30, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c9a6ff';
    ctx.shadowBlur = 14;
    ctx.fill();
    // 揮動殘影弧線
    ctx.globalAlpha *= 0.5;
    ctx.strokeStyle = '#c9a6ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS + 26, -0.5, 0, false);
    ctx.stroke();
    ctx.restore();
  }

  // 大喬：波紋疾走/彈簧拳/SYO 出拳特效
  if (state.josephPunchFX) {
    for (const fx of state.josephPunchFX) {
      const prog = 1 - Math.max(0, fx.life) / fx.maxLife; // 0→1

      if (fx.style === 'dash') {
        // 普通拳擊（波紋疾走）：直拳貫穿，波紋沿手臂脈動traveling，拳頭衝擊
        const dashDist = fx.dist || (RADIUS + 30);
        const reach = Math.max(40, dashDist - RADIUS * 1.05);
        const extend = Math.min(1, prog / 0.55);
        const eased = 1 - Math.pow(1 - extend, 2);
        const curReach = reach * eased;

        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.angle);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, prog - 0.6) / 0.4);

        const grad = ctx.createLinearGradient(RADIUS * 0.3, 0, RADIUS * 0.3 + curReach, 0);
        grad.addColorStop(0, 'rgba(74,168,255,0.15)');
        grad.addColorStop(1, 'rgba(140,220,255,0.95)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(RADIUS * 0.3, 0);
        ctx.lineTo(RADIUS * 0.3 + curReach, 0);
        ctx.stroke();

        for (let k = 0; k < 2; k++) {
          const rp = eased - k * 0.28;
          if (rp > 0 && rp < 1) drawHamonRing(ctx, RADIUS * 0.3 + curReach * rp, 0, 5 + rp * 4, (1 - rp) * 0.8, '#bfe8ff', 2);
        }
        if (eased > 0.4) drawHamonFist(ctx, RADIUS * 0.3 + curReach, 0, 0, 15 * Math.min(1, (eased - 0.4) / 0.3), '#dff3ff');
        ctx.restore();

        if (prog > 0.55) {
          const ip = Math.min(1, (prog - 0.55) / 0.45);
          const tipX = fx.x + Math.cos(fx.angle) * (RADIUS * 0.3 + curReach);
          const tipY = fx.y + Math.sin(fx.angle) * (RADIUS * 0.3 + curReach);
          drawHamonRing(ctx, tipX, tipY, 8 + ip * 26, (1 - ip) * 0.9, '#4aa8ff', 3);
        }

      } else if (fx.style === 'spring') {
        // 彈簧拳：分段伸長 —— 彈簧狀手臂由捲曲逐段甩出並拉直，末端命中爆開波紋
        const dist = fx.dist || (RADIUS + 60);
        const reach = Math.max(50, dist - RADIUS * 1.15);
        const extend = Math.min(1, prog / 0.62);
        const eased = 1 - Math.pow(1 - extend, 3); // 甩出時加速
        const curReach = reach * eased;
        const coilAmp = 15 * (1 - eased) + 1.5; // 越伸展越平直，命中瞬間仍保留微震動
        const segs = 7;

        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.angle);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, prog - 0.78) / 0.22);

        ctx.strokeStyle = '#2f7dc0';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(RADIUS * 0.3, 0);
        const nodes = [];
        for (let i = 1; i <= segs; i++) {
          const t = i / segs;
          const px = RADIUS * 0.3 + curReach * t;
          const taper = 1 - t * 0.85; // 靠近拳頭處逐漸拉直，模擬彈簧鎖死伸展
          const py = (i % 2 === 0 ? 1 : -1) * coilAmp * taper;
          ctx.lineTo(px, py);
          nodes.push([px, py]);
        }
        ctx.stroke();
        ctx.fillStyle = '#8fd0ff';
        for (const [nx, ny] of nodes) { ctx.beginPath(); ctx.arc(nx, ny, 3, 0, Math.PI * 2); ctx.fill(); }
        if (eased > 0.15) drawHamonFist(ctx, RADIUS * 0.3 + curReach, 0, 0, 12 + 10 * Math.min(1, eased), '#eaf7ff');
        ctx.restore();

        if (prog > 0.6) {
          const ip = Math.min(1, (prog - 0.6) / 0.4);
          const tipX = fx.x + Math.cos(fx.angle) * (RADIUS * 0.3 + curReach);
          const tipY = fx.y + Math.sin(fx.angle) * (RADIUS * 0.3 + curReach);
          drawHamonRing(ctx, tipX, tipY, 10 + ip * 30, (1 - ip) * 0.9, '#2f7dc0', 4);
          drawHamonRing(ctx, tipX, tipY, 4 + ip * 18, (1 - ip) * 0.7, '#bfe8ff', 2);
        }

      } else if (fx.style === 'first' || fx.style === 'combo' || fx.style === 'final') {
        // SYO：連續痛擊拳頭群（第一拳／連擊快拳／終結拳）
        const isFinal = fx.style === 'final';
        const isFirst = fx.style === 'first';
        const tx = fx.tx != null ? fx.tx : fx.x;
        const ty = fx.ty != null ? fx.ty : fx.y;
        const angle = fx.angle != null ? fx.angle : Math.atan2(ty - fx.y, tx - fx.x);
        const dist = Math.max(20, Math.hypot(tx - fx.x, ty - fx.y));
        const sideOff = (fx.side || 0) * 8; // 連擊左右交錯微偏移，模擬快速連續出拳節奏

        const windup = Math.min(1, prog / (isFinal ? 0.3 : isFirst ? 0.4 : 0.55));
        const eased = 1 - Math.pow(1 - windup, 2);
        const curReach = dist * eased;

        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(angle);
        ctx.translate(0, sideOff);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, prog - 0.6) / 0.4);

        ctx.strokeStyle = isFinal ? '#ffcc00' : '#ffe066';
        ctx.lineWidth = isFinal ? 6 : 3;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#ffe066'; ctx.shadowBlur = isFinal ? 20 : 10;
        ctx.beginPath();
        ctx.moveTo(RADIUS * 0.25, 0);
        ctx.lineTo(RADIUS * 0.25 + curReach, 0);
        ctx.stroke();
        drawHamonFist(ctx, RADIUS * 0.25 + curReach, 0, 0, isFinal ? 22 : (isFirst ? 16 : 11), isFinal ? '#fff2c2' : '#ffedb0');
        ctx.restore();

        if (prog > (isFinal ? 0.25 : 0.5)) {
          const ip = Math.min(1, (prog - (isFinal ? 0.25 : 0.5)) / (isFinal ? 0.75 : 0.5));
          drawHamonRing(ctx, tx, ty, (isFinal ? 16 : 8) + ip * (isFinal ? 55 : 20), (1 - ip) * (isFinal ? 1 : 0.85), isFinal ? '#ffcc00' : '#ffe066', isFinal ? 5 : 3);
          if (isFinal) {
            // 終結拳：放射狀波紋刺爆開
            for (let s = 0; s < 8; s++) {
              const sa = (Math.PI * 2 / 8) * s;
              const sr = 16 + ip * 48;
              ctx.save();
              ctx.globalAlpha = (1 - ip) * 0.8;
              ctx.strokeStyle = '#ffe066';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(tx + Math.cos(sa) * sr * 0.4, ty + Math.sin(sa) * sr * 0.4);
              ctx.lineTo(tx + Math.cos(sa) * sr, ty + Math.sin(sa) * sr);
              ctx.stroke();
              ctx.restore();
            }
          }
        }
      } else {
        // 後備：舊版命中圈
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - prog);
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, 10 + prog * 22, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // 波紋層數：爆裂特效
  if (state.rippleStackFX) {
    for (const fx of state.rippleStackFX) {
      const prog = 1 - Math.max(0, fx.life) / fx.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - prog);
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, 14 + prog * 40, 0, Math.PI * 2);
      ctx.strokeStyle = '#66ccff';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
    }
  }

  // 夏油條：被定身角色的鎖鏈提示
  for (const b of state.balls) {
    if (!(b.getoBoundTimer > 0)) continue;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#8e6fd9';
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(b.x, b.y, RADIUS + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 大喬 SYO：被定身角色的波紋鎖定提示
  for (const b of state.balls) {
    if (!b.frozenByJoseph) continue;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 3;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(b.x, b.y, RADIUS + 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 暗夜領主：吸血特效
  for (const b of state.balls) {
    if (b.char.type !== 'vampire' || !b.vampireBiting) continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;

    const dx = b.x - enemy.x, dy = b.y - enemy.y;

    ctx.save();

    // 1. 粗血管（3層疊加，外暈+中層+芯）
    const layerWidths = [22, 12, 4];
    const layerAlphas = [0.2, 0.4, 1.0];
    const layerColors = ['rgba(180,0,0,', 'rgba(230,20,50,', 'rgba(255,90,90,'];
    for (let layer = 0; layer < 3; layer++) {
      const lg = ctx.createLinearGradient(enemy.x, enemy.y, b.x, b.y);
      lg.addColorStop(0,   layerColors[layer] + layerAlphas[layer] + ')');
      lg.addColorStop(0.7, layerColors[layer] + (layerAlphas[layer]*0.6) + ')');
      lg.addColorStop(1,   'rgba(100,0,60,0.05)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = layerWidths[layer];
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ff0022';
      ctx.shadowBlur = layer === 0 ? 35 : 8;
      ctx.beginPath();
      ctx.moveTo(enemy.x, enemy.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    // 2. 流動虛線（往吸血鬼方向衝）
    ctx.strokeStyle = 'rgba(255,180,180,1.0)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff6688';
    ctx.shadowBlur = 25;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -(elapsed * 150 % 18);
    ctx.beginPath();
    ctx.moveTo(enemy.x, enemy.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    // 3. 流動血球（12顆，沿血管飄向吸血鬼）
    for (let i = 0; i < 12; i++) {
      const phase = ((elapsed * 2.5 + i / 12) % 1);
      const px = enemy.x + dx * phase;
      const py = enemy.y + dy * phase;
      const size = 7 * Math.sin(phase * Math.PI) + 2;
      const rg = ctx.createRadialGradient(px, py, 0, px, py, size);
      rg.addColorStop(0, 'rgba(255,80,80,1)');
      rg.addColorStop(0.5, 'rgba(200,0,30,0.8)');
      rg.addColorStop(1, 'rgba(150,0,0,0)');
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fillStyle = rg;
      ctx.fill();
    }

    // 4. 敵人身上：大範圍紅暈 + 雙圈脈動
    const bp = 0.6 + 0.4 * Math.abs(Math.sin(elapsed * 16));
    const bg = ctx.createRadialGradient(enemy.x, enemy.y, RADIUS*0.3, enemy.x, enemy.y, RADIUS*3.5);
    bg.addColorStop(0, `rgba(200,0,0,${0.55 * bp})`);
    bg.addColorStop(0.5, `rgba(150,0,0,${0.25 * bp})`);
    bg.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, RADIUS*3.5, 0, Math.PI*2);
    ctx.fillStyle = bg; ctx.fill();
    // 內圈實線
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, RADIUS + 9, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,0,0,${bp})`;
    ctx.lineWidth = 5;
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 30;
    ctx.stroke();
    // 外圈擴散環
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, RADIUS + 9 + 14*(1-bp), 0, Math.PI*2);
    ctx.strokeStyle = `rgba(200,0,0,${0.5 * bp})`;
    ctx.lineWidth = 2.5; ctx.shadowBlur = 15; ctx.stroke();

    // 5. 吸血鬼身上：紫紅吸收光暈
    const ap = 0.5 + 0.5 * Math.abs(Math.sin(elapsed * 14));
    const ag = ctx.createRadialGradient(b.x, b.y, RADIUS*0.5, b.x, b.y, RADIUS*2.5);
    ag.addColorStop(0, `rgba(160,0,100,${0.6 * ap})`);
    ag.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS*2.5, 0, Math.PI*2);
    ctx.fillStyle = ag; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, RADIUS + 7 + 3*ap, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(220,0,100,${ap})`;
    ctx.lineWidth = 4; ctx.shadowColor = '#ff0066'; ctx.shadowBlur = 25;
    ctx.stroke();

    ctx.restore();
  }

  // 麻痺：角色球外的細鋸齒圈
  for (const b of state.balls) {
    if (!(b.thunderParalyzed > 0)) continue;
    ctx.save();
    ctx.strokeStyle = `rgba(241,196,15,${0.5 + 0.4 * Math.abs(Math.sin(elapsed * 12))})`;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#f1c40f';
    ctx.shadowBlur = 6;
    const R = RADIUS + 8;
    ctx.beginPath();
    for (let k = 0; k <= 20; k++) {
      const ang = (k / 20) * Math.PI * 2;
      const r = R + (k % 2 === 0 ? 4 : -4);
      const px = b.x + Math.cos(ang) * r;
      const py = b.y + Math.sin(ang) * r;
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  // 打斷定身瞬間：簡單黃色圈閃一下
  if (state.thunderStunFX) {
    for (const fx of state.thunderStunFX) {
      const prog = fx.life / fx.maxLife;
      ctx.save();
      ctx.globalAlpha = prog * 0.8;
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, RADIUS + 8 + (1 - prog) * 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 命中特效
  for (const f of state.hitFlashes) {
    const prog = f.t/(f.maxT || 0.35);
    const flashRadius = Math.max(0, f.r*(1+(1-prog)*0.5));
    ctx.beginPath(); ctx.arc(f.x,f.y,flashRadius,0,Math.PI*2);
    const alphaHex = Math.floor(f.alpha*prog*255).toString(16).padStart(2,'0');
    ctx.fillStyle = f.color+alphaHex; ctx.fill();
  }

  // 宇治波鼬：須佐能乎刺擊刀刃特效
  if (state.itachiStabFX) {
    for (const fx of state.itachiStabFX) {
      const prog = fx.life / fx.maxLife; // 1→0
      // 0→1 快速衝出，再慢慢淡出
      const punch = Math.min(1, (1 - prog) * 4); // 前1/4時間內衝到滿長
      const extend = punch * (RADIUS * 4.2);
      const alpha = prog;
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = alpha;

      // 衝擊波寬幅紅色閃光（沿刺擊方向的扇形）
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, extend + 20, -0.35, 0.35);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,0,0,${0.25*alpha})`;
      ctx.fill();

      // 刀刃主體（大幅加長加粗）
      ctx.beginPath();
      ctx.moveTo(RADIUS * 0.5, 0);
      ctx.lineTo(RADIUS * 0.5 + extend, -9);
      ctx.lineTo(RADIUS * 0.5 + extend + 26, 0);
      ctx.lineTo(RADIUS * 0.5 + extend, 9);
      ctx.closePath();
      ctx.fillStyle = '#f0f0f0';
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 28;
      ctx.fill();
      // 刀刃中線反光
      ctx.beginPath();
      ctx.moveTo(RADIUS * 0.5, 0);
      ctx.lineTo(RADIUS * 0.5 + extend + 18, 0);
      ctx.strokeStyle = 'rgba(255,255,255,1)';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 16;
      ctx.stroke();

      // 噴濺血線（多道，從刺中點往外炸開）
      for (let si = 0; si < 5; si++) {
        const sa = (si - 2) * 0.35;
        const slen = (extend + 26) + Math.random()*18;
        ctx.beginPath();
        ctx.moveTo(RADIUS * 0.5 + extend, 0);
        ctx.lineTo(
          RADIUS * 0.5 + extend + Math.cos(sa)*slen,
          Math.sin(sa)*slen
        );
        ctx.strokeStyle = `rgba(220,0,0,${0.8*alpha})`;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 0;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // 鍛造師：揮砍劍光特效（弧形掃砍，而非直線刺擊）
  if (state.smithSlashFX) {
    for (const fx of state.smithSlashFX) {
      const prog = fx.life / fx.maxLife; // 1→0
      const swingProg = Math.min(1, (1 - prog) * 2.2); // 揮砍進度 0→1（前半段時間掃完弧）
      const stackRatio2 = Math.min(1, (fx.stacks || 0) / SMITH_FORGE_MAX_STACKS);
      const reach = RADIUS * (2.6 + stackRatio2 * 2.0); // 揮砍距離（層數越高越遠）
      const halfArc = 0.95 + stackRatio2 * 0.35; // 揮砍張角（層數越高越寬）
      const alpha = prog;

      // 劍尖目前掃到的角度：從 -halfArc 掃到 +halfArc
      const sweepAngle = -halfArc + swingProg * (halfArc * 2);

      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = alpha;

      // 刀光殘影：已掃過的弧形範圍（從起始角到目前角）
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, reach, -halfArc, sweepAngle);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,${150+Math.floor(stackRatio2*70)},50,${0.28*alpha})`;
      ctx.fill();

      // 弧形邊緣亮線（劍刃掃過的軌跡線）
      ctx.beginPath();
      ctx.arc(0, 0, reach, -halfArc, sweepAngle);
      ctx.strokeStyle = `rgba(255,255,255,${0.85*alpha})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#cd7f32';
      ctx.shadowBlur = 16 + stackRatio2 * 14;
      ctx.stroke();

      // 內側次亮線，增加厚度感
      ctx.beginPath();
      ctx.arc(0, 0, reach * 0.82, -halfArc, sweepAngle);
      ctx.strokeStyle = `rgba(255,200,120,${0.5*alpha})`;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 6;
      ctx.stroke();

      // 劍身本體：畫在目前劍尖角度上的一段實體劍刃
      const bladeW = 6 + stackRatio2 * 4;
      ctx.save();
      ctx.rotate(sweepAngle);
      ctx.beginPath();
      ctx.moveTo(RADIUS * 0.4, -bladeW * 0.4);
      ctx.lineTo(reach, -bladeW);
      ctx.lineTo(reach + 16, 0);
      ctx.lineTo(reach, bladeW);
      ctx.lineTo(RADIUS * 0.4, bladeW * 0.4);
      ctx.closePath();
      ctx.fillStyle = '#e8c896';
      ctx.shadowColor = '#cd7f32'; ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();

      // 鍛造火花飛濺（從劍尖目前位置噴出）
      const tipX = Math.cos(sweepAngle) * reach;
      const tipY = Math.sin(sweepAngle) * reach;
      for (let si = 0; si < 4; si++) {
        const sa = sweepAngle + (si - 1.5) * 0.3;
        const slen = 14 + Math.random() * 16;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX + Math.cos(sa)*slen, tipY + Math.sin(sa)*slen);
        ctx.strokeStyle = `rgba(255,180,80,${0.7*alpha})`;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 0;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // 史蒂夫：斧揮砍弧形特效（綠色調斧刃掃砍，四階段雙金斧顯示雙刃）
  if (state.steveAxeFX) {
    for (const fx of state.steveAxeFX) {
      const prog = fx.life / fx.maxLife; // 1→0
      const swingProg = Math.min(1, (1 - prog) * 2.4);
      const reach = fx.reach;
      const halfArc = fx.dual ? 1.3 : 1.05;
      const alpha = prog;
      const sweepAngle = -halfArc + swingProg * (halfArc * 2);
      const axeColor = fx.dual ? '255,215,90' : '200,200,205';

      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, reach, -halfArc, sweepAngle);
      ctx.closePath();
      ctx.fillStyle = `rgba(${axeColor},${0.3*alpha})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, reach, -halfArc, sweepAngle);
      ctx.strokeStyle = `rgba(255,255,255,${0.85*alpha})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = fx.dual ? '#ffd700' : '#cccccc';
      ctx.shadowBlur = 14;
      ctx.stroke();

      // 斧刃本體
      ctx.save();
      ctx.rotate(sweepAngle);
      ctx.beginPath();
      ctx.moveTo(RADIUS * 0.4, -7);
      ctx.lineTo(reach * 0.85, -13);
      ctx.lineTo(reach, 0);
      ctx.lineTo(reach * 0.85, 13);
      ctx.lineTo(RADIUS * 0.4, 7);
      ctx.closePath();
      ctx.fillStyle = fx.dual ? '#ffe066' : '#d8d8dc';
      ctx.shadowColor = fx.dual ? '#ffd700' : '#999'; ctx.shadowBlur = 10;
      ctx.fill();
      if (fx.dual) {
        // 雙金斧：第二把斧刃鏡射位置
        ctx.beginPath();
        ctx.moveTo(RADIUS * 0.4, 10);
        ctx.lineTo(reach * 0.8, 18);
        ctx.lineTo(reach * 0.95, 6);
        ctx.lineTo(reach * 0.8, -3);
        ctx.lineTo(RADIUS * 0.4, 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // 乙骨憂太：咒力斬軌跡特效（比照鍛造師劍刃軌跡，但無蓄力疊層，固定距離與張角）
  if (state.yutaSlashFX) {
    for (const fx of state.yutaSlashFX) {
      const prog = fx.life / fx.maxLife; // 1→0
      const swingProg = Math.min(1, (1 - prog) * 2.2); // 揮砍進度 0→1
      const reach2 = RADIUS * 2.8;   // 固定揮砍距離（無蓄力疊層）
      const halfArc2 = 1.0;          // 固定揮砍張角
      const alpha2 = prog;

      const sweepAngle2 = -halfArc2 + swingProg * (halfArc2 * 2);

      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = alpha2;

      // 刀光殘影：已掃過的弧形範圍
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, reach2, -halfArc2, sweepAngle2);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,111,165,${0.28*alpha2})`;
      ctx.fill();

      // 弧形邊緣亮線
      ctx.beginPath();
      ctx.arc(0, 0, reach2, -halfArc2, sweepAngle2);
      ctx.strokeStyle = `rgba(255,255,255,${0.85*alpha2})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff6fa5';
      ctx.shadowBlur = 16;
      ctx.stroke();

      // 內側次亮線
      ctx.beginPath();
      ctx.arc(0, 0, reach2 * 0.82, -halfArc2, sweepAngle2);
      ctx.strokeStyle = `rgba(255,180,210,${0.5*alpha2})`;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 6;
      ctx.stroke();

      // 咒力本體：劍尖角度上的實體咒力刃
      const bladeW2 = 6;
      ctx.save();
      ctx.rotate(sweepAngle2);
      ctx.beginPath();
      ctx.moveTo(RADIUS * 0.4, -bladeW2 * 0.4);
      ctx.lineTo(reach2, -bladeW2);
      ctx.lineTo(reach2 + 16, 0);
      ctx.lineTo(reach2, bladeW2);
      ctx.lineTo(RADIUS * 0.4, bladeW2 * 0.4);
      ctx.closePath();
      ctx.fillStyle = '#ffe0ec';
      ctx.shadowColor = '#ff6fa5'; ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();

      // 咒力光點飛濺（取代鍛造火花，呼應咒術風格）
      const tipX2 = Math.cos(sweepAngle2) * reach2;
      const tipY2 = Math.sin(sweepAngle2) * reach2;
      for (let si = 0; si < 4; si++) {
        const sa2 = sweepAngle2 + (si - 1.5) * 0.3;
        const slen2 = 14 + Math.random() * 16;
        ctx.beginPath();
        ctx.moveTo(tipX2, tipY2);
        ctx.lineTo(tipX2 + Math.cos(sa2)*slen2, tipY2 + Math.sin(sa2)*slen2);
        ctx.strokeStyle = `rgba(255,160,200,${0.7*alpha2})`;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 0;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // 宇治波鼬：烏鴉替身飛散特效
  if (state.itachiCrowFX) {
    const fx = state.itachiCrowFX;
    const prog = fx.life / fx.maxLife;
    ctx.save();
    ctx.font = '20px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
