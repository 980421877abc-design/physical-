    fisherSchoolQueue: [],    // 釣魚佬：首領魚待發射的魚群佇列
    getoSpirits: [],          // 夏油條：場上小型咒靈列表
    getoEntangleFX: [],       // 夏油條：糾纏枝條特效列表
    getoBindFX: [],           // 夏油條：定身特效列表
    getoSurgeFX: [],          // 夏油條：咒力奔流特效列表
    getoUltimateProjectiles: [], // 夏油條：漩渦光球列表
    getoDeathFX: [],          // 夏油條：咒靈/特級咒靈消散特效列表
    getoCaneFX: [],           // 夏油條：游雲甩棍揮擊動畫列表
    josephChargeFX: [],       // 大喬：蓄力波紋呼吸法特效列表
    josephPunchFX: [],        // 大喬：波紋疾走/彈簧拳/SYO 出拳特效列表
    rippleStackFX: [],        // 波紋層數：爆裂特效列表
  };

  updateHUD();
  document.getElementById('p1-bar').style.background = `linear-gradient(90deg, ${ch1.color}aa, ${ch1.color})`;
  document.getElementById('p2-bar').style.background = `linear-gradient(90deg, ${ch2.color}aa, ${ch2.color})`;
  document.getElementById('p1-hud-name').innerHTML = `<span>${ch1.emoji}</span> ${ch1.displayName}`;
  document.getElementById('p2-hud-name').innerHTML = `${ch2.displayName} <span>${ch2.emoji}</span>`;

  if (gameLoop) cancelAnimationFrame(gameLoop);
  lastTime = performance.now();
  elapsed  = 0;
  gameLoop = requestAnimationFrame(tick);

}

function randBetween(min, max) { return min + Math.random() * (max - min); }

// Oblivionis：生成一顆追蹤音符（一般攻擊或新月甦醒共用）
function spawnSakikoNote(b, enemy, tone, overrides = {}) {
  const isPiano = tone === 'piano';
  const baseDamage = isPiano ? SAKIKO_PIANO_DAMAGE : SAKIKO_ORGAN_DAMAGE;
  const speed = overrides.speed != null ? overrides.speed : (isPiano ? SAKIKO_PIANO_SPEED : SAKIKO_ORGAN_SPEED);
  const spread = overrides.spread != null ? overrides.spread : 0.25;
  const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x) + randBetween(-spread, spread);
  b.sakikoNotes.push({
    x: b.x, y: b.y,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: SAKIKO_NOTE_RADIUS,
    damage: overrides.damage != null ? overrides.damage : baseDamage,
    tone,
    color: isPiano ? '#e8d9c0' : '#8e6fd9',
    life: SAKIKO_NOTE_LIFESPAN,
    active: true,
    isNova: !!overrides.isNova
  });
}

// 釣魚佬：依權重隨機決定釣魚結果
function fisherRollResult() {
  const w = FISHER_RESULT_WEIGHTS;
  const total = Object.values(w).reduce((a, c) => a + c, 0);
  let r = Math.random() * total;
  for (const k in w) {
    if (r < w[k]) return k;
    r -= w[k];
  }
  return 'fish';
}

// 釣魚佬：收線完成後，依結果觸發對應效果
function fisherResolveResult(b, enemy) {
  const labels = { fish: '🐟 魚…', shark: '🦈 鯊魚…', bossfish: '🐟🐟🐟 首領魚…', airforce: '✈️ 空軍…', ocean: '🌊 大海…' };
  state.fisherResultFX.push({ x: b.x, y: b.y - RADIUS - 16, text: labels[b.fisherResult] || '…', life: 1.3, maxLife: 1.3 });
  if (!enemy) return;
  switch (b.fisherResult) {
    case 'fish': {
      const ang = Math.atan2(enemy.y - b.y, enemy.x - b.x);
      state.projectiles.push({
        x: b.x, y: b.y, vx: Math.cos(ang) * FISHER_FISH_SPEED, vy: Math.sin(ang) * FISHER_FISH_SPEED,
        type: 'fisher_fish', owner: b.player, damage: FISHER_FISH_DMG, r: 10, active: true
      });
      break;
    }
    case 'shark': {
      const ang = Math.atan2(enemy.y - b.y, enemy.x - b.x);
      state.projectiles.push({
        x: b.x, y: b.y, vx: Math.cos(ang) * FISHER_SHARK_SPEED, vy: Math.sin(ang) * FISHER_SHARK_SPEED,
        type: 'fisher_shark', owner: b.player, damage: FISHER_SHARK_DMG, r: 14, active: true
      });
      break;
    }
    case 'bossfish': {
      for (let i = 0; i < FISHER_BOSSFISH_COUNT; i++) {
        state.fisherSchoolQueue.push({ owner: b.player, timer: i * FISHER_BOSSFISH_GAP });
      }
      break;
    }
    case 'airforce': {
      // 什麼都沒釣到，僅顯示飄字
      // 海灘場地：每次空軍，水裡多一個鯊魚鰭，集滿後清空並丟出鯊魚咬
      if (state.arena === 'beach') {
        if (!state.beachSharkFins) state.beachSharkFins = { 1: 0, 2: 0 };
        state.beachSharkFins[b.player] = (state.beachSharkFins[b.player] || 0) + 1;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 16, alpha: 0.7, color: '#888888', t: 0.3 });
        if (state.beachSharkFins[b.player] >= ARENA_BEACH_SHARKFIN_MAX) {
          state.beachSharkFins[b.player] = 0;
          const ang = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          state.projectiles.push({
            x: b.x, y: b.y, vx: Math.cos(ang) * ARENA_BEACH_SHARKBITE_SPD, vy: Math.sin(ang) * ARENA_BEACH_SHARKBITE_SPD,
            type: 'fisher_shark', owner: b.player, damage: ARENA_BEACH_SHARKBITE_DMG, r: 20, active: true
          });
          state.fisherResultFX.push({ x: b.x, y: b.y - RADIUS - 20, text: '🦈 鯊魚咬擊！', life: 1.3, maxLife: 1.3 });
          playHitSound('vampire_bite');
        }
      }
      break;
    }
    case 'ocean': {
      b.fisherOceanPhase = 'waves';
      b.fisherOceanTimer = 0;
      b.fisherOceanWaveIdx = 0;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#4a90d9', t: 0.5 });
      break;
    }
  }
}

// 海灘場地：生成一隻螃蟹
function beachSpawnCrab() {
  const ang = Math.random() * Math.PI * 2;
  return {
    x: randBetween(W * 0.55, W - WALL - ARENA_BEACH_CRAB_R),
    y: randBetween(WALL + ARENA_BEACH_CRAB_R, H - WALL - ARENA_BEACH_CRAB_R),
    vx: Math.cos(ang) * ARENA_BEACH_CRAB_SPEED, vy: Math.sin(ang) * ARENA_BEACH_CRAB_SPEED,
    dirTimer: randBetween(1.2, 2.6),
    hitCooldown: { 1: 0, 2: 0 }
  };
}

// 海灘場地：潮汐、暗流、螃蟹、海膽、寶箱、電化水域每幀更新
function updateBeachArena(dt) {
  if (!state.beachInit) {
    state.beachInit = true;
    state.beachBoundary = ARENA_BEACH_MID_X;
    state.beachPhase = 'start';   // start -> rising -> flooded -> falling -> low -> rising...
    state.beachPhaseTimer = ARENA_BEACH_START_HOLD;
    state.beachCurrents = [
      { x: WALL + 26, y: H * 0.26 },
      { x: WALL + 26, y: H * 0.74 }
    ];
    state.beachCrabs = Array.from({ length: ARENA_BEACH_CRAB_COUNT }, beachSpawnCrab);
    state.beachUrchins = [];
    state.beachChest = null;
    state.beachPuddles = [];
    state.beachUrchinTimer = ARENA_BEACH_URCHIN_SPAWN_GAP;
    state.beachChestTimer = ARENA_BEACH_CHEST_CHECK_GAP;
    state.beachElectrifyTimer = ARENA_BEACH_ELECTRIFY_TICK;
    state.beachSharkFins = { 1: 0, 2: 0 };
  }

  // ── 潮汐狀態機 ──
  state.beachPhaseTimer -= dt;
  switch (state.beachPhase) {
    case 'start':
      state.beachBoundary = ARENA_BEACH_MID_X;
      if (state.beachPhaseTimer <= 0) { state.beachPhase = 'rising'; state.beachPhaseTimer = ARENA_BEACH_RISE_TIME; }
      break;
    case 'rising': {
      const t = Math.min(1, 1 - Math.max(0, state.beachPhaseTimer) / ARENA_BEACH_RISE_TIME);
      state.beachBoundary = ARENA_BEACH_MID_X + (ARENA_BEACH_HIGH_X - ARENA_BEACH_MID_X) * t;
      if (state.beachPhaseTimer <= 0) {
        state.beachBoundary = ARENA_BEACH_HIGH_X;
        state.beachPhase = 'flooded'; state.beachPhaseTimer = ARENA_BEACH_FLOOD_HOLD;
      }
      break;
    }
    case 'flooded':
      state.beachBoundary = ARENA_BEACH_HIGH_X;
      if (state.beachPhaseTimer <= 0) { state.beachPhase = 'falling'; state.beachPhaseTimer = ARENA_BEACH_FALL_TIME; }
      break;
    case 'falling': {
      const t = Math.min(1, 1 - Math.max(0, state.beachPhaseTimer) / ARENA_BEACH_FALL_TIME);
      state.beachBoundary = ARENA_BEACH_HIGH_X - (ARENA_BEACH_HIGH_X - ARENA_BEACH_LOW_X) * t;
      if (state.beachPhaseTimer <= 0) {
        state.beachBoundary = ARENA_BEACH_LOW_X;
        // 退潮完成：原先淹沒處機率留下少量水漬
        state.beachPuddles = [];
        for (let i = 0; i < 8; i++) {
          if (Math.random() < ARENA_BEACH_PUDDLE_CHANCE) {
            state.beachPuddles.push({
              x: randBetween(ARENA_BEACH_LOW_X + 20, W - WALL - 16),
              y: randBetween(WALL + 16, H - WALL - 16),
              r: randBetween(10, 22)
            });
          }
        }
        state.beachPhase = 'low'; state.beachPhaseTimer = ARENA_BEACH_LOW_HOLD;
      }
      break;
    }
    case 'low':
      state.beachBoundary = ARENA_BEACH_LOW_X;
      if (state.beachPhaseTimer <= 0) {
        state.beachPuddles = [];
        state.beachPhase = 'rising'; state.beachPhaseTimer = ARENA_BEACH_RISE_TIME;
      }
      break;
  }

  // ── 螃蟹 AI（於沙灘一帶隨機遊走）──
  for (const crab of state.beachCrabs) {
    crab.dirTimer -= dt;
    if (crab.dirTimer <= 0) {
      const ang = Math.random() * Math.PI * 2;
      crab.vx = Math.cos(ang) * ARENA_BEACH_CRAB_SPEED;
      crab.vy = Math.sin(ang) * ARENA_BEACH_CRAB_SPEED;
      crab.dirTimer = randBetween(1.2, 2.6);
    }
    crab.x += crab.vx * dt; crab.y += crab.vy * dt;
    const crabMinX = Math.max(WALL + ARENA_BEACH_CRAB_R, state.beachBoundary - 40);
    if (crab.x < crabMinX) { crab.x = crabMinX; crab.vx = Math.abs(crab.vx); }
    if (crab.x > W - WALL - ARENA_BEACH_CRAB_R) { crab.x = W - WALL - ARENA_BEACH_CRAB_R; crab.vx = -Math.abs(crab.vx); }
    if (crab.y < WALL + ARENA_BEACH_CRAB_R) { crab.y = WALL + ARENA_BEACH_CRAB_R; crab.vy = Math.abs(crab.vy); }
    if (crab.y > H - WALL - ARENA_BEACH_CRAB_R) { crab.y = H - WALL - ARENA_BEACH_CRAB_R; crab.vy = -Math.abs(crab.vy); }
    if (crab.hitCooldown[1] > 0) crab.hitCooldown[1] -= dt;
    if (crab.hitCooldown[2] > 0) crab.hitCooldown[2] -= dt;
  }

  // ── 海膽生成 ──
  state.beachUrchinTimer -= dt;
  if (state.beachUrchinTimer <= 0) {
    state.beachUrchinTimer = ARENA_BEACH_URCHIN_SPAWN_GAP + randBetween(-1.5, 1.5);
    if (state.beachUrchins.length < ARENA_BEACH_URCHIN_MAX) {
      state.beachUrchins.push({
        x: randBetween(Math.max(state.beachBoundary + 10, ARENA_BEACH_LOW_X + 30), W - WALL - 20),
        y: randBetween(WALL + 20, H - WALL - 20)
      });
    }
  }

  // ── 寶箱生成（低機率）──
  state.beachChestTimer -= dt;
  if (state.beachChestTimer <= 0) {
    state.beachChestTimer = ARENA_BEACH_CHEST_CHECK_GAP;
    if (!state.beachChest && Math.random() < ARENA_BEACH_CHEST_CHANCE) {
      state.beachChest = {
        x: randBetween(WALL + 24, W - WALL - 24),
        y: randBetween(WALL + 24, H - WALL - 24)
      };
    }
  }

  // ── 雷電法王在水裡：電化水域，週期性電擊在水中的敵方 ──
  const thunderInWater = state.balls.some(b => b.char.type === 'thunder' && b.x < state.beachBoundary);
  state.beachElectrified = thunderInWater;
  if (thunderInWater) {
    state.beachElectrifyTimer -= dt;
    if (state.beachElectrifyTimer <= 0) {
      state.beachElectrifyTimer = ARENA_BEACH_ELECTRIFY_TICK;
      for (const b of state.balls) {
        if (b.char.type === 'thunder') continue; // 施法者自身免疫
        if (b.x < state.beachBoundary) {
          dealDamage(b, ARENA_BEACH_ELECTRIFY_DMG);
          state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1, color: '#fff066', t: 0.35 });
          playHitSound('trap_place');
        }
      }
    }
  } else {
    state.beachElectrifyTimer = ARENA_BEACH_ELECTRIFY_TICK;
  }
}

function dealDamage(target, dmg, options = {}) {
  // 無敵狀態（擊殺動畫播放中）不受傷
  if (target.invincible) return;
  // 帶土虛影/轉移階段：本體無敵（虛影取代本體承受攻擊，但不扣血）
  if (target.char && target.char.type === 'obito' &&
      ['ghost','teleporting','in_space','grabbing','returning'].includes(target.obitoKamuiPhase)) return;
  // 帶土虛化態：不受傷
  if (target.char && target.char.type === 'obito' && target.obitoPhasing) return;
  // 被帶土抓進神威空間的敵人：在空間裡免疫主場地攻擊
  if (target.obitoInSpace && !options.bypassParry) return;
  // 一拳超人必殺拳穿透招架減傷（bypassParry flag）
  const isParrying = target.char && target.char.type === 'samurai' && target.samuraiParrying;
  let mul = (isParrying && !options.bypassParry) ? SAMURAI_PARRY_DMG_REDUCE : 1;
  // bypassParry（目前僅一拳超人必殺拳）：穿透一切減傷效果，視為純粹的系統殺
  if (target.itachiSusanooActive && !options.bypassParry) mul *= (1 - ITACHI_SUSANOO_DMG_REDUCE);
  // 一拳超人：全局減傷（一拳超人自身的必殺拳不受此減免影響）
  const isOpmReduced = target.char && target.char.type === 'opm' && !options.bypassParry;
  if (isOpmReduced) mul *= (1 - OPM_DMG_REDUCE);
  // 工程師：機甲模式減傷
  if (target.char && target.char.type === 'engineer' && target.engMechActive && !options.bypassParry) mul *= (1 - ENGINEER_MECH_DMG_REDUCE);
  const prevHp = target.hp;
  let rawAmount = dmg * mul;
  // 夏油條被動「護身」：特級咒靈承擔夏油條所受30%傷害（直接分擔在特級咒靈血量上）
  // 注意：必須在「傷害封頂於目前血量」之前扣除護身部分，否則致命一擊永遠會被護身分走一小部分，
  // 導致 actual 永遠小於 target.hp，血量只會無限趨近於 0 卻永遠扣不完（卡血無法擊敗的bug）。
  if (target.char && target.char.type === 'geto' && target.getoSpecialActive && !options.bypassParry) {
    const shieldRatio = GETO_SPECIAL_SHIELD_RATIO * (target.getoSurgeCharging ? GETO_SURGE_VULN_MULT : 1);
    const shielded = Math.min(target.getoSpecialHp, rawAmount * shieldRatio);
    if (shielded > 0) {
      target.getoSpecialHp -= shielded;
      rawAmount -= shielded;
      if (state) state.hitFlashes.push({ x: target.x, y: target.y, r: 16, alpha: 0.6, color: '#5b3a8e', t: 0.25 });
      if (target.getoSpecialHp <= 0) {
        target.getoSpecialHp = 0;
        target.getoSpecialActive = false;
        if (state) {
          state.getoDeathFX.push({ x: target.x, y: target.y, life: 0.6, maxLife: 0.6, r: GETO_SPECIAL_RADIUS });
          playHitSound('opm');
        }
      }
    }
  }
  let actual = Math.min(target.hp, rawAmount);
  // 系統殺：若原始傷害本應致命，一拳超人的減傷不應讓他逃過一死
  if (isOpmReduced && dmg >= prevHp) {
    actual = prevHp;
  }
  // bypassParry：必殺拳直接清空血量，標記系統殺，無視復活/替身類效果
  if (options.bypassParry) {
    actual = prevHp;
    target.opmExecuted = true;
  }
  // 虎天帝被動一：部分傷害轉為流血（只有虎天帝自身具有流血值；不是bypassParry時才觸發，穿血自傷也觸發）
  if (!options.bypassParry && !options.noBleed && target.char && target.char.type === 'tiger') {
    const bleedAmt = actual * TIGER_BLEED_RATIO;
    if (bleedAmt > 0) {
      target.tigerBleedPool = Math.min((target.tigerBleedPool || 0) + bleedAmt, TIGER_BLEED_MAX_POOL);
      actual -= bleedAmt; // 這部分傷害先不立即扣，改為流血慢扣
    }
  }
  // Oblivionis「殘月的餘韻」：Fever全滿期間，血量歸零也不會立即倒下，改記錄真實血量（可低於0），效果結束後才正式結算生死
  if (target.char && target.char.type === 'sakiko' && target.sakikoDualActive) {
    if (target.sakikoShadowHp == null) target.sakikoShadowHp = target.hp;
    target.sakikoShadowHp -= actual;
    target.hp = Math.max(1, target.hp - actual);
  } else {
    target.hp = Math.max(0, target.hp - actual);
  }
  // 記錄傷害到對方玩家的 stats（攻擊者 = 對方）
  if (state && state.stats && target.player) {
    const attackerPlayer = target.player === 1 ? 2 : 1;
    state.stats[attackerPlayer].totalDmg += actual;
    if (actual > state.stats[attackerPlayer].maxHit) state.stats[attackerPlayer].maxHit = actual;
  }
}

// ── 多人混戰（FFA）目標選擇工具函式 ──
// 目前所有角色技能仍大量使用 state.balls.find(x => x.player !== b.player) 這種
// 「場上只有我跟一個對手」的寫法。在只有兩人對戰時，下面幾個函式的結果跟舊寫法完全一樣，
// 之後要把某個角色技能改成「打最近的敵人」時，把舊寫法換成 getNearestEnemy(b) 即可，
// 不需要一次全部替換、也不會影響尚未替換角色的現有平衡。
function getAliveBalls() {
  return state.balls.filter(b => b.hp > 0);
}
// 回傳跟 b 不同玩家、且還活著的所有球（多人混戰時可能不只一個）
function getEnemies(b) {
  return state.balls.filter(x => x !== b && x.player !== b.player && x.hp > 0);
}
// 從場上找出離 (x,y) 最近、且玩家編號不是 excludePlayer、還活著的球
function getNearestEnemyTo(x, y, excludePlayer) {
  let best = null, bestD = Infinity;
  for (const cand of state.balls) {
    if (cand.player === excludePlayer || cand.hp <= 0) continue;
    const d = (cand.x - x) * (cand.x - x) + (cand.y - y) * (cand.y - y);
    if (d < bestD) { bestD = d; best = cand; }
  }
  return best;
}
// 找出離 b 最近的存活敵人（兩人對戰時等同原本的 find(x => x.player !== b.player)）
function getNearestEnemy(b) {
  return getNearestEnemyTo(b.x, b.y, b.player);
}

function tick(now) {
  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const dt = rawDt * gameSpeed;
  elapsed += dt;
  state.elapsed = elapsed;
  if (state.stats) state.stats.duration = elapsed;
  update(dt);

  // 一拳超人特效更新（獨立於 update() 之外，比賽結束凍結邏輯後仍需讓特效播完，避免卡死在出拳畫面）
  for (let i = state.opmFX.length - 1; i >= 0; i--) {
    const f = state.opmFX[i];
    f.life -= dt;
    if (f.life <= 0) { state.opmFX.splice(i, 1); continue; }
    if (f.type === 'spark') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= 0.88; f.vy *= 0.88;
      f.vy += (f.gravity || 0) * dt;
    }
    if (f.type === 'ring') {
      f.r += (f.maxR - f.r) * dt * 6;
    }
  }

  // 詛咒橫切特效更新
  if (state.curseSliceKillFX) {
    const fx = state.curseSliceKillFX;
    const dt2 = Math.min((now - lastTime) / 1000, 0.05); // dt already computed above
    fx.life -= dt;
    const prog = 1 - fx.life / fx.maxLife;
    // 上半段
    fx.topOffY += fx.topVY * dt;
    fx.topOffX += fx.topVX * dt;
    fx.topRot  += fx.topRotV * dt;
    // 上半段加速往下掉（重力）
    fx.topVY   += 120 * dt;
    // 下半段
    fx.botOffY += fx.botVY * dt;
    fx.botOffX += fx.botVX * dt;
    fx.botRot  += fx.botRotV * dt;
    fx.botVY   += 100 * dt;
    // 粒子
    for (const p of fx.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
    }
    fx.slashAlpha = Math.max(0, 1 - prog * 2.5);
    fx.flashAlpha = Math.max(0, 1 - prog * 6);
    if (fx.life <= 0) {
      state.curseSliceKillFX = null;
      cancelAnimationFrame(gameLoop);
      gameLoop = null;
      const dead2 = state.balls.filter(b => b.hp <= 0);
      setTimeout(() => showResult(dead2), 100);
      return;
    }
  }

  // 無量空處特效更新（在 update 之外，避免被 early return 跳過）
  if (state.gojoKillFX) {
    const fx = state.gojoKillFX;
    fx.life -= dt;
    for (const l of fx.lines) l.dist += l.speed * dt;
    if (fx.life <= 0) {
      state.gojoKillFX = null;
      cancelAnimationFrame(gameLoop);
      gameLoop = null;
      const dead = state.balls.filter(b => b.hp <= 0);
      setTimeout(() => showResult(dead), 100);
      return;
    }
  }

  // 砲爹 vs 乙骨 決鬥終結特效更新（在 update 之外，避免被 early return 跳過）
  if (state.cannonDuelFX) {
    const fx = state.cannonDuelFX;
    fx.timer -= dt;
    if (fx.phase === 'charge') {
      if (fx.timer <= 0) {
        fx.phase = 'beam';
        fx.timer = CANNON_DUEL_BEAM_TIME;
        fx.angleA = Math.atan2(fx.c.y - fx.a.y, fx.c.x - fx.a.x);
        fx.angleC = Math.atan2(fx.a.y - fx.c.y, fx.a.x - fx.c.x);
        fx.midX = (fx.a.x + fx.c.x) / 2;
        fx.midY = (fx.a.y + fx.c.y) / 2;
        playHitSound('opm');
      }
    } else if (fx.phase === 'beam') {
      if (fx.timer <= 0) {
        fx.phase = 'explode';
        fx.timer = CANNON_DUEL_EXPLODE_TIME;
        fx.explodeR = 10;
        state.hitFlashes.push({ x: fx.midX, y: fx.midY, r: 90, alpha: 1, color: '#ffffff', t: 0.4 });
        playHitSound('vampire_dash');
      }
    } else if (fx.phase === 'explode') {
      const prog = 1 - Math.max(0, fx.timer) / CANNON_DUEL_EXPLODE_TIME;
      fx.explodeR = 10 + prog * 240;
      if (fx.timer <= 0) {
        // 結算勝負：血量較高的一方存活，相同則乙骨贏
        const a = fx.a, c = fx.c;
        const loser = a.hp === c.hp ? a : (a.hp > c.hp ? c : a);
        loser.hp = 0;
        for (const b of state.balls) b.invincible = false;
        state.cannonDuelFX = null;
        cancelAnimationFrame(gameLoop);
        gameLoop = null;
        const dead = state.balls.filter(b => b.hp <= 0);
        setTimeout(() => showResult(dead), 100);
        return;
      }
    }
  }

  render();
  updateHUD();
  const dead = state.balls.filter(b => b.hp <= 0);
  const aliveCount = state.balls.length - dead.length;
  if (dead.length > 0 && aliveCount > 1) {
    // 多人混戰：場上還有兩人以上存活，這次死亡只是淘汰，比賽繼續進行
    // （已淘汰的球維持 hp<=0，getEnemies()/getNearestEnemy() 會自動略過它，不會再被當成目標）
    for (const b of dead) { b.vx = 0; b.vy = 0; }
    gameLoop = requestAnimationFrame(tick);
    return;
  }
  if (dead.length > 0) {
    // 詛咒之王擊殺任意對手：觸發橫切動畫
    if (!state.curseSliceKillFX && !state.gojoKillFX) {
      const cursedKiller = state.balls.find(b => b.hp > 0 && b.char.type === 'cursed');
      const anyDead = dead.find(b => b.char.type !== 'cursed');
      if (cursedKiller && anyDead) {
        state.curseSliceKillFX = {
          life: 2.2, maxLife: 2.2,
          targetX: anyDead.x, targetY: anyDead.y,
          targetPlayer: anyDead.player,
          // 上半部往左上飄
          topOffY: 0, topVY: -80,
          topOffX: 0, topVX: -30,
          topRot: 0, topRotV: -1.8,
          // 下半部往右下掉
          botOffY: 0, botVY: 90,
          botOffX: 0, botVX: 20,
          botRot: 0, botRotV: 1.2,
          // 斬線特效
          slashAlpha: 1.0,
          flashAlpha: 1.0,
          color: anyDead.char.color,
          // 血腥粒子
          particles: Array.from({length: 22}, () => {
            const ang = Math.random() * Math.PI * 2;
            const spd = 60 + Math.random() * 180;
            return { x: anyDead.x, y: anyDead.y,
              vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
              life: 0.4 + Math.random()*0.6, maxLife: 0.6+Math.random()*0.5,
              r: 2 + Math.random()*3 };
          })
        };
        for (const b of state.balls) { b.vx = 0; b.vy = 0; b.invincible = true; b.attackTimer = 0; }
        anyDead.vx = 0; anyDead.vy = 0;
        gameLoop = requestAnimationFrame(tick);
        return;
      }
    }
    // 詛咒橫切動畫播放中
    if (state.curseSliceKillFX) {
      gameLoop = requestAnimationFrame(tick);
      return;
    }

    // Gojo 擊殺：觸發無量空處
    if (!state.gojoKillFX) {
      const killer = state.balls.find(b => b.hp > 0 && b.char.type === 'gojo');
      if (killer) {
        const lines = [];
        for (let i = 0; i < 80; i++) {
          const angle = Math.random() * Math.PI * 2;
          lines.push({
            angle, dist: 20 + Math.random() * 60,
            speed: 180 + Math.random() * 400,
            len: 30 + Math.random() * 120,
            alpha: 0.4 + Math.random() * 0.6,
            width: 0.5 + Math.random() * 1.5
          });
        }
        state.gojoKillFX = { life: 3.2, maxLife: 3.2, lines };
        // 凍結所有球：停止移動、無敵、停止攻擊
        for (const b of state.balls) {
          b.vx = 0; b.vy = 0;
          b.invincible = true;
          b.attackTimer = 0;
        }
      }
    }
    // 若有特效還在播就繼續跑
    if (state.opmFX.length > 0 || state.gojoKillFX) {
      gameLoop = requestAnimationFrame(tick);
      return;
    }
    cancelAnimationFrame(gameLoop);
    gameLoop = null;
    setTimeout(() => showResult(dead), 300);
    return;
  }
  gameLoop = requestAnimationFrame(tick);
}

function update(dt) {
  const [b0, b1] = state.balls; // Note: used only for ball-ball collision of opposing first balls

  // 無量空處播放中：只更新特效，跳過所有遊戲邏輯
  if (state.gojoKillFX) return;

  // 詛咒橫切動畫播放中：跳過所有遊戲邏輯
  if (state.curseSliceKillFX) return;

  // 砲爹 vs 乙骨 決鬥終結特效播放中：跳過所有遊戲邏輯（特效本身於 tick() 中推進）
  if (state.cannonDuelFX) return;

  // 已有一方倒下（比賽已結束，僅播放收尾特效）：凍結所有戰鬥邏輯，避免分出勝負後雙方仍持續互動造成誤判（例如一拳超人出拳擊殺瞬間，特效播放期間吸血鬼仍咬擊導致反輸）
  if (state.matchEnded) return;
  {
    const aliveNow = state.balls.filter(b => b.hp > 0);
    if (aliveNow.length <= 1) {
      state.matchEnded = true;
      for (const b of state.balls) { b.vx = 0; b.vy = 0; }
      return;
    }
    // 多人混戰：把剛倒下的球速度歸零，但比賽繼續（不設 matchEnded）
    for (const b of state.balls) { if (b.hp <= 0) { b.vx = 0; b.vy = 0; } }
  }

  // 砲爹 vs 乙骨：雙方血量同時低於門檻時，觸發決鬥終結
  if (!state.cannonDuelTriggered) {
    const cd = state.balls.find(b => b.char.type === 'cannondad');
    const yt = state.balls.find(b => b.char.type === 'yuta');
    if (cd && yt && cd.hp <= CANNON_DUEL_HP_THRESHOLD && yt.hp <= CANNON_DUEL_HP_THRESHOLD) {
      state.cannonDuelTriggered = true;
      state.cannonDuelFX = { phase: 'charge', timer: CANNON_DUEL_CHARGE_TIME, a: cd, c: yt };
      for (const b of state.balls) { b.vx = 0; b.vy = 0; b.invincible = true; }
      state.hitFlashes.push({ x: cd.x, y: cd.y, r: 26, alpha: 1, color: '#ff8a3d', t: CANNON_DUEL_CHARGE_TIME });
      state.hitFlashes.push({ x: yt.x, y: yt.y, r: 26, alpha: 1, color: '#ff9fc6', t: CANNON_DUEL_CHARGE_TIME });
      return;
    }
  }

  // ── DIO 世界（時停）：凍結敵方狀態快照 ──
  let dioFreezeTarget = null;
  let dioFreezeSnapshot = null;
  const dioWorldCasterBall = state.balls.find(b => b.char.type === 'dio' && b.dioWorldActive);
  if (dioWorldCasterBall) {
    state.dioWorldGlobalActive = true;
    state.dioWorldCaster = dioWorldCasterBall;
    dioFreezeTarget = state.balls.find(b => b !== dioWorldCasterBall);
    if (dioFreezeTarget) dioFreezeSnapshot = { ...dioFreezeTarget };
  } else {
    state.dioWorldGlobalActive = false;
    state.dioWorldCaster = null;
  }

  // ── 場地效果 ──
  if (state.arena === 'lava') {
    for (const b of state.balls) {
      dealDamage(b, ARENA_LAVA_DMG_PER_SEC * dt);
    }
  }

  // 冰雪場：每隔 N 秒吹暴風雪，雙方各 50% 機率被凍結
  if (state.arena === 'snow') {
    state.arenaSnowTimer = (state.arenaSnowTimer == null ? ARENA_SNOW_INTERVAL : state.arenaSnowTimer) - dt;
    if (state.arenaSnowTimer <= 0) {
      state.arenaSnowTimer = ARENA_SNOW_INTERVAL;
      state.arenaBlizzardFX = { life: 1.4, maxLife: 1.4 };
      for (const b of state.balls) {
        if (Math.random() < ARENA_SNOW_FREEZE_CHANCE) {
          b.arenaFrozen = ARENA_SNOW_FREEZE_DURATION;
          b.vx = 0; b.vy = 0;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 28, alpha: 1, color: '#99ddff', t: 0.4 });
        }
      }
    }
  }
  // 凍結倒數
  if (state.arenaSnowFreezeTick == null) state.arenaSnowFreezeTick = true;
  for (const b of state.balls) {
    if (b.arenaFrozen > 0) {
      b.arenaFrozen -= dt;
      if (b.arenaFrozen < 0) b.arenaFrozen = 0;
      b.vx = 0; b.vy = 0;
    }
  }

  // 青草場：每隔 N 秒雙方回血
  if (state.arena === 'grass') {
    state.arenaGrassTimer = (state.arenaGrassTimer == null ? ARENA_GRASS_INTERVAL : state.arenaGrassTimer) - dt;
    if (state.arenaGrassTimer <= 0) {
      state.arenaGrassTimer = ARENA_GRASS_INTERVAL;
      for (const b of state.balls) {
        b.hp = Math.min(MAX_HP, b.hp + ARENA_GRASS_HEAL);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1, color: '#66ff88', t: 0.5 });
      }
    }
  }

  // 流沙場：不定時生成流沙圈，圈內角色被緩速
  if (state.arena === 'sand') {
    if (!state.arenaSandZones) state.arenaSandZones = [];
    state.arenaSandTimer = (state.arenaSandTimer == null ? 2.0 : state.arenaSandTimer) - dt;
    if (state.arenaSandTimer <= 0) {
      state.arenaSandTimer = ARENA_SAND_SPAWN_INTERVAL + (Math.random() * 3 - 1.5);
      state.arenaSandZones.push({
        x: WALL + ARENA_SAND_RADIUS + Math.random() * (W - WALL*2 - ARENA_SAND_RADIUS*2),
        y: WALL + ARENA_SAND_RADIUS + Math.random() * (H - WALL*2 - ARENA_SAND_RADIUS*2),
        life: ARENA_SAND_DURATION, maxLife: ARENA_SAND_DURATION
      });
    }
    for (let si = state.arenaSandZones.length - 1; si >= 0; si--) {
      const z = state.arenaSandZones[si];
      z.life -= dt;
      if (z.life <= 0) { state.arenaSandZones.splice(si, 1); continue; }
    }
    // 判斷角色是否在流沙圈內
    for (const b of state.balls) {
      b.inSandZone = state.arenaSandZones.some(z => Math.hypot(b.x - z.x, b.y - z.y) < z.radius || Math.hypot(b.x - z.x, b.y - z.y) < ARENA_SAND_RADIUS);
    }
  } else {
    for (const b of state.balls) b.inSandZone = false;
  }

  // 海灘場地：潮汐、暗流、螃蟹、海膽、寶箱、電化水域
  if (state.arena === 'beach') {
    updateBeachArena(dt);
  }

  // ── 蝙蝠粒子更新 ──
  for (let i = state.batParticles.length - 1; i >= 0; i--) {
    const bp = state.batParticles[i];
    bp.x += bp.vx * dt;
    bp.y += bp.vy * dt;
    bp.life -= dt;
    bp.alpha = bp.life / bp.maxLife;
    if (bp.life <= 0) state.batParticles.splice(i, 1);
  }

  for (const b of state.balls) {
    // 被帶土抓進神威空間：完全時停（不能攻擊、冷卻不流動、不移動、不受牆壁判定）
    if (b.obitoInSpace) continue;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 18) b.trail.shift();

    // 酒鬼方向改變
    if (b.char.type === 'drunk' && b.drunkTimer !== null) {
      b.drunkTimer -= dt;
      if (b.drunkTimer <= 0) {
        const newAngle = Math.random() * Math.PI * 2;
        b.vx = Math.cos(newAngle) * BASE_SPEED;
        b.vy = Math.sin(newAngle) * BASE_SPEED;
        b.drunkTimer = randBetween(DRUNK_DIR_CHANGE_MIN, DRUNK_DIR_CHANGE_MAX);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 0.5, color: b.char.color, t: 0.3 });
      }
    }

    // 隨機加速（非凍結且非咬擊中，且不在神威空間中）
    if (!b.frozenByVampire && !b.obitoInSpace) {
      b.boostTimer -= dt;
      if (b.boostTimer <= 0) {
        let bvx = randBetween(-BOOST_MAGNITUDE, BOOST_MAGNITUDE);
        let bvy = randBetween(-BOOST_MAGNITUDE, BOOST_MAGNITUDE);
        // 確保合力不低於最低值
        const bmag = Math.hypot(bvx, bvy);
        if (bmag < BOOST_MIN_MAGNITUDE) {
          const scale = BOOST_MIN_MAGNITUDE / (bmag || 1);
          bvx *= scale; bvy *= scale;
        }
        b.vx += bvx;
        b.vy += bvy;
        b.boostTimer = randBetween(BOOST_INTERVAL_MIN, BOOST_INTERVAL_MAX);
      }
    }

    // 暗夜領主：衝刺計時
    if (b.char.type === 'vampire') {
      // 咬擊後冷卻倒數
      if (b.vampireBiteCooldown > 0) {
        b.vampireBiteCooldown -= dt;
        if (b.vampireBiteCooldown < 0) b.vampireBiteCooldown = 0;
      }
      // 蝙蝠狂襲冷卻倒數
      if (!b.vampireDashing) {
        b.vampireDashTimer -= dt;
      }

      // 衝刺中：持續追蹤敵人方向
      if (b.vampireDashing) {
        b.vampireDashElapsed += dt;
        const enemy = state.balls.find(x => x.player !== b.player);
        if (enemy) {
          const ddx = enemy.x - b.x, ddy = enemy.y - b.y;
          const dd = Math.sqrt(ddx*ddx + ddy*ddy);
          if (dd > 0) {
            b.vx = (ddx/dd) * VAMPIRE_DASH_SPEED;
            b.vy = (ddy/dd) * VAMPIRE_DASH_SPEED;
          }
        }
        // 產生蝙蝠粒子
        if (Math.random() < 0.6) {
          spawnBatParticles(b.x, b.y, b.char.color, 1);
        }
        // 衝刺超時停止
        if (b.vampireDashElapsed >= VAMPIRE_DASH_DURATION) {
          b.vampireDashing = false;
          b.vampireDashElapsed = 0;
          // 恢復正常速度
          const spd = BASE_SPEED;
          const ang = Math.random() * Math.PI * 2;
          b.vx = Math.cos(ang) * spd;
          b.vy = Math.sin(ang) * spd;
        }
      }

      // 觸發衝刺
      if (!b.vampireDashing && !b.vampireBiting && b.vampireDashTimer <= 0) {
        b.vampireDashing = true;
        b.vampireDashElapsed = 0;
        b.vampireDashTimer = VAMPIRE_DASH_INTERVAL;
        playHitSound('vampire_dash');
        // 生成大量蝙蝠粒子
        spawnBatParticles(b.x, b.y, b.char.color, 8);
      }
    }

    // 暗夜領主：咬擊序列處理
    if (b.char.type === 'vampire' && b.vampireBiting) {
      b.vampireBiteTimer -= dt;
      if (b.vampireBiteTimer <= 0 && b.vampireBiteStep < VAMPIRE_BITE_COUNT) {
        // 執行本次咬擊
        const enemy = state.balls.find(x => x.player !== b.player);
        if (enemy) {
          dealDamage(enemy, VAMPIRE_BITE_DAMAGE);
          b.hp = Math.min(MAX_HP, b.hp + VAMPIRE_BITE_HEAL);
          // 傷害特效
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30, alpha: 1.0, color: '#ff0055', t: 0.3 });
          // 回血特效（在吸血鬼位置）
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#aa00ff', t: 0.25 });
          playHitSound('vampire_bite');
          spawnBatParticles(enemy.x, enemy.y, b.char.color, 3);
        }
        b.vampireBiteStep++;
        b.vampireBiteTimer = VAMPIRE_BITE_INTERVAL;

        // 三次咬擊完成
        if (b.vampireBiteStep >= VAMPIRE_BITE_COUNT) {
          b.vampireBiting = false;
          b.vampireBiteStep = 0;
          b.vampireBiteTimer = 0;
          b.vampireBiteCooldown = 1.0;  // 1.0秒冷卻，讓雙方有時間分開再說
          // 解凍敵人
          if (enemy) {
            enemy.frozenByVampire = false;
            enemy.frozenTimer = 0;
          }
          // 咬擊完成後以全速彈開（遠離敵人）
          if (enemy) {
            const ex2 = b.x - enemy.x, ey2 = b.y - enemy.y;
            const ed = Math.sqrt(ex2*ex2 + ey2*ey2) || 1;
            b.vx = (ex2/ed) * BASE_SPEED * 2.5;
            b.vy = (ey2/ed) * BASE_SPEED * 2.5;
          } else {
            const ang = Math.random() * Math.PI * 2;
            b.vx = Math.cos(ang) * BASE_SPEED;
            b.vy = Math.sin(ang) * BASE_SPEED;
          }
        }
      }
    }

    // 被凍結計時器更新（保險用）
    if (b.frozenByVampire) {
      b.frozenTimer -= dt;
      if (b.frozenTimer <= 0) {
        b.frozenByVampire = false;
      }
    }
    if (b.frozenByJoseph) {
      b.frozenByJosephTimer -= dt;
      if (b.frozenByJosephTimer <= 0) {
        b.frozenByJoseph = false;
        b.frozenByJosephTimer = 0;
      }
    }

    // 波紋層數：每秒結算一次DOT，達到門檻則爆裂（任何角色都可能承受，大喬技能附加）
    if ((b.rippleStacks || 0) > 0 && !(state.dioWorldGlobalActive && b !== state.dioWorldCaster)) {
      b.rippleTickTimer = (b.rippleTickTimer || 0) + dt;
      if (b.rippleTickTimer >= RIPPLE_TICK_INTERVAL) {
        b.rippleTickTimer -= RIPPLE_TICK_INTERVAL;
        dealDamage(b, b.rippleStacks * RIPPLE_TICK_DMG_PER_STACK);
        if (Math.random() < 0.5) state.hitFlashes.push({ x: b.x+randBetween(-10,10), y: b.y+randBetween(-10,10), r: 10, alpha: 0.6, color: '#2f7dc0', t: 0.3 });
        if (b.rippleStacks >= RIPPLE_BURST_THRESHOLD) {
          b.rippleStacks -= RIPPLE_BURST_CONSUME;
          dealDamage(b, RIPPLE_BURST_DAMAGE);
          state.rippleStackFX.push({ x: b.x, y: b.y, life: 0.4, maxLife: 0.4 });
          state.hitFlashes.push({ x: b.x, y: b.y, r: 32, alpha: 1, color: '#66ccff', t: 0.4 });
          playHitSound('opm');
        }
      }
    }

    // 詛咒 dot 傷害（捌）
    if (b.curseDotTimer > 0) {
      b.curseDotTimer -= dt;
      dealDamage(b, b.curseDotDmg * dt);
      if (b.curseDotTimer <= 0) { b.curseDotTimer = 0; b.curseDotDmg = 0; }
      // 紅色詛咒粒子
      if (Math.random() < 0.3) state.hitFlashes.push({ x: b.x+randBetween(-15,15), y: b.y+randBetween(-15,15), r: 8, alpha: 0.7, color: '#c0392b', t: 0.4 });
    }

    // 釣魚佬「魚」紅溫延遲爆炸
    if (b.fisherRedTimer > 0) {
      b.fisherRedTimer -= dt;
