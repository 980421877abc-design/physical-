<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>競技場對決</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Oswald:wght@700&display=swap');

  :root {
    --bg: #0a0a0f;
    --arena-bg: #0d1117;
    --border: #c8a84b;
    --border-glow: #f0c84a;
    --chef-color: #e84545;
    --drunk-color: #7b4cca;
    --text: #e8dcc8;
    --ui-bg: rgba(15,12,8,0.92);
    --hp-bg: #1a1a2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'Noto Serif TC', serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,168,75,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(232,69,69,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(123,76,202,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    letter-spacing: 0.2em;
    color: var(--border-glow);
    text-shadow: 0 0 30px rgba(240,200,74,0.5);
    margin-bottom: 0.2em;
    text-align: center;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  #select-screen {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    gap: 0;
    z-index: 1;
  }

  .select-row {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
    width: 100%;
    max-width: 480px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .player-slot {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    min-width: 0;
  }

  .player-label {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    opacity: 0.6;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .vs-divider {
    font-family: 'Oswald', sans-serif;
    font-size: 1.6rem;
    color: var(--border);
    opacity: 0.45;
    align-self: center;
    padding-top: 2.5rem;
    flex-shrink: 0;
  }

  .carousel-wrap {
    width: 100%;
    position: relative;
    user-select: none;
    touch-action: none;
  }

  .carousel-viewport {
    overflow: hidden;
    width: 100%;
    border-radius: 6px;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }

  .char-card {
    flex: 0 0 100%;
    padding: 1rem;
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .char-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(200,168,75,0.07) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .char-card.selected::before { opacity: 1; }

  .char-card.selected.p1 {
    border-color: var(--chef-color);
    box-shadow: 0 0 16px rgba(232,69,69,0.4);
  }
  .char-card.selected.p2 {
    border-color: var(--drunk-color);
    box-shadow: 0 0 16px rgba(123,76,202,0.4);
  }

  .char-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.5rem;
  }

  .char-emoji { font-size: 1.8rem; }

  .char-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .char-desc {
    font-size: 0.68rem;
    opacity: 0.55;
    line-height: 1.6;
    margin-bottom: 0.5rem;
  }

  .char-stat {
    font-size: 0.65rem;
    opacity: 0.45;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .stat-badge {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 0.15em 0.45em;
    white-space: nowrap;
  }

  .carousel-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
  }

  .carousel-page-num {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    color: var(--border-glow);
    opacity: 0.75;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .carousel-arrows {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 0.4rem;
  }

  .arrow-btn {
    background: rgba(200,168,75,0.1);
    border: 1px solid rgba(200,168,75,0.2);
    color: var(--border);
    border-radius: 3px;
    width: 28px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.75rem;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .arrow-btn:hover { background: rgba(200,168,75,0.22); }

  .selected-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
    min-height: 1em;
    text-align: center;
    color: var(--border-glow);
  }

  .start-btn {
    margin-top: 0.5rem;
    padding: 0.9rem 3rem;
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: var(--bg);
    background: linear-gradient(135deg, #c8a84b, #f0c84a);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(240,200,74,0.3);
    position: relative;
    z-index: 1;
  }

  .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(240,200,74,0.5); }
  .start-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .arena-select {
    display: flex; gap: 12px; justify-content: center; margin: 16px 0 8px;
    flex-wrap: wrap;
  }
  .arena-btn {
    padding: 8px 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; letter-spacing: .05em;
  }
  .arena-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
  .arena-btn.active { border-color: #f0c84a; color: #f0c84a; background: rgba(240,200,74,0.12); }
  .arena-btn.lava.active { border-color: #ff4500; color: #ff6a00; background: rgba(255,69,0,0.15); }

  #game-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    position: fixed;
    inset: 0;
    overflow: hidden;
    justify-content: center;
    z-index: 1;
    padding: 0.5rem;
    max-width: 100vw;
    box-sizing: border-box;
  }

  .hud {
    width: min(370px, 100vw - 1rem);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .hp-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-width: 0;
  }

  .hp-block.right { align-items: flex-end; }

  .hp-name {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hp-bar-wrap {
    width: 100%;
    height: 9px;
    background: var(--hp-bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .hp-bar {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .hp-bar.p1 { background: linear-gradient(90deg, #c03030, #e84545); }
  .hp-bar.p2 { background: linear-gradient(90deg, #7b4cca, #a66dff); float: right; }

  .hp-num {
    font-size: 0.72rem;
    font-weight: 700;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .hud-center {
    text-align: center;
    min-width: 44px;
    flex-shrink: 0;
  }

  .round-num {
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    opacity: 0.4;
  }

  canvas {
    border: 2px solid var(--border);
    border-radius: 2px;
    box-shadow: 0 0 40px rgba(200,168,75,0.2), 0 0 80px rgba(200,168,75,0.08), inset 0 0 40px rgba(0,0,0,0.5);
    display: block;
    max-width: calc(100vw - 1rem);
    max-height: calc(100vh - 120px);
  }

  .bottom-bar {
    width: min(370px, 100vw - 1rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.65rem;
    opacity: 0.35;
    letter-spacing: 0.1em;
    gap: 0.4rem;
  }

  .bottom-bar span {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bottom-bar span#p2-status {
    text-align: right;
  }

  .forfeit-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: rgba(232,100,100,0.55);
    background: rgba(80,20,20,0.35);
    border: 1px solid rgba(232,100,100,0.2);
    border-radius: 3px;
    padding: 0.25em 0.7em;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    line-height: 1;
    white-space: nowrap;
  }
  .forfeit-btn:hover, .forfeit-btn:active {
    color: rgba(255,90,90,0.95);
    background: rgba(120,20,20,0.6);
    border-color: rgba(232,80,80,0.5);
  }

  /* ── 倍速控制 ── */
  .speed-control {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    z-index: 5;
    background: rgba(15,12,8,0.55);
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 6px;
    padding: 0.25rem 0.4rem;
  }

  .speed-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: rgba(232,220,200,0.55);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 3px;
    padding: 0.22em 0.5em;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    line-height: 1;
    white-space: nowrap;
  }
  .speed-btn:hover {
    color: rgba(240,200,74,0.9);
    border-color: rgba(240,200,74,0.4);
  }
  .speed-btn.active {
    color: #0a0a0f;
    background: var(--border-glow);
    border-color: var(--border-glow);
    font-weight: 700;
  }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
    backdrop-filter: blur(4px);
  }

  #overlay.show { display: flex; }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-shadow: 0 0 40px currentColor;
    text-align: center;
    padding: 0 1rem;
  }

  .result-sub { font-size: 0.9rem; opacity: 0.5; letter-spacing: 0.2em; text-align: center; }

  .replay-btn {
    padding: 0.8rem 2.5rem;
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.3em;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .replay-btn:hover { background: rgba(200,168,75,0.1); box-shadow: 0 0 20px rgba(200,168,75,0.2); }

  /* ── 角色圖鑑按鈕 ── */
  .roster-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(200,168,75,0.8);
    background: rgba(200,168,75,0.08);
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 3px;
    padding: 0.4em 1.2em;
    cursor: pointer;
    transition: all 0.18s;
    margin-bottom: 0.6rem;
  }
  .roster-btn:hover { background: rgba(200,168,75,0.18); color: var(--border-glow); }

  /* ── 角色圖鑑 Modal ── */
  #roster-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.93);
    backdrop-filter: blur(6px);
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1.5rem 1rem 3rem;
  }
  #roster-modal.show { display: flex; }

  .roster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 540px;
    margin-bottom: 1.2rem;
    flex-shrink: 0;
  }
  .roster-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.25em;
    color: var(--border-glow);
    text-shadow: 0 0 20px rgba(240,200,74,0.4);
  }
  .roster-close {
    font-size: 1.1rem;
    color: rgba(200,168,75,0.7);
    background: rgba(200,168,75,0.08);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 3px;
    width: 36px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .roster-close:hover { color: #fff; background: rgba(200,168,75,0.25); }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 0.8rem;
    width: 100%;
    max-width: 540px;
  }

  .roster-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(200,168,75,0.15);
    border-radius: 8px;
    padding: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .roster-card:hover { transform: translateY(-2px); }

  .roster-card-top {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.5rem;
  }
  .roster-emoji { font-size: 2rem; flex-shrink: 0; }
  .roster-name { font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; }
  .roster-type-badge { font-size: 0.6rem; opacity: 0.5; letter-spacing: 0.15em; margin-top: 0.1rem; }
  .roster-desc { font-size: 0.68rem; opacity: 0.55; line-height: 1.65; margin-bottom: 0.55rem; }
  .roster-stats { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.65rem; }
  .roster-stat-badge {
    font-size: 0.62rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    padding: 0.15em 0.5em;
    white-space: nowrap;
  }
  .roster-pick-hint { display: flex; gap: 0.5rem; }
  .pick-btn {
    flex: 1;
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    border-radius: 3px;
    padding: 0.35em 0;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
  }
  .pick-btn.p1 { color: #e84545; border-color: rgba(232,69,69,0.4); background: rgba(232,69,69,0.08); }
  .pick-btn.p1:hover { background: rgba(232,69,69,0.25); }
  .pick-btn.p2 { color: #a66dff; border-color: rgba(123,76,202,0.4); background: rgba(123,76,202,0.08); }
  .pick-btn.p2:hover { background: rgba(123,76,202,0.25); }
</style>
</head>
<body>

<!-- ══ SELECT SCREEN ══ -->
<div id="select-screen">
  <h1>競技場對決</h1>
  <p class="subtitle">ARENA · BATTLE · CHAMPIONSHIP</p>
  <button class="roster-btn" id="roster-btn">📖 角色圖鑑</button>

  <div class="select-row">
    <div class="player-slot">
      <div class="player-label">⚔ 玩家一</div>
      <div class="carousel-wrap" id="p1-carousel">
        <div class="carousel-viewport">
          <div class="carousel-track" id="p1-track"></div>
        </div>
        <div class="carousel-arrows">
          <button class="arrow-btn" data-player="p1" data-dir="-1">◀</button>
          <div class="carousel-dots" id="p1-dots"></div>
          <button class="arrow-btn" data-player="p1" data-dir="1">▶</button>
        </div>
      </div>
      <div class="selected-label" id="p1-selected-label">請選擇角色</div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="player-slot">
      <div class="player-label">玩家二 ⚔</div>
      <div class="carousel-wrap" id="p2-carousel">
        <div class="carousel-viewport">
          <div class="carousel-track" id="p2-track"></div>
        </div>
        <div class="carousel-arrows">
          <button class="arrow-btn" data-player="p2" data-dir="-1">◀</button>
          <div class="carousel-dots" id="p2-dots"></div>
          <button class="arrow-btn" data-player="p2" data-dir="1">▶</button>
        </div>
      </div>
      <div class="selected-label" id="p2-selected-label">請選擇角色</div>
    </div>
  </div>

  <div class="arena-select">
    <div style="width:100%;text-align:center;font-size:0.75rem;color:#888;letter-spacing:.1em;margin-bottom:4px">⚔️ 選擇場地</div>
    <button class="arena-btn active" data-arena="normal">🏟️ 標準場地</button>
    <button class="arena-btn lava" data-arena="lava">🌋 熔岩場地<span style="font-size:0.7rem;opacity:0.7;display:block">每秒灼燒 20 血</span></button>
  </div>

  <div class="bg-color-select" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px">
    <label for="bg-color-picker" style="font-size:0.75rem;color:#888;letter-spacing:.1em">🎨 背景顏色</label>
    <input type="color" id="bg-color-picker" value="#000000" style="width:36px;height:28px;border:none;border-radius:6px;background:none;cursor:pointer;padding:0">
  </div>

  <button class="start-btn" id="start-btn" disabled>開始對決</button>
</div>

<!-- ══ ROSTER MODAL ══ -->
<div id="roster-modal">
  <div class="roster-header">
    <div class="roster-title">📖 角色圖鑑</div>
    <button class="roster-close" id="roster-close">✕</button>
  </div>
  <div class="roster-grid" id="roster-grid"></div>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="game-screen">
  <div class="speed-control" id="speed-control">
    <button class="speed-btn" data-speed="0.5">0.5x</button>
    <button class="speed-btn" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="1.5">1.5x</button>
    <button class="speed-btn" data-speed="2">2x</button>
  </div>
  <div class="hud">
    <div class="hp-block">
      <div class="hp-name" id="p1-hud-name">─</div>
      <div class="hp-bar-wrap" style="position:relative"><div class="hp-bar p1" id="p1-bar" style="width:100%"></div><div id="p1-bleed-bar" style="position:absolute;top:0;height:100%;background:linear-gradient(90deg,#880000,#cc2200);opacity:0.7;border-radius:5px;width:0;left:100%"></div></div>
      <div class="hp-num" id="p1-hp-num">1000 / 1000</div>
    </div>
    <div class="hud-center"><div class="round-num" id="timer-display">0s</div></div>
    <div class="hp-block right">
      <div class="hp-name" id="p2-hud-name" style="flex-direction:row-reverse">─</div>

<script>
// ──────────────── AUDIO ────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playHitSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const dist = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 256 - 1;
      curve[i] = (Math.PI + 300) * x / (Math.PI + 300 * Math.abs(x));
    }
    dist.curve = curve;
    osc.connect(dist); dist.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === 'knife') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.55, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'opm') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.type = 'square';
      osc3.frequency.setValueAtTime(1200, now);
      osc3.frequency.exponentialRampToValueAtTime(100, now + 0.3);
      gain3.gain.setValueAtTime(0.5, now);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc3.connect(dist); gain3.connect(ctx.destination);
      osc3.start(now); osc3.stop(now + 0.3);
      osc.start(now); osc.stop(now + 0.7);
    } else if (type === 'vampire_bite') {
      // 吸血鬼咬擊音效：短促刺穿聲 + 吸血低鳴
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
      // 額外低沉回血音
      const oscHeal = ctx.createOscillator();
      const gainHeal = ctx.createGain();
      oscHeal.type = 'sine';
      oscHeal.frequency.setValueAtTime(180, now + 0.05);
      oscHeal.frequency.linearRampToValueAtTime(260, now + 0.25);
      gainHeal.gain.setValueAtTime(0, now + 0.05);
      gainHeal.gain.linearRampToValueAtTime(0.3, now + 0.1);
      gainHeal.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      oscHeal.connect(gainHeal); gainHeal.connect(ctx.destination);
      oscHeal.start(now + 0.05); oscHeal.stop(now + 0.3);
    } else if (type === 'trap_place') {
      // 放置尖刺：輕微金屬插入聲
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.09);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'trap_hit') {
      // 尖刺命中：刺穿 + 毒液滴落
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      const oscPoi = ctx.createOscillator();
      const gainPoi = ctx.createGain();
      oscPoi.type = 'sine';
      oscPoi.frequency.setValueAtTime(220, now + 0.06);
      oscPoi.frequency.linearRampToValueAtTime(160, now + 0.3);
      gainPoi.gain.setValueAtTime(0.28, now + 0.06);
      gainPoi.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      oscPoi.connect(gainPoi); gainPoi.connect(ctx.destination);
      oscPoi.start(now + 0.06); oscPoi.stop(now + 0.35);
    } else if (type === 'trap_chain') {
      // 鎖鏈射出：金屬鏈聲 + 呼嘯
      const bufSz = Math.floor(ctx.sampleRate * 0.3);
      const cBuf = ctx.createBuffer(1, bufSz, ctx.sampleRate);
      const cData = cBuf.getChannelData(0);
      for (let i = 0; i < bufSz; i++) cData[i] = (Math.random()*2-1) * Math.exp(-i/bufSz*6);
      const cSrc = ctx.createBufferSource(); cSrc.buffer = cBuf;
      const cFilt = ctx.createBiquadFilter(); cFilt.type = 'bandpass'; cFilt.frequency.value = 2500; cFilt.Q.value = 2;
      const cGain = ctx.createGain(); cGain.gain.setValueAtTime(0.7, now); cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      cSrc.connect(cFilt); cFilt.connect(cGain); cGain.connect(ctx.destination);
      cSrc.start(now); cSrc.stop(now + 0.3);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'curse_slash') {
      // 捌斬擊音效：高頻破空 + 金屬摩擦
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.14);
      gain.gain.setValueAtTime(0.65, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
      // 噪聲氣流（斬風感）
      const bufSize = Math.floor(ctx.sampleRate * 0.18);
      const nBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const nData = nBuf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) nData[i] = (Math.random() * 2 - 1);
      const nSrc = ctx.createBufferSource(); nSrc.buffer = nBuf;
      const nFilt = ctx.createBiquadFilter(); nFilt.type = 'highpass'; nFilt.frequency.value = 4000;
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(0.5, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(ctx.destination);
      nSrc.start(now); nSrc.stop(now + 0.18);
      // 金屬回鳴
      const oscRing = ctx.createOscillator();
      const gainRing = ctx.createGain();
      oscRing.type = 'sine';
      oscRing.frequency.setValueAtTime(2000, now + 0.04);
      oscRing.frequency.linearRampToValueAtTime(1600, now + 0.22);
      gainRing.gain.setValueAtTime(0.22, now + 0.04);
      gainRing.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      oscRing.connect(gainRing); gainRing.connect(ctx.destination);
      oscRing.start(now + 0.04); oscRing.stop(now + 0.26);
    } else if (type === 'vampire_dash') {
      // 破空衝刺音效：高頻掃頻 + 氣流聲
      // 氣流噪聲
      const bufferSize = ctx.sampleRate * 0.4;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(3000, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(800, now + 0.35);
      noiseFilter.Q.value = 0.8;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.6, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
      noise.start(now); noise.stop(now + 0.4);
      // 掃頻音調
      const oscDash = ctx.createOscillator();
      const gainDash = ctx.createGain();
      oscDash.type = 'sawtooth';
      oscDash.frequency.setValueAtTime(1800, now);
      oscDash.frequency.exponentialRampToValueAtTime(200, now + 0.3);
      gainDash.gain.setValueAtTime(0.5, now);
      gainDash.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      oscDash.connect(gainDash); gainDash.connect(ctx.destination);
      oscDash.start(now); oscDash.stop(now + 0.3);
    } else if (type === 'samurai_parry') {
      // 招架音效：金屬格擋聲
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
      const oscRing2 = ctx.createOscillator();
      const gainRing2 = ctx.createGain();
      oscRing2.type = 'sine';
      oscRing2.frequency.setValueAtTime(2400, now + 0.03);
      oscRing2.frequency.linearRampToValueAtTime(1800, now + 0.3);
      gainRing2.gain.setValueAtTime(0.4, now + 0.03);
      gainRing2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      oscRing2.connect(gainRing2); gainRing2.connect(ctx.destination);
      oscRing2.start(now + 0.03); oscRing2.stop(now + 0.35);
    } else if (type === 'samurai_iaido') {
      // 居合音效：高速斬擊破空
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2200, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
      const bufSize2 = Math.floor(ctx.sampleRate * 0.1);
      const nBuf2 = ctx.createBuffer(1, bufSize2, ctx.sampleRate);
      const nData2 = nBuf2.getChannelData(0);
      for (let i = 0; i < bufSize2; i++) nData2[i] = (Math.random()*2-1);
      const nSrc2 = ctx.createBufferSource(); nSrc2.buffer = nBuf2;
      const nFilt2 = ctx.createBiquadFilter(); nFilt2.type = 'highpass'; nFilt2.frequency.value = 5000;
      const nGain2 = ctx.createGain();
      nGain2.gain.setValueAtTime(0.6, now);
      nGain2.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      nSrc2.connect(nFilt2); nFilt2.connect(nGain2); nGain2.connect(ctx.destination);
      nSrc2.start(now); nSrc2.stop(now + 0.1);
    } else if (type === 'samurai_shimetsu') {
      // 識滅斬：四連鳴音
      for (let si = 0; si < 4; si++) {
        const oscS = ctx.createOscillator();
        const gainS = ctx.createGain();
        oscS.type = 'sawtooth';
        oscS.frequency.setValueAtTime(1800 - si * 200, now + si * 0.06);
        oscS.frequency.exponentialRampToValueAtTime(100, now + si * 0.06 + 0.12);
        gainS.gain.setValueAtTime(0.7, now + si * 0.06);
        gainS.gain.exponentialRampToValueAtTime(0.001, now + si * 0.06 + 0.15);
        oscS.connect(dist); gainS.connect(ctx.destination);
        oscS.start(now + si * 0.06); oscS.stop(now + si * 0.06 + 0.15);
      }
      osc.start(now); osc.stop(now + 0.01); // dummy to avoid error
    } else if (type === 'naobito_shadow') {
      // 殘影命中：輕柔氣流
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    } else if (type === 'naobito_kyousei') {
      // 凶星軌跡：爆發衝擊聲
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2000, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
      gain.gain.setValueAtTime(0.85, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      // 衝擊低音
      const oscB = ctx.createOscillator(); const gainB = ctx.createGain();
      oscB.type = 'sine'; oscB.frequency.setValueAtTime(80, now);
      oscB.frequency.exponentialRampToValueAtTime(30, now + 0.35);
      gainB.gain.setValueAtTime(0.7, now); gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      oscB.connect(gainB); gainB.connect(ctx.destination);
      oscB.start(now); oscB.stop(now + 0.4);
      // 鍛造音效：短促金屬敲擊聲
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1100, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.07);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
      // 金屬餘鳴
      const oscF2 = ctx.createOscillator();
      const gainF2 = ctx.createGain();
      oscF2.type = 'sine';
      oscF2.frequency.setValueAtTime(800, now + 0.02);
      oscF2.frequency.linearRampToValueAtTime(600, now + 0.12);
      gainF2.gain.setValueAtTime(0.15, now + 0.02);
      gainF2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      oscF2.connect(gainF2); gainF2.connect(ctx.destination);
      oscF2.start(now + 0.02); oscF2.stop(now + 0.15);
    } else {
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(800, now);
      osc2.frequency.exponentialRampToValueAtTime(120, now + 0.15);
      gain2.gain.setValueAtTime(0.3, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc2.connect(dist); gain2.connect(ctx.destination);
      osc2.start(now); osc2.stop(now + 0.15);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

// ──────────────── CAROUSEL STATE ────────────────
const carouselState = {
  p1: { index: 0, selected: null, dragging: false, startX: 0, currentX: 0 },
  p2: { index: 0, selected: null, dragging: false, startX: 0, currentX: 0 }
};

let p1Choice = null, p2Choice = null;

function buildCarousels() {
  ['p1', 'p2'].forEach(p => {
    const track = document.getElementById(`${p}-track`);
    const dotsEl = document.getElementById(`${p}-dots`);

    CHARACTERS.forEach((ch, i) => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.dataset.charId = ch.id;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="char-header">
          <span class="char-emoji">${ch.emoji}</span>
          <span class="char-name">${ch.name}</span>
        </div>
        <div class="char-desc">${ch.desc}</div>
        <div class="char-stat">${ch.stats.map(s => `<span class="stat-badge">${s}</span>`).join('')}</div>
      `;
      card.addEventListener('click', () => selectChar(p, ch.id));
      track.appendChild(card);
    });

    // 頁碼顯示
    const pageNum = document.createElement('span');
    pageNum.className = 'carousel-page-num';
    pageNum.id = `${p}-page-num`;
    pageNum.textContent = `1 / ${CHARACTERS.length}`;
    dotsEl.appendChild(pageNum);

    setupSwipe(p);
  });

  document.querySelectorAll('.arrow-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.player;
      const dir = parseInt(btn.dataset.dir);
      const cs = carouselState[p];
      goToSlide(p, cs.index + dir);
    });
  });
}

function setupSwipe(player) {
  const wrap = document.getElementById(`${player}-carousel`);
  const cs = carouselState[player];

  function onStart(e) {
    cs.dragging = true;
    cs.startX = (e.touches ? e.touches[0].clientX : e.clientX);
    cs.currentX = cs.startX;
    const track = document.getElementById(`${player}-track`);
    track.style.transition = 'none';
  }

  function onMove(e) {
    if (!cs.dragging) return;
    cs.currentX = (e.touches ? e.touches[0].clientX : e.clientX);
    const diff = cs.currentX - cs.startX;
    const track = document.getElementById(`${player}-track`);
    const base = -cs.index * 100;
    const pct = (diff / wrap.offsetWidth) * 100;
    track.style.transform = `translateX(calc(${base}% + ${pct * 0.4}px))`;
  }

  function onEnd() {
    if (!cs.dragging) return;
    cs.dragging = false;
    const diff = cs.currentX - cs.startX;
    const track = document.getElementById(`${player}-track`);
    track.style.transition = '';
    if (Math.abs(diff) > 40) {
      goToSlide(player, diff < 0 ? cs.index + 1 : cs.index - 1);
    } else {
      goToSlide(player, cs.index);
    }
  }

  wrap.addEventListener('touchstart', onStart, { passive: true });
  wrap.addEventListener('touchmove', onMove, { passive: true });
  wrap.addEventListener('touchend', onEnd);
  wrap.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

function goToSlide(player, index) {
  const cs = carouselState[player];
  const total = CHARACTERS.length;
  cs.index = Math.max(0, Math.min(total - 1, index));
  const track = document.getElementById(`${player}-track`);
  track.style.transform = `translateX(-${cs.index * 100}%)`;
  const pageNum = document.getElementById(`${player}-page-num`);
  if (pageNum) pageNum.textContent = `${cs.index + 1} / ${total}`;
  const currentChar = CHARACTERS[cs.index];
  if (currentChar) selectChar(player, currentChar.id);
}

function selectChar(player, charId) {
  const cs = carouselState[player];
  cs.selected = charId;
  if (player === 'p1') p1Choice = charId;
  else p2Choice = charId;

  const track = document.getElementById(`${player}-track`);
  track.querySelectorAll('.char-card').forEach(card => {
    card.classList.remove('selected', 'p1', 'p2');
    if (card.dataset.charId === charId) {
      card.classList.add('selected', player);
    }
  });

  const ch = CHARACTERS.find(c => c.id === charId);
  document.getElementById(`${player}-selected-label`).textContent =
    ch ? `✓ ${ch.emoji} ${ch.name}` : '請選擇角色';

  document.getElementById('start-btn').disabled = !(p1Choice && p2Choice);
}

buildCarousels();

// ──────────────── ROSTER MODAL ────────────────
function openRoster()  { document.getElementById('roster-modal').classList.add('show'); }
function closeRoster() { document.getElementById('roster-modal').classList.remove('show'); }

(function () {
  const grid = document.getElementById('roster-grid');

  CHARACTERS.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'roster-card';
    card.style.borderColor = ch.color + '44';
    card.addEventListener('mouseenter', () => {
      card.style.borderColor = ch.color + 'bb';
      card.style.boxShadow = `0 0 18px ${ch.color}33`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.borderColor = ch.color + '44';
      card.style.boxShadow = '';
    });
    card.innerHTML = `
      <div class="roster-card-top">
        <div class="roster-emoji">${ch.emoji}</div>
        <div>
          <div class="roster-name" style="color:${ch.color}">${ch.name}</div>
          <div class="roster-type-badge">${ch.type.toUpperCase()}</div>
        </div>
      </div>
      <div class="roster-desc">${ch.desc}</div>
      <div class="roster-stats">${ch.stats.map(s => `<span class="roster-stat-badge">${s}</span>`).join('')}</div>
      <div class="roster-pick-hint">
        <button class="pick-btn p1" data-charid="${ch.id}">P1 選擇</button>
        <button class="pick-btn p2" data-charid="${ch.id}">P2 選擇</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.pick-btn');
    if (!btn) return;
    const charId = btn.dataset.charid;
    const player = btn.classList.contains('p1') ? 'p1' : 'p2';
    const idx = CHARACTERS.findIndex(c => c.id === charId);
    if (idx >= 0) { goToSlide(player, idx); selectChar(player, charId); }
    closeRoster();
  });

  document.getElementById('roster-btn').addEventListener('click', openRoster);
  document.getElementById('roster-close').addEventListener('click', closeRoster);
  document.getElementById('roster-modal').addEventListener('click', e => {
    if (e.target.id === 'roster-modal') closeRoster();
  });
})();

  vampire(b) {
    const dashProgress = 1 - (b.vampireDashTimer / VAMPIRE_DASH_INTERVAL);

      atFrac: Math.max(0, Math.min(1, dashProgress)),
      barColor: b.vampireDashing ? '#ff44ff' : (b.vampireBiting ? '#aa00ff' : b.char.color)
    };
  },
  gojo(b) {
    if (b.gojoCharging) return { atFrac: Math.min(b.gojoChargeTimer / GOJO_CHARGE_TIME, 1), barColor: '#bf00ff' };

  },
  cursed(b) {
    return {
      atFrac: b.curseSlashTimer != null ? 1 - (b.curseSlashTimer / CURSE_SLASH_INTERVAL) : 0,
      barColor: b.curseDomainActive ? '#c0392b' : b.char.color

  },
  trapper(b) {
    return {
      atFrac: b.trapChainTimer != null ? 1 - (b.trapChainTimer / TRAP_CHAIN_INTERVAL) : 0,
      barColor: b.trapChainActive ? '#f1c40f' : b.char.color
    };
  },
  yi(b) {

    };
  },
  gunner(b) {
    return {
      atFrac: b.gunnerFiring ? (b.gunnerAmmoFired / GUNNER_MAG_SIZE) : (b.gunnerAmmo / GUNNER_MAG_SIZE),

  mage(b) {

      atFrac: 1 - Math.min(b.mageDoveTimer / MAGE_DOVE_INTERVAL, 1),
      barColor: b.mageTeleportTimer > 0 ? '#ffffff' : b.char.color
    };

  samurai(b) {

    return {
      atFrac: Math.max(0, Math.min(1, b.engTurretTimer != null ? 1 - Math.min(b.engTurretTimer / ENGINEER_TURRET_INTERVAL, 1) : 0)),
      barColor: b.char.color
    };
  },
  cannondad(b) {
    if (b.cannonBlastFiring) return { atFrac: 1, barColor: '#ff8a3d' };
    return {
      atFrac: Math.max(0, Math.min(1, b.cannonSkillTimer != null ? b.cannonSkillTimer / (b.cannonSkillCooldown || CANNON_BEAM_COOLDOWN) : 0)),
      barColor: b.char.color
    };

      // 時停中：顯示剩餘時停時間

      return { atFrac: Math.max(0, Math.min(1, b.dioWorldTimer / dur)), barColor: '#ffe566' };
    }
    // 冷卻中：顯示冷卻進度（滿格=可發動）
    const frac = Math.max(0, Math.min(1, 1 - (b.dioWorldCooldownTimer || 0) / DIO_WORLD_COOLDOWN));
    return { atFrac: frac, barColor: frac >= 1 ? '#ffe566' : b.char.color };
  },
  stargirl(b) {
    if (b.starMeteorActive) return { atFrac: Math.max(0, Math.min(1, b.starMeteorTimer / STAR_METEOR_DURATION)), barColor: '#ffaa00' };
    if (b.starMeteorCooldown > 0) {
      return { atFrac: Math.max(0, 1 - b.starMeteorCooldown / STAR_METEOR_COOLDOWN), barColor: b.char.color };

    const sfrac = Math.max(0, Math.min(1, 1 - (b.starBigTimer || 0) / STAR_BIG_COOLDOWN));

    if (b.obitoKamuiPhase === 'in_space') return { atFrac: 1, barColor: '#ff44ff' };
    if (b.obitoKamuiCooldown > 0) return { atFrac: 1 - b.obitoKamuiCooldown/OBITO_KAMUI_COOLDOWN, barColor: b.char.color };
    const fCd = 1 - Math.max(0,(b.obitoFireballTimer||0)/OBITO_FIREBALL_COOLDOWN);
    return { atFrac: fCd, barColor: '#ff6600' };

  tiger(b) {
    if (b.tigerCharging) return { atFrac: Math.min(1, (b.tigerChargeTimer || 0) / TIGER_PUNCH_CHARGE_TIME), barColor: '#ff6600' };
    if (b.tigerNovaCharging) return { atFrac: Math.min(1, (b.tigerNovaChargeTimer || 0) / TIGER_NOVA_CHARGE_TIME), barColor: '#ff0044' };
    if (b.tigerNovaActive) return { atFrac: 1, barColor: '#ff0044' };
    const bloodOrbCount = state.tigerBloodOrbs ? state.tigerBloodOrbs.filter(o => o.owner === b.player).length : 0;
    if (bloodOrbCount >= TIGER_NOVA_THRESHOLD) return { atFrac: 1, barColor: '#ff0044' };
    return {
      atFrac: Math.max(0, Math.min(1, b.tigerPunchTimer != null ? 1 - (b.tigerPunchTimer / TIGER_PUNCH_INTERVAL) : 0)),
      barColor: b.tigerBleedPool > 50 ? '#aa0000' : b.char.color

  __default(b) {
    return {
      atFrac: Math.min(1, b.attackTimer / b.attackInterval),
      barColor: (b.char.type !== 'chef' || b.knives > 0) ? b.char.color : '#555'
    };

function startGame() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  document.getElementById('result-stats').innerHTML = '';

  const ch1base  = CHARACTERS.find(c => c.id === p1Choice);
  const ch2base  = CHARACTERS.find(c => c.id === p2Choice);
  const sameChar = p1Choice === p2Choice;

  const ch1 = { ...ch1base, color: P1_COLORS[ch1base.type],
    displayName: sameChar ? ch1base.name + ' 1' : ch1base.name };
  const ch2 = { ...ch2base, color: P2_COLORS[ch2base.type],
    displayName: sameChar ? ch2base.name + ' 2' : ch2base.name };

  const cx = W / 2, cy = H / 2, offset = 100;
  const spawnAngle = Math.random() * Math.PI * 2;
  const sx = cx + Math.cos(spawnAngle) * offset;
  const sy = cy + Math.sin(spawnAngle) * offset;
  const ex = cx - Math.cos(spawnAngle) * offset;
  const ey = cy - Math.sin(spawnAngle) * offset;
  const a1 = Math.random() * Math.PI * 2;
  const a2 = Math.random() * Math.PI * 2;

  function makeBall(x, y, vx, vy, ch, player) {
    return {
      x, y, vx, vy, hp: MAX_HP, char: ch, player,
      attackTimer: 0,
      attackInterval: ch.type === 'chef' ? CHEF_ATTACK_INTERVAL : ch.type === 'yi' ? YI_BLACK_INTERVAL : DRUNK_ATTACK_INTERVAL,
      knives: ch.type === 'chef' ? KNIFE_MAX_COUNT : null,
      knifeRecalling: false,   // 是否回收中
      drunkTimer: ch.type === 'drunk' ? randBetween(DRUNK_DIR_CHANGE_MIN, DRUNK_DIR_CHANGE_MAX) : null,
      opmPunched: ch.type === 'opm' ? false : null,
      opmCountdown: ch.type === 'opm' ? OPM_COUNTDOWN_START : null,
      opmWasColliding: ch.type === 'opm' ? false : null,
      opmCollisionCooldown: ch.type === 'opm' ? 0 : null,
      opmWallTouching: ch.type === 'opm' ? false : null,
      // 詛咒之王專屬狀態

    tigerPunchFX: [],         // 虎天帝：出拳特效列表
    tigerBlackFlashFX: [],    // 虎天帝：黑閃特效列表
    tigerCurseFX: [],         // 虎天帝：藍色咒力特效列表
    starBigStars: [],         // 星星女孩：場上大星星列表
    starSmallStars: [],       // 星星女孩：場上小星星列表
    starMeteors: [],          // 星星女孩：星隕落石列表
    starMeteorWarnings: [],   // 星星女孩：星隕落點預警列表
    starMeteorQueue: [],      // 星星女孩：待生成流星佇列
    obitoFireballs: [],       // 帶土：場上火球列表
    obitoSpaceCaptures: [],   // 帶土：被抓入神威空間的子彈列表
    obitoKamuiFX: [],         // 帶土：神威特效列表
  };

  updateHUD();
  document.getElementById('p1-bar').style.background = `linear-gradient(90deg, ${ch1.color}aa, ${ch1.color})`;
  document.getElementById('p2-bar').style.background = `linear-gradient(90deg, ${ch2.color}aa, ${ch2.color})`;
  document.getElementById('p1-hud-name').innerHTML = `<span>${ch1.emoji}</span> ${ch1.displayName}`;
  document.getElementById('p2-hud-name').innerHTML = `${ch2.displayName} <span>${ch2.emoji}</span>`;

  if (gameLoop) cancelAnimationFrame(gameLoop);
  lastTime = performance.now();
  elapsed  = 0;
  gameLoop = requestAnimationFrame(tick);
}

function randBetween(min, max) { return min + Math.random() * (max - min); }
function dealDamage(target, dmg, options = {}) {
  // 無敵狀態（擊殺動畫播放中）不受傷
  if (target.invincible) return;
  // 帶土虛影/轉移階段：本體無敵（虛影取代本體承受攻擊，但不扣血）
  if (target.char && target.char.type === 'obito' &&
      ['ghost','teleporting','in_space','grabbing','returning'].includes(target.obitoKamuiPhase)) return;
  // 帶土虛化態：不受傷
  if (target.char && target.char.type === 'obito' && target.obitoPhasing) return;
  // 被帶土抓進神威空間的敵人：在空間裡免疫主場地攻擊
  if (target.obitoInSpace && !options.bypassParry) return;
  // 一拳超人必殺拳穿透招架減傷（bypassParry flag）
  const isParrying = target.char && target.char.type === 'samurai' && target.samuraiParrying;
  let mul = (isParrying && !options.bypassParry) ? SAMURAI_PARRY_DMG_REDUCE : 1;
  // bypassParry（目前僅一拳超人必殺拳）：穿透一切減傷效果，視為純粹的系統殺
  if (target.itachiSusanooActive && !options.bypassParry) mul *= (1 - ITACHI_SUSANOO_DMG_REDUCE);
  // 一拳超人：全局減傷（一拳超人自身的必殺拳不受此減免影響）
  const isOpmReduced = target.char && target.char.type === 'opm' && !options.bypassParry;
  if (isOpmReduced) mul *= (1 - OPM_DMG_REDUCE);
  // 工程師：機甲模式減傷
  if (target.char && target.char.type === 'engineer' && target.engMechActive && !options.bypassParry) mul *= (1 - ENGINEER_MECH_DMG_REDUCE);
  const prevHp = target.hp;
  let actual = Math.min(target.hp, dmg * mul);
  // 系統殺：若原始傷害本應致命，一拳超人的減傷不應讓他逃過一死
  if (isOpmReduced && dmg >= prevHp) {
    actual = prevHp;
  }
  // bypassParry：必殺拳直接清空血量，標記系統殺，無視復活/替身類效果
  if (options.bypassParry) {
    actual = prevHp;
    target.opmExecuted = true;
  }
  // 虎天帝被動一：部分傷害轉為流血（只有虎天帝自身具有流血值；不是bypassParry時才觸發，穿血自傷也觸發）
  if (!options.bypassParry && !options.noBleed && target.char && target.char.type === 'tiger') {
    const bleedAmt = actual * TIGER_BLEED_RATIO;
    if (bleedAmt > 0) {
      target.tigerBleedPool = Math.min((target.tigerBleedPool || 0) + bleedAmt, TIGER_BLEED_MAX_POOL);
      actual -= bleedAmt; // 這部分傷害先不立即扣，改為流血慢扣
    }
  }
  target.hp = Math.max(0, target.hp - actual);
  // 記錄傷害到對方玩家的 stats（攻擊者 = 對方）
  if (state && state.stats && target.player) {
    const attackerPlayer = target.player === 1 ? 2 : 1;
    state.stats[attackerPlayer].totalDmg += actual;
    if (actual > state.stats[attackerPlayer].maxHit) state.stats[attackerPlayer].maxHit = actual;
  }
}

function tick(now) {
  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const dt = rawDt * gameSpeed;
  elapsed += dt;
  state.elapsed = elapsed;
  if (state.stats) state.stats.duration = elapsed;
  update(dt);

  // 一拳超人特效更新（獨立於 update() 之外，比賽結束凍結邏輯後仍需讓特效播完，避免卡死在出拳畫面）
  for (let i = state.opmFX.length - 1; i >= 0; i--) {
    const f = state.opmFX[i];
    f.life -= dt;
    if (f.life <= 0) { state.opmFX.splice(i, 1); continue; }
    if (f.type === 'spark') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= 0.88; f.vy *= 0.88;
      f.vy += (f.gravity || 0) * dt;
    }
    if (f.type === 'ring') {
      f.r += (f.maxR - f.r) * dt * 6;
    }
  }

  // 詛咒橫切特效更新
  if (state.curseSliceKillFX) {
    const fx = state.curseSliceKillFX;
    const dt2 = Math.min((now - lastTime) / 1000, 0.05); // dt already computed above
    fx.life -= dt;
    const prog = 1 - fx.life / fx.maxLife;
    // 上半段
    fx.topOffY += fx.topVY * dt;
    fx.topOffX += fx.topVX * dt;
    fx.topRot  += fx.topRotV * dt;
    // 上半段加速往下掉（重力）
    fx.topVY   += 120 * dt;
    // 下半段
    fx.botOffY += fx.botVY * dt;
    fx.botOffX += fx.botVX * dt;
    fx.botRot  += fx.botRotV * dt;
    fx.botVY   += 100 * dt;
    // 粒子
    for (const p of fx.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
    }
    fx.slashAlpha = Math.max(0, 1 - prog * 2.5);
    fx.flashAlpha = Math.max(0, 1 - prog * 6);
    if (fx.life <= 0) {
      state.curseSliceKillFX = null;
      cancelAnimationFrame(gameLoop);
      gameLoop = null;
      const dead2 = state.balls.filter(b => b.hp <= 0);
      setTimeout(() => showResult(dead2), 100);
      return;
    }
  }

  // 無量空處特效更新（在 update 之外，避免被 early return 跳過）
  if (state.gojoKillFX) {
    const fx = state.gojoKillFX;
    fx.life -= dt;
    for (const l of fx.lines) l.dist += l.speed * dt;
    if (fx.life <= 0) {
      state.gojoKillFX = null;
      cancelAnimationFrame(gameLoop);
      gameLoop = null;
      const dead = state.balls.filter(b => b.hp <= 0);
      setTimeout(() => showResult(dead), 100);
      return;
    }
  }

  // 砲爹 vs 乙骨 決鬥終結特效更新（在 update 之外，避免被 early return 跳過）
  if (state.cannonDuelFX) {
    const fx = state.cannonDuelFX;
    fx.timer -= dt;
    if (fx.phase === 'charge') {
      if (fx.timer <= 0) {
        fx.phase = 'beam';
        fx.timer = CANNON_DUEL_BEAM_TIME;
        fx.angleA = Math.atan2(fx.c.y - fx.a.y, fx.c.x - fx.a.x);
        fx.angleC = Math.atan2(fx.a.y - fx.c.y, fx.a.x - fx.c.x);
        fx.midX = (fx.a.x + fx.c.x) / 2;
        fx.midY = (fx.a.y + fx.c.y) / 2;
        playHitSound('opm');
      }
    } else if (fx.phase === 'beam') {
      if (fx.timer <= 0) {
        fx.phase = 'explode';
        fx.timer = CANNON_DUEL_EXPLODE_TIME;
        fx.explodeR = 10;
        state.hitFlashes.push({ x: fx.midX, y: fx.midY, r: 90, alpha: 1, color: '#ffffff', t: 0.4 });
        playHitSound('vampire_dash');
      }
    } else if (fx.phase === 'explode') {
      const prog = 1 - Math.max(0, fx.timer) / CANNON_DUEL_EXPLODE_TIME;
      fx.explodeR = 10 + prog * 240;
      if (fx.timer <= 0) {
        // 結算勝負：血量較高的一方存活，相同則乙骨贏
        const a = fx.a, c = fx.c;
        const loser = a.hp === c.hp ? a : (a.hp > c.hp ? c : a);
        loser.hp = 0;
        for (const b of state.balls) b.invincible = false;
        state.cannonDuelFX = null;
        cancelAnimationFrame(gameLoop);
        gameLoop = null;
        const dead = state.balls.filter(b => b.hp <= 0);
        setTimeout(() => showResult(dead), 100);
        return;
      }
    }
  }

  render();
  updateHUD();
  const dead = state.balls.filter(b => b.hp <= 0);
  if (dead.length > 0) {
    // 詛咒之王擊殺任意對手：觸發橫切動畫
    if (!state.curseSliceKillFX && !state.gojoKillFX) {
      const cursedKiller = state.balls.find(b => b.hp > 0 && b.char.type === 'cursed');
      const anyDead = dead.find(b => b.char.type !== 'cursed');
      if (cursedKiller && anyDead) {
        state.curseSliceKillFX = {
          life: 2.2, maxLife: 2.2,
          targetX: anyDead.x, targetY: anyDead.y,
          targetPlayer: anyDead.player,
          // 上半部往左上飄
          topOffY: 0, topVY: -80,
          topOffX: 0, topVX: -30,
          topRot: 0, topRotV: -1.8,
          // 下半部往右下掉
          botOffY: 0, botVY: 90,
          botOffX: 0, botVX: 20,
          botRot: 0, botRotV: 1.2,
          // 斬線特效
          slashAlpha: 1.0,
          flashAlpha: 1.0,
          color: anyDead.char.color,
          // 血腥粒子
          particles: Array.from({length: 22}, () => {
            const ang = Math.random() * Math.PI * 2;
            const spd = 60 + Math.random() * 180;
            return { x: anyDead.x, y: anyDead.y,
              vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
              life: 0.4 + Math.random()*0.6, maxLife: 0.6+Math.random()*0.5,
              r: 2 + Math.random()*3 };
          })
        };
        for (const b of state.balls) { b.vx = 0; b.vy = 0; b.invincible = true; b.attackTimer = 0; }
        anyDead.vx = 0; anyDead.vy = 0;
        gameLoop = requestAnimationFrame(tick);
        return;
      }
    }
    // 詛咒橫切動畫播放中
    if (state.curseSliceKillFX) {
      gameLoop = requestAnimationFrame(tick);
      return;
    }

    // Gojo 擊殺：觸發無量空處
    if (!state.gojoKillFX) {
      const killer = state.balls.find(b => b.hp > 0 && b.char.type === 'gojo');
      if (killer) {
        const lines = [];
        for (let i = 0; i < 80; i++) {
          const angle = Math.random() * Math.PI * 2;
          lines.push({
            angle, dist: 20 + Math.random() * 60,
            speed: 180 + Math.random() * 400,
            len: 30 + Math.random() * 120,
            alpha: 0.4 + Math.random() * 0.6,
            width: 0.5 + Math.random() * 1.5
          });
        }
        state.gojoKillFX = { life: 3.2, maxLife: 3.2, lines };
        // 凍結所有球：停止移動、無敵、停止攻擊
        for (const b of state.balls) {
          b.vx = 0; b.vy = 0;
          b.invincible = true;
          b.attackTimer = 0;
        }
      }
    }
    // 若有特效還在播就繼續跑
    if (state.opmFX.length > 0 || state.gojoKillFX) {
      gameLoop = requestAnimationFrame(tick);
      return;
    }
    cancelAnimationFrame(gameLoop);
    gameLoop = null;
    setTimeout(() => showResult(dead), 300);
    return;
  }
  gameLoop = requestAnimationFrame(tick);
}

function update(dt) {
  const [b0, b1] = state.balls; // Note: used only for ball-ball collision of opposing first balls

  // 無量空處播放中：只更新特效，跳過所有遊戲邏輯
  if (state.gojoKillFX) return;

  // 詛咒橫切動畫播放中：跳過所有遊戲邏輯
  if (state.curseSliceKillFX) return;

  // 砲爹 vs 乙骨 決鬥終結特效播放中：跳過所有遊戲邏輯（特效本身於 tick() 中推進）
  if (state.cannonDuelFX) return;

  // 已有一方倒下（比賽已結束，僅播放收尾特效）：凍結所有戰鬥邏輯，避免分出勝負後雙方仍持續互動造成誤判（例如一拳超人出拳擊殺瞬間，特效播放期間吸血鬼仍咬擊導致反輸）
  if (state.matchEnded) return;
  if (state.balls.some(b => b.hp <= 0)) {
    state.matchEnded = true;
    for (const b of state.balls) { b.vx = 0; b.vy = 0; }
    return;
  }

  // 砲爹 vs 乙骨：雙方血量同時低於門檻時，觸發決鬥終結
  if (!state.cannonDuelTriggered) {
    const cd = state.balls.find(b => b.char.type === 'cannondad');
    const yt = state.balls.find(b => b.char.type === 'yuta');
    if (cd && yt && cd.hp <= CANNON_DUEL_HP_THRESHOLD && yt.hp <= CANNON_DUEL_HP_THRESHOLD) {
      state.cannonDuelTriggered = true;
      state.cannonDuelFX = { phase: 'charge', timer: CANNON_DUEL_CHARGE_TIME, a: cd, c: yt };
      for (const b of state.balls) { b.vx = 0; b.vy = 0; b.invincible = true; }
      state.hitFlashes.push({ x: cd.x, y: cd.y, r: 26, alpha: 1, color: '#ff8a3d', t: CANNON_DUEL_CHARGE_TIME });
      state.hitFlashes.push({ x: yt.x, y: yt.y, r: 26, alpha: 1, color: '#ff9fc6', t: CANNON_DUEL_CHARGE_TIME });
      return;
    }
  }

  // ── DIO 世界（時停）：凍結敵方狀態快照 ──
  let dioFreezeTarget = null;
  let dioFreezeSnapshot = null;
  const dioWorldCasterBall = state.balls.find(b => b.char.type === 'dio' && b.dioWorldActive);
  if (dioWorldCasterBall) {
    state.dioWorldGlobalActive = true;
    state.dioWorldCaster = dioWorldCasterBall;
    dioFreezeTarget = state.balls.find(b => b !== dioWorldCasterBall);
    if (dioFreezeTarget) dioFreezeSnapshot = { ...dioFreezeTarget };
  } else {
    state.dioWorldGlobalActive = false;
    state.dioWorldCaster = null;
  }

  // ── 場地效果 ──
  if (state.arena === 'lava') {
    for (const b of state.balls) {
      dealDamage(b, ARENA_LAVA_DMG_PER_SEC * dt);
    }
  }

  // ── 蝙蝠粒子更新 ──
  for (let i = state.batParticles.length - 1; i >= 0; i--) {
    const bp = state.batParticles[i];
    bp.x += bp.vx * dt;
    bp.y += bp.vy * dt;
    bp.life -= dt;
    bp.alpha = bp.life / bp.maxLife;
    if (bp.life <= 0) state.batParticles.splice(i, 1);
  }

  for (const b of state.balls) {
    // 被帶土抓進神威空間：完全時停（不能攻擊、冷卻不流動、不移動、不受牆壁判定）
    if (b.obitoInSpace) continue;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 18) b.trail.shift();

    // 酒鬼方向改變
    if (b.char.type === 'drunk' && b.drunkTimer !== null) {
      b.drunkTimer -= dt;
      if (b.drunkTimer <= 0) {
        const newAngle = Math.random() * Math.PI * 2;
        b.vx = Math.cos(newAngle) * BASE_SPEED;
        b.vy = Math.sin(newAngle) * BASE_SPEED;
        b.drunkTimer = randBetween(DRUNK_DIR_CHANGE_MIN, DRUNK_DIR_CHANGE_MAX);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 0.5, color: b.char.color, t: 0.3 });
      }
    }

    // 隨機加速（非凍結且非咬擊中，且不在神威空間中）
    if (!b.frozenByVampire && !b.obitoInSpace) {
      b.boostTimer -= dt;
      if (b.boostTimer <= 0) {
        let bvx = randBetween(-BOOST_MAGNITUDE, BOOST_MAGNITUDE);
        let bvy = randBetween(-BOOST_MAGNITUDE, BOOST_MAGNITUDE);
        // 確保合力不低於最低值
        const bmag = Math.hypot(bvx, bvy);
        if (bmag < BOOST_MIN_MAGNITUDE) {
          const scale = BOOST_MIN_MAGNITUDE / (bmag || 1);
          bvx *= scale; bvy *= scale;
        }
        b.vx += bvx;
        b.vy += bvy;
        b.boostTimer = randBetween(BOOST_INTERVAL_MIN, BOOST_INTERVAL_MAX);
      }
    }

    // 暗夜領主：衝刺計時
    if (b.char.type === 'vampire') {
      // 咬擊後冷卻倒數
      if (b.vampireBiteCooldown > 0) {
        b.vampireBiteCooldown -= dt;
        if (b.vampireBiteCooldown < 0) b.vampireBiteCooldown = 0;
      }
      // 蝙蝠狂襲冷卻倒數
      if (!b.vampireDashing) {
        b.vampireDashTimer -= dt;
      }

      // 衝刺中：持續追蹤敵人方向
      if (b.vampireDashing) {
        b.vampireDashElapsed += dt;
        const enemy = state.balls.find(x => x.player !== b.player);
        if (enemy) {
          const ddx = enemy.x - b.x, ddy = enemy.y - b.y;
          const dd = Math.sqrt(ddx*ddx + ddy*ddy);
          if (dd > 0) {
            b.vx = (ddx/dd) * VAMPIRE_DASH_SPEED;
            b.vy = (ddy/dd) * VAMPIRE_DASH_SPEED;
          }
        }
        // 產生蝙蝠粒子
        if (Math.random() < 0.6) {
          spawnBatParticles(b.x, b.y, b.char.color, 1);
        }
        // 衝刺超時停止
        if (b.vampireDashElapsed >= VAMPIRE_DASH_DURATION) {
          b.vampireDashing = false;
          b.vampireDashElapsed = 0;
          // 恢復正常速度
          const spd = BASE_SPEED;
          const ang = Math.random() * Math.PI * 2;
          b.vx = Math.cos(ang) * spd;
          b.vy = Math.sin(ang) * spd;
        }
      }

      // 觸發衝刺
      if (!b.vampireDashing && !b.vampireBiting && b.vampireDashTimer <= 0) {
        b.vampireDashing = true;
        b.vampireDashElapsed = 0;
        b.vampireDashTimer = VAMPIRE_DASH_INTERVAL;
        playHitSound('vampire_dash');
        // 生成大量蝙蝠粒子
        spawnBatParticles(b.x, b.y, b.char.color, 8);
      }
    }

    // 暗夜領主：咬擊序列處理
    if (b.char.type === 'vampire' && b.vampireBiting) {
      b.vampireBiteTimer -= dt;
      if (b.vampireBiteTimer <= 0 && b.vampireBiteStep < VAMPIRE_BITE_COUNT) {
        // 執行本次咬擊
        const enemy = state.balls.find(x => x.player !== b.player);
        if (enemy) {
          dealDamage(enemy, VAMPIRE_BITE_DAMAGE);
          b.hp = Math.min(MAX_HP, b.hp + VAMPIRE_BITE_HEAL);
          // 傷害特效
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30, alpha: 1.0, color: '#ff0055', t: 0.3 });
          // 回血特效（在吸血鬼位置）
          state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#aa00ff', t: 0.25 });
          playHitSound('vampire_bite');
          spawnBatParticles(enemy.x, enemy.y, b.char.color, 3);
        }
        b.vampireBiteStep++;
        b.vampireBiteTimer = VAMPIRE_BITE_INTERVAL;

        // 三次咬擊完成
        if (b.vampireBiteStep >= VAMPIRE_BITE_COUNT) {
          b.vampireBiting = false;
          b.vampireBiteStep = 0;
          b.vampireBiteTimer = 0;
          b.vampireBiteCooldown = 1.0;  // 1.0秒冷卻，讓雙方有時間分開再說
          // 解凍敵人
          if (enemy) {
            enemy.frozenByVampire = false;
            enemy.frozenTimer = 0;
          }
          // 咬擊完成後以全速彈開（遠離敵人）
          if (enemy) {
            const ex2 = b.x - enemy.x, ey2 = b.y - enemy.y;
            const ed = Math.sqrt(ex2*ex2 + ey2*ey2) || 1;
            b.vx = (ex2/ed) * BASE_SPEED * 2.5;
            b.vy = (ey2/ed) * BASE_SPEED * 2.5;
          } else {
            const ang = Math.random() * Math.PI * 2;
            b.vx = Math.cos(ang) * BASE_SPEED;
            b.vy = Math.sin(ang) * BASE_SPEED;
          }
        }
      }
    }
