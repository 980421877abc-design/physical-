            type: 'knife', owner: b.player, color: '#f5e642', angle: bAngle, damage: DIO_KNIFE_DAMAGE, dioKnife: true
          });
        } else {
          state.projectiles.push({
            x: b.x, y: b.y, vx: Math.cos(bAngle) * DIO_KNIFE_SPEED, vy: Math.sin(bAngle) * DIO_KNIFE_SPEED,
            type: 'knife', owner: b.player, color: '#f5e642', angle: bAngle, damage: DIO_KNIFE_DAMAGE
          });
        }
        playHitSound('knife');

        b.dioBreadEaten = (b.dioBreadEaten || 0) + 1;
        if (b.dioBreadEaten >= DIO_BREAD_HIGH_THRESHOLD && !b.dioWorldActive) {
          b.dioBreadEaten = 0;
          b.dioHighActive = true;
          b.dioWorldActive = true;
          b.dioWorldTimer = DIO_WORLD_HIGH_DURATION;
          b.dioWorldKnifeTimer = 0;
          b.dioWorldCooldownTimer = DIO_WORLD_COOLDOWN;
          if (!b.dioSteamrollerThrown) b.dioSteamrollerPending = true;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 70, alpha: 1.3, color: '#ff4444', t: 0.6 });
          playHitSound('knife');
        }
      }
    }

    // 世界：自動施放（冷卻完成時觸發，非HIGH狀態）
    if (!b.dioWorldActive && b.dioWorldCooldownTimer <= 0) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        b.dioWorldCooldownTimer = 2.0; // 打斷：2秒後再試
      } else {
      b.dioWorldActive = true;
      b.dioWorldTimer = DIO_WORLD_DURATION;
      b.dioWorldKnifeTimer = 0;
      b.dioWorldCooldownTimer = DIO_WORLD_COOLDOWN;
      playHitSound('knife');
      } // end else (not paralyzed)
    }

    // 世界：時停中的邏輯（布刀、倒數、結束時釋放飛刀、HIGH壓路機）
    if (b.dioWorldActive) {
      b.dioWorldTimer -= dt;

      if (!b.dioWorldKnifeTimer || b.dioWorldKnifeTimer <= 0) {
        b.dioWorldKnifeTimer = DIO_WORLD_KNIFE_INTERVAL;
        const ang = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        state.projectiles.push({
          x: b.x + Math.cos(ang) * (RADIUS + 8), y: b.y + Math.sin(ang) * (RADIUS + 8),
          vx: 0, vy: 0,
          dioFrozenVx: Math.cos(ang) * DIO_KNIFE_SPEED, dioFrozenVy: Math.sin(ang) * DIO_KNIFE_SPEED,
          type: 'knife', owner: b.player, color: '#f5e642', angle: ang,
          damage: DIO_KNIFE_DAMAGE, dioKnife: true
        });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 22, alpha: 0.8, color: '#ffe66d', t: 0.2 });
        playHitSound('knife');
      } else {
        b.dioWorldKnifeTimer -= dt;
      }

      // HIGH狀態：時停剩餘2秒時丟出壓路機（整場僅一次）
      if (b.dioSteamrollerPending && b.dioWorldTimer <= 2 && !b.dioSteamrollerThrown) {
        b.dioSteamrollerThrown = true;
        b.dioSteamrollerPending = false;
        const ang = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        state.dioSteamroller = {
          x: b.x, y: b.y, vx: Math.cos(ang) * DIO_STEAMROLLER_SPEED, vy: Math.sin(ang) * DIO_STEAMROLLER_SPEED,
          hitTargets: new Set(), owner: b.player, life: 0
        };
        state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1, color: '#888888', t: 0.4 });
      }

      if (b.dioWorldTimer <= 0) {
        b.dioWorldActive = false;
        b.dioWorldTimer = 0;
        // 時停結束：所有DIO飛刀按原方向恢復飛行
        for (const p of state.projectiles) {
          if (p.dioKnife && p.owner === b.player) {
            p.vx = p.dioFrozenVx; p.vy = p.dioFrozenVy;
            p.dioKnife = false;
          }
        }
        state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1, color: '#bbbbbb', t: 0.5 });
        // HIGH狀態結束：DIO衝上前連續毆打
        if (b.dioHighActive) {
          b.dioHighActive = false;
          b.dioRushing = true;
          b.dioRushTimer = DIO_RUSH_DURATION;
          b.dioRushPunchTimer = 0;
        }
      }
    }

    // 衝刺連打（HIGH狀態時停結束後）
    if (b.dioRushing) {
      b.dioRushTimer -= dt;
      const rdx = enemy.x - b.x, rdy = enemy.y - b.y;
      const rd = Math.hypot(rdx, rdy) || 1;
      b.vx = (rdx / rd) * DIO_RUSH_SPEED;
      b.vy = (rdy / rd) * DIO_RUSH_SPEED;
      if (rd < RADIUS * 2 + 10) {
        b.dioRushPunchTimer -= dt;
        if (b.dioRushPunchTimer <= 0) {
          dealDamage(enemy, DIO_RUSH_PUNCH_DAMAGE);
          b.dioRushPunchTimer = DIO_RUSH_PUNCH_INTERVAL;
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 20, alpha: 1, color: '#ffd34d', t: 0.15 });
          if (state.stats) state.stats[b.player].skillUses++;
        }
      }
      if (b.dioRushTimer <= 0) b.dioRushing = false;
    }
  }

  // DIO 壓路機更新（世界時停中靜止，時停結束後才衝出）
  if (state.dioSteamroller) {
    const sr = state.dioSteamroller;
    if (!state.dioWorldGlobalActive) {
      sr.x += sr.vx * dt; sr.y += sr.vy * dt;
      sr.life = (sr.life || 0) + dt;
      const srEnemy = state.balls.find(x => x.player !== sr.owner);
      if (srEnemy && !sr.hitTargets.has(srEnemy.player)) {
        const d = Math.hypot(srEnemy.x - sr.x, srEnemy.y - sr.y);
        if (d < RADIUS + DIO_STEAMROLLER_RADIUS) {
          sr.hitTargets.add(srEnemy.player);
          dealDamage(srEnemy, DIO_STEAMROLLER_DAMAGE);
          const kx = (srEnemy.x - sr.x) / (d || 1), ky = (srEnemy.y - sr.y) / (d || 1);
          srEnemy.vx += kx * 420; srEnemy.vy += ky * 420;
          state.hitFlashes.push({ x: srEnemy.x, y: srEnemy.y, r: 45, alpha: 1.2, color: '#666666', t: 0.4 });
          playHitSound('vampire_dash');
        }
      }
      if (sr.life > 4 || sr.x < -100 || sr.x > W + 100 || sr.y < -100 || sr.y > H + 100) {
        state.dioSteamroller = null;
      }
    }
  }

  // 乙骨憂太：咒力斬軌跡特效更新
  if (state.yutaSlashFX) {
    for (let i = state.yutaSlashFX.length - 1; i >= 0; i--) {
      state.yutaSlashFX[i].life -= dt;
      if (state.yutaSlashFX[i].life <= 0) state.yutaSlashFX.splice(i, 1);
    }
  }

  // ── 星星女孩邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'stargirl') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 技能一：大星星冷卻倒數，冷卻完自動發射（場上不超過3顆）
    if (b.starBigTimer > 0) b.starBigTimer -= dt;
    if (b.starBigTimer <= 0) {
      const bigCount = state.starBigStars.filter(s => s.owner === b.player).length;
      if (bigCount < STAR_BIG_MAX) {
        if (b.thunderParalyzed > 0) {
          b.thunderParalyzed = 0;
          b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
          b.vx = 0; b.vy = 0;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
          b.vx = 0; b.vy = 0;
          b.starBigTimer = STAR_BIG_COOLDOWN;
          state.thunderStunFX = state.thunderStunFX || [];
          state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        } else {
          const dx = enemy.x - b.x, dy = enemy.y - b.y;
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          state.starBigStars.push({
            x: b.x, y: b.y,
            vx: (dx/d) * STAR_BIG_SPEED,
            vy: (dy/d) * STAR_BIG_SPEED,
            owner: b.player,
            color: b.char.color,
            angle: 0,
            life: STAR_BIG_LIFETIME,
            hitCooldown: 0,
            scatterCooldown: 0.5,
          });
          b.starBigTimer = STAR_BIG_COOLDOWN;
        }
      }
    }

    // 技能二（星隕）：常駐冷卻技能
    if (b.starMeteorCooldown > 0) {
      b.starMeteorCooldown -= dt;
    }
    if (b.starMeteorActive) {
      b.starMeteorTimer -= dt;
      b.starMeteorSpawnTimer -= dt;
      if (b.starMeteorSpawnTimer <= 0) {
        const tx = RADIUS + Math.random() * (W - RADIUS * 2);
        const ty = RADIUS + Math.random() * (H - RADIUS * 2);
        state.starMeteorWarnings.push({ x: tx, y: ty, life: STAR_METEOR_WARNING_TIME, owner: b.player, color: b.char.color });
        state.starMeteorQueue.push({ tx, ty, delay: STAR_METEOR_WARNING_TIME, owner: b.player, color: b.char.color });
        b.starMeteorSpawnTimer = STAR_METEOR_INTERVAL;
      }
      if (b.starMeteorTimer <= 0) {
        b.starMeteorActive = false;
        b.starMeteorCooldown = STAR_METEOR_COOLDOWN;
      }
    } else if (b.starMeteorCooldown <= 0) {
      // 冷卻結束，自動觸發
      b.starMeteorActive = true;
      b.starMeteorTimer = STAR_METEOR_DURATION;
      b.starMeteorSpawnTimer = 0;
    }
  }

  // ── 大星星更新 ──
  if (!state.dioWorldGlobalActive) {
  for (let i = state.starBigStars.length - 1; i >= 0; i--) {
    const s = state.starBigStars[i];
    if (!s) continue;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.angle += dt * 3;
    s.life -= dt;
    if (s.hitCooldown > 0) s.hitCooldown -= dt;
    if (s.scatterCooldown > 0) s.scatterCooldown -= dt;

    // 存活時間到，消失
    if (s.life <= 0) { state.starBigStars.splice(i, 1); continue; }

    // 碰牆反彈（不消失）→ 反彈時觸發星散
    let bounced = false;
    if (s.x - STAR_BIG_RADIUS < WALL) { s.x = WALL + STAR_BIG_RADIUS; s.vx = Math.abs(s.vx); bounced = true; }
    if (s.x + STAR_BIG_RADIUS > W - WALL) { s.x = W - WALL - STAR_BIG_RADIUS; s.vx = -Math.abs(s.vx); bounced = true; }
    if (s.y - STAR_BIG_RADIUS < WALL) { s.y = WALL + STAR_BIG_RADIUS; s.vy = Math.abs(s.vy); bounced = true; }
    if (s.y + STAR_BIG_RADIUS > H - WALL) { s.y = H - WALL - STAR_BIG_RADIUS; s.vy = -Math.abs(s.vy); bounced = true; }

    if (bounced && s.scatterCooldown <= 0) {
      const groupId = Date.now() + Math.random();
      for (let k = 0; k < STAR_SMALL_COUNT; k++) {
        const ang = (k / STAR_SMALL_COUNT) * Math.PI * 2 + Math.random() * 0.3;
        state.starSmallStars.push({
          x: s.x, y: s.y,
          vx: Math.cos(ang) * STAR_SMALL_SPEED,
          vy: Math.sin(ang) * STAR_SMALL_SPEED,
          owner: s.owner,
          color: s.color,
          life: STAR_SMALL_LIFETIME,
          angle: Math.random() * Math.PI * 2,
          spawnImmunity: 0.4,
          groupId,  // 同批小星星標記同組，組內不互爆
        });
      }
      state.hitFlashes.push({ x: s.x, y: s.y, r: 30, alpha: 1, color: '#ffffff', t: 0.3, maxT: 0.3 });
      s.scatterCooldown = 1.5;
    }

    // 碰到敵人：傷害60，穿透（有命中冷卻）
    for (const b of state.balls) {
      if (b.player === s.owner) continue;
      const dx = b.x - s.x, dy = b.y - s.y;
      if (Math.sqrt(dx*dx+dy*dy) < RADIUS + STAR_BIG_RADIUS && s.hitCooldown <= 0) {
        dealDamage(b, STAR_BIG_DAMAGE);
        state.hitFlashes.push({ x: s.x, y: s.y, r: 22, alpha: 1, color: s.color, t: 0.25, maxT: 0.25 });
        s.hitCooldown = 0.6;
      }
    }

  }  // ── 大星星迴圈結束 ──
  } // end !dioWorldGlobalActive (大星星)

  // ── 小星星更新 ──
  // 先收集本幀要刪除的索引，統一處理，避免雙重 splice 後越界
  const starSmallToRemove = new Set();
  if (!state.dioWorldGlobalActive) {
  for (let i = 0; i < state.starSmallStars.length; i++) {
    if (starSmallToRemove.has(i)) continue;
    const s = state.starSmallStars[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.angle += dt * 5;
    s.life -= dt;
    if (s.spawnImmunity > 0) s.spawnImmunity -= dt;

    if (s.life <= 0) { starSmallToRemove.add(i); continue; }

    // 碰牆反彈
    if (s.x - STAR_SMALL_RADIUS < WALL) { s.x = WALL + STAR_SMALL_RADIUS; s.vx = Math.abs(s.vx); }
    if (s.x + STAR_SMALL_RADIUS > W - WALL) { s.x = W - WALL - STAR_SMALL_RADIUS; s.vx = -Math.abs(s.vx); }
    if (s.y - STAR_SMALL_RADIUS < WALL) { s.y = WALL + STAR_SMALL_RADIUS; s.vy = Math.abs(s.vy); }
    if (s.y + STAR_SMALL_RADIUS > H - WALL) { s.y = H - WALL - STAR_SMALL_RADIUS; s.vy = -Math.abs(s.vy); }

    // 碰到敵人：30傷後消失
    let hit = false;
    for (const b of state.balls) {
      if (b.player === s.owner) continue;
      const dx = b.x - s.x, dy = b.y - s.y;
      if (Math.sqrt(dx*dx+dy*dy) < RADIUS + STAR_SMALL_RADIUS) {
        // 帶土虛化態：吸收小星星
        if (b.char && b.char.type === 'obito' && b.obitoPhasing) {
          if (!b.obitoAbsorbStored) b.obitoAbsorbStored = [];
          if (b.obitoAbsorbStored.length < OBITO_ABSORB_MAX_STORED) {
            b.obitoAbsorbStored.push({ origType: 'star', origColor: s.color || '#ffe066', damage: STAR_SMALL_DAMAGE });
            state.hitFlashes.push({ x: s.x, y: s.y, r: 18, alpha: 1, color: '#cc44ff', t: 0.2 });
            state.hitFlashes.push({ x: b.x, y: b.y, r: 14, alpha: 0.8, color: '#9900ff', t: 0.15 });
            playHitSound('vampire_bite');
          }
          starSmallToRemove.add(i); hit = true; break;
        }
        dealDamage(b, STAR_SMALL_DAMAGE);
        state.hitFlashes.push({ x: s.x, y: s.y, r: 16, alpha: 1, color: s.color, t: 0.2, maxT: 0.2 });
        starSmallToRemove.add(i); hit = true; break;
      }
    }
    if (hit) continue;

    // 碰到另一顆小星星 → 爆炸80傷，兩顆都消失（出生免疫期內不觸發）
    for (let j = i + 1; j < state.starSmallStars.length; j++) {
      if (starSmallToRemove.has(j)) continue;
      const s2 = state.starSmallStars[j];
      if (s.spawnImmunity > 0 || s2.spawnImmunity > 0) continue;
      if (s.groupId && s.groupId === s2.groupId) continue;
      const dx = s2.x - s.x, dy = s2.y - s.y;
      if (Math.sqrt(dx*dx+dy*dy) < STAR_SMALL_RADIUS * 2) {
        const ex = (s.x + s2.x) / 2, ey = (s.y + s2.y) / 2;
        for (const b of state.balls) {
          if (b.player === s.owner) continue;
          const dbx = b.x - ex, dby = b.y - ey;
          if (Math.sqrt(dbx*dbx+dby*dby) < RADIUS + 32) dealDamage(b, STAR_EXPLODE_DAMAGE);
        }
        state.hitFlashes.push({ x: ex, y: ey, r: 28, alpha: 1, color: '#ffffff', t: 0.3, maxT: 0.3 });
        starSmallToRemove.add(i); starSmallToRemove.add(j); hit = true; break;
      }
    }
    if (hit) continue;

    // 碰到大星星 → 爆炸80傷後消失（出生免疫期內不觸發）
    for (const bs of state.starBigStars) {
      if (s.spawnImmunity > 0) break;
      const dx = bs.x - s.x, dy = bs.y - s.y;
      if (Math.sqrt(dx*dx+dy*dy) < STAR_BIG_RADIUS + STAR_SMALL_RADIUS) {
        for (const b of state.balls) {
          if (b.player === s.owner) continue;
          const dbx = b.x - s.x, dby = b.y - s.y;
          if (Math.sqrt(dbx*dbx+dby*dby) < RADIUS + 35) dealDamage(b, STAR_EXPLODE_DAMAGE);
        }
        state.hitFlashes.push({ x: s.x, y: s.y, r: 28, alpha: 1, color: '#ffff88', t: 0.3, maxT: 0.3 });
        starSmallToRemove.add(i); hit = true; break;
      }
    }
    if (hit) continue;

  }
  // 從後往前刪除，保持索引正確
  const removeArr = Array.from(starSmallToRemove).sort((a,b) => b - a);
  for (const idx of removeArr) state.starSmallStars.splice(idx, 1);
  } // end !dioWorldGlobalActive (小星星)

  // ── 星隕流星更新 ──
  if (!state.dioWorldGlobalActive) {
  for (let i = state.starMeteors.length - 1; i >= 0; i--) {
    const m = state.starMeteors[i];
    if (!m) continue;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.life -= dt;
    if (m.life <= 0 || m.y > H + 30) { state.starMeteors.splice(i, 1); continue; }
    for (const b of state.balls) {
      if (b.player === m.owner) continue;
      const dx = b.x - m.x, dy = b.y - m.y;
      if (Math.sqrt(dx*dx+dy*dy) < RADIUS + STAR_METEOR_RADIUS) {
        dealDamage(b, STAR_METEOR_DAMAGE);
        state.hitFlashes.push({ x: m.x, y: m.y, r: 24, alpha: 1, color: m.color, t: 0.25, maxT: 0.25 });
        state.starMeteors.splice(i, 1); break;
      }
    }
  }
  } // end !dioWorldGlobalActive (流星)

  // ── 宇智波帶土邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'obito') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    const phase = b.obitoKamuiPhase;

    // 火球冷卻計時（虛化期間暫停）
    if (b.obitoFireballTimer > 0 && !b.obitoPhasing) b.obitoFireballTimer -= dt;

    // ── 被動技：虛化態 ──
    // 每隔一段時間自動進入虛化態，此期間受到的投射物全部被吸收進口袋
    if (!b.obitoAbsorbStored) b.obitoAbsorbStored = [];
    if (b.obitoPhasing) {
      b.obitoPhaseTimer -= dt;
      if (b.obitoPhaseTimer <= 0) {
        // 虛化結束
        b.obitoPhasing = false;
        b.obitoPhaseTimer = OBITO_PHASE_INTERVAL;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 28, alpha: 0.8, color: '#cc44ff', t: 0.3 });
      }
    } else {
      b.obitoPhaseTimer -= dt;
      if (b.obitoPhaseTimer <= 0 && phase === 'idle' && !b.obitoFireballDashing && !b.obitoFireballDashDelay) {
        // 進入虛化態
        b.obitoPhasing = true;
        b.obitoPhaseTimer = OBITO_PHASE_DURATION;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 32, alpha: 1, color: '#cc44ff', t: 0.4 });
        playHitSound('vampire_bite');
      }
    }

    // 火球後：延遲倒數，結束後才衝刺（給敵人反應時間，也讓衝刺瞄準當下位置）
    if (b.obitoFireballDashDelay > 0) {
      b.obitoFireballDashDelay -= dt;
      b.vx = 0; b.vy = 0; // 蓄力停滯，預告即將衝刺
      if (b.obitoFireballDashDelay <= 0) {
        b.obitoFireballDashDelay = 0;
        b.obitoFireballDashing = true;
        b.obitoFireballDashTimer = OBITO_DASH_DURATION;
        const dx0 = enemy.x - b.x, dy0 = enemy.y - b.y;
        b.obitoFireballDashAngle = Math.atan2(dy0, dx0);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 1, color: '#ff8800', t: 0.2 });
        playHitSound('vampire_dash');
      }
    }

    // 火球後衝刺處理（衝刺中持續追蹤敵人方向）
    if (b.obitoFireballDashing) {
      b.obitoFireballDashTimer -= dt;
      const dxh = enemy.x - b.x, dyh = enemy.y - b.y;
      const dh = Math.hypot(dxh, dyh) || 1;
      // 追蹤角度緩慢修正朝向敵人，模擬鎖定但非瞬間轉向
      const targetAngle = Math.atan2(dyh, dxh);
      let angleDiff = targetAngle - b.obitoFireballDashAngle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
      b.obitoFireballDashAngle += Math.max(-1, Math.min(1, angleDiff)) * Math.min(Math.abs(angleDiff), dt * 6);
      b.vx = Math.cos(b.obitoFireballDashAngle) * OBITO_DASH_SPEED;
      b.vy = Math.sin(b.obitoFireballDashAngle) * OBITO_DASH_SPEED;
      // 每幀檢查是否已貼近敵人，貼近就立刻成功抓取，不用等衝刺計時結束
      const dNow = Math.hypot(enemy.x - b.x, enemy.y - b.y);
      const dashCaughtEnemy = dNow < RADIUS * 2 + 40;
      if (b.obitoFireballDashTimer <= 0 || dashCaughtEnemy) {
        b.obitoFireballDashing = false;
        // 衝刺結束：檢查是否抓到敵人或子彈
        if (dashCaughtEnemy) {
          // 抓到敵人：送入神威空間
          const spaceX = OBITO_SPACE_W * 0.2 + Math.random() * OBITO_SPACE_W * 0.6;
          const spaceY = OBITO_SPACE_H * 0.2 + Math.random() * OBITO_SPACE_H * 0.6;
          if (!state.obitoSpaceCaptures) state.obitoSpaceCaptures = [];
          state.obitoSpaceCaptures.push({
            owner: b.player,
            type: 'enemy',
            enemyPlayer: enemy.player,
            x: spaceX, y: spaceY,
            vx: (Math.random()-0.5)*160, vy: (Math.random()-0.5)*160,
            life: 6.0,
          });
          dealDamage(enemy, OBITO_SPACE_ENTRY_DAMAGE);
          // 敵人暫時定身在神威空間（凍結位置）
          enemy.obitoInSpace = true;
          enemy.obitoInSpaceTimer = 5.0;
          enemy.vx = 0; enemy.vy = 0;
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 40, alpha: 1.2, color: '#cc44ff', t: 0.5 });
          playHitSound('vampire_bite');
        } else {
          // 掃過路徑：抓子彈
          const toRemove = [];
          if (state.projectiles) {
            for (let pi = state.projectiles.length - 1; pi >= 0; pi--) {
              const p = state.projectiles[pi];
              if (p.owner === b.player) continue;
              const pdx = p.x - b.x, pdy = p.y - b.y;
              if (Math.hypot(pdx, pdy) < 60) {
                if (!state.obitoSpaceCaptures) state.obitoSpaceCaptures = [];
                state.obitoSpaceCaptures.push({
                  owner: b.player, type: 'projectile',
                  origType: p.type, origColor: p.color,
                  x: OBITO_SPACE_W * 0.3 + Math.random() * OBITO_SPACE_W * 0.4,
                  y: OBITO_SPACE_H * 0.3 + Math.random() * OBITO_SPACE_H * 0.4,
                  vx: (Math.random()-0.5)*40, vy: (Math.random()-0.5)*40, life: 8.0,
                  damage: p.damage || 30,
                });
                toRemove.push(pi);
                // 主場地吸入特效：明確讓玩家看到投射物被吸走消失
                state.hitFlashes.push({ x: p.x, y: p.y, r: 28, alpha: 1, color: '#cc44ff', t: 0.3 });
                state.hitFlashes.push({ x: p.x, y: p.y, r: 12, alpha: 1.2, color: p.color || '#ffffff', t: 0.2 });
              }
            }
          }
          for (const pi of toRemove) state.projectiles.splice(pi, 1);
        }
        const ang2 = Math.random() * Math.PI * 2;
        b.vx = Math.cos(ang2) * BASE_SPEED;
        b.vy = Math.sin(ang2) * BASE_SPEED;
      }
    }

    // 技能一：火球發射
    if (!b.obitoPhasing && !b.obitoFireballDashing && !b.obitoFireballDashDelay && b.obitoFireballTimer <= 0 &&
        phase === 'idle' && !b.frozenByVampire && b.gunnerStunTimer <= 0 && b.thunderParalyzed <= 0) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0; b.thunderStunTimer = 0.5; b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        b.obitoFireballTimer = OBITO_FIREBALL_COOLDOWN;
      } else {
        b.obitoFireballTimer = OBITO_FIREBALL_COOLDOWN;
        const dx = enemy.x - b.x, dy = enemy.y - b.y;
        const d = Math.hypot(dx, dy) || 1;
        if (!state.obitoFireballs) state.obitoFireballs = [];
        state.obitoFireballs.push({
          x: b.x, y: b.y,
          vx: (dx/d) * OBITO_FIREBALL_SPEED,
          vy: (dy/d) * OBITO_FIREBALL_SPEED,
          owner: b.player, color: b.char.color,
          r: OBITO_FIREBALL_RADIUS,
          life: 4.0, angle: Math.atan2(dy, dx),
        });
        playHitSound('knife');
        state.hitFlashes.push({ x: b.x, y: b.y, r: 20, alpha: 0.8, color: '#ff4400', t: 0.2 });

        // 丟完火球後延遲一段時間再衝刺抓人/抓投射物
        b.obitoFireballDashDelay = OBITO_DASH_DELAY;
      }
    }

    // 神威冷卻計時
    if (b.obitoKamuiCooldown > 0 && !b.obitoPhasing) b.obitoKamuiCooldown -= dt;

    // 技能二：神威 - 發動（idle且冷卻完成；火球延遲蓄力/衝刺中不可同時觸發）
    if (!b.obitoPhasing && phase === 'idle' && b.obitoKamuiCooldown <= 0 && !b.obitoFireballDashing && !b.obitoFireballDashDelay &&
        b.gunnerStunTimer <= 0 && b.thunderParalyzed <= 0) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0; b.thunderStunTimer = 0.5; b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        b.obitoKamuiCooldown = OBITO_KAMUI_COOLDOWN;
      } else {
        // 在神威空間隨機位置生成虛影
        b.obitoKamuiPhase = 'ghost';
        b.obitoGhostTimer = OBITO_KAMUI_GHOST_TIME;
        b.obitoGhostX = OBITO_SPACE_W * 0.15 + Math.random() * OBITO_SPACE_W * 0.7;
        b.obitoGhostY = OBITO_SPACE_H * 0.15 + Math.random() * OBITO_SPACE_H * 0.7;
        b.obitoGhostHit = false;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 0.8, color: '#cc44ff', t: 0.4 });
        playHitSound('vampire_bite');
        // ── 釋放口袋中儲存的投射物到神威空間 ──
        if (b.obitoAbsorbStored && b.obitoAbsorbStored.length > 0) {
          if (!state.obitoSpaceCaptures) state.obitoSpaceCaptures = [];
          for (const stored of b.obitoAbsorbStored) {
            const ang = Math.random() * Math.PI * 2;
            state.obitoSpaceCaptures.push({
              owner: b.player, type: 'projectile',
              origType: stored.origType, origColor: stored.origColor,
              x: OBITO_SPACE_W * 0.1 + Math.random() * OBITO_SPACE_W * 0.8,
              y: OBITO_SPACE_H * 0.1 + Math.random() * OBITO_SPACE_H * 0.8,
              vx: Math.cos(ang) * (40 + Math.random() * 40),
              vy: Math.sin(ang) * (40 + Math.random() * 40),
              life: 10.0,
              damage: stored.damage,
            });
          }
          state.hitFlashes.push({ x: b.x, y: b.y, r: 45, alpha: 1.2, color: '#cc44ff', t: 0.5 });
          b.obitoAbsorbStored = [];
        }
      }
    }

    // 神威 - 虛影階段
    if (phase === 'ghost') {
      b.vx = 0; b.vy = 0; // 虛影期間本體靜止
      b.obitoGhostTimer -= dt;
      // 虛影被攻擊判定：看看有沒有從神威空間方向來的攻擊（模擬：被敵方子彈命中時標記失敗）
      // 簡化：判斷神威空間中有無被敵方子彈（用 obitoSpaceCaptures 中的子彈判定無法用）
      // 改用：神威空間中若有敵方的捕獲物接近虛影，則認為虛影被打到
      if (state.obitoSpaceCaptures) {
        for (const cap of state.obitoSpaceCaptures) {
          if (cap.type === 'projectile' && cap.owner !== b.player) {
            const gd = Math.hypot(cap.x - b.obitoGhostX, cap.y - b.obitoGhostY);
            if (gd < 20) { b.obitoGhostHit = true; }
          }
        }
      }
      if (b.obitoGhostTimer <= 0 || b.obitoGhostHit) {
        if (b.obitoGhostHit) {
          // 虛影被擊中：取消轉移，不受傷
          b.obitoKamuiPhase = 'idle';
          b.obitoKamuiCooldown = OBITO_KAMUI_COOLDOWN;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 25, alpha: 0.6, color: '#888888', t: 0.4 });
        } else {
          // 虛影存活：開始轉移
          b.obitoKamuiPhase = 'teleporting';
          b.obitoTeleportTimer = 0.4;
          b.vx = 0; b.vy = 0; // 轉移中停止移動
          state.hitFlashes.push({ x: b.x, y: b.y, r: 35, alpha: 1, color: '#cc44ff', t: 0.4 });
          // 判定敵人是否在神威空間
          const enemyCaptured = state.obitoSpaceCaptures &&
            state.obitoSpaceCaptures.some(c => c.type === 'enemy' && c.owner === b.player);
          b.obitoEnemyCaptured = enemyCaptured;
          b.obitoKamuiCooldown = OBITO_KAMUI_COOLDOWN;
        }
      }
    }

    // 神威 - 轉移倒數
    if (phase === 'teleporting') {
      b.obitoTeleportTimer -= dt;
      b.vx = 0; b.vy = 0;
      if (b.obitoTeleportTimer <= 0) {
        // 帶土進入神威空間（消耗體力）
        dealDamage(b, OBITO_SPACE_ENTRY_DAMAGE);
        b.obitoKamuiPhase = 'in_space';
        b.obitoInSpaceCounter = 0; // 重置停留計時器，防止殘留值導致秒出
        b.obitoSpaceX = OBITO_SPACE_W * 0.1 + Math.random() * OBITO_SPACE_W * 0.2;
        b.obitoSpaceY = OBITO_SPACE_H * 0.4;
        const enemyCap = state.obitoSpaceCaptures &&
          state.obitoSpaceCaptures.find(c => c.type === 'enemy' && c.owner === b.player);
        if (enemyCap) {
          // 空間中有敵人：從敵人正上方出現，垂直衝刺向下抓人
          b.obitoKamuiPhase = 'grabbing';
          b.obitoGrabTimer = OBITO_KAMUI_GRAB_DURATION;
          b.obitoSpaceX = Math.max(14, Math.min(OBITO_SPACE_W - 14, enemyCap.x));
          b.obitoSpaceY = 8; // 從頂端衝下
          const tx = enemyCap.x, ty = enemyCap.y;
          const dd = Math.hypot(tx - b.obitoSpaceX, ty - b.obitoSpaceY) || 1;
          b.obitoSpaceVx = ((tx - b.obitoSpaceX)/dd) * OBITO_KAMUI_GRAB_SPEED;
          b.obitoSpaceVy = ((ty - b.obitoSpaceY)/dd) * OBITO_KAMUI_GRAB_SPEED;
          b.obitoGrabTarget = null;
          playHitSound('vampire_dash');
        } else {
          // 空間中無敵人：在空間隨機位置移動
          const sva = Math.random() * Math.PI * 2;
          b.obitoSpaceVx = Math.cos(sva) * 80;
          b.obitoSpaceVy = Math.sin(sva) * 80;
          b.obitoGrabTarget = null;
        }
        state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1, color: '#cc44ff', t: 0.3 });
      }
    }

    // 神威 - 在神威空間中（無敵人）
    if (phase === 'in_space') {
      b.obitoSpaceX += b.obitoSpaceVx * dt;
      b.obitoSpaceY += b.obitoSpaceVy * dt;
      if (b.obitoSpaceX < 10) { b.obitoSpaceX = 10; b.obitoSpaceVx *= -1; }
      if (b.obitoSpaceX > OBITO_SPACE_W - 10) { b.obitoSpaceX = OBITO_SPACE_W - 10; b.obitoSpaceVx *= -1; }
      if (b.obitoSpaceY < 10) { b.obitoSpaceY = 10; b.obitoSpaceVy *= -1; }
      if (b.obitoSpaceY > OBITO_SPACE_H - 10) { b.obitoSpaceY = OBITO_SPACE_H - 10; b.obitoSpaceVy *= -1; }
      b.vx = 0; b.vy = 0;
      // 在空間裡待1.5秒後回來（主場地：從敵人旁邊冒出）
      b.obitoInSpaceCounter = (b.obitoInSpaceCounter || 0) + dt;
      if (b.obitoInSpaceCounter >= 1.5) {
        b.obitoInSpaceCounter = 0;
        b.obitoKamuiPhase = 'returning';
        b.obitoTeleportTimer = 0.3;
        // 預警點：出現在敵人旁
        const eRef = state.balls.find(x => x.player !== b.player);
        if (eRef) {
          const ang0 = Math.random() * Math.PI * 2;
          b.obitoExitX = Math.max(RADIUS+5, Math.min(W-RADIUS-5, eRef.x + Math.cos(ang0)*45));
          b.obitoExitY = Math.max(RADIUS+5, Math.min(H-RADIUS-5, eRef.y + Math.sin(ang0)*45));
        }
      }
    }

    // 神威 - 空間中衝刺抓敵人
    if (phase === 'grabbing') {
      b.obitoGrabTimer -= dt;
      b.obitoSpaceX += b.obitoSpaceVx * dt;
      b.obitoSpaceY += b.obitoSpaceVy * dt;
      b.vx = 0; b.vy = 0;
      // 找到神威空間中的敵人
      const enemyCap = state.obitoSpaceCaptures &&
        state.obitoSpaceCaptures.find(c => c.type === 'enemy' && c.owner === b.player);
      if (enemyCap) {
        const gd = Math.hypot(enemyCap.x - b.obitoSpaceX, enemyCap.y - b.obitoSpaceY);
        if (gd < 20 || b.obitoGrabTimer <= 0) {
          // 碰到了：抓住並回場地
          b.obitoGrabTarget = enemyCap;
          b.obitoKamuiPhase = 'returning';
          b.obitoTeleportTimer = 0.4;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 35, alpha: 1, color: '#cc44ff', t: 0.4 });
          // 預警點：帶人出現在帶土原位置旁
          b.obitoExitX = b.x; b.obitoExitY = b.y;
        }
      } else {
        if (b.obitoGrabTimer <= 0) {
          b.obitoKamuiPhase = 'returning';
          b.obitoTeleportTimer = 0.3;
          const eRef2 = state.balls.find(x => x.player !== b.player);
          if (eRef2) {
            const ang2 = Math.random() * Math.PI * 2;
            b.obitoExitX = Math.max(RADIUS+5, Math.min(W-RADIUS-5, eRef2.x + Math.cos(ang2)*45));
            b.obitoExitY = Math.max(RADIUS+5, Math.min(H-RADIUS-5, eRef2.y + Math.sin(ang2)*45));
          }
        }
      }
    }

    // 神威 - 帶回主場地（或帶人回來）
    if (phase === 'returning') {
      b.obitoTeleportTimer -= dt;
      b.vx = 0; b.vy = 0;
      if (b.obitoTeleportTimer <= 0) {
        b.obitoKamuiPhase = 'idle';
        b.obitoInSpaceCounter = 0;
        if (b.obitoGrabTarget) {
          // 帶著敵人回來：在帶土旁邊位置
          const exitAng = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          // 找敵人ball
          const enemyBall = state.balls.find(x => x.player !== b.player);
          if (enemyBall) {
            enemyBall.x = b.x + Math.cos(exitAng) * (RADIUS * 2 + 10);
            enemyBall.y = b.y + Math.sin(exitAng) * (RADIUS * 2 + 10);
            enemyBall.vx = 0; enemyBall.vy = 0;
            enemyBall.obitoInSpace = false;
            dealDamage(enemyBall, OBITO_SPACE_ENTRY_DAMAGE);
          }
          // 移除空間中所有屬於此帶土的敵人捕獲（避免殘留）
          if (state.obitoSpaceCaptures) {
            for (let ci = state.obitoSpaceCaptures.length - 1; ci >= 0; ci--) {
              const c = state.obitoSpaceCaptures[ci];
              if (c.owner === b.player && c.type === 'enemy') {
                const eb2 = state.balls.find(x => x.player === c.enemyPlayer);
                if (eb2) { eb2.obitoInSpace = false; eb2.obitoInSpaceTimer = 0; }
                state.obitoSpaceCaptures.splice(ci, 1);
              }
            }
          }
          b.obitoGrabTarget = null;
          // 開始鎖鏈甩飛
          b.obitoKamuiPhase = 'chaining';
          b.obitoChainTimer = OBITO_KAMUI_CHAIN_DURATION;
          b.obitoChainPhase = false;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 50, alpha: 1.2, color: '#cc44ff', t: 0.5 });
          playHitSound('trap_chain');
        } else {
          // 沒抓到人：從預警點出現，揮鐵鏈+起爆符
          b.x = b.obitoExitX != null ? b.obitoExitX : Math.max(RADIUS+5, Math.min(W-RADIUS-5, enemy.x + (Math.random()-0.5)*60));
          b.y = b.obitoExitY != null ? b.obitoExitY : Math.max(RADIUS+5, Math.min(H-RADIUS-5, enemy.y + (Math.random()-0.5)*60));
          b.obitoExitX = null; b.obitoExitY = null;
          b.obitoKamuiPhase = 'chaining';
          b.obitoChainTimer = OBITO_KAMUI_CHAIN_DURATION;
          b.obitoChainPhase = false;
          state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1, color: '#cc44ff', t: 0.4 });
          playHitSound('trap_chain');
        }
        // 清除所有敵方在神威空間的狀態（含殘留 cap）
        if (state.obitoSpaceCaptures) {
          for (let ci = state.obitoSpaceCaptures.length - 1; ci >= 0; ci--) {
            const c = state.obitoSpaceCaptures[ci];
            if (c.owner === b.player && c.type === 'enemy') {
              const eb2 = state.balls.find(x => x.player === c.enemyPlayer);
              if (eb2) { eb2.obitoInSpace = false; eb2.obitoInSpaceTimer = 0; }
              state.obitoSpaceCaptures.splice(ci, 1);
            }
          }
        }
        const enemyBall = state.balls.find(x => x.player !== b.player);
        if (enemyBall && enemyBall.obitoInSpace) {
          enemyBall.obitoInSpace = false;
          enemyBall.obitoInSpaceTimer = 0;
        }
      }
    }

    // 神威 - 鎖鏈揮舞 + 起爆符
    if (phase === 'chaining') {
      b.obitoChainTimer -= dt;
      b.vx = 0; b.vy = 0;
      if (!b.obitoChainPhase) {
        // 鐵鏈傷害（範圍持續）
        const chainD = Math.hypot(enemy.x - b.x, enemy.y - b.y);
        if (chainD < OBITO_KAMUI_CHAIN_RADIUS + RADIUS) {
          dealDamage(enemy, OBITO_KAMUI_CHAIN_DAMAGE * dt * 60);
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 18, alpha: 0.7, color: '#cc44ff', t: 0.1 });
        }
        if (b.obitoChainTimer <= 0) {
          b.obitoChainPhase = true; // 進入起爆符階段
          b.obitoChainTimer = 0.5;
          // 起爆符：大範圍爆炸
          if (Math.hypot(enemy.x - b.x, enemy.y - b.y) < OBITO_KAMUI_BOMB_RADIUS + RADIUS) {
            dealDamage(enemy, OBITO_KAMUI_BOMB_DAMAGE);
            state.hitFlashes.push({ x: b.x, y: b.y, r: 70, alpha: 1.5, color: '#ff4400', t: 0.5 });
            playHitSound('vampire_dash');
          }
        }
      } else {
        // 甩飛（如果抓了敵人）
        if (b.obitoGrabTarget !== null || true) {
          // 甩飛傷害
          if (b.obitoChainTimer <= 0.3 && !b.obitoThrowDealt) {
            b.obitoThrowDealt = true;
            dealDamage(enemy, OBITO_KAMUI_THROW_DAMAGE);
            const throwAng = Math.random() * Math.PI * 2;
            enemy.vx = Math.cos(throwAng) * 400;
            enemy.vy = Math.sin(throwAng) * 400;
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 40, alpha: 1.2, color: '#ff6600', t: 0.4 });
            playHitSound('opm');
          }
        }
        if (b.obitoChainTimer <= 0) {
          b.obitoKamuiPhase = 'idle';
          b.obitoThrowDealt = false;
          const ang3 = Math.random() * Math.PI * 2;
          b.vx = Math.cos(ang3) * BASE_SPEED;
          b.vy = Math.sin(ang3) * BASE_SPEED;
        }
      }
    }
  }

  // 帶土：被抓入神威空間的敵人定身計時
  for (const b of state.balls) {
    if (b.obitoInSpace) {
      b.obitoInSpaceTimer -= dt;
      if (b.obitoInSpaceTimer <= 0) {
        b.obitoInSpace = false;
        b.obitoInSpaceTimer = 0;
        // 同步清除空間中對應的 enemy cap，防止帶土仍可「抓到」已返回主場地的敵人
        if (state.obitoSpaceCaptures) {
          for (let ci = state.obitoSpaceCaptures.length - 1; ci >= 0; ci--) {
            const c = state.obitoSpaceCaptures[ci];
            if (c.type === 'enemy' && c.enemyPlayer === b.player) {
              state.obitoSpaceCaptures.splice(ci, 1);
            }
          }
        }
      } else {
        b.vx = 0; b.vy = 0;
      }
    }
  }

  // 帶土：火球更新
  if (!state.dioWorldGlobalActive && state.obitoFireballs) {
    for (let i = state.obitoFireballs.length - 1; i >= 0; i--) {
      const fb = state.obitoFireballs[i];
      fb.x += fb.vx * dt;
      fb.y += fb.vy * dt;
      fb.life -= dt;
      fb.angle += dt * 6;
      if (fb.life <= 0) { state.obitoFireballs.splice(i, 1); continue; }
      // 碰牆消失
      let hit = false;
      if (fb.x - fb.r < WALL || fb.x + fb.r > W - WALL ||
          fb.y - fb.r < WALL || fb.y + fb.r > H - WALL) {
        state.obitoFireballs.splice(i, 1); continue;
      }
      // 碰敵人
      for (const b of state.balls) {
        if (b.player === fb.owner) continue;
        const dx = b.x - fb.x, dy = b.y - fb.y;
        if (Math.hypot(dx, dy) < RADIUS + fb.r) {
          dealDamage(b, OBITO_FIREBALL_DAMAGE);
          state.hitFlashes.push({ x: fb.x, y: fb.y, r: 30, alpha: 1, color: '#ff4400', t: 0.3 });
          playHitSound('knife');
          state.obitoFireballs.splice(i, 1); hit = true; break;
        }
      }
    }
  }

  // 帶土：神威空間捕獲物計時衰減 + 漂浮移動 + 假想子彈碰撞判定
  if (state.obitoSpaceCaptures) {
    for (let i = state.obitoSpaceCaptures.length - 1; i >= 0; i--) {
      const cap = state.obitoSpaceCaptures[i];
      cap.life -= dt;
      // 在空間視窗內漂浮移動，碰到邊界反彈，讓被抓的東西看起來真的飄在空間裡
      const margin = cap.type === 'enemy' ? 16 : 10;
      cap.x += cap.vx * dt;
      cap.y += cap.vy * dt;
      if (cap.x < margin) { cap.x = margin; cap.vx = Math.abs(cap.vx); }
      if (cap.x > OBITO_SPACE_W - margin) { cap.x = OBITO_SPACE_W - margin; cap.vx = -Math.abs(cap.vx); }
      if (cap.y < margin) { cap.y = margin; cap.vy = Math.abs(cap.vy); }
      if (cap.y > OBITO_SPACE_H - margin) { cap.y = OBITO_SPACE_H - margin; cap.vy = -Math.abs(cap.vy); }
      // 敵人如果血量0了或者不在空間中了就移除
      if (cap.life <= 0) {
        if (cap.type === 'enemy') {
          const enemyBall = state.balls.find(x => x.player === cap.enemyPlayer);
          if (enemyBall) { enemyBall.obitoInSpace = false; enemyBall.obitoInSpaceTimer = 0; }
        }
        state.obitoSpaceCaptures.splice(i, 1);
        continue;
      }
      // 假想子彈：碰撞判定（只有 projectile 類型）
      if (cap.type === 'projectile') {
        // 找對應的帶土（空間擁有者）
        const obitoB = state.balls.find(x => x.player === cap.owner && x.char.type === 'obito');
        if (!obitoB) continue;
        const HIT_R = 14; // 假想子彈碰撞半徑（空間座標）
        // 1. 碰到敵人（在神威空間中的敵人 cap）
        // 若帶土仍在 ghost 階段，假想子彈不應造成傷害，直接移除即可
        if (obitoB.obitoKamuiPhase === 'ghost') {
          // ghost 期間：假想子彈碰到虛影附近 → 無損，消除子彈
          const ghostDist = Math.hypot(cap.x - obitoB.obitoGhostX, cap.y - obitoB.obitoGhostY);
          if (ghostDist < HIT_R + 18) {
            state.hitFlashes.push({ x: obitoB.x, y: obitoB.y, r: 18, alpha: 0.5, color: '#888888', t: 0.25 });
            state.obitoSpaceCaptures.splice(i, 1);
            continue;
          }
          continue; // ghost 期間不觸發其他假想子彈邏輯
        }
        for (let j = state.obitoSpaceCaptures.length - 1; j >= 0; j--) {
          if (i === j) continue;
          const other = state.obitoSpaceCaptures[j];
          if (other.type !== 'enemy' || other.owner !== cap.owner) continue;
          const gd = Math.hypot(cap.x - other.x, cap.y - other.y);
          if (gd < HIT_R + 12) {
            const enemyBall = state.balls.find(x => x.player === other.enemyPlayer);
            if (enemyBall) {
              dealDamage(enemyBall, OBITO_PHANTOM_DAMAGE);
              state.hitFlashes.push({ x: enemyBall.x, y: enemyBall.y, r: 22, alpha: 1, color: '#cc44ff', t: 0.3 });
              playHitSound('knife');
            }
            state.obitoSpaceCaptures.splice(i, 1);
            break;
          }
        }
        if (i >= state.obitoSpaceCaptures.length) continue; // 已被移除
        // 2. 碰到帶土本人（in_space 或 grabbing 階段）→ 彈出空間
        if (['in_space','grabbing'].includes(obitoB.obitoKamuiPhase)) {
          const gd = Math.hypot(cap.x - obitoB.obitoSpaceX, cap.y - obitoB.obitoSpaceY);
          if (gd < HIT_R + RADIUS * 0.8) {
            // 帶土被彈出，施加硬直懲罰
            obitoB.obitoKamuiPhase = 'returning';
            obitoB.obitoTeleportTimer = 0.3;
            obitoB.obitoGrabTarget = null;
            obitoB.obitoInSpaceCounter = 0;
            obitoB.obitoEjectStun = 1.2; // 1.2秒無法攻擊
            state.hitFlashes.push({ x: obitoB.x, y: obitoB.y, r: 35, alpha: 1.2, color: '#ff4400', t: 0.4 });
            playHitSound('opm');
            state.obitoSpaceCaptures.splice(i, 1);
            continue;
          }
          // 3. 帶土衝刺抓人路線上：判斷假想子彈是否在帶土與目標之間
          if (obitoB.obitoKamuiPhase === 'grabbing') {
            const targetCap = state.obitoSpaceCaptures.find(c => c.type === 'enemy' && c.owner === cap.owner);
            if (targetCap) {
              // 計算點到線段的距離（帶土位置 → 目標位置的路線）
              const ax = obitoB.obitoSpaceX, ay = obitoB.obitoSpaceY;
              const bx2 = targetCap.x, by2 = targetCap.y;
              const cx2 = cap.x, cy2 = cap.y;
              const ab = Math.hypot(bx2-ax, by2-ay) || 1;
              const t2 = Math.max(0, Math.min(1, ((cx2-ax)*(bx2-ax) + (cy2-ay)*(by2-ay)) / (ab*ab)));
              const nearX = ax + t2*(bx2-ax), nearY = ay + t2*(by2-ay);
              const distToLine = Math.hypot(cx2-nearX, cy2-nearY);
              if (distToLine < HIT_R + 10 && t2 > 0.05 && t2 < 0.95) {
                obitoB.obitoKamuiPhase = 'returning';
                obitoB.obitoTeleportTimer = 0.3;
                obitoB.obitoGrabTarget = null;
                obitoB.obitoInSpaceCounter = 0;
                obitoB.obitoEjectStun = 1.2;
                state.hitFlashes.push({ x: obitoB.x, y: obitoB.y, r: 35, alpha: 1.2, color: '#ff4400', t: 0.4 });
                playHitSound('opm');
                state.obitoSpaceCaptures.splice(i, 1);
                continue;
              }
            }
          }
        }
      }
    }
  }

  // 麻痺定身特效更新
  if (state.thunderStunFX) {
    for (let i = state.thunderStunFX.length - 1; i >= 0; i--) {
      state.thunderStunFX[i].life -= dt;
      if (state.thunderStunFX[i].life <= 0) state.thunderStunFX.splice(i, 1);
    }
  }

  // 星隕預警更新
  for (let i = state.starMeteorWarnings.length - 1; i >= 0; i--) {
    state.starMeteorWarnings[i].life -= dt;
    if (state.starMeteorWarnings[i].life <= 0) state.starMeteorWarnings.splice(i, 1);
  }

  // 星隕佇列：預警倒數完後生成流星（DIO 時停中暫停）
  if (!state.dioWorldGlobalActive) {
  for (let i = state.starMeteorQueue.length - 1; i >= 0; i--) {
    const q = state.starMeteorQueue[i];
    q.delay -= dt;
    if (q.delay <= 0) {
      state.starMeteors.push({
        x: q.tx, y: -20,
        vx: 0, vy: STAR_METEOR_SPEED,
        owner: q.owner, color: q.color,
        life: (q.ty + 40) / STAR_METEOR_SPEED + 0.3,
      });
      state.starMeteorQueue.splice(i, 1);
    }
  }
  }

  // ── 虎天帝邏輯 ──
  for (const b of state.balls) {
    if (b.char.type !== 'tiger') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 被動一：流血池持續扣血（對所有角色）
  }
  // 流血池對所有角色生效
  for (const b of state.balls) {
    if ((b.tigerBleedPool || 0) > 0) {
      const bleedTick = Math.min(b.tigerBleedPool, TIGER_BLEED_DPS * dt);
      b.hp = Math.max(0, b.hp - bleedTick);
      b.tigerBleedPool -= bleedTick;
      if (b.tigerBleedPool < 0) b.tigerBleedPool = 0;
      // 流血特效：紅色粒子
      if (Math.random() < 0.3) {
        const ang = Math.random() * Math.PI * 2;
        if (!state.tigerCurseFX) state.tigerCurseFX = [];
        state.tigerCurseFX.push({
          x: b.x + Math.cos(ang) * (RADIUS * 0.6),
          y: b.y + Math.sin(ang) * (RADIUS * 0.6),
          vx: Math.cos(ang) * 30 + (Math.random()-0.5)*20,
          vy: -20 - Math.random() * 40,
          life: 0.5, maxLife: 0.5, r: 3, color: '#cc0000', isBleed: true
        });
      }
    }
  }

  for (const b of state.balls) {
    if (b.char.type !== 'tiger') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 技能一：徑庭拳 蓄力→出拳（僅在周圍有單位/敵人進入範圍時才會觸發）
    if (b.tigerPunchTimer > 0) b.tigerPunchTimer -= dt;

    const distToEnemy = Math.hypot(enemy.x - b.x, enemy.y - b.y);
    if (!b.tigerCharging && b.tigerPunchTimer <= 0 && distToEnemy < TIGER_PUNCH_RANGE) {
      if (b.thunderParalyzed > 0) {
        b.thunderParalyzed = 0;
        b.thunderStunTimer = 0.5; // 打斷定身 0.5 秒
        b.vx = 0; b.vy = 0;
        state.thunderStunFX = state.thunderStunFX || [];
        state.thunderStunFX.push({ x: b.x, y: b.y, life: 0.5, maxLife: 0.5 });
        state.hitFlashes.push({ x: b.x, y: b.y, r: 24, alpha: 0.8, color: '#f1c40f', t: 0.4 });
        b.tigerPunchTimer = TIGER_PUNCH_INTERVAL * 0.5; // 打斷：短暫冷卻
      } else {
      // 開始蓄力：停下來
      b.tigerCharging = true;
      b.tigerChargeTimer = 0;
      b.tigerBlackFlash = Math.random() < TIGER_BLACK_FLASH_CHANCE;
      // 蓄力視覺特效
      if (!state.tigerPunchFX) state.tigerPunchFX = [];
      state.tigerPunchFX.push({ x: b.x, y: b.y, type: 'charge', life: TIGER_PUNCH_CHARGE_TIME, maxLife: TIGER_PUNCH_CHARGE_TIME, owner: b.player });
      } // end else (not paralyzed)
    }

    if (b.tigerCharging) {
      b.tigerChargeTimer += dt;
      // 蓄力中輕微縮減移動（視覺蓄力感）
      b.vx *= 0.85; b.vy *= 0.85;

      if (b.tigerChargeTimer >= TIGER_PUNCH_CHARGE_TIME) {
        b.tigerCharging = false;
        b.tigerPunchTimer = TIGER_PUNCH_INTERVAL;

        // 是否黑閃
        const isBlack = b.tigerBlackFlash;
        const dmg1 = isBlack ? TIGER_PUNCH_DMG1 * TIGER_BLACK_FLASH_MUL1 : TIGER_PUNCH_DMG1;
        const dmg2 = isBlack ? TIGER_PUNCH_DMG2 * TIGER_BLACK_FLASH_MUL2 : TIGER_PUNCH_DMG2;

        // 範圍判定
        const dist = Math.hypot(enemy.x - b.x, enemy.y - b.y);
        if (dist < TIGER_PUNCH_RANGE) {
          dealDamage(enemy, dmg1);
          // 擊退
          const kx = (enemy.x - b.x) / (dist || 1), ky = (enemy.y - b.y) / (dist || 1);
          enemy.vx += kx * TIGER_PUNCH_KNOCKBACK;
          enemy.vy += ky * TIGER_PUNCH_KNOCKBACK;

          // 藍色咒力特效（敵方受傷）
          if (!state.tigerCurseFX) state.tigerCurseFX = [];
          for (let ci = 0; ci < 8; ci++) {
            const ca = Math.random() * Math.PI * 2;
            const cspd = 60 + Math.random() * 100;
            state.tigerCurseFX.push({ x: enemy.x, y: enemy.y, vx: Math.cos(ca)*cspd, vy: Math.sin(ca)*cspd, life: 0.5, maxLife: 0.5, r: 5, color: '#4488ff', isBleed: false });
          }
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 35, alpha: 1.1, color: '#ff4400', t: 0.25 });

          // 二段傷害（延遲）
          b.tigerPendingSecond = true;
          b.tigerPendingTimer = TIGER_PUNCH_DELAY2;
          b.tigerPendingDmg = dmg2;
          b.tigerPendingTarget = enemy;
          b.tigerPendingKx = kx; b.tigerPendingKy = ky;

          // 黑閃特效（觸發瞬間立即清除自己的流血池並轉化為回血）
          if (isBlack) {
            if (!state.tigerBlackFlashFX) state.tigerBlackFlashFX = [];
            for (let bi = 0; bi < 12; bi++) {
              const ba = Math.random() * Math.PI * 2;
              state.tigerBlackFlashFX.push({ x: b.x, y: b.y, angle: ba, len: 20 + Math.random()*30, life: 0.4, maxLife: 0.4, owner: b.player });
            }
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 55, alpha: 1.3, color: '#000000', t: 0.35 });
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30, alpha: 1.0, color: '#8800ff', t: 0.25 });
            playHitSound('opm');

            // 黑閃：出拳瞬間清除自己的流血池，轉化為直接回復血量
            const clearAmt = Math.min(b.tigerBleedPool || 0, (dmg1 + dmg2) * 1.5);
            if (clearAmt > 0) {
              b.tigerBleedPool -= clearAmt;
              b.hp = Math.min(MAX_HP, b.hp + clearAmt);
              state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.0, color: '#22cc66', t: 0.3 });
            }
            state.hitFlashes.push({ x: b.x, y: b.y, r: 18, alpha: 0.8, color: '#330066', t: 0.2 });
          } else {
            playHitSound('curse_slash');
          }

          // 出拳特效：記錄起點(虎天帝位置)，讓拳影從本體打出
          if (!state.tigerPunchFX) state.tigerPunchFX = [];
          state.tigerPunchFX.push({ sx: b.x, sy: b.y, x: enemy.x, y: enemy.y, type: 'hit', life: 0.3, maxLife: 0.3, isBlack, owner: b.player });
        } else {
          // 打空：出拳特效（往前延伸）
          const pAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          if (!state.tigerPunchFX) state.tigerPunchFX = [];
          state.tigerPunchFX.push({ sx: b.x, sy: b.y, x: b.x + Math.cos(pAngle)*RADIUS*1.5, y: b.y + Math.sin(pAngle)*RADIUS*1.5, type: 'miss', life: 0.2, maxLife: 0.2, angle: pAngle, isBlack: false, owner: b.player });
          playHitSound('curse_slash');
        }
      }
    }

    // 二段傷害倒數
    if (b.tigerPendingSecond) {
      b.tigerPendingTimer -= dt;
      if (b.tigerPendingTimer <= 0) {
        b.tigerPendingSecond = false;
        const tgt = b.tigerPendingTarget;
        if (tgt && tgt.hp > 0) {
          dealDamage(tgt, b.tigerPendingDmg);
          tgt.vx += (b.tigerPendingKx || 0) * TIGER_PUNCH_KNOCKBACK * 0.6;
          tgt.vy += (b.tigerPendingKy || 0) * TIGER_PUNCH_KNOCKBACK * 0.6;
          // 藍色咒力追加特效
          if (!state.tigerCurseFX) state.tigerCurseFX = [];
          for (let ci = 0; ci < 6; ci++) {
            const ca = Math.random() * Math.PI * 2;
            state.tigerCurseFX.push({ x: tgt.x, y: tgt.y, vx: Math.cos(ca)*80, vy: Math.sin(ca)*80, life: 0.4, maxLife: 0.4, r: 4, color: '#4488ff', isBleed: false });
          }
          state.hitFlashes.push({ x: tgt.x, y: tgt.y, r: 22, alpha: 0.9, color: '#aa2200', t: 0.2 });
          playHitSound('knife');
        }
      }
    }

    // 技能二：穿血（倒數自動射出）
    if (b.tigerBloodCooldown > 0) b.tigerBloodCooldown -= dt;

    if (b.tigerBloodCooldown <= 0 && !b.tigerCharging) {
      b.tigerBloodCooldown = TIGER_BLOODSHOT_COOLDOWN;
      const bsCost = Math.min(b.hp * 0.9, TIGER_BLOODSHOT_COST); // 不致命
      if (b.hp > bsCost + 10) {
        // 扣自身血：與一般受傷一樣，部分轉入流血池慢扣，不直接整段扣空
        const selfBleedAmt = Math.min(bsCost * TIGER_BLEED_RATIO, TIGER_BLEED_MAX_POOL - (b.tigerBleedPool || 0));
        if (selfBleedAmt > 0) {
          b.tigerBleedPool = (b.tigerBleedPool || 0) + selfBleedAmt;
        }
        b.hp = Math.max(0, b.hp - (bsCost - selfBleedAmt));
        if (state.stats) state.stats[b.player === 1 ? 2 : 1].totalDmg += 0; // 自傷不計對手傷害

        const angle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
        state.projectiles.push({
          x: b.x + Math.cos(angle)*(RADIUS+5),
          y: b.y + Math.sin(angle)*(RADIUS+5),
          vx: Math.cos(angle)*TIGER_BLOODSHOT_SPEED,
          vy: Math.sin(angle)*TIGER_BLOODSHOT_SPEED,
          type: 'bloodshot', owner: b.player, color: '#dd0022',
          damage: TIGER_BLOODSHOT_DMG, r: 6, active: true, angle
        });
        playHitSound('knife');
        state.hitFlashes.push({ x: b.x, y: b.y, r: 18, alpha: 0.7, color: '#aa0000', t: 0.2 });
      }
    }

    // 技能三：超新星（達成條件後先在原地蓄力，蓄滿才引爆）
    if (b.tigerNovaCooldown > 0) b.tigerNovaCooldown -= dt;

    if (!b.tigerNovaActive && !b.tigerNovaCharging && b.tigerNovaCooldown <= 0) {
      const myOrbs = (state.tigerBloodOrbs || []).filter(o => o.owner === b.player);
      if (myOrbs.length >= TIGER_NOVA_THRESHOLD) {
        // 開始原地蓄力：立即定身（歸零速度），如同被束縛
        b.tigerNovaCharging = true;
        b.tigerNovaChargeTimer = 0;
        b.vx = 0; b.vy = 0;
        playHitSound('curse_slash');
      }
    }

    if (b.tigerNovaCharging) {
      b.tigerNovaChargeTimer += dt;
      // 蓄力中完全定身不動，如同被束縛
      b.vx = 0; b.vy = 0;

      if (b.tigerNovaChargeTimer >= TIGER_NOVA_CHARGE_TIME) {
        b.tigerNovaCharging = false;
        // 蓄力結束時重新取得當前血球（蓄力期間血球可能變化）
        const myOrbs = (state.tigerBloodOrbs || []).filter(o => o.owner === b.player);
        if (myOrbs.length > 0) {
          b.tigerNovaActive = true;
          b.tigerNovaCooldown = TIGER_NOVA_COOLDOWN;
          // 引爆所有血球，從每顆血球噴出血流針
          for (const orb of myOrbs) {
            for (let ni = 0; ni < TIGER_NOVA_NEEDLE_COUNT; ni++) {
              const na = (Math.PI * 2 / TIGER_NOVA_NEEDLE_COUNT) * ni;
              if (!state.tigerNovaNeedles) state.tigerNovaNeedles = [];
              state.tigerNovaNeedles.push({
                x: orb.x, y: orb.y,
                vx: Math.cos(na) * TIGER_NOVA_NEEDLE_SPEED,
                vy: Math.sin(na) * TIGER_NOVA_NEEDLE_SPEED,
                owner: b.player, damage: TIGER_NOVA_NEEDLE_DMG,
                life: TIGER_NOVA_NEEDLE_RANGE / TIGER_NOVA_NEEDLE_SPEED,
                color: '#ff0044', r: 4, active: true, angle: na
              });
            }
            state.hitFlashes.push({ x: orb.x, y: orb.y, r: 40, alpha: 1.2, color: '#ff0044', t: 0.5 });
          }
          // 清空該玩家血球
          state.tigerBloodOrbs = (state.tigerBloodOrbs || []).filter(o => o.owner !== b.player);
          playHitSound('vampire_dash');
          setTimeout(() => { b.tigerNovaActive = false; }, 200);
        } else {
          // 蓄力期間血球被清空，視為冷卻浪費一半時間，避免無限重試
          b.tigerNovaCooldown = TIGER_NOVA_COOLDOWN * 0.5;
        }
      }
    }
  }

  // 大喬（波紋使者）：波紋呼吸法狀態機、波紋疾走／彈簧拳／Sunlight Yellow Overdrive
  for (const b of state.balls) {
    if (b.char.type !== 'joseph') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace || (b.arenaFrozen > 0)) continue;
    if (b.gunnerStunTimer > 0) continue; // 被閃光彈暈眩：暫停波紋呼吸法與所有技能判定
    if (!b.josephDioHpCostDone && enemy.char.type === 'dio') {
      b.josephDioHpCostDone = true;
      b.hp = Math.max(1, b.hp - JOSEPH_DIO_START_HP_COST);
      b.josephState = 'breathing';
      b.josephBreathingTimer = 0;
      b.josephRegenTimer = JOSEPH_HP_REGEN_INTERVAL;
      b.josephChargeTimer = 0;
      b.josephRetryTimer = 0;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1, color: '#2f7dc0', t: 0.5 });
    }

    // 開局至今經過秒數（僅在尚未成功進入呼吸法前累計，判定60秒時限）
    if (b.josephState === 'charging' || b.josephState === 'waiting') {
      b.josephAttemptClock += dt;
    }

    if (b.josephState === 'charging') {
      b.josephChargeTimer += dt;
      b.vx = 0; b.vy = 0; // 蓄力期間原地不動
      if (b.josephChargeTimer >= JOSEPH_CHARGE_TIME) {
        b.josephState = 'breathing';
        b.josephBreathingTimer = 0;
        b.josephRegenTimer = JOSEPH_HP_REGEN_INTERVAL;
        state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1, color: '#66ccff', t: 0.5 });
        playHitSound('curse_slash');
      } else if (b.josephAttemptClock >= JOSEPH_ATTEMPT_DEADLINE) {
        b.josephState = 'failed'; // 超過時限仍未成功，放棄嘗試，維持素體狀態
      }
    } else if (b.josephState === 'waiting') {
      b.josephRetryTimer -= dt;
      if (b.josephAttemptClock >= JOSEPH_ATTEMPT_DEADLINE) {
        b.josephState = 'failed';
      } else if (b.josephRetryTimer <= 0) {
        b.josephState = 'charging';
        b.josephChargeTimer = 0;
      }
    } else if (b.josephState === 'breathing') {
      b.josephBreathingTimer += dt;
      if (!b.josephUltimateReady && b.josephBreathingTimer >= JOSEPH_ULTIMATE_UNLOCK) {
        b.josephUltimateReady = true;
      }
      b.josephRegenTimer -= dt;
      if (b.josephRegenTimer <= 0) {
        b.josephRegenTimer = JOSEPH_HP_REGEN_INTERVAL;
        b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_AMOUNT);
        state.hitFlashes.push({ x: b.x, y: b.y, r: 16, alpha: 0.6, color: '#66ccff', t: 0.3 });
      }
    }
    // 'failed' 狀態：不再嘗試蓄力，維持素體（無技能，碰觸傷害固定5，見球球碰撞區塊）

    if (b.josephUltimateCooldown > 0) b.josephUltimateCooldown -= dt;
    const jDistToEnemy = Math.hypot(enemy.x - b.x, enemy.y - b.y);

    if (b.josephUltimateActive) {
      // Sunlight Yellow Overdrive 連續痛擊進行中：雙方定身
      b.vx = 0; b.vy = 0;
      const tgt = b.josephUltimateTarget;
      if (tgt) { tgt.vx = 0; tgt.vy = 0; }
      b.josephUltimateTimer -= dt;
      if (b.josephUltimateTimer <= 0 && tgt) {
        b.josephUltimateStep++;
        const isFinalHit = b.josephUltimateStep >= JOSEPH_ULTIMATE_COMBO_HITS;
        const perHitDmg = JOSEPH_ULTIMATE_COMBO_DMG / JOSEPH_ULTIMATE_COMBO_HITS;
        dealDamage(tgt, perHitDmg);
        b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_ON_HIT);
        state.hitFlashes.push({ x: tgt.x, y: tgt.y, r: 22, alpha: 0.9, color: '#ffe066', t: 0.2 });
        state.josephPunchFX.push({ x: b.x, y: b.y, tx: tgt.x, ty: tgt.y, side: (b.josephUltimateStep % 2 === 0 ? 1 : -1), life: 0.2, maxLife: 0.2, owner: b.player, style: 'combo' });
        playHitSound('opm');
        if (isFinalHit) {
          const vsDio = tgt.char.type === 'dio';
          if (vsDio) {
            dealDamage(tgt, JOSEPH_ULTIMATE_DIO_PIERCE);
            tgt.rippleStacks = (tgt.rippleStacks || 0) + JOSEPH_ULTIMATE_DIO_STACK;
          } else {
            dealDamage(tgt, JOSEPH_ULTIMATE_FINAL_DMG);
            tgt.rippleStacks = (tgt.rippleStacks || 0) + JOSEPH_ULTIMATE_FINAL_STACK;
          }
          b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_ON_HIT);
          const kdx = tgt.x - b.x, kdy = tgt.y - b.y;
          const kd = Math.hypot(kdx, kdy) || 1;
          tgt.vx += (kdx / kd) * JOSEPH_ULTIMATE_FINAL_KNOCKBACK;
          tgt.vy += (kdy / kd) * JOSEPH_ULTIMATE_FINAL_KNOCKBACK;
          state.josephPunchFX.push({ x: b.x, y: b.y, tx: tgt.x, ty: tgt.y, angle: Math.atan2(kdy, kdx), life: 0.4, maxLife: 0.4, owner: b.player, style: 'final' });
          state.hitFlashes.push({ x: tgt.x, y: tgt.y, r: 34, alpha: 1.1, color: '#ffcc00', t: 0.4 });
          playHitSound('curse_slash');
          b.josephUltimateActive = false;
          b.josephUltimateStep = 0;
          b.josephUltimateTarget = null;
          tgt.frozenByJoseph = false;
          tgt.frozenByJosephTimer = 0;
        } else {
          b.josephUltimateTimer = JOSEPH_ULTIMATE_COMBO_INTERVAL;
        }
      }
    } else if (b.josephState === 'breathing' && b.josephUltimateReady && b.josephUltimateCooldown <= 0 && jDistToEnemy < JOSEPH_ULTIMATE_RANGE) {
      // 發動 Sunlight Yellow Overdrive：第一拳
      b.josephUltimateCooldown = JOSEPH_ULTIMATE_COOLDOWN;
      dealDamage(enemy, JOSEPH_ULTIMATE_FIRST_DMG);
      b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_ON_HIT);
      state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 26, alpha: 1, color: '#ffe066', t: 0.3 });
      state.josephPunchFX.push({ x: b.x, y: b.y, tx: enemy.x, ty: enemy.y, life: 0.28, maxLife: 0.28, owner: b.player, style: 'first' });
      playHitSound('opm');
      // 這一拳命中，敵人停止攻擊與移動，展開連續痛擊
      enemy.frozenByJoseph = true;
      enemy.frozenByJosephTimer = (JOSEPH_ULTIMATE_COMBO_HITS * JOSEPH_ULTIMATE_COMBO_INTERVAL) + 0.6;
      b.josephUltimateActive = true;
      b.josephUltimateStep = 0;
      b.josephUltimateTimer = JOSEPH_ULTIMATE_COMBO_INTERVAL;
      b.josephUltimateTarget = enemy;
      b.vx = 0; b.vy = 0;
    } else {
      // 波紋疾走／彈簧拳（僅在波紋呼吸法型態下可用）
      if (b.josephDashTimer > 0) b.josephDashTimer -= dt;
      if (b.josephSpringTimer > 0) b.josephSpringTimer -= dt;
      if (b.josephState === 'breathing') {
        if (b.josephDashTimer <= 0 && jDistToEnemy < JOSEPH_DASH_RANGE) {
          b.josephDashTimer = JOSEPH_DASH_COOLDOWN;
          dealDamage(enemy, JOSEPH_DASH_DAMAGE);
          b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_ON_HIT);
          enemy.rippleStacks = (enemy.rippleStacks || 0) + JOSEPH_DASH_STACK;
          const dashAng = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          state.josephPunchFX.push({ x: b.x, y: b.y, angle: dashAng, dist: jDistToEnemy, life: 0.22, maxLife: 0.22, owner: b.player, style: 'dash' });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 20, alpha: 0.85, color: '#4aa8ff', t: 0.25 });
          playHitSound('knife');
        } else if (b.josephSpringTimer <= 0 && jDistToEnemy < JOSEPH_SPRING_RANGE && jDistToEnemy >= JOSEPH_DASH_RANGE) {
          b.josephSpringTimer = JOSEPH_SPRING_COOLDOWN;
          dealDamage(enemy, JOSEPH_SPRING_DAMAGE);
          b.hp = Math.min(MAX_HP, b.hp + JOSEPH_HP_REGEN_ON_HIT);
          enemy.rippleStacks = (enemy.rippleStacks || 0) + JOSEPH_SPRING_STACK;
          const springAng = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          state.josephPunchFX.push({ x: b.x, y: b.y, angle: springAng, dist: jDistToEnemy, life: 0.42, maxLife: 0.42, owner: b.player, style: 'spring' });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 24, alpha: 0.9, color: '#2f7dc0', t: 0.3 });
          playHitSound('curse_slash');
        }
      }
    }
  }

  // 虎天帝：血球壽命更新
  if (state.tigerBloodOrbs) {
    for (let i = state.tigerBloodOrbs.length - 1; i >= 0; i--) {
      state.tigerBloodOrbs[i].life -= dt;
      if (state.tigerBloodOrbs[i].life <= 0) state.tigerBloodOrbs.splice(i, 1);
    }
  }

  // 虎天帝：超新星血流針移動
  if (state.tigerNovaNeedles) {
    for (let i = state.tigerNovaNeedles.length - 1; i >= 0; i--) {
      const needle = state.tigerNovaNeedles[i];
      needle.x += needle.vx * dt; needle.y += needle.vy * dt;
      needle.life -= dt;
      if (!needle.active || needle.life <= 0) { state.tigerNovaNeedles.splice(i, 1); continue; }
      // 命中判定
      const needleEnemy = state.balls.find(x => x.player !== needle.owner);
      if (needleEnemy && Math.hypot(needleEnemy.x - needle.x, needleEnemy.y - needle.y) < RADIUS + needle.r) {
        dealDamage(needleEnemy, needle.damage);
        if (!state.tigerCurseFX) state.tigerCurseFX = [];
        for (let ci = 0; ci < 4; ci++) {
          const ca = Math.random() * Math.PI * 2;
          state.tigerCurseFX.push({ x: needleEnemy.x, y: needleEnemy.y, vx: Math.cos(ca)*60, vy: Math.sin(ca)*60, life: 0.3, maxLife: 0.3, r: 3, color: '#4488ff', isBleed: false });
        }
        state.hitFlashes.push({ x: needleEnemy.x, y: needleEnemy.y, r: 16, alpha: 0.9, color: '#ff0044', t: 0.18 });
        state.tigerNovaNeedles.splice(i, 1);
      }
    }
  }

  // 虎天帝：咒力/流血粒子更新
  if (state.tigerCurseFX) {
    for (let i = state.tigerCurseFX.length - 1; i >= 0; i--) {
      const p = state.tigerCurseFX[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 80 * dt;
      p.life -= dt;
      if (p.life <= 0) state.tigerCurseFX.splice(i, 1);
    }
  }
  if (state.tigerPunchFX) {
    for (let i = state.tigerPunchFX.length - 1; i >= 0; i--) {
      state.tigerPunchFX[i].life -= dt;
      if (state.tigerPunchFX[i].life <= 0) state.tigerPunchFX.splice(i, 1);
    }
  }
  if (state.tigerBlackFlashFX) {
    for (let i = state.tigerBlackFlashFX.length - 1; i >= 0; i--) {
      state.tigerBlackFlashFX[i].life -= dt;
      if (state.tigerBlackFlashFX[i].life <= 0) state.tigerBlackFlashFX.splice(i, 1);
    }
  }

  // ══════════════ 釣魚佬邏輯 ══════════════
  for (const b of state.balls) {
    if (b.char.type !== 'fisherman') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // ── 大海：海浪 + 坐船勾甩（優先於一切，直到序列結束）──
    if (b.fisherOceanPhase) {
      if (b.fisherOceanPhase === 'waves') {
        b.vx = 0; b.vy = 0;
        b.fisherOceanTimer -= dt;
        if (b.fisherOceanTimer <= 0 && b.fisherOceanWaveIdx < FISHER_OCEAN_WAVE_COUNT) {
          b.fisherOceanWaveIdx++;
          state.fisherOceanWaves.push({ x: -FISHER_OCEAN_WAVE_WIDTH, owner: b.player, hit: false });
          b.fisherOceanTimer = FISHER_OCEAN_WAVE_GAP;
          playHitSound('bottle');
        } else if (b.fisherOceanWaveIdx >= FISHER_OCEAN_WAVE_COUNT && b.fisherOceanTimer <= 0) {
          b.fisherOceanPhase = 'dashwait';
          b.fisherOceanTimer = 0.35;
        }
      } else if (b.fisherOceanPhase === 'dashwait') {
        b.vx = 0; b.vy = 0;
        b.fisherOceanTimer -= dt;
        if (b.fisherOceanTimer <= 0) {
          b.fisherOceanDashAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
          b.fisherOceanPhase = 'dash';
          state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.2, color: '#66ccff', t: 0.3 });
        }
      } else if (b.fisherOceanPhase === 'dash') {
        b.vx = Math.cos(b.fisherOceanDashAngle) * FISHER_OCEAN_DASH_SPEED;
        b.vy = Math.sin(b.fisherOceanDashAngle) * FISHER_OCEAN_DASH_SPEED;
        const dd = Math.hypot(enemy.x - b.x, enemy.y - b.y);
        if (dd < RADIUS * 2 + 14) {
          dealDamage(enemy, FISHER_OCEAN_HOOK_DMG);
          b.vx = 0; b.vy = 0;
          enemy.vx = 0; enemy.vy = 0;
          enemy.fisherGrabbedBy = b.player;
          const dirx = Math.cos(b.fisherOceanDashAngle), diry = Math.sin(b.fisherOceanDashAngle);
          b.fisherOceanTargetX = Math.max(RADIUS + 10, Math.min(W - RADIUS - 10, enemy.x + dirx * 600));
          b.fisherOceanTargetY = Math.max(RADIUS + 10, Math.min(H - RADIUS - 10, enemy.y + diry * 600));
          b.fisherOceanPhase = 'grab';
          b.fisherOceanTimer = FISHER_OCEAN_GRAB_HOLD;
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 24, alpha: 1, color: '#4a90d9', t: 0.3 });
          playHitSound('knife');
        }
      } else if (b.fisherOceanPhase === 'grab') {
        b.vx = 0; b.vy = 0;
        enemy.vx = 0; enemy.vy = 0;
        enemy.x = b.x; enemy.y = b.y;
        b.fisherOceanTimer -= dt;
        if (b.fisherOceanTimer <= 0) {
          b.fisherOceanPhase = 'slam';
          b.fisherOceanTimer = 0.2;
          b._fisherSlamDur = 0.2;
        }
      } else if (b.fisherOceanPhase === 'slam') {
        b.vx = 0; b.vy = 0;
        enemy.vx = 0; enemy.vy = 0;
        const dur = b._fisherSlamDur || 0.2;
        const t2 = Math.max(0, Math.min(1, 1 - b.fisherOceanTimer / dur));
        enemy.x = b.x + (b.fisherOceanTargetX - b.x) * t2;
        enemy.y = b.y + (b.fisherOceanTargetY - b.y) * t2;
        b.fisherOceanTimer -= dt;
        if (b.fisherOceanTimer <= 0) {
          dealDamage(enemy, FISHER_OCEAN_SLAM_DMG);
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 46, alpha: 1.3, color: '#4a90d9', t: 0.4 });
          state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 20, alpha: 1, color: '#ffffff', t: 0.25 });
          playHitSound('opm');
          const kAng = Math.atan2(enemy.y - b.y, enemy.x - b.x) || Math.random() * Math.PI * 2;
          enemy.vx = Math.cos(kAng) * BASE_SPEED * 1.5;
          enemy.vy = Math.sin(kAng) * BASE_SPEED * 1.5;
          enemy.fisherGrabbedBy = null;
          b.fisherOceanPhase = null;
          b.fisherTimer = 0;
        }
      }
      continue; // 大海序列進行中，跳過一般釣魚流程
    }

    // ── 一般釣魚流程：拋竿 → 咬鉤 → 收線 → 結算 ──
    if (b.fisherPhase === 'idle') {
      b.fisherTimer += dt;
      if (b.fisherTimer >= FISHER_CAST_COOLDOWN) {
        const distLeft = b.x - RADIUS, distRight = (W - RADIUS) - b.x, distTop = b.y - RADIUS, distBottom = (H - RADIUS) - b.y;
        const minD = Math.min(distLeft, distRight, distTop, distBottom);
        let tx = b.x, ty = b.y;
        if (minD === distLeft) tx = RADIUS;
        else if (minD === distRight) tx = W - RADIUS;
        else if (minD === distTop) ty = RADIUS;
        else ty = H - RADIUS;
        b.fisherHookFromX = b.x; b.fisherHookFromY = b.y;
        b.fisherHookToX = tx; b.fisherHookToY = ty;
        b.fisherHookX = b.x; b.fisherHookY = b.y;
        b.fisherPhase = 'casting';
        b.fisherPhaseTimer = FISHER_CAST_TIME;
      }
    } else if (b.fisherPhase === 'casting') {
      b.fisherPhaseTimer -= dt;
      const prog = Math.max(0, Math.min(1, 1 - b.fisherPhaseTimer / FISHER_CAST_TIME));
      b.fisherHookX = b.fisherHookFromX + (b.fisherHookToX - b.fisherHookFromX) * prog;
      b.fisherHookY = b.fisherHookFromY + (b.fisherHookToY - b.fisherHookFromY) * prog;
      if (b.fisherPhaseTimer <= 0) {
        b.fisherResult = fisherRollResult();
        b.fisherPhase = 'waiting';
        b.fisherPhaseTimer = FISHER_BITE_TIME;
        state.hitFlashes.push({ x: b.fisherHookX, y: b.fisherHookY, r: 12, alpha: 1, color: '#ffffff', t: 0.2 });
      }
    } else if (b.fisherPhase === 'waiting') {
      b.fisherPhaseTimer -= dt;
      if (b.fisherPhaseTimer <= 0) {
        b.fisherPhase = 'reeling';
        b.fisherPhaseTimer = FISHER_REEL_TIME;
      }
    } else if (b.fisherPhase === 'reeling') {
      b.fisherPhaseTimer -= dt;
      const prog = Math.max(0, Math.min(1, 1 - b.fisherPhaseTimer / FISHER_REEL_TIME));
      b.fisherHookX = b.fisherHookToX + (b.fisherHookFromX - b.fisherHookToX) * prog;
      b.fisherHookY = b.fisherHookToY + (b.fisherHookFromY - b.fisherHookToY) * prog;
      if (b.fisherPhaseTimer <= 0) {
        fisherResolveResult(b, enemy);
        b.fisherPhase = 'idle';
        b.fisherTimer = 0;
      }
    }
  }

  // 釣魚佬：首領魚魚群佇列發射
  for (let i = state.fisherSchoolQueue.length - 1; i >= 0; i--) {
    const q = state.fisherSchoolQueue[i];
    q.timer -= dt;
    if (q.timer <= 0) {
      const caster = state.balls.find(x => x.player === q.owner);
      const target = state.balls.find(x => x.player !== q.owner);
      if (caster && target) {
        const ang = Math.atan2(target.y - caster.y, target.x - caster.x) + randBetween(-0.15, 0.15);
        state.projectiles.push({
          x: caster.x, y: caster.y, vx: Math.cos(ang) * FISHER_BOSSFISH_SPEED, vy: Math.sin(ang) * FISHER_BOSSFISH_SPEED,
          type: 'fisher_school', owner: q.owner, damage: FISHER_BOSSFISH_DMG, r: 8, active: true
        });
      }
      state.fisherSchoolQueue.splice(i, 1);
    }
  }

  // 釣魚佬：大海海浪移動與命中判定
  for (let i = state.fisherOceanWaves.length - 1; i >= 0; i--) {
    const wv = state.fisherOceanWaves[i];
    wv.x += FISHER_OCEAN_WAVE_SPEED * dt;
    const target = state.balls.find(x => x.player !== wv.owner);
    if (target && !wv.hit && Math.abs(target.x - wv.x) < FISHER_OCEAN_WAVE_WIDTH / 2) {
      wv.hit = true;
      dealDamage(target, FISHER_OCEAN_WAVE_DMG);
      state.hitFlashes.push({ x: target.x, y: target.y, r: 28, alpha: 1, color: '#66ccff', t: 0.3 });
    }
    if (wv.x > W + FISHER_OCEAN_WAVE_WIDTH) state.fisherOceanWaves.splice(i, 1);
  }

  // 釣魚佬：結果飄字衰減
  for (let i = state.fisherResultFX.length - 1; i >= 0; i--) {
    const fx = state.fisherResultFX[i];
    fx.life -= dt;
    fx.y -= 16 * dt;
    if (fx.life <= 0) state.fisherResultFX.splice(i, 1);
  }

  // DIO：替身拳擊特效更新
  if (state.dioPunchFX) {
    for (let i = state.dioPunchFX.length - 1; i >= 0; i--) {
      state.dioPunchFX[i].life -= dt;
      if (state.dioPunchFX[i].life <= 0) state.dioPunchFX.splice(i, 1);
    }
  }
  if (state.dioImpactLines) {
    for (let i = state.dioImpactLines.length - 1; i >= 0; i--) {
      state.dioImpactLines[i].life -= dt;
      if (state.dioImpactLines[i].life <= 0) state.dioImpactLines.splice(i, 1);
    }
  }

  // 特效更新
  for (let i = state.hitFlashes.length-1; i >= 0; i--) {
    const hf = state.hitFlashes[i];
    if (hf.maxT === undefined) hf.maxT = hf.t; // 記錄真實初始時長，避免不同 t 值造成負半徑
    hf.t -= dt;
    if (hf.t <= 0) state.hitFlashes.splice(i, 1);
  }

  // ══════════════ 夏油條邏輯 ══════════════
  for (const b of state.balls) {
    if (b.char.type !== 'geto') continue;
    const enemy = state.balls.find(x => x.player !== b.player);
    if (!enemy) continue;
    if ((state.dioWorldGlobalActive && b !== state.dioWorldCaster) || b.obitoInSpace) continue;

    // 游雲被動冷卻遞減
    if (b.getoCaneCooldown > 0) b.getoCaneCooldown -= dt;

    // 技能一：咒靈操術 — 庫存每秒消耗一隻召喚小型咒靈
    if (b.getoStock > 0) {
      b.getoSpawnTimer -= dt;
      if (b.getoSpawnTimer <= 0) {
        b.getoSpawnTimer = GETO_SPAWN_INTERVAL;
        b.getoStock--;
        state.getoSpirits.push({
          x: b.x + randBetween(-16, 16), y: b.y + randBetween(-16, 16),
          hp: GETO_SPIRIT_HP, maxHp: GETO_SPIRIT_HP, owner: b.player,
          contactCd: 0, life: GETO_SPIRIT_LIFESPAN, spawnFlash: 0.3
        });
      }
    }

    // 技能二：血量剩餘50%時，一次性召喚特級咒靈
    if (!b.getoSpecialSpawned && b.hp <= MAX_HP * GETO_SPECIAL_TRIGGER_RATIO) {
      b.getoSpecialSpawned = true;
      b.getoSpecialActive = true;
      b.getoSpecialHp = GETO_SPECIAL_HP;
      b.getoSpecialAngle = Math.random() * Math.PI * 2;
      b.getoSpecialSkill = ['entangle', 'bind', 'surge'][Math.floor(Math.random() * 3)];
      b.getoEntangleTimer = GETO_ENTANGLE_INTERVAL * 0.5;
      b.getoBindTimer = GETO_BIND_COOLDOWN * 0.5;
      b.getoSurgeTimer = GETO_SURGE_COOLDOWN * 0.5;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 60, alpha: 1.1, color: '#5b3a8e', t: 0.6 });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 30, alpha: 1.0, color: '#ffffff', t: 0.4 });
      playHitSound('opm');
    }

    // 特級咒靈：跟隨繞行 + 三選一技能運作
    if (b.getoSpecialActive) {
      if (b.getoSpecialBoundTimer > 0) {
        b.getoSpecialBoundTimer -= dt;
        if (b.getoSpecialBoundTimer < 0) b.getoSpecialBoundTimer = 0;
      } else {
        b.getoSpecialAngle += dt * 1.3;
      }
      b.getoSpecialX = b.x + Math.cos(b.getoSpecialAngle) * GETO_SPECIAL_FOLLOW_RADIUS;
      b.getoSpecialY = b.y + Math.sin(b.getoSpecialAngle) * GETO_SPECIAL_FOLLOW_RADIUS;
      const distToEnemy = Math.hypot(enemy.x - b.getoSpecialX, enemy.y - b.getoSpecialY);

      if (b.getoSpecialSkill === 'entangle') {
        b.getoEntangleTimer -= dt;
        if (b.getoEntangleTimer <= 0) {
          b.getoEntangleTimer = GETO_ENTANGLE_INTERVAL;
          if (distToEnemy < GETO_ENTANGLE_RANGE) {
            enemy.getoDotDmg = GETO_ENTANGLE_TICK_DMG;
            enemy.getoDotTimer = GETO_ENTANGLE_TICKS;
            enemy.getoDotTickTimer = GETO_ENTANGLE_TICK_TIME;
            enemy.getoDotOwnerPlayer = b.player;
            state.getoEntangleFX.push({
              fromX: b.getoSpecialX, fromY: b.getoSpecialY, toX: enemy.x, toY: enemy.y,
              life: 0.45, maxLife: 0.45
            });
            playHitSound('trap_chain');
          }
        }
      } else if (b.getoSpecialSkill === 'bind') {
        const enemyBound = enemy.getoBoundTimer > 0;
        if (!enemyBound) {
          if (b.getoBindTimer > 0) b.getoBindTimer -= dt;
          if (b.getoBindTimer <= 0 && distToEnemy < GETO_BIND_RANGE) {
            enemy.getoBoundTimer = GETO_BIND_DURATION;
            b.getoSpecialBoundTimer = GETO_BIND_DURATION; // 特級咒靈自己定在原地（不影響夏油條本體移動）
            b.getoBindTimer = GETO_BIND_COOLDOWN;  // 冷卻已重置，但因敵方硬直中會暫停遞減，實際從硬直解除那刻才開始倒數
            state.getoBindFX.push({ x: (b.getoSpecialX + enemy.x) / 2, y: (b.getoSpecialY + enemy.y) / 2, life: GETO_BIND_DURATION, maxLife: GETO_BIND_DURATION });
            state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 30, alpha: 0.9, color: '#8e6fd9', t: 0.4 });
            playHitSound('trap_chain');
          }
        }
      } else if (b.getoSpecialSkill === 'surge') {
        if (!b.getoSurgeCharging) {
          if (b.getoSurgeTimer > 0) b.getoSurgeTimer -= dt;
          if (b.getoSurgeTimer <= 0 && distToEnemy < GETO_SURGE_RANGE) {
            b.getoSurgeCharging = true;
            b.getoSurgeChargeTimer = GETO_SURGE_CHARGE_TIME;
            b.getoSurgeAngle = Math.atan2(enemy.y - b.getoSpecialY, enemy.x - b.getoSpecialX);
            state.hitFlashes.push({ x: b.getoSpecialX, y: b.getoSpecialY, r: 26, alpha: 1, color: '#c9a6ff', t: GETO_SURGE_CHARGE_TIME });
          }
        } else {
          b.getoSurgeChargeTimer -= dt;
          if (b.getoSurgeChargeTimer <= 0) {
            b.getoSurgeCharging = false;
            b.getoSurgeTimer = GETO_SURGE_COOLDOWN;
            const dd = Math.hypot(enemy.x - b.getoSpecialX, enemy.y - b.getoSpecialY);
            if (dd < GETO_SURGE_RANGE + 60) {
              dealDamage(enemy, GETO_SURGE_DAMAGE);
              state.hitFlashes.push({ x: enemy.x, y: enemy.y, r: 34, alpha: 1, color: '#c9a6ff', t: 0.35 });
            }
            state.getoSurgeFX.push({
              fromX: b.getoSpecialX, fromY: b.getoSpecialY, angle: b.getoSurgeAngle,
              life: 0.3, maxLife: 0.3
            });
            playHitSound('opm');
          }
        }
      }
    }

    // 技能三：極之番•漩渦 — 血量剩餘25%時觸發
    if (!b.getoUltimateTriggered && b.hp <= MAX_HP * GETO_ULTIMATE_TRIGGER_RATIO) {
      b.getoUltimateTriggered = true;
      b.getoUltimateCharging = true;
      b.getoUltimateChargeTimer = GETO_ULTIMATE_CHARGE_TIME;
      b.vx = 0; b.vy = 0;
      state.hitFlashes.push({ x: b.x, y: b.y, r: 70, alpha: 1.2, color: '#c9a6ff', t: GETO_ULTIMATE_CHARGE_TIME });
      state.hitFlashes.push({ x: b.x, y: b.y, r: 40, alpha: 1.0, color: '#ffffff', t: 0.5 });
      playHitSound('opm');
    }
    if (b.getoUltimateCharging) {
      b.vx = 0; b.vy = 0;
      b.getoUltimateChargeTimer -= dt;
      // 蓄力全程持續描準，鎖定敵人當下位置，確保發射瞬間角度最準
      b.getoUltimateAngle = Math.atan2(enemy.y - b.y, enemy.x - b.x);
      if (b.getoUltimateChargeTimer <= 0) {
        b.getoUltimateCharging = false;
        const dmg = GETO_ULTIMATE_BASE_DMG + b.getoStock * GETO_ULTIMATE_STOCK_MULT;
        const ang = b.getoUltimateAngle;
        state.getoUltimateProjectiles.push({
          x: b.x, y: b.y,
          vx: Math.cos(ang) * GETO_ULTIMATE_SPEED, vy: Math.sin(ang) * GETO_ULTIMATE_SPEED,
          r: GETO_ULTIMATE_RADIUS, damage: dmg, owner: b.player, life: 3.5, active: true
        });
        playHitSound('opm');
      }
    }
  }

  // 夏油條：糾纏持續傷害跳動處理（掛在受傷方身上，任何角色都可能中招）
  for (const b of state.balls) {
    if (b.getoDotTimer > 0) {
      b.getoDotTickTimer -= dt;
      if (b.getoDotTickTimer <= 0) {
        b.getoDotTickTimer = GETO_ENTANGLE_TICK_TIME;
        dealDamage(b, b.getoDotDmg);
        const healer = state.balls.find(x => x.player === b.getoDotOwnerPlayer);
        if (healer && healer.hp > 0) healer.hp = Math.min(MAX_HP, healer.hp + b.getoDotDmg * GETO_ENTANGLE_HEAL_RATIO);
        state.hitFlashes.push({ x: b.x + randBetween(-10, 10), y: b.y + randBetween(-10, 10), r: 12, alpha: 0.7, color: '#5b3a8e', t: 0.3 });
        // 每次觸發傷害，身上長出一根新枝條
        if (!b.getoBranches) b.getoBranches = [];
        b.getoBranches.push({
          angle: Math.random() * Math.PI * 2,
          growTimer: 0,
          targetLen: RADIUS * (0.5 + Math.random() * 0.4),
          swayPhase: Math.random() * Math.PI * 2,
          fadeTimer: 0,
        });
        if (b.getoBranches.length > GETO_ENTANGLE_BRANCH_MAX) b.getoBranches.shift();
        b.getoDotTimer--;
        if (b.getoDotTimer <= 0) { b.getoDotTimer = 0; b.getoDotDmg = 0; b.getoDotOwnerPlayer = null; }
      }
    }
    // 枝條生長動畫；DoT結束後開始凋零並自動清除
    if (b.getoBranches && b.getoBranches.length) {
      for (let i = b.getoBranches.length - 1; i >= 0; i--) {
        const br = b.getoBranches[i];
        br.growTimer += dt;
        if (b.getoDotTimer <= 0) {
          br.fadeTimer += dt;
          if (br.fadeTimer >= GETO_ENTANGLE_BRANCH_FADE) b.getoBranches.splice(i, 1);
        }
      }
    }
  }

  // 夏油條：小型咒靈移動、貼身傷害與生命週期
  for (let i = state.getoSpirits.length - 1; i >= 0; i--) {
    const s = state.getoSpirits[i];
    if (s.spawnFlash > 0) s.spawnFlash -= dt;
    s.life -= dt;
    if (s.life <= 0 || s.hp <= 0) {
      state.getoDeathFX.push({ x: s.x, y: s.y, life: 0.35, maxLife: 0.35, r: GETO_SPIRIT_RADIUS });
      state.getoSpirits.splice(i, 1);
      continue;
    }
    const enemy = state.balls.find(x => x.player !== s.owner);
    if (!enemy || (state.dioWorldGlobalActive && state.dioWorldCaster && state.dioWorldCaster.player !== s.owner)) continue;
    const dx = enemy.x - s.x, dy = enemy.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist, ny = dy / dist;
    s.x += nx * GETO_SPIRIT_SPEED * dt;
    s.y += ny * GETO_SPIRIT_SPEED * dt;
    if (s.contactCd > 0) s.contactCd -= dt;
    if (dist < RADIUS + GETO_SPIRIT_RADIUS && s.contactCd <= 0) {
      s.contactCd = GETO_SPIRIT_CONTACT_CD;
      dealDamage(enemy, GETO_SPIRIT_DAMAGE);
      s.hp -= GETO_SPIRIT_RETALIATE;
      state.hitFlashes.push({ x: (s.x + enemy.x) / 2, y: (s.y + enemy.y) / 2, r: 14, alpha: 0.8, color: '#5b3a8e', t: 0.25 });
      playHitSound('trap_hit');
    }
  }

  // 夏油條：極之番•漩渦光球移動與命中
  for (let i = state.getoUltimateProjectiles.length - 1; i >= 0; i--) {
    const p = state.getoUltimateProjectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) { state.getoUltimateProjectiles.splice(i, 1); continue; }
    const target = state.balls.find(x => x.player !== p.owner);
    if (target) {
      const dd = Math.hypot(target.x - p.x, target.y - p.y);
      if (dd < RADIUS + p.r) {
        dealDamage(target, p.damage);
        state.hitFlashes.push({ x: target.x, y: target.y, r: 55, alpha: 1.2, color: '#c9a6ff', t: 0.45 });
        state.hitFlashes.push({ x: target.x, y: target.y, r: 30, alpha: 1.0, color: '#ffffff', t: 0.3 });
        playHitSound('opm');
        state.getoUltimateProjectiles.splice(i, 1);
      }
    }
  }

  // 夏油條：各類特效壽命衰減
  for (let i = state.getoEntangleFX.length - 1; i >= 0; i--) { state.getoEntangleFX[i].life -= dt; if (state.getoEntangleFX[i].life <= 0) state.getoEntangleFX.splice(i, 1); }
